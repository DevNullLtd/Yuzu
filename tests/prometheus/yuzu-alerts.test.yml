        eval_time: 30m
        exp_samples: []

  # CASE 36 -- a wedged second writer skips every tick, sustained -- must
  # page.
  - interval: 1m
    name: rotation sweep lock contention - a sustained wedge pages
    input_series:
      - series: 'yuzu_rotation_sweep_lock_skipped_total{job="yuzu",instance="s1"}'
        values: "0+1x300"
