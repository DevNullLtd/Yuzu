  #   * the outcome matcher dropped, or widened to `unrecorded|lookup_degraded` -> case B (the
  #     verified and unrecorded outcomes keep rising on a healthy fleet and must not fire)
  #   * the matcher swapped to `unrecorded`, or the metric swapped to read_degrade_total -> case A
  # NOT caught: a rate window of 4m or 6m. Same sparse-failure boundary as the write rule, rarely
  # the limiting case here because response traffic is denser than dispatch traffic.

  # CASE A -- a recurring failure (one more event every minute from minute 2) fires, labeled with
