        eval_time: 15m
        exp_samples:
          - labels: 'ALERTS{alertname="YuzuRuntimeConfigReadDegraded", alertstate="firing", reason="crypto_error", severity="warning"}'
            value: 1

  # CASE 69 -- the boot-time pre-seed alone (all reasons present at zero,
  # never incremented) must stay quiet: present-at-zero is the HEALTHY
  # steady state, not a degrade.
  - interval: 1m
    name: runtime config read degraded - pre-seeded flat counters stay quiet
    input_series:
      - series: 'yuzu_server_runtime_config_read_degrade_total{job="yuzu",instance="s1",reason="store_not_open"}'
        values: "0x30"
      - series: 'yuzu_server_runtime_config_read_degrade_total{job="yuzu",instance="s1",reason="pool_acquire_timeout"}'
        values: "0x30"
      - series: 'yuzu_server_runtime_config_read_degrade_total{job="yuzu",instance="s1",reason="query_error"}'
        values: "0x30"
      - series: 'yuzu_server_runtime_config_read_degrade_total{job="yuzu",instance="s1",reason="crypto_error"}'
        values: "0x30"
    promql_expr_test:
      - expr: 'ALERTS{alertname="YuzuRuntimeConfigReadDegraded"}'
        eval_time: 20m
        exp_samples: []

  # ── YuzuDispatchTargetRejected: the reason="quarantined" exclusion (#881) ──
  #
  # `sum by (route, reason)(increase(yuzu_server_dispatch_target_rejected_total
  # {reason!="quarantined"}[15m])) > 3`, no `for:`, warning.
  #
  # #881 routes quarantine denials into this pre-existing counter family, and
  # the counter is the ONE the rule reads. Without the matcher, correct
  # containment fires a warning alert: a single looping automation against one
  # contained host clears 3 in 15m on its own, and a fail-closed episode
  # increments by the whole connected fleet in a single dispatch. A rule that
  # pages on the control working gets silenced, and the genuine #2500
  # near-miss signal is silenced with it -- the exact outcome the >3 threshold
  # (rather than >0) was chosen to avoid.
  #
  # Mutate the rule -- drop `{reason!="quarantined"}` -- and CASE 61 goes red.
  # That is the only thing that makes this pair evidence rather than decoration.

  # CASE 61 -- a fail-closed episode: 40 denials in one dispatch, an order of
  # magnitude past the threshold, on the route that carries them. Silent.
  - interval: 1m
    name: dispatch target rejected - quarantine denials never fire the targeting alert
    input_series:
      - series: 'yuzu_server_dispatch_target_rejected_total{job="yuzu",instance="s1",route="command",reason="quarantined"}'
        values: "0 0 0 40x30"
      - series: 'yuzu_server_dispatch_target_rejected_total{job="yuzu",instance="s1",route="dispatch_closure",reason="quarantined"}'
        values: "0 0 0 40x30"
    promql_expr_test:
      - expr: 'ALERTS{alertname="YuzuDispatchTargetRejected"}'
        eval_time: 10m
        exp_samples: []
      - expr: 'ALERTS{alertname="YuzuDispatchTargetRejected"}'
        eval_time: 25m
        exp_samples: []

  # CASE 62 -- the other half, so the exclusion cannot be widened into a
  # silencer: a genuine targeting mistake on the SAME counter family, and on
  # the same route as CASE 61, still fires. 5 in 15m clears the >3 threshold.
  - interval: 1m
    name: dispatch target rejected - a real targeting mistake still fires alongside
    input_series:
      - series: 'yuzu_server_dispatch_target_rejected_total{job="yuzu",instance="s1",route="command",reason="agent_ids_empty"}'
        values: "0 0 0 0+1x30"
      - series: 'yuzu_server_dispatch_target_rejected_total{job="yuzu",instance="s1",route="command",reason="quarantined"}'
        values: "0 0 0 40x30"
    promql_expr_test:
      # No `for:` on this rule, so pending and firing coincide: the alert is
      # firing on the first evaluation at which the 15m increase exceeds 3.
      # An ALERTS series carries 1 while firing, never the expression's value —
      # so the assertion that matters here is the LABEL SET: exactly one
      # series, and its reason is the targeting mistake, not "quarantined".
      - expr: 'ALERTS{alertname="YuzuDispatchTargetRejected", alertstate="firing"}'
        eval_time: 20m
        exp_samples:
          - labels: 'ALERTS{alertname="YuzuDispatchTargetRejected", alertstate="firing", route="command", reason="agent_ids_empty", severity="warning"}'
            value: 1
      # And the underlying expression's own value, which the ALERTS series
      # cannot show: 15 for the real mistake, and NO quarantined series at all
      # — one series in the result, not two. That absence is the assertion.
      - expr: 'sum by (route, reason) (increase(yuzu_server_dispatch_target_rejected_total{reason!="quarantined"}[15m]))'
        eval_time: 20m
        exp_samples:
          - labels: '{route="command", reason="agent_ids_empty"}'
            value: 15

  # ── YuzuDispatchTargetRejected: the reason="unknown_plugin" exclusion
  # (#3424/#3511) ────────────────────────────────────────────────────────────
  #
  # #3511's plugin-presence filter routes the same counter family's
  # reason="unknown_plugin" through this rule too. Withholding a dispatch to a
  # plugin absent from every target's inventory is a caller mistake (typo,
  # stale automation), not a fleet outage — same rationale CASE 61 established
  # for reason="quarantined". Without the exclusion, one misconfigured
  # automation looping against an uninstalled plugin clears 3 in 15m on its
  # own and pages a warning for a working control.
  #
  # Mutate the rule -- drop `unknown_plugin` from the exclusion regex -- and
  # CASE 61b goes red, same evidentiary shape as CASE 61.

  # CASE 61b -- a misconfigured automation retries against an absent plugin:
  # 40 withheld dispatches in one run, silent.
  - interval: 1m
    name: dispatch target rejected - unknown-plugin denials never fire the targeting alert
    input_series:
      - series: 'yuzu_server_dispatch_target_rejected_total{job="yuzu",instance="s1",route="command",reason="unknown_plugin"}'
        values: "0 0 0 40x30"
    promql_expr_test:
      - expr: 'ALERTS{alertname="YuzuDispatchTargetRejected"}'
        eval_time: 10m
        exp_samples: []
      - expr: 'ALERTS{alertname="YuzuDispatchTargetRejected"}'
        eval_time: 25m
        exp_samples: []

  # CASE 61c -- #5294: a dispatch withheld because the per-OS kill switch is
  # off is an operator's own policy at work, not a targeting mistake: silent.
  - interval: 1m
    name: dispatch target rejected - kill-switched-os withholdings never fire the targeting alert
    input_series:
      - series: 'yuzu_server_dispatch_target_rejected_total{job="yuzu",instance="s1",route="command",reason="kill_switched_os"}'
        values: "0 0 0 40x30"
    promql_expr_test:
      - expr: 'ALERTS{alertname="YuzuDispatchTargetRejected"}'
        eval_time: 10m
        exp_samples: []
      - expr: 'ALERTS{alertname="YuzuDispatchTargetRejected"}'
        eval_time: 25m
        exp_samples: []

  # CASE 62b -- a real targeting mistake still fires alongside ALL THREE excluded
  # reasons on the same route, so no exclusion widened into a silencer.
  - interval: 1m
    name: dispatch target rejected - a real targeting mistake still fires alongside all three exclusions
    input_series:
      - series: 'yuzu_server_dispatch_target_rejected_total{job="yuzu",instance="s1",route="command",reason="agent_ids_empty"}'
        values: "0 0 0 0+1x30"
      - series: 'yuzu_server_dispatch_target_rejected_total{job="yuzu",instance="s1",route="command",reason="quarantined"}'
        values: "0 0 0 40x30"
      - series: 'yuzu_server_dispatch_target_rejected_total{job="yuzu",instance="s1",route="command",reason="unknown_plugin"}'
        values: "0 0 0 40x30"
      - series: 'yuzu_server_dispatch_target_rejected_total{job="yuzu",instance="s1",route="command",reason="kill_switched_os"}'
        values: "0 0 0 40x30"
    promql_expr_test:
      - expr: 'ALERTS{alertname="YuzuDispatchTargetRejected", alertstate="firing"}'
        eval_time: 20m
        exp_samples:
          - labels: 'ALERTS{alertname="YuzuDispatchTargetRejected", alertstate="firing", route="command", reason="agent_ids_empty", severity="warning"}'
            value: 1
      - expr: 'sum by (route, reason) (increase(yuzu_server_dispatch_target_rejected_total{reason!~"quarantined|unknown_plugin|kill_switched_os"}[15m]))'
        eval_time: 20m
        exp_samples:
          - labels: '{route="command", reason="agent_ids_empty"}'
            value: 15

  # ── YuzuQuarantineGateFailClosed (#881) ───────────────────────────────────
  #
  # `increase(yuzu_server_quarantine_gate_total{outcome="fail_closed"}[5m]) > 0`,
  # for: 2m, critical.
  #
  # The rule exists because #881 introduces a NEW outage mode with no other
  # signal: containment state unreadable past the 60s stale budget means
  # instruction dispatch reaches nobody, fleet-wide. It cannot be detected on
  # the neighbouring targeting family, whose quarantine reason is deliberately
  # excluded (CASE 61 above).
  #
  # Both halves pinned: the outage fires, and the ORDINARY gate outcomes —
  # which increment on literally every dispatch — never do. The second half is
  # the one that would make this rule useless if it were wrong.

  # CASE 63 -- a healthy server: `fresh` on every dispatch, plus the exempt
  # control-plugin path. Silent, however large the counts get.
  - interval: 1m
    name: quarantine gate - ordinary outcomes never fire the outage alert
    input_series:
      - series: 'yuzu_server_quarantine_gate_total{job="yuzu",instance="s1",outcome="fresh"}'
        values: "0+50x40"
      - series: 'yuzu_server_quarantine_gate_total{job="yuzu",instance="s1",outcome="stale"}'
        values: "0+5x40"
      - series: 'yuzu_server_quarantine_gate_total{job="yuzu",instance="s1",outcome="exempt_control_plugin"}'
        values: "0+2x40"
      - series: 'yuzu_server_quarantine_gate_total{job="yuzu",instance="s1",outcome="fail_closed"}'
        values: "0x40"
    promql_expr_test:
      - expr: 'ALERTS{alertname="YuzuQuarantineGateFailClosed"}'
        eval_time: 30m
        exp_samples: []

  # CASE 64 -- the outage: fail_closed starts incrementing at t=10m. `for: 2m`
  # is pinned on both sides, because the whole point of the delay is to absorb
  # a single degraded evaluation during a pool blip.
  - interval: 1m
    name: quarantine gate - a sustained fail-closed episode fires critical
    input_series:
      - series: 'yuzu_server_quarantine_gate_total{job="yuzu",instance="s1",outcome="fail_closed"}'
        values: "0x10 0+30x30"
    promql_expr_test:
      - expr: 'ALERTS{alertname="YuzuQuarantineGateFailClosed", alertstate="firing"}'
        eval_time: 12m
        exp_samples: []
      - expr: 'ALERTS{alertname="YuzuQuarantineGateFailClosed", alertstate="firing"}'
        eval_time: 20m
        exp_samples:
          # No `sum by` on this rule, deliberately: the series keeps `instance`
          # so an alert routes to the affected server, and `outcome` so the
          # payload is self-describing.
          - labels: 'ALERTS{alertname="YuzuQuarantineGateFailClosed", alertstate="firing", instance="s1", job="yuzu", outcome="fail_closed", severity="critical"}'
            value: 1

  # ── YuzuQuarantineGateServingStaleState (#881) ────────────────────────────
  #
  # `sum(increase(yuzu_server_quarantine_gate_total{outcome="stale"}[10m])) > 0`,
  # for: 10m, warning.
  #
  # There is no rule for yuzu_server_system_reserved_push_total. That was
  # tried and withdrawn: `send_to` returns false whenever an agent's stream is
  # null, which is what an ordinary suspended laptop looks like, and
  # echo.fleet_snapshot fans out over the whole fleet on every viz fetch. A
  # `> 0` rule on that family is permanently firing on any real fleet, and a
  # permanently-firing rule gets silenced — taking the genuine
  # "__guard__.push_rules never landed" signal with it. Same self-defeating
  # shape YuzuDispatchTargetRejected chose `>3` to avoid. The metric ships and
  # is documented with PromQL; the alert does not.

  # CASE 65 -- the ordinary outcomes, at volume, stay quiet. `fresh` increments
  # on every single dispatch, so a rule that could not tolerate that would be
  # useless.
  - interval: 1m
    name: quarantine gate - fresh and exempt outcomes never fire the stale alert
    input_series:
      - series: 'yuzu_server_quarantine_gate_total{job="yuzu",instance="s1",outcome="fresh"}'
        values: "0+50x40"
      - series: 'yuzu_server_quarantine_gate_total{job="yuzu",instance="s1",outcome="exempt_control_plugin"}'
        values: "0+2x40"
      - series: 'yuzu_server_quarantine_gate_total{job="yuzu",instance="s1",outcome="stale"}'
        values: "0x40"
    promql_expr_test:
      - expr: 'ALERTS{alertname="YuzuQuarantineGateServingStaleState"}'
        eval_time: 30m
        exp_samples: []

  # CASE 66 -- a sustained stale episode fires. `for: 10m` is pinned on both
  # sides: quiet while the episode is younger than the hold, firing after it.
  # This is the window in which containment UNDER-enforces, which is why it is
  # alerted at all — the fail-closed rule only ever sees over-enforcement.
  - interval: 1m
    name: quarantine gate - a sustained stale episode fires warning
    input_series:
      - series: 'yuzu_server_quarantine_gate_total{job="yuzu",instance="s1",outcome="stale"}'
        values: "0x5 0+3x40"
    promql_expr_test:
      - expr: 'ALERTS{alertname="YuzuQuarantineGateServingStaleState", alertstate="firing"}'
        eval_time: 12m
        exp_samples: []
      - expr: 'ALERTS{alertname="YuzuQuarantineGateServingStaleState", alertstate="firing"}'
        eval_time: 25m
        exp_samples:
          - labels: 'ALERTS{alertname="YuzuQuarantineGateServingStaleState", alertstate="firing", severity="warning"}'
            value: 1

  # CASE 67 -- #3481/Gate 8 (sre): documents the RULE's dependency on a pre-seeded series —
  # empirically confirmed the hard way during Gate 8 review — an `increase()` query cannot
  # detect a 0->1 step on a series whose FIRST-EVER sample is already 1 (no earlier zero to
  # diff against), so a future edit that "simplifies" server.cpp's pre-seed loop into dead code
  # would silently disarm this alert. This case proves the RULE fires correctly GIVEN a
  # pre-seeded-at-0 series (the input_series below is synthetic, modeling what the pre-seed
  # produces) — it does NOT exercise server.cpp's own pre-seed loop at boot (gov Gate 3,
  # quality-engineer: no C++ test does, for this counter or its siblings). The series here
  # starts pre-seeded at 0 (t=0..30m), then one partial-compensation event bumps it to 1 at
  # t=31m and it stays there (no second event) — `for: 0m` means it must fire on the very next
  # eval after the step, not later.
  - interval: 1m
    name: product-pack compensation partial - a single event fires immediately given a pre-seeded series
    input_series:
      - series: 'yuzu_server_product_pack_install_compensation_total{job="yuzu",instance="s1",result="partial"}'
        values: "0x30 1+0x40"
    promql_expr_test:
      - expr: 'ALERTS{alertname="YuzuProductPackCompensationPartial"}'
        eval_time: 30m
        exp_samples: []
      - expr: 'ALERTS{alertname="YuzuProductPackCompensationPartial", alertstate="firing"}'
        eval_time: 32m
        exp_samples:
          - labels: 'ALERTS{alertname="YuzuProductPackCompensationPartial", alertstate="firing", instance="s1", job="yuzu", result="partial", severity="warning"}'
            value: 1
      - expr: 'ALERTS{alertname="YuzuProductPackCompensationPartial", alertstate="firing"}'
        eval_time: 60m
        exp_samples:
          - labels: 'ALERTS{alertname="YuzuProductPackCompensationPartial", alertstate="firing", instance="s1", job="yuzu", result="partial", severity="warning"}'
            value: 1

  # CASE 68 -- companion to CASE 67: no compensation event ever occurs (the
  # ordinary case — a healthy install path never needs compensation at all).
  # A flat pre-seeded-at-0 series must never fire, at any eval time.
  - interval: 1m
    name: product-pack compensation partial - a flat zero series never fires
    input_series:
      - series: 'yuzu_server_product_pack_install_compensation_total{job="yuzu",instance="s1",result="partial"}'
        values: "0x120"
    promql_expr_test:
      - expr: 'ALERTS{alertname="YuzuProductPackCompensationPartial"}'
        eval_time: 2h
        exp_samples: []

  # CASE 69 -- the `increase(...[1h])` window self-clears once the single
  # event ages out, even though the underlying orphan does NOT self-heal (the
  # metrics.md doc note this pins: "a lone event... does not self-clear
  # either" describes the ORPHAN, not the alert). Same series as CASE 67.
  # Firing check well inside the 1h window (t=45m, 14m after the t=31m jump);
  # cleared check well outside it (t=3h) — deliberately not pinned to the
  # exact boundary minute, which is sensitive to promql's increase()
  # extrapolation and not this rule's contract.
  - interval: 1m
    name: product-pack compensation partial - clears once the event ages out of the 1h window
    input_series:
      - series: 'yuzu_server_product_pack_install_compensation_total{job="yuzu",instance="s1",result="partial"}'
        values: "0x30 1+0x150"
    promql_expr_test:
      - expr: 'ALERTS{alertname="YuzuProductPackCompensationPartial", alertstate="firing"}'
        eval_time: 45m
        exp_samples:
          - labels: 'ALERTS{alertname="YuzuProductPackCompensationPartial", alertstate="firing", instance="s1", job="yuzu", result="partial", severity="warning"}'
            value: 1
      - expr: 'ALERTS{alertname="YuzuProductPackCompensationPartial", alertstate="firing"}'
        eval_time: 3h
  # ── YuzuQuarantineEndpointUnconfirmed (#3425) ─────────────────────────────
  #
  # `yuzu_server_quarantine_endpoint_unconfirmed{reachability="connected"} > 0`,
  # for: 15m, warning. A GAUGE, unlike every other rule in this group — no
  # increase()/sum() needed, `for:` alone provides the sustain requirement.

  # CASE 67 -- the flagship case: a connected, quarantined device stays
  # unconfirmed past the 15m hold. `for:` is pinned on both sides: quiet
  # before the hold elapses, firing after.
  - interval: 1m
    name: quarantine endpoint unconfirmed - a sustained connected divergence fires warning
    input_series:
      - series: 'yuzu_server_quarantine_endpoint_unconfirmed{job="yuzu",instance="s1",reachability="connected"}'
        values: "1x40"
    promql_expr_test:
      - expr: 'ALERTS{alertname="YuzuQuarantineEndpointUnconfirmed", alertstate="firing"}'
        eval_time: 12m
        exp_samples: []
      - expr: 'ALERTS{alertname="YuzuQuarantineEndpointUnconfirmed", alertstate="firing"}'
        eval_time: 20m
        exp_samples:
          - labels: 'ALERTS{alertname="YuzuQuarantineEndpointUnconfirmed", alertstate="firing", instance="s1", job="yuzu", reachability="connected", severity="warning"}'
            value: 1

  # CASE 68 -- reachability="offline" NEVER fires, no matter how long or how
  # high. A device quarantined while off is legitimately unconfirmed for its
  # whole offline duration — paging on it would be paging on correct
  # behaviour, the same self-defeating shape CASE 65's comment warns about
  # for yuzu_server_system_reserved_push_total.
  - interval: 1m
    name: quarantine endpoint unconfirmed - offline reachability never fires, at any volume or duration
    input_series:
      - series: 'yuzu_server_quarantine_endpoint_unconfirmed{job="yuzu",instance="s1",reachability="offline"}'
        values: "5x90"
      - series: 'yuzu_server_quarantine_endpoint_unconfirmed{job="yuzu",instance="s1",reachability="connected"}'
        values: "0x90"
    promql_expr_test:
      - expr: 'ALERTS{alertname="YuzuQuarantineEndpointUnconfirmed"}'
        eval_time: 90m
        exp_samples: []

  # CASE 69 -- resolution: the divergence clears (a confirm lands) and the
  # alert un-fires, pinning the gauge shape's recovery behaviour distinct
  # from the counter-based rules above (which only ever accumulate).
  - interval: 1m
    name: quarantine endpoint unconfirmed - resolves once the gauge returns to 0
    input_series:
      - series: 'yuzu_server_quarantine_endpoint_unconfirmed{job="yuzu",instance="s1",reachability="connected"}'
        values: "1x20 0x40"
    promql_expr_test:
      - expr: 'ALERTS{alertname="YuzuQuarantineEndpointUnconfirmed", alertstate="firing"}'
        eval_time: 20m
        exp_samples:
          - labels: 'ALERTS{alertname="YuzuQuarantineEndpointUnconfirmed", alertstate="firing", instance="s1", job="yuzu", reachability="connected", severity="warning"}'
            value: 1
      - expr: 'ALERTS{alertname="YuzuQuarantineEndpointUnconfirmed", alertstate="firing"}'
        eval_time: 55m
        exp_samples: []

  # ── YuzuSessionReapClockAnomaly (HA WS-1/1a, ADR-2002 §4) ─────────────────
  #
