    promql_expr_test:
      - expr: 'ALERTS{alertname="YuzuExecCorrelationReapSaturated", instance="s1"}'
        eval_time: 3h
        exp_samples: []
      - expr: 'ALERTS{alertname="YuzuExecCorrelationReapSaturated", alertstate="pending", instance="s1"}'
