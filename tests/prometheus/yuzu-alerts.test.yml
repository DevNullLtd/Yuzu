  # CASE 53 -- a flat series held at disabled (0) never fires — no CHANGE,
  # just steady-state off (e.g. a fresh install that never enabled RBAC).
  - interval: 1m
    name: rbac enforcement disabled - a flat disabled series never fires
    input_series:
      - series: 'yuzu_server_rbac_enforcement_enabled{job="yuzu",instance="s1"}'
