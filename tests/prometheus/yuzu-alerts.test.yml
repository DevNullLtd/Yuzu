            value: 1

  # CASE 52 -- an ENABLE transition (disabled -> enabled) never fires this
  # rule — direction-specific, the mirror-image case CASE 49 already proves
  # fires the OTHER (undirected) alert.
  - interval: 1m
    name: rbac enforcement disabled - an enable transition never fires
    input_series:
