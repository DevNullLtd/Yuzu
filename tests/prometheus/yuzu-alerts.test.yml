  # same shape as the write rule above and is scoped to that ONE outcome: `unrecorded` also counts
  # an id the server never issued, a record reaped after 24 hours and an empty id (non-zero on a
  # healthy fleet), and yuzu_exec_correlation_read_degrade_total also counts a first-attempt
  # failure that the retry recovers. Which case catches which change (each mutation was run against
  # the pinned promtool image and turned the named case red):
