        values: "0x60"
    promql_expr_test:
      - expr: 'ALERTS{alertname="YuzuGatewayRouteWriteFailed", alertstate="firing"}'
        eval_time: 30m
        exp_samples: []

  # CASE — a single route_unreadable-caused retry fires (no `for:` on this
