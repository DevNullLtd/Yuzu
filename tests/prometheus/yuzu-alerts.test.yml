        eval_time: 4m
        exp_samples:
          - labels: 'ALERTS{alertname="YuzuDispatchRecordWriteFailing", alertstate="pending", instance="s1", severity="warning"}'
            value: 1
      - expr: 'ALERTS{alertname="YuzuDispatchRecordWriteFailing", alertstate="firing"}'
        eval_time: 8m
        exp_samples: []
      - expr: 'ALERTS{alertname="YuzuDispatchRecordWriteFailing", alertstate="firing"}'
        eval_time: 12m
        exp_samples: []
      - expr: 'ALERTS{alertname="YuzuDispatchRecordWriteFailing", alertstate="firing"}'
        eval_time: 14m
        exp_samples: []
      - expr: 'ALERTS{alertname="YuzuDispatchRecordWriteFailing"}'
        eval_time: 20m
        exp_samples: []

  # CASE D -- a short outage (an event at minutes 2, 3 and 4, then recovery) does not page: the rate
  # is true from minute 2 to about minute 8, under the 10 minutes `for:` needs, and gone by minute
  # 12. RED if the expression keeps a short outage true for 10 minutes (an `increase(...[10m])`
  # form would).
  - interval: 1m
    name: dispatch record write failing - a short outage that recovers does not page
    input_series:
      - series: 'yuzu_exec_correlation_write_degrade_total{job="yuzu",instance="s1"}'
