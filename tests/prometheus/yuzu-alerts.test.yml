        exp_samples:
          - labels: 'ALERTS{alertname="YuzuRotationSweepDeclinedSustained", alertstate="firing", instance="s1", job="yuzu", severity="warning"}'
            value: 1

  # ── yuzu-scim (#3057, ADR-2001 PR-B) ────────────────────────────────────
  #
  # Six of this group's seven rules key on a BARE counter that is boot-seeded
  # to 0 by its producer (never absent on a build shipping this feature),
  # matching the YuzuOnBehalfAssertionRejected idiom this group borrows:
  # `increase(x[1h]) > 0`, no `for:` (the alert fires the same cycle the
  # condition goes true -- there is no pending phase to assert separately).
  # Every case below for those six either rises from a flat-0 prefix (fires)
  # or stays flat-0 the whole hour (quiet). The seventh,
  # YuzuScimAuditWriteFailures, keys on `yuzu_scim_audit_write_failures_total
  # {action=...}` -- dynamically labeled by a runtime `action` value the
  # server cannot enumerate in advance, so it is NOT boot-seeded and is
  # genuinely BORN-AT-1 on a fresh `action`'s first-ever failure in
  # production. Its case below (CASE 55) still uses a flat-0-then-1 input
  # series like the other six, because promtool's `input_series` shape does
  # not model "a label appearing mid-series with no prior 0 sample" --
  # exercising THAT gap is out of scope for this file; the documented caveat
  # (a truly isolated first failure may lag one evaluation cycle) lives in
  # the rule's own `description` in docs/prometheus/yuzu-alerts.yml instead.

  # ── YuzuBreakGlassLogin ─────────────────────────────────────────────────

  # A single break-glass login after the boot seed pages. The flat-0 prefix is
  # the boot seed in server.cpp; without it the series would be born at 1 and
  # increase() could not see the first use.
  - interval: 1m
    name: break-glass login - one use after the boot seed fires
    input_series:
      - series: 'yuzu_auth_break_glass_login_total{job="yuzu",instance="s1"}'
        values: "0x30 1x30"
    promql_expr_test:
      - expr: 'ALERTS{alertname="YuzuBreakGlassLogin", alertstate="firing"}'
        eval_time: 45m
        exp_samples:
          - labels: 'ALERTS{alertname="YuzuBreakGlassLogin", alertstate="firing", instance="s1", job="yuzu", severity="critical"}'
            value: 1

  # No break-glass use, no page.
  - interval: 1m
    name: break-glass login - a flat seeded counter stays quiet
    input_series:
      - series: 'yuzu_auth_break_glass_login_total{job="yuzu",instance="s1"}'
        values: "0x60"
    promql_expr_test:
      - expr: 'ALERTS{alertname="YuzuBreakGlassLogin"}'
        eval_time: 45m
        exp_samples: []

