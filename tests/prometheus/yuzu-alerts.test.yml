    promql_expr_test:
      - expr: 'ALERTS{alertname="YuzuDispatchRecordWriteFailing", alertstate="pending"}'
        eval_time: 4m
        exp_samples:
          - labels: 'ALERTS{alertname="YuzuDispatchRecordWriteFailing", alertstate="pending", instance="s1", severity="warning"}'
            value: 1
      - expr: 'ALERTS{alertname="YuzuDispatchRecordWriteFailing", alertstate="firing"}'
        eval_time: 12m
        exp_samples: []
      - expr: 'ALERTS{alertname="YuzuDispatchRecordWriteFailing", alertstate="firing"}'
        eval_time: 14m
