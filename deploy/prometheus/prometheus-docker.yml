# Prometheus config for Docker Compose stack
# Targets use Docker service names instead of localhost

# /metrics: the compose server runs with YUZU_METRICS_NO_AUTH and YUZU_NO_HTTPS (dev rig only, see docker-compose.yml; :8080 is plain http), so
# this scrape sends no credential. Against a server that authenticates /metrics add an `authorization`
# block per docs/user-manual/metrics.md.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'yuzu-server'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['server:8080']
        labels:
          component: 'server'

  - job_name: 'yuzu-gateway'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['gateway:9568']
        labels:
          component: 'gateway'
