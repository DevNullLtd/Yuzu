# Yuzu Prometheus Alert Rules
# Import into Prometheus or Grafana alerting.

groups:
  - name: yuzu.rules
    rules:
      # Alert when no agents are connected for more than 5 minutes.
      - alert: YuzuNoAgentsConnected
        expr: yuzu_agents_connected == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "No Yuzu agents connected"
          description: "The Yuzu server has had zero connected agents for more than 5 minutes."

      # Alert when an agent disconnects (connected count drops).
      - alert: YuzuAgentDisconnected
        expr: delta(yuzu_agents_connected[5m]) < -1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Yuzu agent disconnection detected"
          description: "The connected agent count dropped by {{ $value }} in the last 5 minutes."

      # Alert when command failure rate exceeds 10% over 5 minutes.
      - alert: YuzuHighCommandFailureRate
        expr: >
          rate(yuzu_commands_completed_total{status="error"}[5m])
          / (rate(yuzu_commands_completed_total[5m]) > 0) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High command failure rate"
          description: "More than 10% of commands are failing (current rate: {{ $value | humanizePercentage }})."

      # Alert when command latency p95 exceeds 10 seconds.
      - alert: YuzuHighCommandLatency
        expr: histogram_quantile(0.95, rate(yuzu_command_duration_seconds_bucket[5m])) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High command execution latency"
          description: "p95 command latency is {{ $value }}s (threshold: 10s)."

      # Alert when no commands are being processed (possible stall).
      - alert: YuzuCommandProcessingStalled
        expr: >
          yuzu_agents_connected > 0
          and rate(yuzu_commands_dispatched_total[15m]) == 0
          and rate(yuzu_commands_completed_total[15m]) == 0
        for: 15m
        labels:
          severity: info
        annotations:
          summary: "No commands processed"
          description: "Agents are connected but no commands have been dispatched or completed in 15 minutes."

      # Fleet health: more than 10% of connected agents are not heartbeating.
      - alert: YuzuFleetUnhealthy
        expr: >
          (yuzu_agents_connected - yuzu_fleet_agents_healthy)
          / yuzu_agents_connected > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "More than 10% of agents are not sending heartbeats"
          description: "{{ $value | humanizePercentage }} of connected agents have not sent a heartbeat recently."

      # Heartbeats have completely stopped.
      - alert: YuzuHeartbeatsStopped
        expr: >
          yuzu_agents_connected > 0
          and rate(yuzu_heartbeats_received_total[5m]) == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "No heartbeats received from any agent"
          description: "Agents are connected but no heartbeats have been received in 5 minutes."

      # Gateway upstream RPC errors.
      - alert: YuzuGatewayUpstreamErrors
        expr: rate(yuzu_gw_upstream_rpc_errors_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Gateway upstream RPC errors"
          description: "Gateway is experiencing {{ $value }}/s upstream RPC errors."

      # A request the gateway could not encode never reaches the server and never
      # opens the circuit breaker, so a systematic local encode fault leaves the
      # breaker closed. The rate rule above has no code filter and fires only
      # above 0.1 errors/s for 5m, so a slow encode fault can stay under it.
      # Threshold: increase() >= 10 over 10m (about ten: increase() extrapolates,
      # so nine on a non-zero counter can reach it), so one rejected request does
      # not warn. batch_heartbeat marshal failures are counted as
      # code="exception" and are not covered here.
      - alert: YuzuGatewayUpstreamEncodeErrors
        expr: increase(yuzu_gw_upstream_rpc_errors_total{code="encode"}[10m]) >= 10
        labels:
          severity: warning
        annotations:
          summary: "Gateway could not encode about 10 or more {{ $labels.rpc_name }} requests in 10m"
          description: "Gateway could not encode about 10 or more {{ $labels.rpc_name }} requests in 10m. A systematic encode failure leaves the circuit breaker closed and /readyz ready; YuzuGatewayUpstreamErrors fires on any code only above 0.1 errors/s, so it can stay silent for a slow encode fault. A lone failure is most likely a single rejected request and does not reach this alert, which needs about 10 in 10 minutes (increase() extrapolates, so nine can reach it): read the rate, not the existence."

      # Gateway BEAM VM memory exceeds 4GB.
      - alert: YuzuGatewayMemoryHigh
        expr: yuzu_gw_beam_memory_bytes{type="total"} > 4294967296
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Gateway BEAM VM memory exceeds 4GB"
          description: "Gateway node {{ $labels.node }} is using {{ $value | humanize1024 }}B of memory."

      # Gateway agent session churn.
      - alert: YuzuGatewayHighChurn
        expr: rate(yuzu_gw_agents_disconnected_total[5m]) > 10
        for: 5m
        labels:
          severity: info
        annotations:
          summary: "High agent disconnect rate on gateway"
          description: "{{ $value }}/s agent disconnections on gateway node {{ $labels.node }}."

      # MFA step-up check answered 503: the auth store could not be read, the
      # stored second factor could not be decrypted, there is no usable auth store, or the
      # check itself threw or could not fingerprint the session. The gated routes stay closed. The >= 3 debounce keeps one
      # stray 503 from paging.
      - alert: YuzuStepUpGateUnavailable
        expr: sum by (job, instance, surface) (increase(yuzu_auth_mfa_step_up_gate_total{outcome="unavailable"}[10m])) >= 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "MFA step-up check answering 503 on {{ $labels.instance }} ({{ $labels.surface }} surface)"
          description: "The MFA step-up check refused at least three requests in ten minutes with 503 because it could not establish the caller's MFA state (auth store unreadable, stored second factor undecryptable, no usable auth store, or an unexpected exception inside the check). Step-up routes stay closed until the cause is fixed. Check PostgreSQL and the KEK."

      # --mfa-step-up-window-secs <= 0 disables the stale-proof requirement (recovery lever).
      - alert: YuzuStepUpWindowDisabled
        expr: yuzu_auth_mfa_step_up_window_seconds <= 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "MFA step-up stale-proof requirement is disabled (--mfa-step-up-window-secs <= 0)"
          description: "The server was started with --mfa-step-up-window-secs 0 (or less), so the stale-proof requirement is disabled on every step-up route except the JIT-elevation routes: no stale proof is refused (so none is recorded), and SAML sessions and the authentication-store read are skipped too, while engine denials and unwired-store refusals still apply and are recorded. This is a recovery lever, not a steady state: restore the window (default 300) and restart once the reason it was set is resolved."
