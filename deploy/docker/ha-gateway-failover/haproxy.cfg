# WS-13 13.0 spike - L4 VIP in front of three gateway nodes (mode tcp).
#
# The agent edge (:50051) and the server->gateway management plane (:50063) are
# both fronted, each health-checked on the gateway's /readyz (:8081). A node
# that fails its check has its sessions shut down (on-marked-down
# shutdown-sessions), so the agents reconnect through the surviving nodes. Whether
# /readyz ever FAILS for a node that is up but has lost its server is hypothesis
# H3b of the spike. Style follows ha-postgres/haproxy.cfg.
global
    log stdout format raw local0
    maxconn 20000

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 5s
    # gRPC streams are held open for the life of the agent session.
    timeout client  1h
    timeout server  1h
    timeout tunnel  1h
    timeout check   2s

frontend agent_edge
    bind :50051
    default_backend gw_agent

backend gw_agent
    balance leastconn
    option httpchk GET /readyz
    http-check expect status 200
    default-server check port 8081 inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server gw1 10.77.12.11:50051
    server gw2 10.77.12.12:50051
    server gw3 10.77.12.13:50051

frontend mgmt_edge
    bind :50063
    default_backend gw_mgmt

backend gw_mgmt
    balance leastconn
    option httpchk GET /readyz
    http-check expect status 200
    default-server check port 8081 inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server gw1 10.77.12.11:50063
    server gw2 10.77.12.12:50063
    server gw3 10.77.12.13:50063

# Backend state for the sampler: curl http://haproxy:8404/stats;csv
frontend stats
    mode http
    bind :8404
    timeout client 10s
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 1s
