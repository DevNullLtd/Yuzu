# WS-13 slice 13.6 two-replica probe (#7082) - LAB RIG ONLY, not a deployment pattern.
#
# The spike's haproxy.cfg (agent edge :50051 and management plane :50063 over the three
# gateways) PLUS an L4 VIP for the gateway -> server upstream (:50055) over TWO server
# replicas. Every gateway dials ONE endpoint (gw-srv.ha.test:50055, pool_size 1, the
# shipped shape), so each gateway holds ONE upstream connection and therefore ONE holder
# replica; holders mix per gateway, not per agent. Two endpoints on the gateway channel
# would round-robin every call over both replicas (yuzu_grpc_client_channel.erl; gateway.md
# warns against it) and make "holder" unmeasurable.
#
# A second server replica is NOT a supported deployment until the HA safe-to-scale gate
# lifts (docs/ha-delivery-matrix.md). Nothing here changes that.
global
    log stdout format raw local0
    maxconn 20000

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 5s
    # gRPC streams are held open for the life of the agent session.
    timeout client  1h
    timeout server  1h
    timeout tunnel  1h
    timeout check   2s

frontend agent_edge
    bind :50051
    default_backend gw_agent

backend gw_agent
    balance leastconn
    option httpchk GET /readyz
    http-check expect status 200
    default-server check port 8081 inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server gw1 10.77.12.11:50051
    server gw2 10.77.12.12:50051
    server gw3 10.77.12.13:50051

frontend mgmt_edge
    bind :50063
    default_backend gw_mgmt

backend gw_mgmt
    balance leastconn
    option httpchk GET /readyz
    http-check expect status 200
    default-server check port 8081 inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server gw1 10.77.12.11:50063
    server gw2 10.77.12.12:50063
    server gw3 10.77.12.13:50063

# gateway -> server upstream: a plain TCP connect check; a connection already placed stays
# on its replica for its life (no shutdown-sessions: the probe must not move holders by itself).
frontend upstream_edge
    bind :50055
    default_backend srv_upstream

backend srv_upstream
    balance leastconn
    default-server check inter 3s fall 3 rise 2
    server srv1 10.77.12.4:50055
    server srv2 10.77.12.5:50055

# Backend state for the sampler: curl http://haproxy:8404/stats;csv
frontend stats
    mode http
    bind :8404
    timeout client 10s
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 1s
