## Yuzu — Reference Docker Compose (server + Erlang gateway + agent, TLS)
##
## SECURE-BY-DEFAULT multi-container topology (PKI #1289). Demonstrates the
## scale-out plane fully encrypted:
##   - server auto-generates a per-install CA + leaves (no operator certs)
##   - dashboard over HTTPS (8443)
##   - gateway↔server upstream is MUTUAL TLS; agent↔gateway is one-way TLS
##   - agents enrol through the gateway and are issued PER-AGENT mTLS certs
##
## Cross-container cert sharing (the crux): the three containers run as
## DIFFERENT non-root uids; the server and the gateway share one /etc/yuzu/certs
## volume (the agent gets only the public CA certificate, see "Key custody"). The
## server is launched with `--cert-group yuzu-pki`, which chgrp's the cert dir
## (0750) and the gateway's leaf key (0640) to the FIXED gid 2000 `yuzu-pki`
## group baked into all three images, so the gateway (a different uid) can read
## its key.
## The server/CA/HTTPS private keys stay 0600 owner-only.
##
## Key custody: the server and gateway containers mount the key-bearing
## certificate volume, and the one-shot `ca-export` service mounts it a THIRD
## time, read-only, to copy the public CA certificate (default-ca.pem) into the
## `ca-public` volume (it runs with the shared gid, so it could read the
## group-readable gateway key, but it only runs one `install` command and
## exits). The agent container mounts `ca-public` and never the key-bearing
## volume, read-only at /etc/yuzu/certs, which is where it auto-discovers its
## trust anchor. `ca-export` re-runs on every `docker compose up`: after a CA
## re-root run `docker compose up -d` (not `restart`) so `ca-public` is
## refreshed (docs/pki-architecture.md, "Operator runbook"). The gateway container sees the whole `certs` volume (a
## named volume cannot be narrowed to a file); the server and CA keys stay 0600
## and owned by the server's uid.
##
## The gateway key file is the credential that authorizes a gateway: keep it
## readable only by the server and gateway processes, and do not mount it into
## other long-running containers. This shared-key layout is a reference-rig convenience. A
## production install should issue a gateway-only certificate whose key is 0600
## and owned by the gateway's own user, and pin it explicitly on the server with
## --gateway-peer-pin (or --gateway-peer-pin-file) instead of relying on the
## automatic pin described next.
##
## Gateway peer authorization: the server's gateway-upstream service requires an
## authorized gateway peer (an SPKI public-key pin). This rig runs the server on
## its generated default certificate set with no certificate overrides and no
## explicit pin, so the server pins its own default-gateway.pem automatically
## and no extra server flag is needed here.
##
## Gateway TLS config: the gateway's grpcbox reads its OWN config, not the
## YUZU_GW_* env vars, so we MOUNT reference-gateway-sys.config (upstream points
## at the `server` service, listener is one-way TLS). Env-driven gateway TLS is
## tracked in #1291.
##
## --cert-san: the default leaves are minted with SANs for the in-compose
## service names so SNI verification succeeds (agent→`gateway`, gateway→`server`).
##
## Mgmt-plane reachability: the gateway co-hosts the agent edge (:50051) and the
## privileged mgmt plane (:50063) on 0.0.0.0, so on this single demo bridge an
## agent could reach :50063 at the network layer. Two controls reject it: strict
## mutual TLS (#1314 — no CA-issued cert, no handshake) and the SPKI peer pin
## (#1422 — a CA-issued cert that is not the server's default-server leaf, an
## enrolled agent's included, gets UNAUTHENTICATED before any handler runs). A
## *production* deployment additionally isolates/firewalls the mgmt plane from
## agents at the infra layer.
##
## Usage:
##   export YUZU_VERSION=0.12.0
##   # the server REQUIRES Postgres (fails closed otherwise) — set the two
##   # DISTINCT db passwords (superuser + app role):
##   export YUZU_POSTGRES_PASSWORD="$(openssl rand -hex 24)"
##   export YUZU_DB_PASSWORD="$(openssl rand -hex 24)"
##   # seed an admin into ./yuzu-server.cfg (user:admin:<salt>:<pbkdf2> — see
##   # scripts/start-demo.sh for the one-liner), then first bring-up of a NEW
##   # stack (depends_on pulls in postgres; the agent starts in the next step):
##   docker compose -f docker-compose.reference-gateway.yml up -d server gateway
##   # create an enrollment token via the dashboard / REST, then start agents:
##   YUZU_ENROLL_TOKEN=<token> docker compose -f docker-compose.reference-gateway.yml up -d agent
##
## UPGRADING an existing stack: bring up the WHOLE stack, never `up -d server
## gateway` alone: a running agent container keeps the volume mounts it was
## created with until compose recreates it.
##   YUZU_ENROLL_TOKEN=<token> docker compose -f docker-compose.reference-gateway.yml up -d
##   # or only the agent: ... up -d --force-recreate agent
##
## CAUTION: `down -v` deletes the CA (the `certs` volume) — agents would re-trust
## a fresh CA. The agent-data volume persists each agent's issued leaf.

services:
  server:
    image: ghcr.io/devnullltd/yuzu-server:${YUZU_VERSION:-0.14.1}
    container_name: yuzu-server
    restart: unless-stopped
    # MCP streamed POST ships ON by default (docs/user-manual/server-admin.md
    # "Sizing"): a held-open SSE response's worst-case drain is the 120s
    # response cap + 2x~3s pump ticks + the 30s socket write timeout
    # (server.cpp set_write_timeout) = ~156s. Docker's 10s default SIGKILLs
    # it mid-drain; 210s matches the systemd unit's existing margin.
    stop_grace_period: 210s
    command:
      - "--listen=0.0.0.0:50051"
      - "--gateway-upstream=0.0.0.0:50055"
      - "--gateway-mode"
      - "--gateway-command-addr=gateway:50063"
      - "--web-address=0.0.0.0"
      - "--https-port=8443"
      - "--cert-san=dns:gateway"      # agent→gateway SNI
      - "--cert-san=dns:server"       # gateway→server SNI
      - "--cert-group=yuzu-pki"       # share the cert volume across the uids
      - "--config=/etc/yuzu/yuzu-server.cfg"
      - "--data-dir=/var/lib/yuzu"
    environment:
      # Postgres substrate (ADR-0006/0007): the server REQUIRES Postgres and
      # FAILS CLOSED without a reachable DSN. The DSN carries the APP role
      # password (YUZU_DB_PASSWORD), never the superuser's. Point at an
      # external/managed Postgres instead by replacing this DSN and dropping
      # the postgres service + depends_on below.
      YUZU_POSTGRES_DSN: postgresql://yuzu:${YUZU_DB_PASSWORD:?set YUZU_DB_PASSWORD (app role password, distinct from YUZU_POSTGRES_PASSWORD; no insecure default in the reference template)}@postgres:5432/yuzu
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8443:8443"     # Dashboard + REST API (HTTPS)
    volumes:
      - ./yuzu-server.cfg:/etc/yuzu/yuzu-server.cfg:ro
      - certs:/etc/yuzu/certs
      - server-data:/var/lib/yuzu
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8443"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 10s

  gateway:
    image: ghcr.io/devnullltd/yuzu-gateway:${YUZU_VERSION:-0.14.1}
    container_name: yuzu-gateway
    restart: unless-stopped
    environment:
      # Single-node, ephemeral — accept the default Erlang distribution cookie
      # (the gateway fail-closes on it otherwise). NEVER set this in a clustered
      # production gateway; set a strong YUZU_GW_COOKIE instead.
      YUZU_GW_ALLOW_DEFAULT_COOKIE: "1"
    volumes:
      # grpcbox reads its own config — mount the TLS sys.config (#1291 follow-up).
      - ./reference-gateway-sys.config:/opt/yuzu_gw/releases/0.2.0/sys.config:ro
      - certs:/etc/yuzu/certs:ro      # reads default-ca/-gateway via the yuzu-pki group
    depends_on:
      server: { condition: service_healthy }

  agent:
    # `-chisel` is the ONLY published agent image: release.yml builds the
    # agent in docker-publish-chisel only, never in the plain docker-publish
    # matrix, so `yuzu-agent` has never existed at any tag and this service
    # could never start. Same binary and entrypoint as the other images.
    image: ghcr.io/devnullltd/yuzu-agent-chisel:${YUZU_VERSION:-0.14.1}
    command:
      - "--server=gateway:50051"
      # No --ca-cert: the agent auto-discovers the install CA at
      # /etc/yuzu/certs/default-ca.pem (mounted below). No --no-tls.
      - "--cert-dir=/var/lib/yuzu-agent/certs"   # persists its issued leaf
      - "--data-dir=/var/lib/yuzu-agent"
      # This `command:` replaces the image's CMD, so restate its plugin dir:
      # without it the agent falls back to <binary dir>/../plugins
      # (/usr/local/plugins in this image), loads 0 plugins, and rejects every
      # command with `plugin not found: <name>`.
      - "--plugin-dir=/usr/lib/yuzu/plugins"
      - "--enrollment-token=${YUZU_ENROLL_TOKEN:?set YUZU_ENROLL_TOKEN to an enrollment token}"
    volumes:
      # The agent mounts the `ca-public` volume (see "Key custody" above),
      # which holds default-ca.pem; it verifies the gateway with that file and
      # its own leaf comes from enrolment and is stored under --cert-dir.
      - ca-public:/etc/yuzu/certs:ro
      - agent-data:/var/lib/yuzu-agent
    depends_on:
      gateway: { condition: service_started }
      ca-export: { condition: service_completed_successfully }

  # One-shot: copy the public install CA (default-ca.pem) from the `certs`
  # volume into `ca-public`, which the agent mounts. A named volume cannot
  # expose a single file, and a host bind mount would need a manual copy step
  # before first boot, so a tiny init service is the least fragile option. It
  # reuses the server image (already pulled, has sh + install), mounts `certs`
  # read-only, runs as root only to own the fresh volume's files, with gid 2000
  # (yuzu-pki) so it can traverse the 0750 cert dir and no capabilities at all.
  # It re-runs on every `up`, so a re-rooted CA is picked up.
  ca-export:
    image: ghcr.io/devnullltd/yuzu-server:${YUZU_VERSION:-0.14.1}
    container_name: yuzu-ca-export
    restart: "no"
    user: "0:2000"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        test -s /ca-src/default-ca.pem || {
          echo "ca-export: cannot read default-ca.pem from the certs volume; the server must run with --cert-group yuzu-pki so gid 2000 can read it" >&2
          exit 1
        }
        install -m 0644 /ca-src/default-ca.pem /ca-dst/default-ca.pem
    volumes:
      - certs:/ca-src:ro
      - ca-public:/ca-dst
    depends_on:
      server: { condition: service_healthy }

  # ── PostgreSQL (server storage substrate, ADR-0006/0007) ─────────────
  # The server REQUIRES Postgres and fails closed without it. Release-pinned,
  # signed yuzu-postgres image (PG18 + pgvector + first-boot app role/db
  # init); per-store schemas are created at runtime by the migration runner.
  # An external/managed Postgres is first-class — point the server's
  # YUZU_POSTGRES_DSN at it and drop this service + the server depends_on.
  postgres:
    image: ghcr.io/devnullltd/yuzu-postgres:${YUZU_VERSION:-0.14.1}
    container_name: yuzu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${YUZU_POSTGRES_PASSWORD:?set YUZU_POSTGRES_PASSWORD (superuser; no insecure default in the reference template)}
      # App role password — DISTINCT from the superuser password above.
      # First-boot init refuses to run if they are equal or if this is unset.
      YUZU_DB_PASSWORD: ${YUZU_DB_PASSWORD:?set YUZU_DB_PASSWORD (app role password, distinct from YUZU_POSTGRES_PASSWORD)}
    volumes:
      # PG18 mount point: the parent dir, NOT .../data. The postgres:18 image
      # stores data in a version-pinned subdir (default $PGDATA=/var/lib/
      # postgresql/18/docker, which lives inside this mount); a volume at the
      # legacy /data path is read as an un-migrated upgrade and the container
      # refuses to boot (docker-library/postgres#1259). Leave PGDATA at the
      # image default — do not pin it back to /data.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # pg_isready is liveness; the psql SELECT 1 over the app DSN proves the
      # app credential authenticates. $$ defers expansion to the container
      # shell so the password never appears in `docker compose config`.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U yuzu -d yuzu && psql \"postgresql://yuzu:$${YUZU_DB_PASSWORD}@$$(hostname):5432/yuzu\" -tA -c 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  certs:         # per-install CA + leaves — DO NOT delete (down -v re-roots)
  ca-public:     # public CA certificate (written by ca-export); mounted by the agent
  server-data:
  agent-data:    # each agent's issued per-agent mTLS leaf
  postgres-data: # PostgreSQL substrate state — back it up; never `down -v`
