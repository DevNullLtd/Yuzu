syntax = "proto3";

package yuzu.guardian.v1;

import "google/protobuf/timestamp.proto";

option cc_enable_arenas = true;

// Guaranteed State wire protocol for the Yuzu Guardian engine.
// See docs/yuzu-guardian-design-v1.1.md § 7.
//
// Transport reuses the existing CommandRequest/CommandResponse bidi stream via
// the reserved plugin name "__guard__" with these actions. Each message body is a
// serialized proto carried in the binary-safe `payload` (bytes) field of the
// CommandRequest / CommandResponse — NOT the `parameters` map or the `output`
// string. proto3 string values must be valid UTF-8 and serialized proto bytes are
// not; `payload` is binary-safe and survives the gateway re-encode. See
// agent.proto CommandRequest.payload / CommandResponse.payload and
// docs/guardian-mvp-contract.md G2.
//   Server -> Agent:  plugin="__guard__" action="push_rules"  payload=GuaranteedStatePush
//   Agent  -> Server: plugin="__guard__" action="event"       payload=GuaranteedStateEvent
//   Server -> Agent:  plugin="__guard__" action="get_status"
//   Agent  -> Server: plugin="__guard__" action="status"      payload=GuaranteedStateStatus

message GuaranteedStateRule {
  string rule_id = 1;
  string name = 2;
  string yaml_source = 3;       // Verbatim source, authoritative form
  uint64 version = 4;
  bool enabled = 5;
  string enforcement_mode = 6;  // "enforce" | "audit" — disable is enabled=false (field 5),
                                // NOT a third mode value (M3 / #1209). Store + REST validate
                                // mode in {enforce, audit}; `enabled` is the on/off gate.
  bytes signature = 7;          // HMAC-SHA256 over the canonical JSON (contract G3, deferred)

  // Structured, typed enforcement content — the agent's source of truth (it never
  // parses yaml_source). Each block is {type, map<string,string> params}; the param
  // shape is defined by the server-side JSON-Schema registry, not the proto.
  // See docs/guardian-mvp-contract.md decisions 1 & 3.
  GuardianSpecBlock spark       = 8;   // trigger / detection mechanism
  GuardianSpecBlock assertion   = 9;   // desired-state check
  GuardianSpecBlock remediation = 10;  // alert|remediate (action + method in params)
}

// A typed {type, params} block — the unit of a Guard's spark/assertion/remediation.
// `type` is the discriminator the agent dispatches on; `params` carries typed values
// by key (e.g. hive/key/value_name/value_type/expected). The param schema lives in the
// server-side JSON-Schema registry (the agent never sees it). See contract decision 3.
message GuardianSpecBlock {
  string type = 1;
  map<string, string> params = 2;
}

message GuaranteedStatePush {
  repeated GuaranteedStateRule rules = 1;
  bool full_sync = 2;           // true = replace active set; false = delta merge
  uint64 policy_generation = 3;
}

message GuaranteedStateEvent {
  // Normally the id of the Guardian rule that produced this event. The reserved
  // sentinel "__observation__" marks a RULELESS DEX observation (e.g. a process
  // crash) not tied to any rule: such an event is distinguished from rule-bound
  // drift by this sentinel + `event_type` (the DEX discriminator — there is
  // deliberately no separate category field). Server ingest finds no rule for the
  // sentinel, so its severity-enrich is a no-op and the per-(agent,rule) census is
  // untouched (the event_type is not a compliance state). See agent crash_event.hpp.
  string rule_id = 1;
  string rule_name = 2;
  string event_type = 3;        // e.g. "drift.detected" | "drift.remediated"
                                // | "guard.unhealthy" | "resilience.escalated"
  string severity = 4;          // "critical" | "high" | "medium" | "low"
  string guard_type = 5;        // "registry" | "etw" | "wfp" | "scm" | "process" ...
  string guard_category = 6;    // "event" | "condition"
  string detected_value = 7;
  string expected_value = 8;
  string remediation_action = 9;
  bool remediation_success = 10;
  uint64 detection_latency_us = 11;
  uint64 remediation_latency_us = 12;
  google.protobuf.Timestamp timestamp = 13;
  string resilience_strategy = 14;
  uint32 escalation_step = 15;
  double drift_rate = 16;
  string competing_process = 17;
  string platform = 18;         // "windows" | "linux" | "macos"

  // Agent-generated, stable across retries — the dedup key for the at-least-once
  // event journal (contract G6/N1). The server dedups inserts by event_id.
  string event_id = 19;

  // Structured, machine-readable detail for this event — JSON, keyed by
  // event_type (route a'). For "process.crashed" (a DEX observation) the object
  // carries process / pid / kind / exception_code / symbolic / faulting_module
  // (NO image_path — data-minimisation, mirrors the parsed-not-sent rule). The
  // human-readable `detected_value` (field 7) is UNCHANGED and kept alongside.
  // Deliberately ONE generic field, not per-type typed fields, so the wire
  // contract stays frozen as new observation types arrive (each defines its own
  // JSON shape); the DEX read model projects this into indexed columns
  // server-side. Empty for events with no structured detail (e.g. plain drift).
  //
  // Gateway-safe: the event travels as opaque bytes in CommandRequest.payload, so
  // the gateway forwards this field without decoding it — no gpb regen needed
  // (there is no guaranteed_state_pb module on the Erlang side).
  string detail_json = 20;

  // Event-family discriminator (ADR-0021 Decision 6 amendment, R0
  // 2026-09-17): "" (default, unset) means "guardian" — every pre-Reflex
  // agent build never sets this field, so absence is backward-compatible;
  // "reflex" marks an agent-local Reflex chain outcome (fired / completed /
  // failed / aborted / suppressed_sampled), whose ReflexOutcome shape is
  // carried as JSON in `detail_json` above rather than a dedicated proto
  // message (see proto/yuzu/reflex/v1/reflex.proto's header comment and
  // docs/reflex-design.md "Wire contract"). Server ingest
  // (guardian_ingest.cpp) demuxes on this field: a "reflex" row inserts
  // into the Reflex-only `reflex_outcomes` table and MUST skip every
  // Guardian-only observer (blast-radius / alert-router) — those observers
  // interpret `rule_id`/`event_type` under the Guardian vocabulary, which a
  // Reflex row does not follow (`rule_id` stays EMPTY for a Reflex row; see
  // `set_id`/`reflex_id` below). This keeps Reflex on the SAME single
  // agent->server unsolicited-event channel and the SAME single ingest
  // router chokepoint ADR-0021 Decision 6 establishes; only the eventual
  // storage destination forks on this field.
  string family = 21;

  // Reflex-only identity, additive fields (ADR-0021 Decision 6 amendment, R0
  // 2026-09-17). `rule_id` (field 1) stays EMPTY for every family=="reflex"
  // row — it is NEVER repurposed as "<set_id>/<reflex_id>" (that would
  // resurrect exactly the `__observation__` rule-id-squat pattern Decision 6
  // retires `family` in order to stop doing). Both fields are empty and
  // ignored for family != "reflex" rows.
  string set_id = 22;
  string reflex_id = 23;
}

message GuaranteedStateStatus {
  string agent_id = 1;
  uint64 policy_generation = 2;
  uint32 total_rules = 3;
  uint32 compliant_rules = 4;
  uint32 drifted_rules = 5;
  uint32 errored_rules = 6;
  repeated GuaranteedStateRuleStatus rules = 7;
  string platform = 8;
}

message GuaranteedStateRuleStatus {
  string rule_id = 1;
  string status = 2;            // "compliant" | "drifted" | "errored" | "exempt"
  string guard_category = 3;
  uint32 drift_count = 4;
  uint32 remediation_count = 5;
  google.protobuf.Timestamp last_evaluation = 6;
  google.protobuf.Timestamp last_drift = 7;

  // Kernel-wiring health signal (plan PR 3). Lets the dashboard distinguish
  // "compliant because nothing's happening" from "silently deaf because the
  // subscription never plugged into the kernel."
  //
  // Producer-lifecycle note: these fields are populated starting with the
  // agent build that ships PR 3's self-test probe. On agents predating that
  // build the fields are default-constructed (false / epoch / 0). Consumers
  // MUST treat default values as "status unknown," NOT as "guard unhealthy."
  bool guard_healthy = 8;
  google.protobuf.Timestamp last_notification = 9;
  uint64 notifications_total = 10;
}
