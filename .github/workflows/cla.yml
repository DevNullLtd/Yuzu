name: CLA Assistant

# Yuzu dual-licenses its source (AGPL-3.0-or-later for the community edition
# and a commercial license for enterprise/). To preserve the right to ship
# under both licenses, every external contribution must be covered by a
# signed Contributor License Agreement (see ../CLA.md).
#
# This workflow uses contributor-assistant/github-action to comment on every
# pull request and require every commit author to sign the CLA before merge.
#
# ─────────────────────────────────────────────────────────────────────────
#  ACTIVE on DevNullLtd/Yuzu (activated 2026-05-21, while the repo was
#  Tr3kkR/Yuzu; transferred to the DevNullLtd org 2026-09-28).
# ─────────────────────────────────────────────────────────────────────────
# Provisioning (owner setup; see docs/dependency-updates.md, "The cla environment"):
#   - Secret `CLA_REPO_ACCESS_TOKEN`: a token able to write the signatures
#     store. It is to be stored in the `cla` environment, which only the
#     default branch may use. Once the owner has moved it there and deleted
#     the repository copy (docs/dependency-updates.md, "The cla environment"),
#     a workflow on another branch cannot read it; until then it is still a
#     repository secret. Only cla-check may
#     declare the environment or read the secret
#     (tests/shell/test_cla_environment.sh).
#   - Signatures store: private repo `Tr3kkR/Yuzu-cla-signatures`, branch
#     `main`, file `signatures/cla.json` (auto-created on first signature).
#     DELIBERATELY still on the personal account after the DevNullLtd
#     transfer — the signatures are the licensing record and moving them is
#     a separate, deliberate decision, not a rename. Do not "fix" the
#     `remote-organization-name` below to match the new repo owner.
#   - Guard: runs only on the canonical repo; forks of Yuzu are skipped.
#
# To make the CLA *block* merges (not just comment), add this job's status
# context to the `Protect Dev` / `Protect Main` rulesets' required checks.
#
# NOTE: any external contribution merged BEFORE activation was not covered by
# a signed CLA, so it is AGPL-only and cannot be relicensed commercially.
# See CONTRIBUTING.md.

# zizmor dangerous-triggers is ignored on both triggers below (reviewed
# 2026-11-17). The CLA bot must comment on and set statuses for FORK pull
# requests, which a plain `pull_request` run cannot (read-only token, no
# secrets). The job never checks out or executes pull-request code: it runs
# one SHA-pinned action that reads event metadata through the API. The token
# it hands that action is to be stored in the `cla` environment (Provisioning above).
on:
  issue_comment:  # zizmor: ignore[dangerous-triggers] approver: fjarvis (2026-11-18), revisit: 2027-05-18 (#8228)
    types: [created]
  pull_request_target:  # zizmor: ignore[dangerous-triggers] approver: fjarvis (2026-11-18), revisit: 2027-05-18 (#8228)
    types: [opened, synchronize, closed]

permissions:
  contents: read

jobs:
  cla-check:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      pull-requests: write
      statuses: write
    # Live on the canonical repo only; forks of Yuzu skip the CLA gate.
    if: github.repository == 'DevNullLtd/Yuzu'
    # CLA_REPO_ACCESS_TOKEN is to be stored in this environment, whose only
    # deployment branch is `main` (owner setup; until then it is still a
    # repository secret). Both triggers run the default branch's copy of this
    # file with GITHUB_REF set to the default branch, which is what the
    # environment's branch rule is matched against, so fork pull requests
    # pass it too. `deployment: false` keeps GitHub from creating a
    # deployment record on every pull request event and comment; the branch
    # rule still applies.
    environment:
      name: cla
      deployment: false
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        # zizmor archived-uses ignored (reviewed 2026-11-17): upstream
        # archived this repository, so it gets no security fixes. It stays
        # SHA-pinned until the maintainers choose a replacement CLA bot that
        # can keep reading the existing signatures store; that is an owner
        # decision, not a CI fix.
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1 # zizmor: ignore[archived-uses] approver: fjarvis (2026-11-18), revisit: 2027-05-18 (#8228)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PAT with `repo` scope; required because GITHUB_TOKEN cannot write
          # to a repo other than the one triggering the workflow, and the
          # signatures store is conventionally a separate private repo.
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_REPO_ACCESS_TOKEN }}
        with:
          path-to-signatures: 'signatures/cla.json'
          path-to-document: 'https://github.com/DevNullLtd/Yuzu/blob/main/CLA.md'
          branch: 'main'
          allowlist: Tr3kkR,dependabot[bot]
          # Intentionally NOT DevNullLtd — see the signatures-store note in
          # the header block.
          remote-organization-name: Tr3kkR
          remote-repository-name: Yuzu-cla-signatures
          custom-notsigned-prcomment: |
            Thanks for your pull request! Before we can merge it, we need you to
            accept the Yuzu [Contributor License Agreement](https://github.com/DevNullLtd/Yuzu/blob/main/CLA.md).
            Please read the document, then reply to this comment with:
            `I have read the CLA Document and I hereby sign the CLA`
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All CLA signatures are on file. Thank you!'
