name: CLA Assistant

# Yuzu dual-licenses its source (AGPL-3.0-or-later for the community edition
# and a commercial license for enterprise/). To preserve the right to ship
# under both licenses, every external contribution must be covered by a
# signed Contributor License Agreement (see ../CLA.md).
#
# This workflow uses contributor-assistant/github-action to comment on every
# pull request and require every commit author to sign the CLA before merge.
#
# ─────────────────────────────────────────────────────────────────────────
#  ACTIVE on DevNullLtd/Yuzu (activated 2026-05-21, while the repo was
#  Tr3kkR/Yuzu; transferred to the DevNullLtd org 2026-09-28).
# ─────────────────────────────────────────────────────────────────────────
# Provisioning (in place):
#   - Secret `CLA_REPO_ACCESS_TOKEN`: classic PAT (`repo` scope) able to
#     write the signatures store.
#   - Signatures store: private repo `Tr3kkR/Yuzu-cla-signatures`, branch
#     `main`, file `signatures/cla.json` (auto-created on first signature).
#     DELIBERATELY still on the personal account after the DevNullLtd
#     transfer — the signatures are the licensing record and moving them is
#     a separate, deliberate decision, not a rename. Do not "fix" the
#     `remote-organization-name` below to match the new repo owner.
#   - Guard: runs only on the canonical repo; forks of Yuzu are skipped.
#
# To make the CLA *block* merges (not just comment), add this job's status
# context to the `Protect Dev` / `Protect Main` rulesets' required checks.
#
# NOTE: any external contribution merged BEFORE activation was not covered by
# a signed CLA, so it is AGPL-only and cannot be relicensed commercially.
# See CONTRIBUTING.md.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, closed]

permissions:
  contents: read

jobs:
  cla-check:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      pull-requests: write
      statuses: write
    # Live on the canonical repo only; forks of Yuzu skip the CLA gate.
    if: github.repository == 'DevNullLtd/Yuzu'
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PAT with `repo` scope; required because GITHUB_TOKEN cannot write
          # to a repo other than the one triggering the workflow, and the
          # signatures store is conventionally a separate private repo.
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_REPO_ACCESS_TOKEN }}
        with:
          path-to-signatures: 'signatures/cla.json'
          path-to-document: 'https://github.com/DevNullLtd/Yuzu/blob/main/CLA.md'
          branch: 'main'
          allowlist: Tr3kkR,dependabot[bot]
          # Intentionally NOT DevNullLtd — see the signatures-store note in
          # the header block.
          remote-organization-name: Tr3kkR
          remote-repository-name: Yuzu-cla-signatures
          custom-notsigned-prcomment: |
            Thanks for your pull request! Before we can merge it, we need you to
            accept the Yuzu [Contributor License Agreement](https://github.com/DevNullLtd/Yuzu/blob/main/CLA.md).
            Please read the document, then reply to this comment with:
            `I have read the CLA Document and I hereby sign the CLA`
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All CLA signatures are on file. Thank you!'
