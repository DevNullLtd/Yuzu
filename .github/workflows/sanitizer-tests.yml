name: Sanitizer tests

# Workflow dispatched by scripts/test/sanitizer-gate.sh (Phase 6 of /test).
#
# Runs ASan+UBSan and TSan rebuilds + test suites on the Big Tam
# self-hosted pool (yuzu-bigtam-linux, native Ubuntu 26.04, GCC 15);
# sanitizer rebuilds are too slow to run on the operator's interactive dev
# box, so /test --full dispatches here instead. A preflight job gates both
# legs on bigtam_pool_healthy (fail-closed skip if Big Tam is offline).
#
# ASAN_OPTIONS / TSAN_OPTIONS mirror .github/workflows/ci.yml so local
# runs match CI semantics (any findings fail the job).
#
# Job results are surfaced via:
#   - exit codes (success/failure at the workflow level)
#   - sanitizer-asan.log / sanitizer-tsan.log artifacts (gate parser reads these)
#   - testlog.junit.xml artifacts (standard meson format)
#
# Note on dispatch: workflow_dispatch requires the workflow file to exist
# on the target ref. The gate passes --ref $(git rev-parse HEAD), so this
# file must be committed and pushed before /test --full can dispatch
# against a new commit.
#
# TODO(#4637): this workflow provisions no Postgres service and sets no
# YUZU_TEST_POSTGRES_DSN. Every Postgres-touching test SKIPs silently via
# YUZU_REQUIRE_PG_DB when that DSN is unset (tests/unit/test_helpers.hpp), so
# today this workflow cannot be trusted as evidence that a PG-touching
# sanitizer issue is actually exercised. Real fix is a separate, larger CI
# change (adding a Postgres service + ensure-postgres.sh wiring, mirroring
# ci.yml's server legs); out of scope here, tracked at #4637.

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Which sanitizer to run (asan, tsan, both)"
        required: false
        default: "both"
        type: choice
        options: [asan, tsan, both]
      run_id:
        description: "/test run ID for correlation (appears in artifact names)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: sanitizer-tests-${{ github.ref }}
  cancel-in-progress: false

env:
  VCPKG_COMMIT: "4b77da7fed37817f124936239197833469f1b9a8"
  CCACHE_MAXSIZE: "500M"
  CCACHE_COMPRESS: "true"
  # Big Tam allocates one 8C/16T L3 domain to each runner.
  YUZU_BUILD_JOBS: "16"

jobs:
  # ── Preflight: Big Tam runner-health gate ─────────────────────────────
  # Mirrors ci.yml's preflight. Runs on a GHA-hosted runner (always
  # available) and queries /actions/runners via runner-health-check.py.
  # The sanitizer jobs pin the Big Tam sub-pool (gcc-15/26.04 toolchain),
  # so they gate on bigtam_pool_healthy with explicit `== 'true'`
  # (fail-closed: an offline/unknown Big Tam skips the job in <30s rather
  # than queueing 75 min into a stalled runner). Secrets are available on
  # workflow_dispatch (the /test --full dispatch path), so the PAT resolves.
  preflight:
    name: "Sanitizer preflight (runner health)"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      bigtam_pool_healthy: ${{ steps.health.outputs.bigtam_pool_healthy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Probe runner health
        id: health
        env:
          GH_TOKEN: ${{ secrets.RUNNER_INVENTORY_TOKEN || secrets.GITHUB_TOKEN }}
        run: >-
          python3 scripts/ci/runner-health-check.py --mode preflight
          --require-pool bigtam

  asan-ubsan:
    name: "Sanitizers (ASan+UBSan)"
    needs: [preflight]
    # Suite selector AND the Big Tam health gate (fail-closed `== 'true'`).
    if: ${{ (inputs.suite == 'asan' || inputs.suite == 'both' || inputs.suite == '') && needs.preflight.outputs.bigtam_pool_healthy == 'true' }}
    # Pinned to the Big Tam sub-pool (native Ubuntu 26.04, GCC 15): the
    # x64-linux-asan triplet is a forced cold-cache rebuild and a small
    # cloud runner can't finish it inside the job timeout. The Threadripper
    # Big Tam host clears the instrumented dep tree fast; the bigtam-linux
    # label guarantees the gcc-15 toolchain (Shulgi 24.04 can't build it).
    runs-on: [self-hosted, Linux, X64, yuzu-bigtam-linux]
    timeout-minutes: 75
    env:
      # detect_odr_violation=0: kept as belt-and-braces post-#4019, not
      # because the original trigger still applies. It was added because
      # gRPC's libgpr.so embedded a static copy of abseil's kToUpper while
      # the rest of the dep tree linked abseil dynamically -- #4019's
      # triplets/x64-linux-asan.cmake switch to static linkage eliminated
      # that specific split (confirmed: no separate libgpr.so in the built
      # binaries). A narrower, still-live instance of the same ODR class
      # survives at the libyuzu_agent_core.so/test-binary boundary (each
      # independently embeds its own abseil kSeed) -- confirmed empirically
      # NOT to trip this detector across a full agent-suite run, but not
      # proven absent under every code path. Re-enabling is tracked
      # separately; don't assume this line is dead weight.
      ASAN_OPTIONS: "detect_leaks=1:halt_on_error=1:detect_odr_violation=0"
      UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"
      # Big Tam runs 4 runners on one host; a gateway eunit test that boots
      # the app can transiently bring up Erlang distribution and trip the
      # #659 insecure-default-cookie boot guard. Documented dev/CI override
      # (the guard's policy logic is unit-tested directly); matches ci.yml.
      YUZU_GW_ALLOW_DEFAULT_COOKIE: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install system packages
        run: |
          # Big Tam does NOT carry meson on the default PATH: ci.yml
          # pip-installs it under ~/.local/bin and adds that to PATH per-job,
          # which does NOT persist to this workflow. So install the toolchain
          # here (mirrors ci.yml's linux leg) rather than verify-only.
          # flock serializes apt across the 4 runners sharing the Big Tam
          # host — DPkg::Lock::Timeout does NOT cover apt-get update's lists
          # lock — reusing ci.yml's lock path so all Big Tam jobs coordinate.
          (
            flock -w 600 9 || { echo "::error::timed out waiting for apt lock"; exit 1; }
            sudo apt-get -o DPkg::Lock::Timeout=300 update
            sudo apt-get -o DPkg::Lock::Timeout=300 install -y \
              cmake ninja-build pkg-config curl zip unzip tar python3-pip ccache \
              bison flex libsystemd-dev libblkid-dev autoconf automake libtool gcc-15 g++-15
          ) 9>/tmp/yuzu-ci-apt.lock
          pip3 install --user --break-system-packages --require-hashes -r requirements-ci.txt
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Assert toolchain available
        run: |
          # Sanity-check the install above landed meson/gcc-15 on PATH and
          # libsystemd is discoverable (the Linux Guardian systemd service
          # guard links sd-bus at configure time). Fail loudly otherwise.
          for tool in meson ninja gcc-15 g++-15 ccache python3 bison flex autoconf automake libtool; do
              if ! command -v "$tool" >/dev/null; then
                  echo "::error::$tool not on PATH on yuzu-bigtam-linux runner"
                  exit 1
              fi
          done
          if ! pkg-config --exists libsystemd; then
              echo "::error::libsystemd-dev (pkg-config 'libsystemd') missing on yuzu-bigtam-linux runner"
              exit 1
          fi
          meson --version
          gcc-15 --version | head -1
          ccache --version | head -1

      # Install Erlang/OTP and rebar3 via setup-beam (the Big Tam host's
      # global Erlang, if any, is not guaranteed on the `runner` user's
      # PATH). Use the same setup-beam pattern as ci.yml / nightly.yml /
      # release.yml — version pin must move with them on any OTP bump.
      # ImageOS env is required because setup-beam can't auto-detect the
      # self-hosted OS; DELIBERATELY ubuntu24 even on 26.04 (setup-beam has
      # no ubuntu26 prebuilt OTP; the 24.04 build runs fine on 26.04 — same
      # libcrypto.so.3 soname). Matches ci.yml's linux leg.
      - name: Install Erlang/OTP and rebar3
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        env:
          ImageOS: ubuntu24
        with:
          otp-version: '28'
          rebar3-version: '3.24'

      # sre-5: fail fast if the runner is out of disk before we sink
      # time into a 15-min compile that's going to die with ENOSPC.
      # Full sanitizer build + vcpkg + checkout + ccache ≈ 30 GB.
      - name: Assert runner disk (≥30 GB free)
        run: |
          free_gb=$(df -BG "$GITHUB_WORKSPACE" | awk 'NR==2 {gsub("G",""); print $4}')
          echo "runner disk free: ${free_gb}G on $GITHUB_WORKSPACE"
          if [[ -z "$free_gb" ]] || (( free_gb < 30 )); then
              echo "::error::runner disk ${free_gb}G < 30 GB required for sanitizer build"
              exit 1
          fi

      - name: Reset ccache stats
        run: ccache -z

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          vcpkgGitCommitId: '${{ env.VCPKG_COMMIT }}'

      - name: vcpkg sentinel (x64-linux-asan)
        # Universal cache-key contract — see scripts/ci/vcpkg-triplet-sentinel.sh.
        run: bash scripts/ci/vcpkg-triplet-sentinel.sh x64-linux-asan

      - name: Install vcpkg packages (ASan-instrumented)
        # Use the x64-linux-asan overlay triplet (matches ci.yml's
        # sanitize-asan job) so vcpkg builds protobuf/abseil/grpc with
        # -fsanitize=address,undefined; the regular x64-linux binaries
        # would surface phantom use-after-poison at protobuf static
        # init and abort before any Yuzu test could execute.
        #
        # VCPKG_DEFAULT_BINARY_CACHE points at the SAME runner-local dir
        # that ci.yml's sanitize-asan populates, so the dispatched
        # /test --full path inherits the warm cache instead of
        # rebuilding all instrumented ports from source. Closes #441.
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{ runner.tool_cache }}/yuzu-vcpkg-binary-cache-asan
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          ${{ github.workspace }}/vcpkg/vcpkg install \
            --triplet x64-linux-asan \
            --overlay-triplets=${{ github.workspace }}/triplets \
            --x-manifest-root=${{ github.workspace }}

      - name: Configure (Meson + ASan/UBSan)
        env:
          CC: ccache gcc-15
          CXX: ccache g++-15
          PKG_CONFIG_PATH: ${{ github.workspace }}/vcpkg_installed/x64-linux-asan/lib/pkgconfig
        run: |
          rm -rf build-linux-asan
          meson setup build-linux-asan \
            --native-file meson/native/linux-gcc15.ini \
            --buildtype=debug \
            -Dcmake_prefix_path=${{ github.workspace }}/vcpkg_installed/x64-linux-asan \
            -Dbuild_tests=true \
            -Db_sanitize=address,undefined

      - name: Build (ASan+UBSan)
        run: meson compile -C build-linux-asan -j "$YUZU_BUILD_JOBS" 2>&1 | tee sanitizer-asan-build.log

      - name: Test (ASan+UBSan)
        # Capture both stdout and the meson testlog as artifacts so the
        # gate parser can distinguish "build failed" from "one test
        # leaked 48 bytes". --no-stdsplit keeps ASan output interleaved
        # with the test harness output so the ERROR line is visible.
        run: |
          set -o pipefail
          # --timeout-multiplier 2: same rationale as nightly.yml — the #2092
          # server shards carry 600s budgets sized for uninstrumented runs.
          meson test -C build-linux-asan --timeout-multiplier 2 --print-errorlogs --no-stdsplit \
              2>&1 | tee sanitizer-asan.log

      - name: ccache stats
        if: always()
        run: ccache -s

      - name: Upload ASan artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sanitizer-asan${{ inputs.run_id && format('-{0}', inputs.run_id) || '' }}
          path: |
            sanitizer-asan.log
            sanitizer-asan-build.log
            build-linux-asan/meson-logs/testlog.junit.xml
            build-linux-asan/meson-logs/testlog.txt
          if-no-files-found: warn

  tsan:
    name: "Sanitizers (TSan)"
    needs: [preflight]
    # Suite selector AND the Big Tam health gate (fail-closed `== 'true'`).
    if: ${{ (inputs.suite == 'tsan' || inputs.suite == 'both' || inputs.suite == '') && needs.preflight.outputs.bigtam_pool_healthy == 'true' }}
    # Pinned to the Big Tam sub-pool for the same reason as asan-ubsan:
    # x64-linux-tsan is a forced cold-cache rebuild every run (#917) and the
    # bigtam-linux label guarantees the gcc-15 toolchain (Shulgi 24.04 can't
    # build it).
    runs-on: [self-hosted, Linux, X64, yuzu-bigtam-linux]
    timeout-minutes: 75
    env:
      # TSan suppressions are COMPILED INTO the test binaries
      # (tests/unit/test_runner_main.cpp, __tsan_default_suppressions, #1611);
      # there is deliberately no `suppressions=` file here. Read that comment
      # before adding one.
      TSAN_OPTIONS: "halt_on_error=1:second_deadlock_stack=1"
      # See asan-ubsan: harmless gateway-eunit default-cookie defence on the
      # shared 4-runner Big Tam host (matches ci.yml).
      YUZU_GW_ALLOW_DEFAULT_COOKIE: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install system packages
        run: |
          # See the ASan job: Big Tam does not carry meson on the default
          # PATH, so install the toolchain here (flock-serialized apt across
          # the shared 4-runner host, same lock path as ci.yml) rather than
          # verify-only.
          (
            flock -w 600 9 || { echo "::error::timed out waiting for apt lock"; exit 1; }
            sudo apt-get -o DPkg::Lock::Timeout=300 update
            sudo apt-get -o DPkg::Lock::Timeout=300 install -y \
              cmake ninja-build pkg-config curl zip unzip tar python3-pip ccache \
              bison flex libsystemd-dev libblkid-dev autoconf automake libtool gcc-15 g++-15
          ) 9>/tmp/yuzu-ci-apt.lock
          pip3 install --user --break-system-packages --require-hashes -r requirements-ci.txt
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Assert toolchain available
        run: |
          for tool in meson ninja gcc-15 g++-15 ccache python3 bison flex autoconf automake libtool; do
              if ! command -v "$tool" >/dev/null; then
                  echo "::error::$tool not on PATH on yuzu-bigtam-linux runner"
                  exit 1
              fi
          done
          if ! pkg-config --exists libsystemd; then
              echo "::error::libsystemd-dev (pkg-config 'libsystemd') missing on yuzu-bigtam-linux runner"
              exit 1
          fi
          meson --version
          gcc-15 --version | head -1
          ccache --version | head -1

      # Install Erlang/OTP and rebar3 (see ASan job for full rationale).
      - name: Install Erlang/OTP and rebar3
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        env:
          ImageOS: ubuntu24
        with:
          otp-version: '28'
          rebar3-version: '3.24'

      - name: Assert runner disk (≥30 GB free)
        run: |
          free_gb=$(df -BG "$GITHUB_WORKSPACE" | awk 'NR==2 {gsub("G",""); print $4}')
          echo "runner disk free: ${free_gb}G on $GITHUB_WORKSPACE"
          if [[ -z "$free_gb" ]] || (( free_gb < 30 )); then
              echo "::error::runner disk ${free_gb}G < 30 GB required for sanitizer build"
              exit 1
          fi

      - name: Reset ccache stats
        run: ccache -z

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          vcpkgGitCommitId: '${{ env.VCPKG_COMMIT }}'

      - name: vcpkg sentinel (x64-linux-tsan)
        # Universal cache-key contract — see scripts/ci/vcpkg-triplet-sentinel.sh.
        run: bash scripts/ci/vcpkg-triplet-sentinel.sh x64-linux-tsan

      - name: Install vcpkg packages (TSan-instrumented)
        # Dedicated x64-linux-tsan triplet (#917): TSan-instrumented
        # ports give TSan the visibility it needs into abseil/grpc/openssl
        # synchronization primitives. Without this, TSan-instrumented
        # consumer code passes through non-TSan library code and either
        # misses real races or hard-faults on shadow-memory collisions.
        # Per-triplet binary cache because TSan-flag compiled packages
        # can't share zips with the standard or ASan triplets.
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{ runner.tool_cache }}/yuzu-vcpkg-binary-cache-tsan
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          ${{ github.workspace }}/vcpkg/vcpkg install \
            --triplet x64-linux-tsan \
            --overlay-triplets=${{ github.workspace }}/triplets \
            --x-manifest-root=${{ github.workspace }}

      - name: Configure (Meson + TSan)
        env:
          CC: ccache gcc-15
          CXX: ccache g++-15
          PKG_CONFIG_PATH: ${{ github.workspace }}/vcpkg_installed/x64-linux-tsan/lib/pkgconfig
        run: |
          rm -rf build-linux-tsan
          meson setup build-linux-tsan \
            --native-file meson/native/linux-gcc15.ini \
            --buildtype=debug \
            -Dcmake_prefix_path=${{ github.workspace }}/vcpkg_installed/x64-linux-tsan \
            -Dbuild_tests=true \
            -Db_sanitize=thread

      - name: Build (TSan)
        run: meson compile -C build-linux-tsan -j "$YUZU_BUILD_JOBS" 2>&1 | tee sanitizer-tsan-build.log

      - name: Build gai_sync_shim (TSan + glibc getaddrinfo_a workaround)
        # Same shim as nightly.yml's TSan job (#438): cpp-httplib's non-blocking
        # DNS routes through getaddrinfo_a(), whose clone3-spawned helper thread
        # bypasses TSan's pthread_create interceptor and crashes the suite the way
        # the nightly used to. ONE shared build script, so this and nightly.yml
        # can't drift (#1038 CS-03) — the glibc-private-ABI guard, gcc-15/-Werror,
        # and the $RUNNER_TEMP-not-/tmp shared-path fix (#1038 R-15/CS-04) all live
        # there and now apply here too.
        run: bash scripts/ci/build-gai-sync-shim.sh "$RUNNER_TEMP/libgai_sync_shim.so"

      - name: Test (TSan)
        env:
          LD_PRELOAD: ${{ runner.temp }}/libgai_sync_shim.so
        run: |
          set -o pipefail
          # --timeout-multiplier 2: same rationale as nightly.yml — the #2092
          # server shards carry 600s budgets sized for uninstrumented runs.
          meson test -C build-linux-tsan --timeout-multiplier 2 --print-errorlogs --no-stdsplit \
              2>&1 | tee sanitizer-tsan.log

      - name: ccache stats
        if: always()
        run: ccache -s

      - name: Upload TSan artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sanitizer-tsan${{ inputs.run_id && format('-{0}', inputs.run_id) || '' }}
          path: |
            sanitizer-tsan.log
            sanitizer-tsan-build.log
            build-linux-tsan/meson-logs/testlog.junit.xml
            build-linux-tsan/meson-logs/testlog.txt
          if-no-files-found: warn
