name: Release legs (daily dispatch)

# Daily release/LTO coverage of `dev` (CI speed programme, PR 1).
#
# A push to `dev` no longer builds ci.yml's release legs (Linux gcc-15 release
# LTO, Linux clang-21 release, Windows MSVC release LTO, macOS release LTO):
# they cost 9-23 min of self-hosted runner time per push and gate nothing (no
# release leg is a required check). This workflow puts them back on a daily
# cadence instead: it dispatches ci.yml against dev's tip with `legs=release`,
# which expands to the release legs only (the debug legs already ran on that
# commit's push). A push to `main` (release promotion) still runs the whole
# matrix, so every release candidate is built in release mode before it tags.
#
# It skips when dev's tip already has a release-legs dispatch run that
# succeeded or is still in flight, so a quiet day costs nothing.
#
# LIVE ONLY FROM `main`: a `schedule:` trigger fires from the default branch
# alone, so this cron starts at the first dev -> main promotion carrying this
# file. Until then, run it by hand:
#   gh workflow run release-legs-nightly.yml --ref dev
# or dispatch ci.yml directly:
#   gh workflow run ci.yml --ref dev -f legs=release
#
# 02:30 UTC sits clear of Big Tam's 01:00 Postgres restart and nightly.yml's
# 06:00 run. The dispatched run lands in ci.yml's own `-dispatch` concurrency
# group, so it never displaces a queued dev push run.
#
# The dispatch uses GITHUB_TOKEN: a workflow_dispatch event is one of the two
# events a GITHUB_TOKEN may create that DOES start a new run.

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-legs-nightly
  cancel-in-progress: false

jobs:
  dispatch:
    name: "Dispatch release legs on dev"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write   # gh workflow run (dispatch ci.yml) + gh run list
      contents: read   # read dev's tip commit
    steps:
      - name: Dispatch ci.yml (legs=release) unless dev's tip is already covered
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          sha=$(gh api "repos/$REPO/commits/dev" --jq .sha)
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::could not resolve dev's tip (got '$sha')"; exit 1; }
          echo "dev tip: $sha"
          # Covered = a ci.yml workflow_dispatch run on this exact commit that
          # succeeded or has not finished. A failed/cancelled one is retried.
          covered=$(gh run list -R "$REPO" --workflow ci.yml --event workflow_dispatch \
                      --commit "$sha" --limit 20 --json status,conclusion \
                      --jq '[.[] | select(.status != "completed" or .conclusion == "success")] | length')
          if (( covered > 0 )); then
            echo "dev tip $sha already has a release-legs run (success or in flight) - nothing to do." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh workflow run ci.yml -R "$REPO" --ref dev -f legs=release
          echo "Dispatched ci.yml legs=release on dev ($sha)." | tee -a "$GITHUB_STEP_SUMMARY"
