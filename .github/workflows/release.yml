name: Release

on:
  push:
    tags: ['v*']
  # Manual fallback when GitHub's push/tag webhook dispatch for this repo
  # silently drops events (encountered 2026-04-18 during v0.11.0-rc1 cut:
  # push events stopped firing workflows for ~hours while workflow_dispatch
  # remained functional). Dispatch from the tag ref via the Actions UI or
  # `gh workflow run release.yml --ref vX.Y.Z` — GITHUB_REF_NAME resolves to
  # the tag name exactly as it does for push, so the existing version-
  # extraction in every step continues to work unchanged.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  # Top-level baseline = least-privilege read. Every elevated scope
  # (id-token, attestations, packages, contents:write) is opted into
  # per-job — Scorecard Token-Permissions zeroes the score on any
  # workflow-level write to a sensitive scope, even one shared across
  # multiple jobs.
  contents: read

env:
  # meson pin for the Linux and macOS legs lives in requirements-ci.txt (pip
  # ecosystem tracked by Dependabot); the Windows leg uses the runner's
  # pre-provisioned meson, pinned by deploy/windows/toolchain-contract.json.
  # vcpkg baseline is tracked by the scheduled
  # .github/workflows/vcpkg-baseline-update.yml workflow.
  VCPKG_COMMIT: "9eec002df1cd109f8f104cd966a763daf9751489"
  VCPKG_BINARY_SOURCES: "default"
  # ccache sizing — mirror ci.yml. Without this the self-hosted build-linux
  # leg inherits the host default (5 GiB on Big Tam), far too small for ~700
  # TUs and a full release+LTO build → cache thrash → slow release. 30G covers
  # the working set with headroom. (Harmless on the Wee Tam Windows / hosted
  # macOS build ccaches too.)
  CCACHE_MAXSIZE: "30G"
  CCACHE_COMPRESS: "true"
  CCACHE_COMPRESSLEVEL: "1"
  # Self-hosted Big Tam and Wee Tam runners each own one 8C/16T L3 domain.
  YUZU_BUILD_JOBS: "16"

jobs:
  # ── Refuse to publish over a released tag (#5282) ────────────────────
  # Every image-publishing job (docker-publish, docker-publish-postgres,
  # docker-publish-chisel, docker-publish-agent-bundle) and the release job
  # list this job in `needs`, and so do the three build jobs, so a refused run
  # stops before any build, attestation or push. Without it, a run started
  # against an already-released tag (by mistake, or a superseded run) rebuilt
  # everything and pushed new digests over :X.Y.Z (and :X.Y/:latest), which then
  # no longer matched the published release's signed SHA256SUMS and SBOMs; the
  # only existing-release check was the release job's own, after every push.
  #
  # There is deliberately NO override input. A published release's assets and
  # signatures describe the images it shipped, so any re-push over it breaks
  # verification. To redo a release, cut a new version. The guard cannot see a
  # deleted release; see Release tag policy, Limit 2.
  #
  # Only a release tag may run: the ref must be a tag (a workflow_dispatch from
  # a branch is refused) shaped vX.Y.Z or vX.Y.Z-{alpha,beta,rc}N, the alphabet
  # the release job's prerelease classifier and the `:latest` enable
  # (!contains(ref_name, '-')) assume.
  #
  # Fail-closed: only an HTTP 404 status line from
  # `gh api -i repos/.../releases/tags/<tag>` proceeds; 200 refuses; anything
  # else — no status line, 401/403/429/5xx — fails the run. gh's exit code and
  # stderr prose are never interpreted. contents:read sees PUBLISHED releases
  # only, not drafts; a draft for the tag is caught later by "Create GitHub
  # Release" (after the pushes). A re-run ("Re-run failed jobs" on the newest
  # run, the release skill's Recovery) does not repeat this job; every push and
  # the release creation instead re-check that the tag still points at the
  # run's commit (scripts/ci/check-release-tag-sha.sh).
  # Shell contract: tests/shell/test_release_guard.sh (runs this step body).
  release-guard:
    name: "Refuse re-publish over a released tag"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read   # gh api releases/tags/<tag> (sees published releases only)
    steps:
      - id: refuse-published-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          tag="${GITHUB_REF_NAME:-}"
          # SEC-F1: only a release tag may publish. A branch ref (a workflow_dispatch
          # without --ref vX.Y.Z) has no release, so the existence check alone passes it
          # and docker-publish-postgres would push :latest from branch content.
          if [[ "${GITHUB_REF_TYPE:-}" != "tag" ]]; then
            echo "::error::release.yml must run from a release tag, not ${GITHUB_REF_TYPE:-<unset>} '${tag}' (dispatch with --ref vX.Y.Z). Refusing (#5282)."
            exit 1
          fi
          # 1-4 digits per field: scripts/build-agent-bundle.sh (the post-release
          # agent-bundle job) refuses wider fields, so a tag it would reject must
          # not be allowed to publish a release first (#7529).
          re='^v[0-9]{1,4}\.[0-9]{1,4}\.[0-9]{1,4}(-(alpha|beta|rc)[0-9]{1,4})?$'
          if [[ ! "$tag" =~ $re ]]; then
            echo "::error::'$tag' is not a release tag (vX.Y.Z or vX.Y.Z-{alpha,beta,rc}N, 1-4 digits per number). Refusing (#5282)."
            exit 1
          fi
          out="$(mktemp)"; err="$(mktemp)"; rc=0
          gh api -i "repos/$GITHUB_REPOSITORY/releases/tags/$tag" >"$out" 2>"$err" || rc=$?
          # The HTTP status line is the ONLY evidence accepted: 200 = a published
          # release exists; 404 = none visible to this token (REST returns 404 for a
          # draft too). gh's exit code and stderr prose are never interpreted.
          status="$(head -n1 "$out" | tr -d '\r' | awk '$1 ~ /^HTTP\// { print $2 }')"
          case "$status" in
            200)
              body="$(sed '1,/^\r\{0,1\}$/d' "$out")"
              echo "::error::Release $tag already exists ($(jq -c '{tag_name,published_at,html_url}' <<<"$body" 2>/dev/null || head -c 300 <<<"$body")). Refusing to rebuild and push images over it: they would no longer match its signed SHA256SUMS and SBOMs (#5282). Cut a new version; see the release skill, Recovery."
              exit 1 ;;
            404)
              echo "No published release for $tag (HTTP 404); publishing may proceed."
              exit 0 ;;
            *)
              echo "::error::Could not determine whether release $tag exists (gh exit $rc, HTTP status '${status:-none}'): $(tr '\r\n' '  ' <"$err"). Failing closed (#5282)."
              exit 1 ;;
          esac

  # ── Linux x64 release build ──────────────────────────────────────────
  build-linux:
    name: "Build Linux x64"
    needs: [release-guard]
    runs-on: [self-hosted, Linux, X64, yuzu-bigtam-linux]
    permissions:
      contents: read
      id-token: write       # cosign keyless + actions/attest-build-provenance OIDC
      attestations: write   # actions/attest-build-provenance
    # 90 = backstop for the slow GHA cache backend / 9P filesystem
    # observed during v0.11.0 retags. Cache surgery (restore-only)
    # should make this irrelevant in practice; keeping the wider
    # budget so the next dependabot bump or runner hiccup doesn't
    # immediately cliff back into Post-step timeouts.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          clean: false
          persist-credentials: false

      # Activate Erlang/OTP + rebar3 so the meson `.gateway_built` custom_target
      # (enabled when rebar3 is on PATH AND an OTP passing the pin in
      # scripts/erlang_toolchain.py - 28.4 or any later 28.x - is found at
      # configure) can run `escript` at compile time.
      # The github-runner user has rebar3 in ~/.local/bin but no OTP runtime on
      # PATH, so without this the Build step fails at `.gateway_built` with
      # "escript: No such file or directory". Pin matches ci.yml + the
      # "Build Gateway (Erlang)" job so an OTP bump moves all three together.
      - name: Install Erlang/OTP and rebar3
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        env:
          ImageOS: ubuntu24
        with:
          otp-version: '28'
          rebar3-version: '3.24'

      - name: Install Python build deps (meson + PyYAML for content embed)
        # Governance UAT 2026-05-06 build-ci B-1: PyYAML is a hard
        # configure-time dependency for the bundled-content embed
        # (server/core/scripts/embed_content.py). meson setup fails
        # with error() if `import yaml` returns non-zero. Without an
        # explicit install step, this self-hosted runner relied on
        # CI-job pip-bleed-over (ci.yml installs requirements-ci to
        # ~/.local on the same runner). A runner re-bake would break
        # release. Install explicitly and hash-pinned.
        #
        # Runs BEFORE "Verify build dependencies": meson is pip-installed
        # here into ~/.local/bin, NOT pre-provisioned on the Big Tam
        # (yuzu-bigtam-linux) runner. The `echo … >> $GITHUB_PATH` puts
        # ~/.local/bin on PATH for every later step — the verify check AND
        # the `meson setup` below — mirroring ci.yml lines 269-270. Without
        # both the reorder and the PATH export, verify fails with
        # "Missing tools: meson" even though the pip install succeeds.
        run: |
          pip3 install --user --break-system-packages --require-hashes -r requirements-ci.txt
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify build dependencies
        run: |
          MISSING=""
          # bison/flex: vcpkg's libpq port builds postgresql from source and
          # cannot auto-acquire them on Linux (gov #1331 — do not rely on the
          # machine-wide side effect of ci.yml's apt step).
          # dpkg-deb/rpm2cpio/cpio: scripts/ci/artifact-sbom.py unpacks the
          # .deb and .rpm packages to describe what is inside each one.
          for cmd in gcc-15 g++-15 cmake ninja meson ccache pkg-config rpmbuild bison flex dpkg-deb rpm2cpio cpio; do
            command -v "$cmd" >/dev/null 2>&1 || MISSING="$MISSING $cmd"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Missing tools on self-hosted runner:$MISSING"
            echo "Install with: sudo apt-get install -y ccache rpm cpio bison flex libsystemd-dev"
            exit 1
          fi
          # libsystemd-dev (sd-bus) — the Linux Guardian systemd service guard links it;
          # without the .pc file `meson setup` fails the agent configure. Checked via
          # pkg-config rather than a command since it ships no binary.
          if ! pkg-config --exists libsystemd; then
            echo "::error::libsystemd-dev (pkg-config 'libsystemd') missing on self-hosted runner — sudo apt-get install -y libsystemd-dev"
            exit 1
          fi
          # libblkid-dev — bitlocker's Linux LUKS-detection leg links it;
          # without the .pc file `meson setup` fails the agent configure.
          if ! pkg-config --exists blkid; then
            echo "::error::libblkid-dev (pkg-config 'blkid') missing on self-hosted runner — sudo apt-get install -y libblkid-dev"
            exit 1
          fi

      - name: Clean stale build directory (preserve vcpkg_installed)
        run: rm -rf build-linux

      # ccache (~/.cache/ccache) persists on the self-hosted Linux
      # runner between jobs. The original cache/restore@v5 was already
      # restore-only because release tags never re-use a file-hash; the
      # local persistence delivers the same restore semantics without
      # any GHA round-trip. Issue #569.
      - name: Reset ccache stats
        run: ccache -z

      - name: Setup vcpkg
        # Mirror ci.yml (Setup vcpkg) and the Windows/macOS release jobs: clone
        # vcpkg into the workspace at the pinned VCPKG_COMMIT and invoke it by
        # full path below. The Linux release job previously ran a bare `vcpkg`,
        # which relied on a runner-global vcpkg on PATH — true on the retired
        # Shulgi runner, but the Big Tam (yuzu-bigtam-linux) pool has no `vcpkg`
        # on the non-login GHA PATH, so the install died with
        # "vcpkg: command not found" (exit 127).
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          vcpkgGitCommitId: '${{ env.VCPKG_COMMIT }}'

      - name: vcpkg sentinel (x64-linux-static)
        # Universal cache-key contract — see scripts/ci/vcpkg-triplet-sentinel.sh.
        run: bash scripts/ci/vcpkg-triplet-sentinel.sh x64-linux-static

      - name: Install vcpkg packages (static linkage)
        run: |
          ${{ github.workspace }}/vcpkg/vcpkg install --triplet x64-linux-static \
            --overlay-triplets=${{ github.workspace }}/triplets \
            --x-manifest-root=${{ github.workspace }}

      - name: Configure (Meson release)
        env:
          CC: ccache gcc-15
          CXX: ccache g++-15
          PKG_CONFIG_PATH: ${{ github.workspace }}/vcpkg_installed/x64-linux-static/lib/pkgconfig
          CMAKE_PREFIX_PATH: ${{ github.workspace }}/vcpkg_installed/x64-linux-static
        run: |
          meson setup build-linux \
            --native-file meson/native/linux-gcc15.ini \
            --buildtype=release \
            -Dcmake_prefix_path=${{ github.workspace }}/vcpkg_installed/x64-linux-static \
            -Dbuild_tests=false

      - name: Build
        run: meson compile -C build-linux -j "$YUZU_BUILD_JOBS"

      - name: ccache stats
        if: always()
        run: ccache -s

      - name: Test (smoke)
        run: |
          ./build-linux/server/core/yuzu-server --help || true
          ./build-linux/agents/core/yuzu-agent --help || true

      - name: Package archive
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${VERSION//-/_}"
          STAGING="yuzu-${VERSION}-linux-x64"
          mkdir -p "${STAGING}/bin" "${STAGING}/plugins"

          # Binaries (InstructionDefinitions are embedded into yuzu-server
          # at build time — no content/ directory shipped).
          cp build-linux/server/core/yuzu-server "${STAGING}/bin/"
          cp build-linux/agents/core/yuzu-agent "${STAGING}/bin/"

          # Agent core shared library
          find build-linux -name 'libyuzu_agent_core.so*' -exec cp {} "${STAGING}/bin/" \;

          # Plugin shared libraries
          find build-linux/agents/plugins -name '*.so' -exec cp {} "${STAGING}/plugins/" \;

          # Postgres provisioning helper (ADR-0006, #1320) — tarball installs
          # run it manually; .deb/.rpm invoke it from their post-install hooks.
          mkdir -p "${STAGING}/scripts"
          cp scripts/install-server-postgres.sh "${STAGING}/scripts/"

          tar czf "yuzu-linux-x64.tar.gz" "${STAGING}"

      # Linux ELF floor gate, ADR-2003 (Accepted, PR #5631) slice S0:
      # REPORT-ONLY. Measures the versioned-symbol requirements of everything
      # just staged against the committed floor files (agent: glibc 2.28;
      # server: 2.34) and records them. continue-on-error, and the script exits
      # 0 on violations in this mode, so it cannot fail a release; the step is
      # bounded to 10 minutes (the script has its own 240s deadline per run)
      # so a hung binutils call cannot hold the runner for long. S2 flips it to
      # --enforce. Contract: tests/shell/test_check_elf_floor.sh;
      # docs/ci-architecture.md.
      - name: ELF floor report (report-only, ADR-2003 S0)
        continue-on-error: true
        timeout-minutes: 10
        run: |
          # The default shell is `bash -e` without pipefail: without this the
          # `| tee || rc=$?` below would report tee's status, not the script's.
          set -o pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${VERSION//-/_}"
          STAGING="yuzu-${VERSION}-linux-x64"
          OUT="${RUNNER_TEMP}/elf-floor"
          rm -rf "$OUT"; mkdir -p "$OUT"
          rc=0
          bash scripts/ci/check-elf-floor.sh --report-only \
            --floor deploy/packaging/linux-floor-agent.json --dir "$STAGING" \
            --exclude 'bin/yuzu-server' --set-name agent \
            --source "${GITHUB_REF_NAME} yuzu-linux-x64.tar.gz (agent set)" \
            --emit-baseline "$OUT/baseline.json" --full-report "$OUT/agent-full.json" \
            | tee "$OUT/agent-report.txt" || rc=$?
          bash scripts/ci/check-elf-floor.sh --report-only \
            --floor deploy/packaging/linux-floor-server.json --dir "$STAGING" \
            --include 'bin/yuzu-server' --set-name server \
            --source "${GITHUB_REF_NAME} yuzu-linux-x64.tar.gz (server)" \
            --emit-baseline "$OUT/baseline.json" --full-report "$OUT/server-full.json" \
            | tee "$OUT/server-report.txt" || rc=$?
          exit "$rc"

      # Named without the "yuzu-" prefix on purpose: the release job downloads
      # every artifact matching 'yuzu-*' into its asset directory.
      - name: Upload ELF floor report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: linux-elf-floor-report
          path: ${{ runner.temp }}/elf-floor
          if-no-files-found: ignore
          retention-days: 14

      - name: Build .deb packages
        run: |
          # This job runs in a reused self-hosted workspace (clean: false). Clear
          # packages left by an earlier release first, or the "*.deb"/"*.rpm"
          # attest and upload globs ship them as this release's output (v0.13.0-rc6
          # published rc4 packages with rc6 provenance). This rm is the primary
          # control; scripts/check-release-artifacts.sh catches only leftovers
          # from a different version.
          rm -f -- ./*.deb ./*.rpm
          VERSION="${GITHUB_REF_NAME#v}"
          DEB_VERSION="${VERSION/-/\~}"
          bash deploy/packaging/debian/build-deb.sh \
            --bin-dir build-linux --version "$DEB_VERSION" --output .
          # Pre-release FILE names use the tag's version, not DEB_VERSION (#5141).
          # The control Version keeps Debian's "~" so 0.14.0~rc3 sorts before
          # 0.14.0, but GitHub rewrites "~" to "." in asset names, so a "~"
          # file name never matched SHA256SUMS or the provenance subjects.
          # Renaming here, before attestation and upload, keeps every
          # downstream name (attestations, SHA256SUMS, .intoto.jsonl) equal
          # to the stored asset name.
          if [ "$DEB_VERSION" != "$VERSION" ]; then
            for f in *_"${DEB_VERSION}"_*.deb; do
              mv -v -- "$f" "${f/_${DEB_VERSION}_/_${VERSION}_}"
            done
          fi

      - name: Build .rpm packages
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          RPM_VERSION="${VERSION%%-*}"
          PRERELEASE="${VERSION#*-}"
          [ "$PRERELEASE" = "$VERSION" ] && PRERELEASE=""
          PRE_FLAG=""
          [ -n "$PRERELEASE" ] && PRE_FLAG="--prerelease $PRERELEASE"
          bash deploy/packaging/rpm/build-rpm.sh \
            --bin-dir build-linux --version "$RPM_VERSION" $PRE_FLAG --output .

      # ── SBOMs (CycloneDX + SPDX), one per shipped file ──────────────
      # scripts/ci/artifact-sbom.py unpacks each artifact, runs syft over that
      # tree only, and adds the vcpkg ports the binaries in it are built from,
      # read from the installed x64-linux-static tree (syft cannot see them:
      # the binaries are static). It never scans the checkout: the old
      # `path: .` scan listed the vcpkg ports catalogue and test tooling
      # (40,853 components on v0.15.0) and none of the shipped libraries.
      # Each SBOM is named after its artifact (yuzu-linux-x64.cdx.json for the
      # archive, <package without .deb/.rpm>.cdx.json for a package) and
      # records its SHA-256; the release job checks both.
      - name: Install syft (pinned)
        id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.57.2

      - name: Generate per-artifact SBOMs
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          # sbom-out/ starts empty: this workspace is reused (clean: false), so
          # an SBOM left by an earlier release must never be uploaded as this
          # one's (the same reason the package steps rm old packages).
          rm -rf sbom-out && mkdir sbom-out
          VERSION="${GITHUB_REF_NAME#v}"
          for artifact in yuzu-linux-x64.tar.gz ./*.deb ./*.rpm; do
            python3 scripts/ci/artifact-sbom.py generate --syft "$SYFT" \
              --artifact "${artifact#./}" --version "$VERSION" \
              --vcpkg-installed vcpkg_installed --triplet x64-linux-static \
              --manifest vcpkg.json --out-dir sbom-out
          done

      # ── SLSA build provenance ───────────────────────────────────────
      # Records that these specific artifacts came from this specific
      # workflow run. Stored in GitHub's attestation registry; verified
      # customer-side with `gh attestation verify <file>`.
      - name: Attest provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            yuzu-linux-x64.tar.gz
            *.deb
            *.rpm

      - name: Upload archive artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: yuzu-linux-x64
          path: yuzu-linux-x64.tar.gz
          retention-days: 3

      - name: Upload .deb artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: yuzu-linux-deb
          path: "*.deb"
          retention-days: 3

      - name: Upload .rpm artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: yuzu-linux-rpm
          path: "*.rpm"
          retention-days: 3

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: yuzu-linux-x64-sbom
          path: sbom-out/
          if-no-files-found: error
          retention-days: 3

  # ── Linux ARM64 release build — SUSPENDED ────────────────────────────
  # Requires a local ARM64 runner or cross-compile runner.
  # Re-enable when self-hosted ARM64 runner is available.
  # build-linux-arm64:
  #   name: "Build Linux ARM64"
  #   ... suspended pending local runner ...

  # ARM64 archive packaging suspended — see above

  # ── Erlang gateway release build ──────────────────────────────────────
  build-gateway:
    name: "Build Gateway (Erlang)"
    needs: [build-linux]
    runs-on: [self-hosted, Linux, X64, yuzu-bigtam-linux]
    permissions:
      contents: read
      id-token: write       # cosign keyless + actions/attest-build-provenance OIDC
      attestations: write   # actions/attest-build-provenance
    timeout-minutes: 30
    env:
      ImageOS: ubuntu24
      # yuzu_gw_config_files_tests reads the SHIPPED sys.config files; a layout
      # it cannot find the repository root in must fail the release, not skip.
      YUZU_REQUIRE_CONFIG_FILES_TEST: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Erlang/OTP and rebar3
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: '28'
          rebar3-version: '3.24'

      # rebar3 _build/default/lib and Dialyzer PLT both persist in
      # the workspace on the self-hosted Linux runner — the original
      # cache/restore@v5 calls were already restore-only and the local
      # persistence is functionally equivalent without GHA round-trip.
      # Issue #569.

      - name: Compile gateway
        working-directory: gateway
        run: rebar3 compile

      # F-3 (#1243): fail closed if the committed gpb modules drift from
      # priv/proto. gpb modules are self-contained — an un-regenerated module
      # silently drops new proto fields in transit (the PR5 CSR field-drop bug).
      # Runs after compile so _build/gpb exists; regenerates with rebar.config's
      # own pinned gpb_opts and byte-diffs against the committed *_pb.erl.
      - name: Check proto codegen is in sync
        working-directory: gateway
        run: bash scripts/check-proto-codegen.sh

      - name: Run EUnit tests
        working-directory: gateway
        run: |
          set +e
          rebar3 as test eunit --dir apps/yuzu_gw/test 2>&1 | tee eunit.log
          RC=${PIPESTATUS[0]}
          # One parser for every gateway test gate (scripts/gateway_test_summary.py,
          # pinned by tests/test_gateway_test_summary.py): >= 1 test must have
          # EXECUTED (#4800); any failure or cancellation remains a failure.
          python3 ../scripts/gateway_test_summary.py strict eunit "$RC" eunit.log

      - name: Run Dialyzer
        working-directory: gateway
        run: rebar3 dialyzer

      # rebar3 does not prune lib/ directories left by an earlier release (a
      # release assembled over an old _build kept grpcbox/chatterbox/gproc/hpack
      # beside gun), and the tarball, .deb and .rpm below package the whole tree.
      # Start from nothing, then assert the result below.
      - name: Build production release
        working-directory: gateway
        run: |
          rm -rf _build/prod/rel
          rebar3 as prod release

      # The release's lib/ must be EXACTLY the applications its .rel names: an
      # extra directory (grpcbox*, chatterbox*, ...) is shipped dead code and a
      # missing one is a gateway that cannot boot. Plain shell on the .rel text
      # (one {app,"vsn"} tuple per application; erts is not under lib/).
      - name: Assert release lib/ matches the .rel application list
        working-directory: gateway
        run: |
          set -euo pipefail
          rel_dir=_build/prod/rel/yuzu_gw
          rel_file="$(ls "$rel_dir"/releases/*/yuzu_gw.rel)"
          [ "$(printf '%s\n' "$rel_file" | wc -l)" -eq 1 ] || { echo "::error::expected exactly one yuzu_gw.rel"; exit 1; }
          grep -oE '\{[a-z_0-9]+,"[^"]+"\}' "$rel_file" \
            | grep -v '^{erts,' \
            | sed -E 's/\{([a-z_0-9]+),"([^"]+)"\}/\1-\2/' \
            | LC_ALL=C sort > expected-libs.txt
          ls -1 "$rel_dir/lib" | LC_ALL=C sort > actual-libs.txt
          [ -s expected-libs.txt ] || { echo "::error::parsed no applications from $rel_file"; exit 1; }
          if ! diff -u expected-libs.txt actual-libs.txt; then
            echo "::error::release lib/ does not match the .rel application list (< missing, > extra, e.g. stale grpcbox/chatterbox)"
            exit 1
          fi
          echo "release lib/ matches the .rel: $(wc -l < actual-libs.txt) applications"

      - name: Package release tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${VERSION//-/_}"
          STAGING="yuzu-gateway-${VERSION}-linux-x64"
          mkdir -p "${STAGING}"
          cp -a gateway/_build/prod/rel/yuzu_gw/* "${STAGING}/"
          # The unit's ExecStartPre sources the cookie policy from the install dir
          # (/opt/yuzu_gw/gateway-cookie-policy.sh); ship both inside the staging dir so a
          # tarball install (tar --strip-components=1 into /opt/yuzu_gw) obtains them (the
          # .deb/.rpm/image install the policy file themselves).
          cp deploy/docker/gateway-cookie-policy.sh "${STAGING}/gateway-cookie-policy.sh"
          cp deploy/systemd/yuzu-gateway.service "${STAGING}/yuzu-gateway.service"
          tar czf "yuzu-gateway-linux-x64.tar.gz" "${STAGING}"

      - name: Build .deb package
        run: |
          # Defensive: this job's checkout cleans the workspace, but build-linux's
          # does not (clean: false) and there old packages were shipped as this
          # release's output (#5141). Never let the "*.deb"/"*.rpm" attest and
          # upload globs below see a package this step did not build.
          rm -f -- ./*.deb ./*.rpm
          VERSION="${GITHUB_REF_NAME#v}"
          DEB_VERSION="${VERSION/-/\~}"
          bash deploy/packaging/debian/build-gateway-deb.sh \
            --rel-dir gateway/_build/prod/rel/yuzu_gw \
            --version "$DEB_VERSION" --output .
          # Pre-release FILE names use the tag's version, not DEB_VERSION (#5141).
          # The control Version keeps Debian's "~" so 0.14.0~rc3 sorts before
          # 0.14.0, but GitHub rewrites "~" to "." in asset names, so a "~"
          # file name never matched SHA256SUMS or the provenance subjects.
          # Renaming here, before attestation and upload, keeps every
          # downstream name (attestations, SHA256SUMS, .intoto.jsonl) equal
          # to the stored asset name.
          if [ "$DEB_VERSION" != "$VERSION" ]; then
            for f in *_"${DEB_VERSION}"_*.deb; do
              mv -v -- "$f" "${f/_${DEB_VERSION}_/_${VERSION}_}"
            done
          fi

      - name: Build .rpm package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          RPM_VERSION="${VERSION%%-*}"
          PRERELEASE="${VERSION#*-}"
          [ "$PRERELEASE" = "$VERSION" ] && PRERELEASE=""
          PRE_FLAG=""
          [ -n "$PRERELEASE" ] && PRE_FLAG="--prerelease $PRERELEASE"
          bash deploy/packaging/rpm/build-gateway-rpm.sh \
            --rel-dir gateway/_build/prod/rel/yuzu_gw \
            --version "$RPM_VERSION" $PRE_FLAG --output .

      # ── Gateway SBOMs (CycloneDX + SPDX), one per shipped file ──────
      # Each artifact is unpacked and scanned on its own, so the SBOM lists the
      # OTP release it carries (_build/prod/rel/yuzu_gw: the applications in
      # lib/ and ERTS) and nothing from gateway/'s test build trees. rebar.lock
      # only turns each Hex dependency's pkg:otp purl into pkg:hex; it adds no
      # component. See the Linux job for the script and its naming.
      - name: Install syft (pinned)
        id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.57.2

      - name: Generate per-artifact gateway SBOMs
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          rm -rf sbom-out && mkdir sbom-out
          VERSION="${GITHUB_REF_NAME#v}"
          for artifact in yuzu-gateway-linux-x64.tar.gz ./*.deb ./*.rpm; do
            python3 scripts/ci/artifact-sbom.py generate --syft "$SYFT" \
              --artifact "${artifact#./}" --version "$VERSION" \
              --rebar-lock gateway/rebar.lock --out-dir sbom-out
          done

      - name: Attest gateway provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            yuzu-gateway-linux-x64.tar.gz
            *.deb
            *.rpm

      - name: Upload tarball artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: yuzu-gateway-linux-x64
          path: yuzu-gateway-linux-x64.tar.gz
          retention-days: 3

      - name: Upload .deb artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: yuzu-gateway-deb
          path: "*.deb"
          retention-days: 3

      - name: Upload .rpm artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: yuzu-gateway-rpm
          path: "*.rpm"
          retention-days: 3

      - name: Upload gateway SBOM artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: yuzu-gateway-linux-x64-sbom
          path: sbom-out/
          if-no-files-found: error
          retention-days: 3

  # ── Windows x64 release build ────────────────────────────────────────
  # Needs only release-guard (#5282) — runs on the Wee Tam Windows pool (a
  # separate host from the Big Tam Linux build) so it can build in parallel with
  # build-linux + build-gateway.
  build-windows:
    name: "Build Windows x64"
    needs: [release-guard]
    runs-on: [self-hosted, Windows, X64, yuzu-weetam-windows]
    permissions:
      contents: read
      id-token: write       # cosign keyless + actions/attest-build-provenance OIDC
      attestations: write   # actions/attest-build-provenance
    # 90 = backstop. Same rationale as Build Linux x64. Defender
    # exclusions on the runner should keep tar/zstd extraction off
    # the Defender scan path, but if exclusions ever drift the wider
    # budget at least lets the build complete instead of timing out.
    timeout-minutes: 90
    env:
      HAS_SIGNING_CERT: ${{ secrets.WINDOWS_SIGNING_CERT != '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          sdk: 10.0.26100.0

      - name: Verify Meson, PyYAML and ccache (pre-provisioned)
        shell: pwsh
        run: |
          # Never install Python packages here. Wee Tam's toolchain is set up
          # by deploy/windows/Provision-Windows-Runner.ps1 and pinned by
          # deploy/windows/toolchain-contract.json (checked by the next step).
          # All runner slots share one OS identity, so a machine-wide OR a
          # --user install changes what every later job's C:\Python314
          # imports: requirements-ci.txt pins a newer meson than the contract,
          # and installing it (machine-wide, in the v0.14.0-rc1 release run)
          # failed the contract check for every Windows job on the box.
          # A missing PyYAML (embed_content.py needs it at meson setup) is a
          # provisioning fault, so fail with the fix instead of installing.
          $PSNativeCommandUseErrorActionPreference = $false
          python -c "import yaml" 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::PyYAML is not importable by the runner's Python (C:\Python314). This job does not install packages into the shared host Python: drain every runner slot on this host, then re-run deploy/windows/Provision-Windows-Runner.ps1 from an elevated pwsh session (do not pass -AllowActiveRunners)."
            exit 1
          }
          meson --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # ccache is pre-provisioned on the Wee Tam (yuzu-weetam-windows)
          # runner — C:\tools\ccache is already on PATH. Chocolatey is NOT
          # installed there, so the old `choco install ccache` aborted the
          # step with "'choco' is not recognized". Fall back to winget only
          # if ccache is genuinely absent (e.g. a freshly re-baked runner);
          # on Wee Tam this branch is skipped.
          if (-not (Get-Command ccache -ErrorAction SilentlyContinue)) {
            winget install --id Ccache.Ccache --silent --accept-package-agreements --accept-source-agreements
          } else {
            Write-Host "ccache already present: $((Get-Command ccache).Source)"
          }

      - name: Assert toolchain manifest (self-hosted)
        shell: pwsh
        run: ./deploy/windows/Assert-Toolchain.ps1 -ManifestPath 'C:\actions-runner\toolchain-manifest.json'

      # ccache (~\AppData\Local\ccache) persists on the self-hosted
      # Windows runner between jobs (the original cache/restore@v5 calls
      # were already restore-only — local persistence delivers the same
      # restore semantics without any GHA round-trip, issue #569).
      # vcpkg_installed/ does NOT persist for this job: the default
      # clean: true checkout runs git clean -ffdx, so every release run
      # installs its own agent-only tree.
      - name: Reset ccache stats
        run: ccache -z

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          vcpkgGitCommitId: '${{ env.VCPKG_COMMIT }}'

      - name: Assert effective vcpkg checkout
        shell: pwsh
        run: ./deploy/windows/Assert-VcpkgCheckout.ps1 -VcpkgRoot (Join-Path $env:GITHUB_WORKSPACE 'vcpkg')

      - name: vcpkg sentinel (x64-windows)
        # Universal cache-key contract — see scripts/ci/vcpkg-triplet-sentinel.sh.
        # Both the outer shell AND the inner bash invocation must bypass
        # $PATH lookup for `bash`, otherwise the runner's $PATH order
        # (C:\Windows\system32 before C:\msys64\usr\bin) resolves `bash`
        # to WSL bash, which exits with WSL_E_LOCAL_SYSTEM_NOT_SUPPORTED
        # under LOCAL SYSTEM. Explicit MSYS2 paths fix it.
        shell: 'C:\msys64\usr\bin\bash.exe --noprofile --norc -eo pipefail {0}'
        run: /usr/bin/bash scripts/ci/vcpkg-triplet-sentinel.sh x64-windows

      - name: Install vcpkg packages
        run: |
          # Agent-only vcpkg profile (ADR-0035 step 3): no `server` feature
          # (libpq, xmlsec, drogon) and no `tests` (-Dbuild_tests=false).
          & "${{ github.workspace }}/vcpkg/vcpkg.exe" install `
            --triplet x64-windows `
            --x-manifest-root="${{ github.workspace }}" `
            --x-no-default-features

      # Agent only (ADR-0035): the server is supported on Linux only, so the
      # Windows release builds and ships the agent and its plugins, never
      # yuzu-server.exe. -Dserver=disabled is explicit here (this job starts
      # from a clean checkout, so no stored option can reach an older
      # branch). Pinned by tests/test_release_agent_only.py.
      - name: Configure (Meson release)
        env:
          CC: ccache cl
          CXX: ccache cl
        run: |
          meson setup build-windows `
            --buildtype=release `
            -Dcpp_std=vc++latest `
            -Dcmake_prefix_path=${{ github.workspace }}/vcpkg_installed/x64-windows `
            -Dbuild_tests=false `
            -Dserver=disabled

      - name: Build
        run: meson compile -C build-windows -j $env:YUZU_BUILD_JOBS

      - name: ccache stats
        if: always()
        run: ccache -s

      - name: Test (smoke)
        run: |
          & ./build-windows/agents/core/yuzu-agent.exe --help
        continue-on-error: true

      - name: Sign binaries (Authenticode)
        if: env.HAS_SIGNING_CERT == 'true'
        env:
          WINDOWS_SIGNING_CERT: ${{ secrets.WINDOWS_SIGNING_CERT }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        shell: pwsh
        run: |
          # Decode the PFX certificate from base64 secret
          $certPath = "${{ runner.temp }}\signing-cert.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERT))

          # Find signtool.exe from the Windows SDK
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter "signtool.exe" |
            Where-Object { $_.FullName -match "x64" } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1 -ExpandProperty FullName

          if (-not $signtool) {
            Write-Error "signtool.exe not found"
            exit 1
          }
          Write-Host "Using signtool: $signtool"

          # Collect all EXE and DLL files to sign
          $filesToSign = @()
          $filesToSign += Get-ChildItem build-windows -Filter "yuzu-agent.exe" -Recurse
          $filesToSign += Get-ChildItem build-windows -Filter "yuzu_agent_core.dll" -Recurse
          $filesToSign += Get-ChildItem build-windows/agents/plugins -Filter "*.dll" -Recurse

          foreach ($file in $filesToSign) {
            Write-Host "Signing: $($file.FullName)"
            & $signtool sign `
              /f $certPath `
              /p $env:WINDOWS_SIGNING_CERT_PASSWORD `
              /fd sha256 `
              /tr http://timestamp.digicert.com `
              /td sha256 `
              /d "Yuzu Endpoint Management" `
              $file.FullName

            if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to sign $($file.Name)"
              exit 1
            }

            # Verify signature
            & $signtool verify /pa /v $file.FullName
          }

          # Clean up certificate
          Remove-Item $certPath -Force

      - name: Package archive
        shell: pwsh
        run: |
          $version = "$env:GITHUB_REF_NAME".TrimStart("v").Replace("-", "_")
          $staging = "yuzu-agent-${version}-windows-x64"
          New-Item -ItemType Directory -Force -Path "${staging}/bin", "${staging}/plugins"

          # Agent only (ADR-0035): no yuzu-server.exe.
          Copy-Item "build-windows/agents/core/yuzu-agent.exe" "${staging}/bin/"

          # Agent core DLL
          Get-ChildItem -Path build-windows -Filter "yuzu_agent_core.dll" -Recurse | Copy-Item -Destination "${staging}/bin/"

          # Plugin DLLs
          Get-ChildItem -Path build-windows/agents/plugins -Filter "*.dll" -Recurse | Copy-Item -Destination "${staging}/plugins/"

          # Third-party attribution, including the Visual C++ runtime staged
          # below (yuzu-agent.iss installs the same file into {app}).
          Copy-Item "NOTICE" "${staging}/"
          # The installer packs the same file from the build directory: the
          # installer SBOM step refuses a manifest row outside it, and
          # yuzu-agent.iss would otherwise reach out to the repository root.
          Copy-Item "NOTICE" "build-windows/NOTICE"

          # Runtime DLLs from vcpkg that plugins/binaries need. This copies
          # every DLL vcpkg installed; since ADR-0035 step 3 the install above
          # is agent-only, so the server-only DLLs (libpq and its libecpg/
          # libpgtypes siblings, drogon, trantor, jsoncpp, xmlsec) are not
          # installed; the verify step below refuses the archive if one is.
          $vcpkgBin = "${{ github.workspace }}/vcpkg_installed/x64-windows/bin"
          if (Test-Path $vcpkgBin) {
            Get-ChildItem -Path $vcpkgBin -Filter "*.dll" | Copy-Item -Destination "${staging}/bin/"
          }

          # The Microsoft Visual C++ runtime (vcruntime140*.dll, msvcp140*.dll),
          # deployed app-local: every binary above imports it, and up to v0.15.0
          # neither payload carried it, so the agent ran only where something
          # else had installed the VC++ Redistributable (this runner has, which
          # is why nothing here noticed). Copied from this runner's own Visual
          # Studio redistributable directory into the zip's bin/ and into
          # build-windows/msvc-runtime, which yuzu-agent.iss installs into
          # {app}\bin. The script throws if the directory or a required DLL is
          # missing. Pinned by tests/test_windows_payload_imports.py.
          & ./deploy/packaging/windows/stage-msvc-runtime.ps1 -Destination "${staging}/bin", "build-windows/msvc-runtime"
          if ($LASTEXITCODE -ne 0) { Write-Error "stage-msvc-runtime.ps1 failed"; exit 1 }

          Compress-Archive -Path "${staging}" -DestinationPath "yuzu-agent-windows-x64.zip"

      # Unlike "Test (smoke)" above, this one gates, before the installers
      # are built and signed and before anything is attested or uploaded
      # (the binaries were Authenticode-signed above). It checks the archive
      # holds yuzu-agent.exe and no yuzu-server.exe, holds every plugin DLL
      # the build produced, and that yuzu-agent.exe --help runs from the
      # extracted archive with PATH cut down to the Windows directories. That
      # catches a DLL that yuzu-agent.exe or yuzu_agent_core.dll imports at
      # load time and the archive lacks. It does NOT cover DLLs only a plugin
      # imports (--help loads no plugin), or a missing MSVC runtime, which
      # would resolve from System32 here because the runner has the VC++
      # runtime installed; the import-closure step below covers both. The
      # agent is killed if it has not exited within 60 s. Pinned by
      # tests/test_release_agent_only.py.
      - name: Verify the agent runs from the packaged archive
        shell: pwsh
        timeout-minutes: 5
        run: |
          $out = Join-Path $env:RUNNER_TEMP "yuzu-agent-archive-check"
          if (Test-Path $out) { Remove-Item -Recurse -Force $out }
          Expand-Archive -Path "yuzu-agent-windows-x64.zip" -DestinationPath $out
          $top = Get-ChildItem -Path $out -Directory | Select-Object -First 1
          $bin = Join-Path $top.FullName "bin"
          $agent = Join-Path $bin "yuzu-agent.exe"
          if (-not (Test-Path $agent)) { Write-Error "yuzu-agent.exe missing from the archive"; exit 1 }
          if (Test-Path (Join-Path $bin "yuzu-server.exe")) { Write-Error "yuzu-server.exe found in the agent archive"; exit 1 }
          # ADR-0035 step 3: the install is agent-only, so a server-only DLL in the archive means the
          # vcpkg profile regressed. The patterns cover the nine DLLs that a full x64-windows vcpkg
          # tree has and an agent-only one lacks (measured on a real tree): drogon, jsoncpp,
          # libecpg, libecpg_compat, libpgtypes, libpq, libxmlsec1, libxmlsec1-openssl, trantor.
          # UNVERIFIED on a release: this check ran in the ADR-0035 step-3 Windows rehearsal (not a
          # release) and has not yet run on a real release tag; until then it is lexically pinned and
          # rehearsed, not operationally proven.
          $serverDlls = @(Get-ChildItem -Path $top.FullName -Recurse -File -Include "libpq*.dll", "libecpg*.dll", "libpgtypes*.dll", "drogon*.dll", "trantor*.dll", "jsoncpp*.dll", "*xmlsec*.dll" | ForEach-Object { $_.Name })
          if ($serverDlls.Count -gt 0) { Write-Error "server-only DLLs in the agent archive: $($serverDlls -join ', ')"; exit 1 }
          $built = @(Get-ChildItem -Path build-windows/agents/plugins -Filter "*.dll" -Recurse).Count
          $packed = @(Get-ChildItem -Path (Join-Path $top.FullName "plugins") -Filter "*.dll").Count
          if ($built -lt 1 -or $packed -ne $built) { Write-Error "plugin DLLs: built $built, in the archive $packed"; exit 1 }
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $p = Start-Process -FilePath $agent -ArgumentList "--help" -NoNewWindow -PassThru `
                 -RedirectStandardOutput (Join-Path $env:RUNNER_TEMP "yuzu-agent-help.txt")
          $null = $p.Handle  # keeps the exit code readable after the process ends
          if (-not $p.WaitForExit(60000)) { $p.Kill(); Write-Error "yuzu-agent.exe --help did not exit within 60 s"; exit 1 }
          if ($p.ExitCode -ne 0) { Write-Error "yuzu-agent.exe --help exited $($p.ExitCode) from the packaged archive"; exit 1 }
          Write-Host "yuzu-agent.exe --help ran from the packaged archive ($packed plugin DLLs)"

      # Every DLL a shipped .exe or .dll imports must be in that payload's bin/,
      # be an API set, or be an OS DLL in System32 - except the Visual C++
      # runtime, which counts as missing unless the payload carries it (this
      # runner's System32 has it; a customer's need not). Checked for the zip
      # as built and for the installer payload, the files yuzu-agent.iss packs
      # from build-windows, before ISCC runs. It reads PE import tables, so it
      # also covers DLLs only a plugin imports, which the step above cannot.
      # Pinned by tests/test_windows_payload_imports.py.
      - name: Check the DLL import closure of both payloads
        shell: pwsh
        timeout-minutes: 5
        run: |
          python scripts/ci/check-windows-payload-imports.py `
            --zip yuzu-agent-windows-x64.zip `
            --iss deploy/packaging/windows/yuzu-agent.iss `
            --build-dir build-windows `
            --system-dir "$env:SystemRoot\System32"
          if ($LASTEXITCODE -ne 0) { Write-Error "check-windows-payload-imports.py failed (exit $LASTEXITCODE); see the errors above"; exit 1 }

      - name: Build Windows installers (InnoSetup)
        shell: pwsh
        run: |
          $version = "$env:GITHUB_REF_NAME".TrimStart("v").Replace("-", "_")

          # Locate the Inno Setup compiler (ISCC.exe). Wee Tam
          # (yuzu-weetam-windows) has no Chocolatey, so the old
          # `choco install innosetup` aborted with "'choco' is not recognized".
          # Install via winget when absent — but winget may place Inno Setup
          # machine- OR user-scoped (rc3 installed 6.7.3 somewhere other than
          # the hardcoded C:\Program Files (x86)\Inno Setup 6), so DISCOVER
          # ISCC.exe rather than assuming a fixed path.
          function Find-Iscc {
            $candidates = @(
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
              "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
              "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
            )
            foreach ($p in $candidates) { if ($p -and (Test-Path $p)) { return $p } }
            Get-ChildItem -Path @("${env:ProgramFiles(x86)}", "$env:ProgramFiles", "$env:LOCALAPPDATA\Programs") `
              -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }

          $iscc = Find-Iscc
          if (-not $iscc) {
            Write-Host "Inno Setup 6 not found — installing via winget"
            winget install --id JRSoftware.InnoSetup --silent --accept-package-agreements --accept-source-agreements
            $iscc = Find-Iscc
          }
          if (-not $iscc) {
            Write-Error "ISCC.exe not found after InnoSetup install"
            exit 1
          }
          Write-Host "Using ISCC: $iscc"

          # Build agent installer. yuzu-agent.iss sets OutputManifestFile, so
          # ISCC also writes the list of the files it packed, with the SHA-256
          # of each; the installer's SBOM is made from that list (below). The
          # manifest is removed first and taken only from this run, so the
          # SBOM never reads one an earlier build left behind.
          Write-Host "=== Building Agent Installer ==="
          $manifest = "deploy\packaging\windows\output\YuzuAgentSetup.manifest.txt"
          Remove-Item -Force -ErrorAction SilentlyContinue $manifest, "YuzuAgentSetup-${version}.manifest.txt"
          & $iscc `
            "/DAppVersion=${version}" `
            "/DBuildDir=${{ github.workspace }}\build-windows" `
            "deploy\packaging\windows\yuzu-agent.iss"
          if ($LASTEXITCODE -ne 0) { Write-Error "Agent installer failed"; exit 1 }
          if (-not (Test-Path $manifest)) { Write-Error "ISCC wrote no manifest ($manifest): the installer SBOM is made from it"; exit 1 }

          $agentInstaller = "deploy\packaging\windows\output\YuzuAgentSetup-${version}.exe"
          Copy-Item $agentInstaller "YuzuAgentSetup-${version}.exe"
          Copy-Item $manifest "YuzuAgentSetup-${version}.manifest.txt"
          Write-Host "Agent installer: $('{0:N1} MB' -f ((Get-Item $agentInstaller).Length / 1MB))"
          # No server installer: YuzuServerSetup was discontinued by ADR-0035.

      - name: Sign installers (Authenticode)
        if: env.HAS_SIGNING_CERT == 'true'
        env:
          WINDOWS_SIGNING_CERT: ${{ secrets.WINDOWS_SIGNING_CERT }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        shell: pwsh
        run: |
          $version = "$env:GITHUB_REF_NAME".TrimStart("v").Replace("-", "_")

          $certPath = "${{ runner.temp }}\signing-cert.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERT))

          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter "signtool.exe" |
            Where-Object { $_.FullName -match "x64" } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1 -ExpandProperty FullName

          foreach ($installer in @("YuzuAgentSetup-${version}.exe")) {
            if (Test-Path $installer) {
              Write-Host "Signing: $installer"
              & $signtool sign `
                /f $certPath `
                /p $env:WINDOWS_SIGNING_CERT_PASSWORD `
                /fd sha256 `
                /tr http://timestamp.digicert.com `
                /td sha256 `
                /d "Yuzu Endpoint Management" `
                $installer
              & $signtool verify /pa $installer
            }
          }

          Remove-Item $certPath -Force

      # ── Windows SBOMs (CycloneDX + SPDX), one per shipped file ──────
      # Same script as the Linux job, against the agent-only x64-windows tree
      # (ADR-0035 step 3). The archive is unpacked and scanned. Nothing here
      # unpacks an InnoSetup installer: its SBOM lists the files ISCC's own
      # manifest (written by the "Build Windows installers" step's ISCC run)
      # says it packed, each read from build-windows and checked against the
      # SHA-256 ISCC recorded, at its path below build-windows (not its
      # install path). --inno-build-dir is the /DBuildDir that ISCC run was
      # given, the prefix of the manifest's paths. The SBOM records the
      # installer's own name and SHA-256 and is marked incomplete (the
      # InnoSetup runtime is not listed). The manifest is not a release asset;
      # it is kept for 90 days as the windows-installer-manifest artifact.
      - name: Install syft (pinned)
        id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.57.2

      - name: Generate per-artifact SBOMs
        shell: pwsh
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          $version = "$env:GITHUB_REF_NAME".TrimStart("v")
          if (Test-Path sbom-out) { Remove-Item -Recurse -Force sbom-out }
          New-Item -ItemType Directory -Path sbom-out | Out-Null
          $common = @("--version", $version, "--syft", $env:SYFT, "--out-dir", "sbom-out",
                      "--vcpkg-installed", "vcpkg_installed", "--triplet", "x64-windows", "--manifest", "vcpkg.json")
          python scripts/ci/artifact-sbom.py generate --artifact yuzu-agent-windows-x64.zip @common
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installers = @(Get-ChildItem -File -Filter "YuzuAgentSetup-*.exe")
          if ($installers.Count -lt 1) { Write-Error "no YuzuAgentSetup-*.exe to describe"; exit 1 }
          foreach ($exe in $installers) {
            python scripts/ci/artifact-sbom.py generate --artifact $exe.Name `
              --inno-manifest "$($exe.BaseName).manifest.txt" --build-dir build-windows `
              --inno-build-dir "${{ github.workspace }}\build-windows" @common
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Attest Windows provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            yuzu-agent-windows-x64.zip
            YuzuAgentSetup-*.exe

      - name: Upload archive artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: yuzu-agent-windows-x64
          path: yuzu-agent-windows-x64.zip
          retention-days: 3

      - name: Upload installer artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: yuzu-windows-installer
          path: |
            YuzuAgentSetup-*.exe
          retention-days: 3

      - name: Upload Windows SBOM artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: yuzu-agent-windows-x64-sbom
          path: sbom-out/
          if-no-files-found: error
          retention-days: 3

      # The ISCC manifest the installer SBOM was made from: evidence of how the
      # installer SBOM was produced, and for diagnosing an SBOM refusal. Kept 90
      # days, the repository maximum (owner decision, 2026-11-18). Not named
      # yuzu-*, so the release job does not download it: it is not a release
      # asset (it records the runner's paths).
      - name: Upload the installer manifest
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: windows-installer-manifest
          path: YuzuAgentSetup-*.manifest.txt
          if-no-files-found: warn
          retention-days: 90

  # ── macOS ARM64 release build ────────────────────────────────────────
  build-macos:
    name: "Build macOS ARM64"
    needs: [release-guard]
    # Pinned to the self-hosted BigMags macOS pool (Apple Silicon, Xcode 16 /
    # Apple Clang 16, accepts -std=c++23), matching how build-linux/build-gateway
    # pin Big Tam and build-windows pins Wee Tam. release.yml triggers only on
    # `push: tags: v*` + workflow_dispatch (both require repo write — no untrusted
    # fork context), so no pool-health preflight gate is needed here, mirroring the
    # self-hosted Linux/Windows release jobs. Matches ci.yml's self-hosted macOS job.
    runs-on: [self-hosted, macOS, ARM64, yuzu-bigmags-macos]
    permissions:
      contents: read
      id-token: write       # cosign keyless + actions/attest-build-provenance OIDC
      attestations: write   # actions/attest-build-provenance
    timeout-minutes: 90
    env:
      HAS_SIGNING_CERT: ${{ secrets.MACOS_SIGNING_CERT != '' }}
      HAS_NOTARIZATION: ${{ secrets.MACOS_SIGNING_CERT != '' && secrets.MACOS_NOTARIZATION_TEAM_ID != '' }}
      # Override the workflow-scope YUZU_BUILD_JOBS: "16" (sized for the 16-core
      # Big Tam / Wee Tam). BigMags is a 12-core / 24 GiB M4 Pro shared by 2
      # agents, so bound the release+LTO build to 6 here at JOB scope — otherwise
      # the workflow env wins and the `-j` below silently runs at 16.
      YUZU_BUILD_JOBS: "6"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install dependencies
        run: |
          # autoconf/automake/libtool: installed back when vcpkg's libpq port
          # (Postgres substrate, ADR-0006) ran autoreconf on this leg. This
          # install is agent-only since ADR-0035 step 3 (no libpq), so they
          # may no longer be needed; kept until a macOS run proves the leg
          # builds without them (the hosted image doesn't ship autotools).
          #
          # cmake deliberately excluded from this brew line, pinned via pipx
          # below instead. 2026-07-16: brew's floating `cmake` drifted to
          # 4.4.0 underneath us with no code change on our side, and that
          # release crashes resolving httplib's CMake package: FindThreads'
          # try_compile() trips CMake's own internal "This should not have
          # happened" guard in Internal/CheckSourceCompiles.cmake, which
          # poisons every subsequent cmake-method dependency lookup in the
          # same configure. Broke macOS CI fleet-wide the same way (ci.yml,
          # #2224) before it could hit a release build here. Pin like meson
          # below so a future brew bump can't repeat this.
          # pkg-config: the self-hosted BigMags box does not ship the hosted
          # image's baked-in pkg-config that the Configure step's PKG_CONFIG_PATH
          # assumes exists. The GitHub-hosted macos-15 image bundled it implicitly.
          brew install ninja ccache pipx autoconf automake libtool pkg-config
          # Belt-and-suspenders: the macos-15 image pre-bakes its own cmake
          # independent of this workflow's brew line, so dropping cmake
          # above doesn't remove it. Unlink it so it can never win a PATH
          # race against the pinned pipx cmake below. `|| true`: fine if a
          # future image doesn't pre-bake cmake at all; stderr is left
          # visible so a genuine unlink failure still shows in the log.
          brew unlink cmake || true
          # 4.3.4 is the latest 4.x release before the 4.4.0 regression
          # above. Bump deliberately once a fixed release is confirmed clean
          # here. Query pipx's own shim dir and prepend it to GITHUB_PATH so
          # it's guaranteed to win on PATH rather than assumed to. Captured
          # into a variable first (not inlined into the `echo` argument):
          # under `set -e`, a failing/empty command substitution inlined
          # into `echo "$(...)"` would NOT abort the step (echo's own exit
          # status is what -e checks), silently writing a blank PATH entry.
          pipx install cmake==4.3.4
          pipx_bin_dir="$(pipx environment --value PIPX_BIN_DIR)"
          test -n "$pipx_bin_dir"
          echo "$pipx_bin_dir" >> "$GITHUB_PATH"
          # GITHUB_PATH only takes effect from the next step onward, not
          # within this script, so verify via the resolved dir directly
          # rather than a bare `cmake` (which may still hit an empty PATH
          # slot right here). Self-documents the fix in every future log:
          # today's incident was exactly this kind of silent version drift.
          "$pipx_bin_dir/cmake" --version
          # awk strips the trailing ` \` that pip-compile adds when the
          # requirement is continued by `--hash=...` lines.
          pipx install "$(awk '/^meson==/ {print $1}' requirements-ci.txt)"
          # Governance UAT 2026-05-06 build-ci B-1: PyYAML is a hard
          # configure-time dependency for the bundled-content embed
          # (server/core/scripts/embed_content.py). meson setup fails
          # with error() if `import yaml` returns non-zero. Install via
          # the same hash-pinned requirements file used elsewhere.
          pip3 install --break-system-packages --require-hashes -r requirements-ci.txt

      # No actions/cache round-trip on the self-hosted BigMags pool. ccache
      # persists at ~/Library/Caches/ccache in the runner user's HOME between
      # jobs by definition, and vcpkg restores from the persistent binary cache
      # in runner.tool_cache (populated below, and warmed by the ci.yml macOS
      # test leg that shares the same path). The GHA cache/restore round-trip +
      # the ACTIONS_CACHE_URL / ACTIONS_RUNTIME_TOKEN export it fed are dead
      # wiring on a self-hosted runner. Mirrors the Linux/Windows self-hosted
      # release jobs and the ci.yml macOS conversion (PR #3217). Issue #569.
      - name: Reset ccache stats
        run: ccache -z

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          vcpkgGitCommitId: '${{ env.VCPKG_COMMIT }}'

      - name: Install vcpkg packages
        env:
          # Persistent binary cache outside the workspace on the self-hosted
          # BigMags runner. Without this, lukka/run-vcpkg defaults to a per-run
          # temp dir → 0% hit rate every run → every port rebuilt from source.
          # runner.tool_cache survives actions/checkout's default clean, and this
          # is the SAME warm cache path the ci.yml macOS test leg already
          # populates on BigMags. Plain (unconditional) form: release.yml triggers
          # only on tag push + workflow_dispatch, so there is no untrusted-fork
          # context to isolate against (unlike ci.yml's trusted_execution branch).
          VCPKG_DEFAULT_BINARY_CACHE: ${{ runner.tool_cache }}/yuzu-vcpkg-binary-cache-macos
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          # Agent-only vcpkg profile (ADR-0035 step 3), no tests.
          ${{ github.workspace }}/vcpkg/vcpkg install \
            --triplet arm64-osx \
            --x-manifest-root=${{ github.workspace }} \
            --x-no-default-features

      - name: Configure (Meson release + LTO)
        env:
          CC: ccache cc
          CXX: ccache c++
          # spdlog/fmt resolve via pkg-config, not cmake (CLAUDE.md Manual
          # Configure). Set explicitly to match ci.yml's macOS job and the Linux
          # release Configure step above — the brew `pkg-config` install is inert
          # without this, and the earlier comment referenced a var no step set.
          PKG_CONFIG_PATH: ${{ github.workspace }}/vcpkg_installed/arm64-osx/lib/pkgconfig
        run: |
          # -Dbackend_max_links=1 serialises the link steps. `-j` bounds ninja's
          # job COUNT, not the per-process RSS of a monolithic full-LTO link of
          # yuzu-agent — the real memory spike. Serialising caps peak
          # to one big LTO link at a time on the 24 GiB box; the full-LTO artifact
          # is unchanged.
          # Agent only (ADR-0035): the server is supported on Linux only, so the
          # macOS release never builds or ships yuzu-server. Pinned by
          # tests/test_release_agent_only.py. -Dserver=disabled is explicit
          # (clean checkout, nothing stored).
          meson setup build-macos \
            --native-file meson/native/macos-appleclang.ini \
            --buildtype=release \
            -Dcmake_prefix_path=${{ github.workspace }}/vcpkg_installed/arm64-osx \
            -Dbuild_tests=false \
            -Dserver=disabled \
            -Db_lto=true \
            -Dbackend_max_links=1

      - name: Build
        # -j pinned to YUZU_BUILD_JOBS = "6", set at JOB scope above (overriding the
        # workflow-scope "16" that's sized for the 16-core Tams). Load-bearing on
        # BigMags: 2 agents share 12 cores / 24 GiB and release+LTO links are
        # memory-heavy, so an unbounded ninja oversubscribes memory when both
        # agents build at once. Paired with -Dbackend_max_links=1 in Configure.
        run: meson compile -C build-macos -j "${YUZU_BUILD_JOBS:-6}"

      - name: ccache stats
        if: always()
        run: ccache -s

      - name: Test (smoke)
        run: |
          ./build-macos/agents/core/yuzu-agent --help || true

      - name: Sign binaries (codesign)
        if: env.HAS_SIGNING_CERT == 'true'
        env:
          MACOS_SIGNING_CERT: ${{ secrets.MACOS_SIGNING_CERT }}
          MACOS_SIGNING_CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          # Create a temporary keychain for signing
          KEYCHAIN_PATH="${RUNNER_TEMP}/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 1800 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"

          # Import the Developer ID certificate
          CERT_PATH="${RUNNER_TEMP}/signing-cert.p12"
          echo "${MACOS_SIGNING_CERT}" | base64 --decode > "${CERT_PATH}"
          security import "${CERT_PATH}" \
            -k "${KEYCHAIN_PATH}" \
            -P "${MACOS_SIGNING_CERT_PASSWORD}" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          # Allow codesign to access the keychain without UI prompt
          security set-key-partition-list -S apple-tool:,apple: \
            -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"

          # Add temporary keychain to the search list
          security list-keychains -d user -s "${KEYCHAIN_PATH}" $(security list-keychains -d user | tr -d '"')

          # Sign all binaries and dylibs with hardened runtime
          IDENTITY="${MACOS_SIGNING_IDENTITY}"
          # The agent binary is built under agents/core/ (the bare
          # build-macos/yuzu-agent path this loop used never existed; it went
          # unnoticed because MACOS_SIGNING_CERT has never been set).
          for binary in build-macos/agents/core/yuzu-agent; do
            echo "Signing: ${binary}"
            codesign --force --options runtime \
              --sign "${IDENTITY}" \
              --timestamp \
              "${binary}"
            codesign --verify --verbose "${binary}"
          done

          # Sign dylibs
          find build-macos -name '*.dylib' -print0 | while IFS= read -r -d '' dylib; do
            echo "Signing: ${dylib}"
            codesign --force --options runtime \
              --sign "${IDENTITY}" \
              --timestamp \
              "${dylib}"
          done

          # Clean up certificate file
          rm -f "${CERT_PATH}"

      - name: Notarize binaries
        if: env.HAS_NOTARIZATION == 'true'
        env:
          MACOS_SIGNING_CERT: ${{ secrets.MACOS_SIGNING_CERT }}
          MACOS_NOTARIZATION_APPLE_ID: ${{ secrets.MACOS_NOTARIZATION_APPLE_ID }}
          MACOS_NOTARIZATION_PASSWORD: ${{ secrets.MACOS_NOTARIZATION_PASSWORD }}
          MACOS_NOTARIZATION_TEAM_ID: ${{ secrets.MACOS_NOTARIZATION_TEAM_ID }}
        run: |
          # Create a ZIP of the signed binaries for notarization submission
          NOTARIZE_ZIP="${RUNNER_TEMP}/yuzu-notarize.zip"
          zip -j "${NOTARIZE_ZIP}" \
            build-macos/agents/core/yuzu-agent

          # Add dylibs to the notarization payload
          find build-macos -name '*.dylib' -exec zip -j "${NOTARIZE_ZIP}" {} \;

          # Submit for notarization and wait for result
          echo "Submitting for Apple notarization..."
          # --wait returns when Apple has decided, and an Invalid verdict is
          # not guaranteed to be a non-zero exit, so read the status. (The
          # .pkg below needs no such check: stapling fails without a ticket.)
          RESULT="${RUNNER_TEMP}/yuzu-notarize-result.plist"
          xcrun notarytool submit "${NOTARIZE_ZIP}" \
            --apple-id "${MACOS_NOTARIZATION_APPLE_ID}" \
            --password "${MACOS_NOTARIZATION_PASSWORD}" \
            --team-id "${MACOS_NOTARIZATION_TEAM_ID}" \
            --wait \
            --timeout 15m \
            --output-format plist > "${RESULT}" || true  # the verdict below decides; the plist is printed on failure
          STATUS=$(/usr/libexec/PlistBuddy -c 'Print :status' "${RESULT}" 2>/dev/null || echo unknown)
          if [ "${STATUS}" != "Accepted" ]; then
            echo "::error::Apple notarization status is '${STATUS}', not Accepted. Read the reason with: xcrun notarytool log <id> (the id is below)."
            cat "${RESULT}"
            exit 1
          fi

          echo "Notarization complete"
          rm -f "${NOTARIZE_ZIP}"

      - name: Clean up keychain
        if: always()
        run: |
          KEYCHAIN_PATH="${RUNNER_TEMP}/signing.keychain-db"
          if [ -f "${KEYCHAIN_PATH}" ]; then
            security delete-keychain "${KEYCHAIN_PATH}" 2>/dev/null || true
          fi

      - name: Package archive
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${VERSION//-/_}"
          STAGING="yuzu-agent-${VERSION}-macos-arm64"
          mkdir -p "${STAGING}/bin" "${STAGING}/plugins"

          # Agent only (ADR-0035): no yuzu-server.
          cp build-macos/agents/core/yuzu-agent "${STAGING}/bin/"

          # Agent core dylib
          find build-macos -name 'libyuzu_agent_core.dylib*' -exec cp {} "${STAGING}/bin/" \;

          # Plugin dylibs
          find build-macos/agents/plugins -name '*.dylib' -exec cp {} "${STAGING}/plugins/" \;

          tar czf "yuzu-agent-macos-arm64.tar.gz" "${STAGING}"

      - name: Build macOS installer (.pkg)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${VERSION//-/_}"
          bash deploy/packaging/macos/build-pkg.sh \
            --bin-dir build-macos --version "$VERSION" --output .

      - name: Sign installer (.pkg)
        if: env.HAS_SIGNING_CERT == 'true'
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${VERSION//-/_}"
          PKG="YuzuAgent-${VERSION}-macos-arm64.pkg"
          SIGNED="YuzuAgent-${VERSION}-macos-arm64-signed.pkg"

          # productsign signs the .pkg with Developer ID Installer identity
          INSTALLER_ID=$(echo "${MACOS_SIGNING_IDENTITY}" | sed 's/Developer ID Application/Developer ID Installer/')
          productsign --sign "${INSTALLER_ID}" "${PKG}" "${SIGNED}"
          mv "${SIGNED}" "${PKG}"
          echo "Signed: ${PKG}"

      - name: Notarize installer (.pkg)
        if: env.HAS_NOTARIZATION == 'true'
        env:
          MACOS_NOTARIZATION_APPLE_ID: ${{ secrets.MACOS_NOTARIZATION_APPLE_ID }}
          MACOS_NOTARIZATION_PASSWORD: ${{ secrets.MACOS_NOTARIZATION_PASSWORD }}
          MACOS_NOTARIZATION_TEAM_ID: ${{ secrets.MACOS_NOTARIZATION_TEAM_ID }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${VERSION//-/_}"
          PKG="YuzuAgent-${VERSION}-macos-arm64.pkg"

          echo "Submitting installer for Apple notarization..."
          xcrun notarytool submit "${PKG}" \
            --apple-id "${MACOS_NOTARIZATION_APPLE_ID}" \
            --password "${MACOS_NOTARIZATION_PASSWORD}" \
            --team-id "${MACOS_NOTARIZATION_TEAM_ID}" \
            --wait \
            --timeout 15m

          # Staple the notarization ticket to the .pkg
          xcrun stapler staple "${PKG}"
          echo "Notarized and stapled: ${PKG}"

      # ── macOS SBOMs (CycloneDX + SPDX), one per shipped file ────────
      # Same script as the Linux job, against the agent-only arm64-osx tree
      # (ADR-0035 step 3). The .pkg is unpacked with pkgutil --expand-full.
      # Runs after the .pkg is signed, notarized and stapled, so the SHA-256
      # each SBOM records is the shipped file's.
      - name: Install syft (pinned)
        id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.57.2

      - name: Generate per-artifact SBOMs
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          rm -rf sbom-out && mkdir sbom-out
          VERSION="${GITHUB_REF_NAME#v}"
          for artifact in yuzu-agent-macos-arm64.tar.gz ./YuzuAgent-*.pkg; do
            python3 scripts/ci/artifact-sbom.py generate --syft "$SYFT" \
              --artifact "${artifact#./}" --version "$VERSION" \
              --vcpkg-installed vcpkg_installed --triplet arm64-osx \
              --manifest vcpkg.json --out-dir sbom-out
          done

      - name: Attest macOS provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            yuzu-agent-macos-arm64.tar.gz
            YuzuAgent-*.pkg

      - name: Upload archive artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: yuzu-agent-macos-arm64
          path: yuzu-agent-macos-arm64.tar.gz
          retention-days: 3

      - name: Upload .pkg artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: yuzu-macos-pkg
          path: "YuzuAgent-*.pkg"
          retention-days: 3

      - name: Upload macOS SBOM artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: yuzu-agent-macos-arm64-sbom
          path: sbom-out/
          if-no-files-found: error
          retention-days: 3

  # ── Docker images — server + gateway published to GHCR ──────────────
  # Runs on the self-hosted Linux runner (native dockerd, systemd-managed).
  # Both images build in parallel via matrix; buildx registry cache persists
  # across releases so repeat runs with unchanged vcpkg/rebar deps are fast.
  # build-windows and build-macos are in the needs: so a failed agent
  # packaging step (e.g. the Windows "Verify the agent runs from the packaged
  # archive" refusal) stops the push before any :X.Y.Z image exists; without
  # them the images were pushed while no GitHub Release was created (ADR-0035
  # step 3, UP-12). Neither build job has an `if:`, so neither is skipped on
  # any tag, and docker-publish has no `if:` that reads needs.*.
  docker-publish:
    name: "Publish ${{ matrix.image }} image"
    needs: [release-guard, build-linux, build-gateway, build-windows, build-macos]
    runs-on: [self-hosted, Linux, X64, yuzu-bigtam-linux]
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write        # cosign keyless + Sigstore OIDC
      attestations: write    # actions/attest-build-provenance
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: server
            dockerfile: deploy/docker/Dockerfile.server
          - image: gateway
            dockerfile: deploy/docker/Dockerfile.gateway

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          clean: false
          persist-credentials: false

      - name: Lowercase repository owner
        id: owner
        run: echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          # GHCR_PAT (write:packages-only PAT) instead
          # of GITHUB_TOKEN so we can push to GHCR packages whose
          # Actions-access policy isn't pinned to this repo (e.g.
          # yuzu-agent-bundle-chisel, originally created via local
          # PAT push). Falls back to GITHUB_TOKEN for fork PRs that
          # don't have access to the secret. Username pinned to the
          # PAT owner since github.actor varies per actor. The owner is a
          # USER, not the org, so it is carried in the `GHCR_USERNAME` repo
          # variable rather than hardcoded — see the DevNullLtd migration
          # note in .github/runner-inventory.json.
          username: ${{ vars.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Compute image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ steps.owner.outputs.value }}/yuzu-${{ matrix.image }}
          # Tag convention mirrors scripts/docker-release.sh:
          #   - stable (no -alpha/-beta/-rc suffix): :X.Y.Z + :X.Y + :latest
          #   - pre-release:                         :X.Y.Z-suffix only
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=yuzu-${{ matrix.image }}
            org.opencontainers.image.description=Yuzu ${{ matrix.image }} component
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      # cache-prune.yml prunes this runner's buildx cache (and its siblings')
      # weekly; it skips a cache directory whose lock is held. Held from here,
      # before the first build imports the cache, until the job ends (the
      # runner reaps the holder), so no prune overlaps this job's import or
      # export (WP15/S9, scripts/ci/buildcache-lock.sh).
      - name: Hold the buildx cache lock
        env:
          CACHE_DIR: ${{ runner.tool_cache }}/yuzu-docker-buildcache/${{ matrix.image }}
        run: scripts/ci/buildcache-lock.sh hold "$CACHE_DIR"

      # ── Healthcheck runtime invariants (#751) ──────────────────────────
      # Build WITHOUT pushing, verify the image still provides the tool its
      # compose healthcheck invokes (bash + /dev/tcp for server; busybox wget
      # --spider for gateway), and only then push.
      #
      # Verifying AFTER the push would be too late: a broken tag would already
      # be in GHCR for users to pull. The failure mode is silent -- a base-image
      # swap or a dropped apt package breaks nothing at build time and nothing
      # at boot, only the healthcheck, so Compose parks every container in
      # `unhealthy` forever with no application error to point at.
      #
      # No `cache-to` here. Both builds run against the SAME buildkitd instance
      # (one `setup-buildx-action` builder per job), so "Build and push" below
      # hits BuildKit's own in-memory solver cache from this build and rebuilds
      # nothing -- it pays only for the registry upload. A second `mode=max` local
      # export would be a full duplicate write of a cache that already includes
      # the vcpkg builder stage, for no benefit.
      - name: Build for healthcheck verification (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          load: true
          tags: yuzu-hc-verify/${{ matrix.image }}:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: |
            TRIPLET=x64-linux
            YUZU_BUILD_JOBS=${{ env.YUZU_BUILD_JOBS }}
            YUZU_PACKAGE_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=local,src=${{ runner.tool_cache }}/yuzu-docker-buildcache/${{ matrix.image }}
          provenance: false
          sbom: false

      # Pin the build by image ID (WP15/S9). The tag is salted per run attempt,
      # but the Big Tam runners share one Docker daemon, so every check below
      # uses the ID resolved here, never the tag, and the layer list recorded
      # here is what "Verify the pushed image is the scanned one" compares
      # the pushed image against.
      - name: Pin the built image by ID
        id: built
        env:
          IMAGE: yuzu-hc-verify/${{ matrix.image }}:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: scripts/ci/image-identity.sh pin "$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Verify healthcheck runtime invariant
        env:
          ROLE: ${{ matrix.image }}
          IMAGE: ${{ steps.built.outputs.id }}
        run: scripts/ci/verify-healthcheck-invariants.sh "${ROLE}=${IMAGE}"

      # WP15/S9: the runtime stage upgrades its Debian packages at build time,
      # and the healthcheck probe above never starts yuzu-server, so prove the
      # binary still loads on the upgraded libraries before the image is
      # pushed: every shared library resolves (ldd) and it runs (--version).
      # Offline (--network none), by the pinned image ID.
      - name: Verify yuzu-server loads on the upgraded runtime
        if: matrix.image == 'server'
        env:
          IMAGE: ${{ steps.built.outputs.id }}
        run: |
          out="$(docker run --rm --network none --entrypoint sh "$IMAGE" -c 'ldd /usr/local/bin/yuzu-server')"
          echo "$out"
          if grep -q 'not found' <<<"$out"; then
            echo "::error::yuzu-server has an unresolved shared library on the upgraded runtime (above)"
            exit 1
          fi
          docker run --rm --network none --entrypoint yuzu-server "$IMAGE" --version

      # ── Image vulnerability gate (WP15/S9) ─────────────────────────────
      # Scans the image just built and probed (by its pinned ID), BEFORE
      # "Build and push": a CRITICAL vulnerability with a fix, not accepted in
      # .trivyignore.yaml, fails this leg, so no tag is pushed and the release
      # job (which needs this job) does not run. The push build normally
      # reuses this build's layers from the same buildkitd (see above);
      # "Verify the pushed image is the scanned one" proves it did.
      # The script installs its own pinned, checksum-verified Trivy and keeps
      # the DB under RUNNER_TEMP, never $HOME (one OS identity for all Big Tam
      # runners, #1871). Recovery: docs/ci-architecture.md "Release image
      # vulnerability gate".
      - name: Scan image for fixable CRITICAL vulnerabilities (pre-push gate)
        id: gate
        env:
          NAME: yuzu-${{ matrix.image }}
          IMAGE: ${{ steps.built.outputs.id }}
        run: |
          rm -rf "$RUNNER_TEMP/image-vuln-gate"
          # exec: the gate is the step's process, so the runner's SIGINT/SIGTERM
          # on cancel or timeout reaches its trap, which writes
          # `gate: FAIL: cancelled` before it exits. --attempt names the
          # reports per run attempt, so a re-run adds evidence, never replaces it.
          exec scripts/ci/image-vuln-gate.sh --release --attempt "$GITHUB_RUN_ATTEMPT" \
            --report-dir "$RUNNER_TEMP/image-vuln-gate" "$NAME=$IMAGE"

      - name: Remove the verification image
        if: always()
        env:
          IMAGE: yuzu-hc-verify/${{ matrix.image }}:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: docker image rm -f "$IMAGE" || true

      # ── Publish: the tags move LAST, behind a write-ahead journal ──────
      # scripts/ci/image-publish.sh, the journal's only writer, appends one
      # line per completed transition to publish-<image>.attempt-<N>.txt
      # beside the gate's reports: none, push-started (BEFORE the push),
      # verified, signed-attested, tagging (BEFORE the first tag moves),
      # tagged. The push is by digest and carries no tag; the release tags
      # are applied only once that digest is verified, signed and attested.
      # A failure or cancel just stops the journal, which then claims at least
      # what the registry holds. Every step runs the script with `exec`: the
      # runner signals only the step's PID on a cancel, and the script stops
      # at its next step boundary, appending nothing (image-publish.sh
      # "Cancellation"). Contract: docs/ci-architecture.md "The publish
      # journal" (WP15/S9).
      - name: Open the publish journal
        env:
          NAME: yuzu-${{ matrix.image }}
        run: exec scripts/ci/image-publish.sh open "$RUNNER_TEMP/image-vuln-gate" "$NAME" "$GITHUB_RUN_ATTEMPT"

      - name: Record the push intent
        env:
          NAME: yuzu-${{ matrix.image }}
          REPO: ghcr.io/${{ steps.owner.outputs.value }}/yuzu-${{ matrix.image }}
        run: exec scripts/ci/image-publish.sh push-started "$RUNNER_TEMP/image-vuln-gate" "$NAME" "$GITHUB_RUN_ATTEMPT" "$REPO"

      - name: Build and push by digest (no tag)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          # push-by-digest: the registry receives the manifest and no tag at
          # all (no `tags:` either), so nothing public moves here; the digest
          # is this step's `digest` output. The tags are applied by "Tag the
          # release" below.
          outputs: type=image,name=ghcr.io/${{ steps.owner.outputs.value }}/yuzu-${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          # TRIPLET is the vcpkg triplet baked into the Dockerfile for
          # vcpkg install + meson configure. The Dockerfile defaults to
          # `x64-linux`, but pinning explicitly here is QE-R2-02 follow-up
          # from feat/viz-engine governance round 2: when arm64 publishing
          # lands the matrix will need to set this per-row, and the
          # explicit build-arg becomes load-bearing rather than aspirational.
          # Dockerfile.gateway does not consume TRIPLET (rebar3 path); the
          # build-arg is still safe -- unused build-args are ignored.
          build-args: |
            TRIPLET=x64-linux
            YUZU_BUILD_JOBS=${{ env.YUZU_BUILD_JOBS }}
            YUZU_PACKAGE_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
          # Registry cache lives in GHCR itself under a :buildcache tag.
          # mode=max caches intermediate layers too (best hit rate).
          cache-from: type=local,src=${{ runner.tool_cache }}/yuzu-docker-buildcache/${{ matrix.image }}
          cache-to: type=local,dest=${{ runner.tool_cache }}/yuzu-docker-buildcache/${{ matrix.image }},mode=max
          # Disable buildx's own provenance/sbom attestation — we emit
          # GitHub-native attestations + cosign signatures below so
          # customers have a single verification path via `gh
          # attestation verify` and `cosign verify`.
          provenance: false
          sbom: false

      # The push build is a second build. It normally reuses the scanned
      # build's layers, but nothing forces it to, so before the image is
      # described, attested or signed, image-publish.sh `verified` proves the
      # pushed digest's filesystem (layer diff IDs) is the one that was probed
      # and scanned (scripts/ci/image-identity.sh verify-pushed). On a mismatch
      # the job fails with the journal at push-started: the digest is in GHCR
      # untagged, unsigned, and no release tag names it.
      - name: Verify the pushed image is the scanned one
        env:
          NAME: yuzu-${{ matrix.image }}
          REF: ghcr.io/${{ steps.owner.outputs.value }}/yuzu-${{ matrix.image }}@${{ steps.build.outputs.digest }}
          LAYERS: ${{ steps.built.outputs.layers }}
        run: exec scripts/ci/image-publish.sh verified "$RUNNER_TEMP/image-vuln-gate" "$NAME" "$GITHUB_RUN_ATTEMPT" "$REF" "$LAYERS"

      # ── Docker image SBOM (CycloneDX + SPDX) ────────────────────────
      # Syft scans the pushed image by digest (pulls manifest +
      # layers from GHCR) so the SBOM reflects exactly what customers
      # will pull. Output goes to artifacts/ for the release job to
      # attach alongside the per-platform archive SBOMs.
      - name: Generate image SBOM (CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          # The same syft as the per-artifact SBOMs (the action's default is older).
          syft-version: v1.57.2
          image: ghcr.io/${{ steps.owner.outputs.value }}/yuzu-${{ matrix.image }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: yuzu-${{ matrix.image }}-image.cdx.json
          artifact-name: yuzu-${{ matrix.image }}-image.cdx.json
          upload-artifact: false

      - name: Generate image SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          # The same syft as the per-artifact SBOMs (the action's default is older).
          syft-version: v1.57.2
          image: ghcr.io/${{ steps.owner.outputs.value }}/yuzu-${{ matrix.image }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: yuzu-${{ matrix.image }}-image.spdx.json
          artifact-name: yuzu-${{ matrix.image }}-image.spdx.json
          upload-artifact: false

      # ── SLSA build provenance (by image digest) ─────────────────────
      - name: Attest image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ steps.owner.outputs.value }}/yuzu-${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # ── cosign keyless image signing (Sigstore / Fulcio / Rekor) ────
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign image (keyless)
        env:
          COSIGN_EXPERIMENTAL: "1"
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/${{ steps.owner.outputs.value }}/yuzu-${{ matrix.image }}
        run: |
          # cosign v3.0+ rejects explicit --oidc-issuer when a signing
          # config is in use (the GHA-default path). The OIDC issuer is
          # auto-detected from the workflow's id-token, so the flag is
          # both redundant and a hard error in v3. The cosign-installer
          # bump from 3.10.1 → 4.1.1 (#495) installs cosign v3.0.5 by
          # default; v0.11.0-rc0 hit "cannot specify service URLs and
          # use signing config" and aborted before publishing the
          # release page.
          cosign sign --yes "${IMAGE}@${DIGEST}"
          echo "Signed ${IMAGE}@${DIGEST} with cosign keyless (OIDC)"

      # The SBOMs, the provenance attestation and the signature are made by
      # digest above; `signed-attested` also checks the signature verifies
      # for this workflow's identity before recording it.
      - name: Record signed and attested
        env:
          NAME: yuzu-${{ matrix.image }}
          REF: ghcr.io/${{ steps.owner.outputs.value }}/yuzu-${{ matrix.image }}@${{ steps.build.outputs.digest }}
        run: exec scripts/ci/image-publish.sh signed-attested "$RUNNER_TEMP/image-vuln-gate" "$NAME" "$GITHUB_RUN_ATTEMPT" "$REF"

      # syft's image scan cannot see the vcpkg libraries linked into yuzu-server
      # or yuzu-agent, nor what the Erlang emulator vendors: mark the pair
      # incomplete, with the reason (no-op for an image holding neither).
      # After attest + sign, like the upload (#5242), and before the tags move:
      # it edits only the local SBOM files the next step uploads, which still
      # describe the verified digest. The release job's SBOM check refuses an
      # unmarked pair.
      - name: Mark the image SBOM incomplete where the scan cannot see
        env:
          SBOM: yuzu-${{ matrix.image }}-image
        run: python3 scripts/ci/artifact-sbom.py mark-image --cdx "$SBOM.cdx.json" --spdx "$SBOM.spdx.json"

      - name: Upload image SBOM artifacts
        # After attest + sign (#5242), before the tags move: if this upload
        # fails, the pushed digest is signed and attested but no release tag
        # names it.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # No continue-on-error (#5242): the SBOM is a release asset, so a failed
        # upload must fail this job rather than leave a green leg with an
        # earlier attempt's SBOM (or none) for the release to sign.
        with:
          name: yuzu-${{ matrix.image }}-image-sbom
          path: |
            yuzu-${{ matrix.image }}-image.cdx.json
            yuzu-${{ matrix.image }}-image.spdx.json
          if-no-files-found: error
          retention-days: 3
          # A re-run of this job ("Re-run failed jobs" on the newest run, the
          # release skill's Recovery) pushes a new digest; replace the earlier attempt's
          # SBOM. With no continue-on-error and
          # if-no-files-found: error, a re-run either uploads this attempt's
          # SBOM or fails the job (#5242).
          overwrite: true

      # The publishing act (#5282: the tag re-check comes immediately before
      # it). `tagging` is recorded before the first tag moves, every tag is
      # pointed at the verified, signed digest with `docker buildx imagetools
      # create --prefer-index=false` (the tag names that same manifest
      # digest), and `tagged` only once each tag resolves to it. Several tags
      # do not move atomically: a stop in between leaves the journal at
      # `tagging`, and the release check refuses that attempt.
      - name: Refuse to publish if the tag moved (#5282)
        run: bash scripts/ci/check-release-tag-sha.sh

      - name: Tag the release
        env:
          NAME: yuzu-${{ matrix.image }}
          REF: ghcr.io/${{ steps.owner.outputs.value }}/yuzu-${{ matrix.image }}@${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          mapfile -t tags < <(printf '%s\n' "$TAGS" | sed '/^[[:space:]]*$/d')
          exec scripts/ci/image-publish.sh tag "$RUNNER_TEMP/image-vuln-gate" "$NAME" "$GITHUB_RUN_ATTEMPT" "$REF" "${tags[@]}"

      - name: Upload image vulnerability gate report
        # WP15/S9 evidence of the pre-push gate: trivy-yuzu-${{ matrix.image }}.json (the full
        # Trivy report: image ID, layers, every package, the findings and the
        # accepted ones), .txt (the table) and .gate.txt (Trivy version, the DB's
        # repository@digest and dates, image ID, coverage, advisory canary,
        # result), each named .attempt-<run attempt>, and the publish journal
        # publish-<image>.attempt-<run attempt>.txt when the gate passed. It runs whenever
        # the gate ran, PASS, FAIL OR CANCELLED (an explicit status function: a
        # bare `if:` would be success() only, and a refusal, the control
        # operating, would leave no record); the gate writes a .gate.txt for every
        # image on every exit it reaches, a SIGTERM/SIGINT included.
        # The release job attaches them to the GitHub Release, inside the
        # signed SHA256SUMS, like the SBOMs; this artifact also keeps them for
        # 90 days (the repository's maximum retention), including for a leg
        # whose gate refused the image (the release then never runs).
        id: upload_gate
        if: always() && (steps.gate.outcome == 'success' || steps.gate.outcome == 'failure' || steps.gate.outcome == 'cancelled')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yuzu-${{ matrix.image }}-image-vuln-gate-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/image-vuln-gate/
          if-no-files-found: error
          retention-days: 90
          # One artifact per run attempt, never overwritten: a re-run ("Re-run
          # failed jobs") adds its attempt's reports beside the refused
          # attempt's instead of replacing them.

      # One retry of the evidence upload (G8P6-architect-4,
      # G8P6-security-guardian-2): an attempt that moved a tag and then lost
      # its journal to a failed upload leaves no record of that move, and the
      # consumers would read an older attempt (or none) as the published one.
      # No `overwrite`: when the first upload did complete despite its error,
      # this one fails on the existing name and changes nothing.
      - name: Retry the image vulnerability gate report upload
        if: always() && steps.upload_gate.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yuzu-${{ matrix.image }}-image-vuln-gate-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/image-vuln-gate/
          if-no-files-found: error
          retention-days: 90

      - name: Image summary
        env:
          NAME: yuzu-${{ matrix.image }}
        run: |
          # From the journal, the record consumers read (job outputs carry no
          # publish state).
          st="$(scripts/ci/image-publish.sh state "$RUNNER_TEMP/image-vuln-gate" "$NAME" "$GITHUB_RUN_ATTEMPT")"
          {
            echo "## Published \`$NAME\` image"
            echo ""
            echo "**Journal:** \`$(sed -n 's/^state=//p' <<<"$st")\`  **Digest:** \`$(sed -n 's/^digest=//p' <<<"$st")\`"
            echo ""
            echo '```'
            sed -n 's/^tags=//p' <<<"$st" | tr ',' '\n'
            echo '```'
            echo ""
            echo "Signed with cosign keyless + SLSA provenance attestation."
          } >> "$GITHUB_STEP_SUMMARY"

  # ── yuzu-postgres — the server's storage substrate image ─────────────
  # Postgres 16 + pgvector + app role/db init (ADR-0006/0007/0008, #1318).
  # Mirrors docker-publish (login / metadata / SBOM / attestation / cosign)
  # with three differences:
  #   1. The image contains no Yuzu build artifacts (it's postgres + pgvector
  #      + init SQL), so no build is an INPUT to it. It still waits for all
  #      four builds (build-linux, build-gateway, build-windows, build-macos),
  #      purely as a success gate: no :X.Y.Z image is pushed for a release
  #      whose server or agent packaging fails (ADR-0035 step 3, UP-12; owner
  #      decision 2026-11-12). It IS in the release job's needs: the composes
  #      release-pin ghcr.io/.../yuzu-postgres:X.Y.Z, so a release must not
  #      publish if this image failed to.
  #   2. amd64-only today: the QEMU arm64 leg was dropped (see the buildx
  #      step); the demo/viz rigs would need it back.
  #   3. Distinct local buildcache path (postgres suffix).
  docker-publish-postgres:
    name: "Publish postgres image"
    needs: [release-guard, build-linux, build-gateway, build-windows, build-macos]
    runs-on: [self-hosted, Linux, X64, yuzu-bigtam-linux]
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write        # cosign keyless + Sigstore OIDC
      attestations: write    # actions/attest-build-provenance

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          clean: false
          persist-credentials: false

      - name: Lowercase repository owner
        id: owner
        run: echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # amd64-only: linux/arm64 (QEMU) dropped — not needed yet. See
      # docker-publish-chisel for the same rationale.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker-container

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          # GHCR_PAT (write:packages-only PAT) instead
          # of GITHUB_TOKEN — see docker-publish for the full rationale.
          username: ${{ vars.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Compute image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ steps.owner.outputs.value }}/yuzu-postgres
          # Tag convention mirrors docker-publish / scripts/docker-release.sh:
          #   - stable (no -alpha/-beta/-rc suffix): :X.Y.Z + :X.Y + :latest
          #   - pre-release:                         :X.Y.Z-suffix only
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=yuzu-postgres
            org.opencontainers.image.description=Yuzu server storage substrate — PostgreSQL 18 + pgvector (ADR-0006)
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      # cache-prune.yml prunes this runner's buildx cache (and its siblings')
      # weekly; it skips a cache directory whose lock is held. Held from here,
      # before the first build imports the cache, until the job ends (the
      # runner reaps the holder), so no prune overlaps this job's import or
      # export (WP15/S9, scripts/ci/buildcache-lock.sh).
      - name: Hold the buildx cache lock
        env:
          CACHE_DIR: ${{ runner.tool_cache }}/yuzu-docker-buildcache/postgres
        run: scripts/ci/buildcache-lock.sh hold "$CACHE_DIR"

      # ── Image vulnerability gate (WP15/S9) ─────────────────────────────
      # Build WITHOUT pushing and scan before "Build and push", as in
      # docker-publish. No `cache-to`: this build shares the buildkitd
      # instance with the push build, which normally reuses its layers, as
      # "Verify the pushed image is the scanned one" proves (the
      # final stage's apt-get upgrade is not run twice; YUZU_PACKAGE_REFRESH,
      # identical in both builds, makes it run once per attempt rather than be
      # served from an earlier release's cache). The tag is salted per run (the
      # Big Tam runners share one Docker daemon) and uses the yuzu-hc-verify/
      # prefix so cache-prune.yml's #751 sweep reclaims a leaked one.
      - name: Build for vulnerability scan (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile.postgres
          platforms: linux/amd64
          push: false
          load: true
          tags: yuzu-hc-verify/postgres-vuln-scan:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: |
            YUZU_PACKAGE_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=local,src=${{ runner.tool_cache }}/yuzu-docker-buildcache/postgres
          provenance: false
          sbom: false

      # Pin by image ID; see the same step in docker-publish.
      - name: Pin the built image by ID
        id: built
        env:
          IMAGE: yuzu-hc-verify/postgres-vuln-scan:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: scripts/ci/image-identity.sh pin "$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Scan image for fixable CRITICAL vulnerabilities (pre-push gate)
        id: gate
        env:
          NAME: yuzu-postgres
          IMAGE: ${{ steps.built.outputs.id }}
        run: |
          rm -rf "$RUNNER_TEMP/image-vuln-gate"
          # exec: the gate is the step's process, so the runner's SIGINT/SIGTERM
          # on cancel or timeout reaches its trap, which writes
          # `gate: FAIL: cancelled` before it exits. --attempt names the
          # reports per run attempt, so a re-run adds evidence, never replaces it.
          exec scripts/ci/image-vuln-gate.sh --release --attempt "$GITHUB_RUN_ATTEMPT" \
            --report-dir "$RUNNER_TEMP/image-vuln-gate" "$NAME=$IMAGE"

      - name: Remove the scan image
        if: always()
        env:
          IMAGE: yuzu-hc-verify/postgres-vuln-scan:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: docker image rm -f "$IMAGE" || true

      # The tags move LAST, behind a write-ahead journal: see the same
      # steps in docker-publish (WP15/S9, scripts/ci/image-publish.sh).
      - name: Open the publish journal
        env:
          NAME: yuzu-postgres
        run: exec scripts/ci/image-publish.sh open "$RUNNER_TEMP/image-vuln-gate" "$NAME" "$GITHUB_RUN_ATTEMPT"

      - name: Record the push intent
        env:
          NAME: yuzu-postgres
          REPO: ghcr.io/${{ steps.owner.outputs.value }}/yuzu-postgres
        run: exec scripts/ci/image-publish.sh push-started "$RUNNER_TEMP/image-vuln-gate" "$NAME" "$GITHUB_RUN_ATTEMPT" "$REPO"

      - name: Build and push by digest (no tag)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile.postgres
          # amd64-only (linux/arm64 dropped — not needed yet).
          platforms: linux/amd64
          # push-by-digest, no tag: see docker-publish.
          outputs: type=image,name=ghcr.io/${{ steps.owner.outputs.value }}/yuzu-postgres,push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          # Same value as the scan build, so this build reuses its layers.
          build-args: |
            YUZU_PACKAGE_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
          # Distinct local buildcache path — never collides with the
          # server/gateway/chisel caches on this runner.
          cache-from: type=local,src=${{ runner.tool_cache }}/yuzu-docker-buildcache/postgres
          cache-to: type=local,dest=${{ runner.tool_cache }}/yuzu-docker-buildcache/postgres,mode=max
          # Disable buildx's own provenance/sbom attestation — we emit
          # GitHub-native attestations + cosign signatures below (single
          # verification path, same as docker-publish).
          provenance: false
          sbom: false

      # See the same step in docker-publish (WP15/S9).
      - name: Verify the pushed image is the scanned one
        env:
          NAME: yuzu-postgres
          REF: ghcr.io/${{ steps.owner.outputs.value }}/yuzu-postgres@${{ steps.build.outputs.digest }}
          LAYERS: ${{ steps.built.outputs.layers }}
        run: exec scripts/ci/image-publish.sh verified "$RUNNER_TEMP/image-vuln-gate" "$NAME" "$GITHUB_RUN_ATTEMPT" "$REF" "$LAYERS"

      # ── Docker image SBOM (CycloneDX + SPDX) ────────────────────────
      - name: Generate image SBOM (CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          # The same syft as the per-artifact SBOMs (the action's default is older).
          syft-version: v1.57.2
          image: ghcr.io/${{ steps.owner.outputs.value }}/yuzu-postgres@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: yuzu-postgres-image.cdx.json
          artifact-name: yuzu-postgres-image.cdx.json
          upload-artifact: false

      - name: Generate image SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          # The same syft as the per-artifact SBOMs (the action's default is older).
          syft-version: v1.57.2
          image: ghcr.io/${{ steps.owner.outputs.value }}/yuzu-postgres@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: yuzu-postgres-image.spdx.json
          artifact-name: yuzu-postgres-image.spdx.json
          upload-artifact: false

      # ── SLSA build provenance (by image digest) ─────────────────────
      - name: Attest image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ steps.owner.outputs.value }}/yuzu-postgres
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # ── cosign keyless image signing (Sigstore / Fulcio / Rekor) ────
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign image (keyless)
        env:
          COSIGN_EXPERIMENTAL: "1"
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/${{ steps.owner.outputs.value }}/yuzu-postgres
        run: |
          # cosign v3.0+ auto-detects the OIDC issuer from the workflow's
          # id-token; an explicit --oidc-issuer is redundant and a hard
          # error in v3 (see docker-publish for the #495 history).
          cosign sign --yes "${IMAGE}@${DIGEST}"
          echo "Signed ${IMAGE}@${DIGEST} with cosign keyless (OIDC)"

      # The SBOMs, the provenance attestation and the signature are made by
      # digest above; `signed-attested` also checks the signature verifies
      # for this workflow's identity before recording it.
      - name: Record signed and attested
        env:
          NAME: yuzu-postgres
          REF: ghcr.io/${{ steps.owner.outputs.value }}/yuzu-postgres@${{ steps.build.outputs.digest }}
        run: exec scripts/ci/image-publish.sh signed-attested "$RUNNER_TEMP/image-vuln-gate" "$NAME" "$GITHUB_RUN_ATTEMPT" "$REF"

      # pgvector is built from source: syft lists its vector.so as a file but no
      # package, so the scan names no pgvector. mark-image marks the pair
      # pgvector-source because it finds vector.so, and refuses this image
      # (titled yuzu-postgres) if syft stops listing that file.
      - name: Mark the image SBOM incomplete where the scan cannot see
        env:
          SBOM: yuzu-postgres-image
        run: python3 scripts/ci/artifact-sbom.py mark-image --cdx "$SBOM.cdx.json" --spdx "$SBOM.spdx.json"

      - name: Upload image SBOM artifacts
        # After attest + sign (#5242), before the tags move: if this upload
        # fails, the pushed digest is signed and attested but no release tag
        # names it.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # No continue-on-error (#5242): the SBOM is a release asset, so a failed
        # upload must fail this job rather than leave a green leg with an
        # earlier attempt's SBOM (or none) for the release to sign.
        with:
          name: yuzu-postgres-image-sbom
          path: |
            yuzu-postgres-image.cdx.json
            yuzu-postgres-image.spdx.json
          if-no-files-found: error
          retention-days: 3
          # A re-run of this job ("Re-run failed jobs" on the newest run, the
          # release skill's Recovery) pushes a new digest; replace the earlier attempt's
          # SBOM. With no continue-on-error and
          # if-no-files-found: error, a re-run either uploads this attempt's
          # SBOM or fails the job (#5242).
          overwrite: true

      # The publishing act (#5282: the tag re-check comes immediately before
      # it). `tagging` is recorded before the first tag moves, every tag is
      # pointed at the verified, signed digest with `docker buildx imagetools
      # create --prefer-index=false` (the tag names that same manifest
      # digest), and `tagged` only once each tag resolves to it. Several tags
      # do not move atomically: a stop in between leaves the journal at
      # `tagging`, and the release check refuses that attempt.
      - name: Refuse to publish if the tag moved (#5282)
        run: bash scripts/ci/check-release-tag-sha.sh

      - name: Tag the release
        env:
          NAME: yuzu-postgres
          REF: ghcr.io/${{ steps.owner.outputs.value }}/yuzu-postgres@${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          mapfile -t tags < <(printf '%s\n' "$TAGS" | sed '/^[[:space:]]*$/d')
          exec scripts/ci/image-publish.sh tag "$RUNNER_TEMP/image-vuln-gate" "$NAME" "$GITHUB_RUN_ATTEMPT" "$REF" "${tags[@]}"

      - name: Upload image vulnerability gate report
        # WP15/S9 evidence of the pre-push gate: trivy-yuzu-postgres.json (the full
        # Trivy report: image ID, layers, every package, the findings and the
        # accepted ones), .txt (the table) and .gate.txt (Trivy version, the DB's
        # repository@digest and dates, image ID, coverage, advisory canary,
        # result), each named .attempt-<run attempt>, and the publish journal
        # publish-<image>.attempt-<run attempt>.txt when the gate passed. It runs whenever
        # the gate ran, PASS, FAIL OR CANCELLED (an explicit status function: a
        # bare `if:` would be success() only, and a refusal, the control
        # operating, would leave no record); the gate writes a .gate.txt for every
        # image on every exit it reaches, a SIGTERM/SIGINT included.
        # The release job attaches them to the GitHub Release, inside the
        # signed SHA256SUMS, like the SBOMs; this artifact also keeps them for
        # 90 days (the repository's maximum retention), including for a leg
        # whose gate refused the image (the release then never runs).
        id: upload_gate
        if: always() && (steps.gate.outcome == 'success' || steps.gate.outcome == 'failure' || steps.gate.outcome == 'cancelled')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yuzu-postgres-image-vuln-gate-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/image-vuln-gate/
          if-no-files-found: error
          retention-days: 90
          # One artifact per run attempt, never overwritten: a re-run ("Re-run
          # failed jobs") adds its attempt's reports beside the refused
          # attempt's instead of replacing them.

      # One retry of the evidence upload (G8P6-architect-4,
      # G8P6-security-guardian-2): an attempt that moved a tag and then lost
      # its journal to a failed upload leaves no record of that move, and the
      # consumers would read an older attempt (or none) as the published one.
      # No `overwrite`: when the first upload did complete despite its error,
      # this one fails on the existing name and changes nothing.
      - name: Retry the image vulnerability gate report upload
        if: always() && steps.upload_gate.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yuzu-postgres-image-vuln-gate-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/image-vuln-gate/
          if-no-files-found: error
          retention-days: 90

      - name: Image summary
        env:
          NAME: yuzu-postgres
        run: |
          # From the journal, the record consumers read (job outputs carry no
          # publish state).
          st="$(scripts/ci/image-publish.sh state "$RUNNER_TEMP/image-vuln-gate" "$NAME" "$GITHUB_RUN_ATTEMPT")"
          {
            echo "## Published \`$NAME\` image (linux/amd64)"
            echo ""
            echo "**Journal:** \`$(sed -n 's/^state=//p' <<<"$st")\`  **Digest:** \`$(sed -n 's/^digest=//p' <<<"$st")\`"
            echo ""
            echo '```'
            sed -n 's/^tags=//p' <<<"$st" | tr ',' '\n'
            echo '```'
            echo ""
            echo "Signed with cosign keyless + SLSA provenance attestation."
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Chiselled demo images — server + gateway + agent ─────────────────
  # Publishes the FROM-scratch chiselled Ubuntu 26.04 demo images to GHCR
  # under a distinct `-chisel` repo suffix (see docs/demo-environment.md).
  # The `release` job NEEDS this job since #5242 (see the comment at its
  # needs: below). Mirrors docker-publish (login / metadata / cosign /
  # attestation / lowercase owner) but differs in two ways:
  #   1. NO TRIPLET build-arg — the server/agent chisel Dockerfiles derive
  #      the vcpkg triplet from buildx's TARGETARCH. The build is amd64-only
  #      today (the QEMU-emulated arm64 leg was dropped; see the buildx step).
  #   2. A distinct local buildcache path (-chisel suffix) so it never
  #      collides with docker-publish's cache.
  docker-publish-chisel:
    name: "Publish ${{ matrix.image }}-chisel image"
    # Mirror docker-publish's needs (core builds AND the Windows/macOS agent
    # builds must pass, so no :X.Y.Z image is pushed for a release whose agent
    # packaging fails; ADR-0035 step 3, UP-12). The release job
    # NEEDS this job (#5242): the three chisel images' SBOMs are release assets
    # and belong inside the signed SHA256SUMS, and while this job stayed out of
    # the release's needs they were attached only when it happened to finish
    # first (rc2, rc4 and rc6 shipped without some of them). Cost: the release
    # waits for these builds -- 1-16 min on rc1..rc6, all green; a cold cache
    # (vcpkg from source) takes longer, bounded by the timeout below -- and a
    # failed or cancelled chisel leg now skips the release (fail-closed).
    # Recovery: "Re-run failed jobs" on the NEWEST run for the tag (digests of
    # the succeeded legs are kept; each tag move re-checks the tag), never on an
    # older run (#5242); a fresh run is the fallback. See the release skill.
    needs: [release-guard, build-linux, build-gateway, build-windows, build-macos]
    runs-on: [self-hosted, Linux, X64, yuzu-bigtam-linux]
    # Job-level concurrency so a re-tagged release (same ref) cancels an
    # in-flight build instead of wedging the single self-hosted Linux runner
    # slot behind a stale one (a superseded run's release is then skipped,
    # since it needs this job). The
    # workflow-level concurrency is cancel-in-progress:false (a real
    # release must run to completion); this narrower group trades that
    # for runner-slot liveness on the demo-image path specifically — SRE
    # flagged the starvation risk. Group is keyed on github.ref + the
    # matrix image so a re-push of the same tag is treated as a
    # supersede PER IMAGE — without `${{ matrix.image }}`, the three
    # matrix legs (server/gateway/agent) share a single group and
    # GitHub cancels two of them at scheduling time. Observed on
    # v0.12.0 release run 26413256206 where server-chisel and
    # agent-chisel were cancelled at 1s runtime, leaving gateway-chisel
    # as the only published variant. A leg cancelled this way gets the same
    # PID-only SIGINT/SIGTERM as any cancel: its `exec`'d image-publish.sh
    # stops its own registry call before exiting, so it cannot move a tag
    # after the newer run's leg has tagged (G8P6-chaos-injector-2).
    concurrency:
      group: chisel-publish-${{ github.ref }}-${{ matrix.image }}
      cancel-in-progress: true
    # The server/agent chisel images compile vcpkg (gRPC/abseil/protobuf/
    # openssl) from source on a cold cache: the same compile peaked at 26 min
    # in docker-publish (run 36607188023), and the chisel legs took 1-16 min
    # on rc1..rc6. The build is amd64-only now (the old 360-min budget was for
    # the dropped QEMU arm64 leg), and since #5242 the release waits on this
    # job, so the bound is tighter: 120 min. Re-adding
    # arm64 is tracked as the "Open decision — arm64 build strategy" note in
    # docs/demo-environment.md ("Publishing").
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
      id-token: write        # cosign keyless + Sigstore OIDC
      attestations: write    # actions/attest-build-provenance
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: server
            dockerfile: deploy/docker/Dockerfile.server.chisel
          - image: gateway
            dockerfile: deploy/docker/Dockerfile.gateway.chisel
          - image: agent
            dockerfile: deploy/docker/Dockerfile.agent.chisel

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          clean: false
          persist-credentials: false

      - name: Lowercase repository owner
        id: owner
        run: echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # amd64-only: linux/arm64 (QEMU-emulated) dropped — not needed yet, and
      # the emulated leg was slow + flaky. Re-add QEMU + arm64 when a native
      # arm64 runner exists. docker-container driver retained for the local
      # layer-cache export (cache-to type=local) below.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker-container

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          # GHCR_PAT (write:packages-only PAT) instead
          # of GITHUB_TOKEN so we can push to GHCR packages whose
          # Actions-access policy isn't pinned to this repo (e.g.
          # yuzu-agent-bundle-chisel, originally created via local
          # PAT push). Falls back to GITHUB_TOKEN for fork PRs that
          # don't have access to the secret. Username pinned to the
          # PAT owner since github.actor varies per actor. The owner is a
          # USER, not the org, so it is carried in the `GHCR_USERNAME` repo
          # variable rather than hardcoded — see the DevNullLtd migration
          # note in .github/runner-inventory.json.
          username: ${{ vars.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Compute image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # Distinct `-chisel` suffix — must not collide with the non-chisel
          # yuzu-${image} images published by docker-publish.
          images: ghcr.io/${{ steps.owner.outputs.value }}/yuzu-${{ matrix.image }}-chisel
          # Tag convention mirrors docker-publish / scripts/docker-release.sh:
          #   - stable (no -alpha/-beta/-rc suffix): :X.Y.Z + :X.Y + :latest
          #   - pre-release:                         :X.Y.Z-suffix only
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=yuzu-${{ matrix.image }}-chisel
            org.opencontainers.image.description=Yuzu ${{ matrix.image }} chiselled demo image
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      # cache-prune.yml prunes this runner's buildx cache (and its siblings')
      # weekly; it skips a cache directory whose lock is held. Held from here,
      # before the first build imports the cache, until the job ends (the
      # runner reaps the holder), so no prune overlaps this job's import or
      # export (WP15/S9, scripts/ci/buildcache-lock.sh).
      - name: Hold the buildx cache lock
        env:
          CACHE_DIR: ${{ runner.tool_cache }}/yuzu-docker-buildcache/${{ matrix.image }}-chisel
        run: scripts/ci/buildcache-lock.sh hold "$CACHE_DIR"

      # ── Healthcheck runtime invariants (#751) ──────────────────────────
      # Same pre-push gate as docker-publish, and it matters MORE here: these
      # images are FROM scratch, so their healthcheck depends entirely on a
      # busybox binary the chisel stage symlinks into place. A slice change that
      # stops shipping it breaks the demo-stack healthchecks and nothing else.
      # docker-compose.demo.yml invokes busybox by ABSOLUTE path
      # (`/bin/busybox wget --spider`) for the server and gateway chisel images,
      # which is exactly what the script probes. The `agent` leg of this matrix is
      # pre-emptive — no compose healthchecks an agent image today.
      #
      # NO TRIPLET build-arg, matching "Build and push" below.
      - name: Build for healthcheck verification (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          load: true
          tags: yuzu-hc-verify/${{ matrix.image }}-chisel:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: |
            YUZU_BUILD_JOBS=${{ env.YUZU_BUILD_JOBS }}
            YUZU_PACKAGE_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=local,src=${{ runner.tool_cache }}/yuzu-docker-buildcache/${{ matrix.image }}-chisel
          provenance: false
          sbom: false

      # Pin by image ID; see the same step in docker-publish.
      - name: Pin the built image by ID
        id: built
        env:
          IMAGE: yuzu-hc-verify/${{ matrix.image }}-chisel:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: scripts/ci/image-identity.sh pin "$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Verify healthcheck runtime invariant
        env:
          ROLE: ${{ matrix.image }}-chisel
          IMAGE: ${{ steps.built.outputs.id }}
        run: scripts/ci/verify-healthcheck-invariants.sh "${ROLE}=${IMAGE}"

      # Image vulnerability gate (WP15/S9), before the push; see the same step
      # in docker-publish. The chisel stage cuts its slices from the live
      # Ubuntu archive (security and updates pockets); the push build normally
      # reuses these layers rather than cutting again, and "Verify the pushed
      # image is the scanned one" proves it did.
      - name: Scan image for fixable CRITICAL vulnerabilities (pre-push gate)
        id: gate
        env:
          NAME: yuzu-${{ matrix.image }}-chisel
          IMAGE: ${{ steps.built.outputs.id }}
        run: |
          rm -rf "$RUNNER_TEMP/image-vuln-gate"
          # exec: the gate is the step's process, so the runner's SIGINT/SIGTERM
          # on cancel or timeout reaches its trap, which writes
          # `gate: FAIL: cancelled` before it exits. --attempt names the
          # reports per run attempt, so a re-run adds evidence, never replaces it.
          exec scripts/ci/image-vuln-gate.sh --release --attempt "$GITHUB_RUN_ATTEMPT" \
            --report-dir "$RUNNER_TEMP/image-vuln-gate" "$NAME=$IMAGE"

      - name: Remove the verification image
        if: always()
        env:
          IMAGE: yuzu-hc-verify/${{ matrix.image }}-chisel:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: docker image rm -f "$IMAGE" || true

      # The tags move LAST, behind a write-ahead journal: see the same
      # steps in docker-publish (WP15/S9, scripts/ci/image-publish.sh).
      - name: Open the publish journal
        env:
          NAME: yuzu-${{ matrix.image }}-chisel
        run: exec scripts/ci/image-publish.sh open "$RUNNER_TEMP/image-vuln-gate" "$NAME" "$GITHUB_RUN_ATTEMPT"

      - name: Record the push intent
        env:
          NAME: yuzu-${{ matrix.image }}-chisel
          REPO: ghcr.io/${{ steps.owner.outputs.value }}/yuzu-${{ matrix.image }}-chisel
        run: exec scripts/ci/image-publish.sh push-started "$RUNNER_TEMP/image-vuln-gate" "$NAME" "$GITHUB_RUN_ATTEMPT" "$REPO"

      - name: Build and push by digest (no tag)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # amd64-only (linux/arm64 dropped — not needed yet).
          platforms: linux/amd64
          # push-by-digest, no tag: see docker-publish.
          outputs: type=image,name=ghcr.io/${{ steps.owner.outputs.value }}/yuzu-${{ matrix.image }}-chisel,push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            YUZU_BUILD_JOBS=${{ env.YUZU_BUILD_JOBS }}
            YUZU_PACKAGE_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
          # NOTE: deliberately NO TRIPLET build-arg. The server/agent chisel
          # Dockerfiles derive the vcpkg triplet from buildx's per-arch
          # TARGETARCH when TRIPLET is empty
          # (T="${TRIPLET:-$(case "$TARGETARCH" in arm64) echo arm64-linux;;
          # *) echo x64-linux;; esac)}"). Pinning TRIPLET=x64-linux here (as
          # docker-publish does) would bake an x64 binary into the arm64
          # image. gateway.chisel ignores TRIPLET (rebar3 path).
          # Distinct local buildcache path so chisel never collides with
          # the non-chisel docker-publish cache. mode=max caches
          # intermediate layers too (best hit rate) — important given the
          # full vcpkg-from-source compile.
          cache-from: type=local,src=${{ runner.tool_cache }}/yuzu-docker-buildcache/${{ matrix.image }}-chisel
          cache-to: type=local,dest=${{ runner.tool_cache }}/yuzu-docker-buildcache/${{ matrix.image }}-chisel,mode=max
          # Disable buildx's own provenance/sbom attestation — we emit
          # GitHub-native attestations + cosign signatures below so
          # customers have a single verification path via `gh
          # attestation verify` and `cosign verify`.
          provenance: false
          sbom: false

      # See the same step in docker-publish (WP15/S9).
      - name: Verify the pushed image is the scanned one
        env:
          NAME: yuzu-${{ matrix.image }}-chisel
          REF: ghcr.io/${{ steps.owner.outputs.value }}/yuzu-${{ matrix.image }}-chisel@${{ steps.build.outputs.digest }}
          LAYERS: ${{ steps.built.outputs.layers }}
        run: exec scripts/ci/image-publish.sh verified "$RUNNER_TEMP/image-vuln-gate" "$NAME" "$GITHUB_RUN_ATTEMPT" "$REF" "$LAYERS"

      # ── Docker image SBOM (CycloneDX + SPDX) ────────────────────────
      # Mirrors docker-publish's SBOM steps so the chisel demo images get
      # the same supply-chain coverage (compliance flagged that the chisel
      # images had cosign + SLSA but no SBOM). Syft scans the pushed
      # image by digest. Same SHA-pinned anchore/sbom-action +
      # upload-artifact versions as docker-publish.
      - name: Generate image SBOM (CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          # The same syft as the per-artifact SBOMs (the action's default is older).
          syft-version: v1.57.2
          image: ghcr.io/${{ steps.owner.outputs.value }}/yuzu-${{ matrix.image }}-chisel@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: yuzu-${{ matrix.image }}-chisel-image.cdx.json
          artifact-name: yuzu-${{ matrix.image }}-chisel-image.cdx.json
          upload-artifact: false

      - name: Generate image SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          # The same syft as the per-artifact SBOMs (the action's default is older).
          syft-version: v1.57.2
          image: ghcr.io/${{ steps.owner.outputs.value }}/yuzu-${{ matrix.image }}-chisel@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: yuzu-${{ matrix.image }}-chisel-image.spdx.json
          artifact-name: yuzu-${{ matrix.image }}-chisel-image.spdx.json
          upload-artifact: false

      # ── SLSA build provenance (by image digest) ─────────────────────
      - name: Attest image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ steps.owner.outputs.value }}/yuzu-${{ matrix.image }}-chisel
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # ── cosign keyless image signing (Sigstore / Fulcio / Rekor) ────
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign image (keyless)
        env:
          COSIGN_EXPERIMENTAL: "1"
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/${{ steps.owner.outputs.value }}/yuzu-${{ matrix.image }}-chisel
        run: |
          # cosign v3.0+ auto-detects the OIDC issuer from the workflow's
          # id-token; an explicit --oidc-issuer is redundant and a hard
          # error in v3 (see docker-publish for the #495 history).
          cosign sign --yes "${IMAGE}@${DIGEST}"
          echo "Signed ${IMAGE}@${DIGEST} with cosign keyless (OIDC)"

      # The SBOMs, the provenance attestation and the signature are made by
      # digest above; `signed-attested` also checks the signature verifies
      # for this workflow's identity before recording it.
      - name: Record signed and attested
        env:
          NAME: yuzu-${{ matrix.image }}-chisel
          REF: ghcr.io/${{ steps.owner.outputs.value }}/yuzu-${{ matrix.image }}-chisel@${{ steps.build.outputs.digest }}
        run: exec scripts/ci/image-publish.sh signed-attested "$RUNNER_TEMP/image-vuln-gate" "$NAME" "$GITHUB_RUN_ATTEMPT" "$REF"

      # As in docker-publish.
      - name: Mark the image SBOM incomplete where the scan cannot see
        env:
          SBOM: yuzu-${{ matrix.image }}-chisel-image
        run: python3 scripts/ci/artifact-sbom.py mark-image --cdx "$SBOM.cdx.json" --spdx "$SBOM.spdx.json"

      - name: Upload image SBOM artifacts
        # After attest + sign (#5242), before the tags move: if this upload
        # fails, the pushed digest is signed and attested but no release tag
        # names it.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # No continue-on-error (#5242): the SBOM is a release asset, so a failed
        # upload must fail this job rather than leave a green leg with an
        # earlier attempt's SBOM (or none) for the release to sign.
        with:
          name: yuzu-${{ matrix.image }}-chisel-image-sbom
          path: |
            yuzu-${{ matrix.image }}-chisel-image.cdx.json
            yuzu-${{ matrix.image }}-chisel-image.spdx.json
          if-no-files-found: error
          retention-days: 3
          # A re-run of this job ("Re-run failed jobs" on the newest run, the
          # release skill's Recovery) pushes a new digest; replace the earlier attempt's
          # SBOM. With no continue-on-error and
          # if-no-files-found: error, a re-run either uploads this attempt's
          # SBOM or fails the job (#5242).
          overwrite: true

      # The publishing act (#5282: the tag re-check comes immediately before
      # it). `tagging` is recorded before the first tag moves, every tag is
      # pointed at the verified, signed digest with `docker buildx imagetools
      # create --prefer-index=false` (the tag names that same manifest
      # digest), and `tagged` only once each tag resolves to it. Several tags
      # do not move atomically: a stop in between leaves the journal at
      # `tagging`, and the release check refuses that attempt.
      - name: Refuse to publish if the tag moved (#5282)
        run: bash scripts/ci/check-release-tag-sha.sh

      - name: Tag the release
        env:
          NAME: yuzu-${{ matrix.image }}-chisel
          REF: ghcr.io/${{ steps.owner.outputs.value }}/yuzu-${{ matrix.image }}-chisel@${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          mapfile -t tags < <(printf '%s\n' "$TAGS" | sed '/^[[:space:]]*$/d')
          exec scripts/ci/image-publish.sh tag "$RUNNER_TEMP/image-vuln-gate" "$NAME" "$GITHUB_RUN_ATTEMPT" "$REF" "${tags[@]}"

      - name: Upload image vulnerability gate report
        # WP15/S9 evidence of the pre-push gate: trivy-yuzu-${{ matrix.image }}-chisel.json (the full
        # Trivy report: image ID, layers, every package, the findings and the
        # accepted ones), .txt (the table) and .gate.txt (Trivy version, the DB's
        # repository@digest and dates, image ID, coverage, advisory canary,
        # result), each named .attempt-<run attempt>, and the publish journal
        # publish-<image>.attempt-<run attempt>.txt when the gate passed. It runs whenever
        # the gate ran, PASS, FAIL OR CANCELLED (an explicit status function: a
        # bare `if:` would be success() only, and a refusal, the control
        # operating, would leave no record); the gate writes a .gate.txt for every
        # image on every exit it reaches, a SIGTERM/SIGINT included.
        # The release job attaches them to the GitHub Release, inside the
        # signed SHA256SUMS, like the SBOMs; this artifact also keeps them for
        # 90 days (the repository's maximum retention), including for a leg
        # whose gate refused the image (the release then never runs).
        id: upload_gate
        if: always() && (steps.gate.outcome == 'success' || steps.gate.outcome == 'failure' || steps.gate.outcome == 'cancelled')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yuzu-${{ matrix.image }}-chisel-image-vuln-gate-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/image-vuln-gate/
          if-no-files-found: error
          retention-days: 90
          # One artifact per run attempt, never overwritten: a re-run ("Re-run
          # failed jobs") adds its attempt's reports beside the refused
          # attempt's instead of replacing them.

      # One retry of the evidence upload (G8P6-architect-4,
      # G8P6-security-guardian-2): an attempt that moved a tag and then lost
      # its journal to a failed upload leaves no record of that move, and the
      # consumers would read an older attempt (or none) as the published one.
      # No `overwrite`: when the first upload did complete despite its error,
      # this one fails on the existing name and changes nothing.
      - name: Retry the image vulnerability gate report upload
        if: always() && steps.upload_gate.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yuzu-${{ matrix.image }}-chisel-image-vuln-gate-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/image-vuln-gate/
          if-no-files-found: error
          retention-days: 90

      - name: Image summary
        env:
          NAME: yuzu-${{ matrix.image }}-chisel
        run: |
          # From the journal, the record consumers read (job outputs carry no
          # publish state).
          st="$(scripts/ci/image-publish.sh state "$RUNNER_TEMP/image-vuln-gate" "$NAME" "$GITHUB_RUN_ATTEMPT")"
          {
            echo "## Published \`$NAME\` image (linux/amd64)"
            echo ""
            echo "**Journal:** \`$(sed -n 's/^state=//p' <<<"$st")\`  **Digest:** \`$(sed -n 's/^digest=//p' <<<"$st")\`"
            echo ""
            echo '```'
            sed -n 's/^tags=//p' <<<"$st" | tr ',' '\n'
            echo '```'
            echo ""
            echo "Signed with cosign keyless + SLSA provenance attestation."
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Agent-bundle delivery image — published + SIGNED after the release ─
  # The 3-triplet agent bundle (yuzu-agent-bundle-chisel) repackages the
  # release's OWN agent archives, so it can only be built once the
  # GitHub Release exists -> needs: [release]. It runs on a GitHub-hosted
  # runner (no compilation, just download + repackage; gh/docker/buildx are
  # preinstalled, cosign is installed by the job), reuses scripts/build-agent-bundle.sh as the single
  # source of truth, then signs + SBOMs + attests the pushed image exactly
  # like docker-publish. It is deliberately NOT in the release job's needs:
  # (it depends on release, not vice-versa), so it never gates the release.
  docker-publish-agent-bundle:
    name: "Publish agent-bundle image"
    needs: [release-guard, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # No job outputs: what this job published is in its publish journal
    # (scripts/ci/image-publish.sh), which attach-bundle-gate-report reads from
    # the uploaded gate artifact of every attempt. A run cancelled by this
    # group stops its tag move as any cancel does (image-publish.sh
    # "Cancellation", G8P6-chaos-injector-2).
    concurrency:
      group: agent-bundle-publish-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
      id-token: write        # cosign keyless + Sigstore OIDC
      attestations: write    # actions/attest-build-provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Lowercase repository owner
        id: owner
        run: echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # Step outputs reach the shell through env, never `${{ }}` in the run
      # body (zizmor template-injection).
      - name: Compute version + image ref
        id: ref
        env:
          OWNER: ${{ steps.owner.outputs.value }}
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${OWNER}/yuzu-agent-bundle-chisel" >> "$GITHUB_OUTPUT"

      # amd64-only: linux/arm64 (QEMU) dropped — not needed yet. The bundle
      # script builds the host-arch (amd64) image when --multiarch is omitted.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker-container

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          # GHCR_PAT (write:packages-only PAT) instead
          # of GITHUB_TOKEN so we can push to GHCR packages whose
          # Actions-access policy isn't pinned to this repo (e.g.
          # yuzu-agent-bundle-chisel, originally created via local
          # PAT push). Falls back to GITHUB_TOKEN for fork PRs that
          # don't have access to the secret. Username pinned to the
          # PAT owner since github.actor varies per actor. The owner is a
          # USER, not the org, so it is carried in the `GHCR_USERNAME` repo
          # variable rather than hardcoded — see the DevNullLtd migration
          # note in .github/runner-inventory.json.
          username: ${{ vars.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # Reuse the maintainer script (download release artifacts -> verify
      # SHA256SUMS' cosign signature, then each file against its own line -> lay out -> build host-arch (amd64) image -> smoke-test). GH_TOKEN
      # lets its `gh release download` authenticate against this just-published
      # release. linux/arm64 dropped (no --multiarch). No --push (WP15/S9): the
      # script leaves the image in the local daemon as REGISTRY/IMAGE:VERSION,
      # the gate below scans it, and only then is it pushed.
      - name: Build agent bundle (amd64, no push)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ref.outputs.version }}
          REGISTRY: ghcr.io/${{ steps.owner.outputs.value }}
          SIGNER_REPO: ${{ github.repository }}
        run: |
          bash scripts/build-agent-bundle.sh \
            --version "$VERSION" \
            --registry "$REGISTRY" \
            --signer-repo "$SIGNER_REPO"

      # Pin by image ID, then gate (WP15/S9); see the same steps in
      # docker-publish. The push below pushes the scanned ID under a candidate
      # tag, so the local tag is checked to still name the scanned ID first.
      - name: Pin the built image by ID
        id: built
        env:
          IMAGE: ${{ steps.ref.outputs.image }}:${{ steps.ref.outputs.version }}
        run: scripts/ci/image-identity.sh pin "$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Scan image for fixable CRITICAL vulnerabilities (pre-push gate)
        id: gate
        env:
          NAME: yuzu-agent-bundle-chisel
          IMAGE: ${{ steps.built.outputs.id }}
        run: |
          rm -rf "$RUNNER_TEMP/image-vuln-gate"
          # exec: the gate is the step's process, so the runner's SIGINT/SIGTERM
          # on cancel or timeout reaches its trap, which writes
          # `gate: FAIL: cancelled` before it exits. --attempt names the
          # reports per run attempt, so a re-run adds evidence, never replaces it.
          exec scripts/ci/image-vuln-gate.sh --release --attempt "$GITHUB_RUN_ATTEMPT" \
            --report-dir "$RUNNER_TEMP/image-vuln-gate" "$NAME=$IMAGE"

      # The release tag moves LAST, behind a write-ahead journal (WP15/S9): see
      # the same steps in docker-publish and scripts/ci/image-publish.sh. The
      # bundle is pushed with `docker push`, which needs a tag, so it goes up as
      # :candidate-<run id>-<attempt>, never as :X.Y.Z; "Tag the release"
      # points :X.Y.Z at the verified, signed digest.
      - name: Open the publish journal
        env:
          NAME: yuzu-agent-bundle-chisel
        run: exec scripts/ci/image-publish.sh open "$RUNNER_TEMP/image-vuln-gate" "$NAME" "$GITHUB_RUN_ATTEMPT"

      # The intent, BEFORE anything reaches the registry, in its own step so
      # the script is the step's process (`exec`: the runner signals only the
      # step's PID on a cancel; see scripts/ci/image-publish.sh "Cancellation").
      - name: Record the push intent
        env:
          NAME: yuzu-agent-bundle-chisel
          IMAGE: ${{ steps.ref.outputs.image }}:${{ steps.ref.outputs.version }}
          REPO: ${{ steps.ref.outputs.image }}
          SCANNED_ID: ${{ steps.built.outputs.id }}
        run: |
          now="$(docker image inspect --format '{{.Id}}' "$IMAGE")"
          if [ "$now" != "$SCANNED_ID" ]; then
            echo "::error::$IMAGE now names $now, not the scanned image $SCANNED_ID; refusing to push"
            exit 1
          fi
          candidate="$REPO:candidate-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker tag "$SCANNED_ID" "$candidate"
          exec scripts/ci/image-publish.sh push-started "$RUNNER_TEMP/image-vuln-gate" "$NAME" "$GITHUB_RUN_ATTEMPT" "$candidate"

      - name: Push the candidate
        id: push
        env:
          REPO: ${{ steps.ref.outputs.image }}
          SCANNED_ID: ${{ steps.built.outputs.id }}
        run: |
          candidate="$REPO:candidate-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          now="$(docker image inspect --format '{{.Id}}' "$candidate")"
          if [ "$now" != "$SCANNED_ID" ]; then
            echo "::error::$candidate now names $now, not the scanned image $SCANNED_ID; refusing to push"
            exit 1
          fi
          docker push "$candidate"
          digest="$(docker buildx imagetools inspect "$candidate" --format '{{.Manifest.Digest}}')"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Pushed $candidate as $REPO@$digest"

      # See the same step in docker-publish (WP15/S9). `verified` also checks
      # the candidate tag still names this digest.
      - name: Verify the pushed image is the scanned one
        env:
          NAME: yuzu-agent-bundle-chisel
          REF: ${{ steps.ref.outputs.image }}@${{ steps.push.outputs.digest }}
          LAYERS: ${{ steps.built.outputs.layers }}
        run: exec scripts/ci/image-publish.sh verified "$RUNNER_TEMP/image-vuln-gate" "$NAME" "$GITHUB_RUN_ATTEMPT" "$REF" "$LAYERS"

      - name: Generate bundle SBOM (CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          # The same syft as the per-artifact SBOMs (the action's default is older).
          syft-version: v1.57.2
          image: ${{ steps.ref.outputs.image }}@${{ steps.push.outputs.digest }}
          format: cyclonedx-json
          output-file: yuzu-agent-bundle-chisel-image.cdx.json
          artifact-name: yuzu-agent-bundle-chisel-image.cdx.json
          upload-artifact: false

      - name: Generate bundle SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          # The same syft as the per-artifact SBOMs (the action's default is older).
          syft-version: v1.57.2
          image: ${{ steps.ref.outputs.image }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: yuzu-agent-bundle-chisel-image.spdx.json
          artifact-name: yuzu-agent-bundle-chisel-image.spdx.json
          upload-artifact: false

      - name: Upload bundle SBOM artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: yuzu-agent-bundle-chisel-image-sbom
          path: |
            yuzu-agent-bundle-chisel-image.cdx.json
            yuzu-agent-bundle-chisel-image.spdx.json
          retention-days: 3

      - name: Attest bundle provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.ref.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Sign image (keyless)
        env:
          COSIGN_EXPERIMENTAL: "1"
          DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE: ${{ steps.ref.outputs.image }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
          echo "Signed ${IMAGE}@${DIGEST} with cosign keyless (OIDC)"

      - name: Record signed and attested
        env:
          NAME: yuzu-agent-bundle-chisel
          REF: ${{ steps.ref.outputs.image }}@${{ steps.push.outputs.digest }}
        run: exec scripts/ci/image-publish.sh signed-attested "$RUNNER_TEMP/image-vuln-gate" "$NAME" "$GITHUB_RUN_ATTEMPT" "$REF"

      # The publishing act: :X.Y.Z only (no :X.Y or :latest for the bundle).
      # See the same steps in docker-publish.
      - name: Refuse to publish if the tag moved (#5282)
        run: bash scripts/ci/check-release-tag-sha.sh

      - name: Tag the release
        env:
          NAME: yuzu-agent-bundle-chisel
          REF: ${{ steps.ref.outputs.image }}@${{ steps.push.outputs.digest }}
          TAG: ${{ steps.ref.outputs.image }}:${{ steps.ref.outputs.version }}
        run: exec scripts/ci/image-publish.sh tag "$RUNNER_TEMP/image-vuln-gate" "$NAME" "$GITHUB_RUN_ATTEMPT" "$REF" "$TAG"

      - name: Upload image vulnerability gate report
        # WP15/S9 evidence of the pre-push gate: trivy-yuzu-agent-bundle-chisel.json (the full
        # Trivy report: image ID, layers, every package, the findings and the
        # accepted ones), .txt (the table) and .gate.txt (Trivy version, the DB's
        # repository@digest and dates, image ID, coverage, advisory canary,
        # result), each named .attempt-<run attempt>, and the publish journal
        # publish-yuzu-agent-bundle-chisel.attempt-<run attempt>.txt when the
        # gate passed. It runs whenever
        # the gate ran, PASS, FAIL OR CANCELLED (an explicit status function: a
        # bare `if:` would be success() only, and a refusal, the control
        # operating, would leave no record); the gate writes a .gate.txt for every
        # image on every exit it reaches, a SIGTERM/SIGINT included.
        # This job runs after the release exists, so they are not inside its
        # SHA256SUMS; attach-bundle-gate-report attaches them to the GitHub
        # Release afterwards, with their own signed checksum list (also when
        # this gate refused the image), and this artifact keeps them for 90 days.
        id: upload_gate
        if: always() && (steps.gate.outcome == 'success' || steps.gate.outcome == 'failure' || steps.gate.outcome == 'cancelled')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yuzu-agent-bundle-chisel-image-vuln-gate-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/image-vuln-gate/
          if-no-files-found: error
          retention-days: 90
          # One artifact per run attempt, never overwritten: a re-run ("Re-run
          # failed jobs") adds its attempt's reports beside the refused
          # attempt's instead of replacing them.

      # One retry of the evidence upload (G8P6-architect-4,
      # G8P6-security-guardian-2): an attempt that moved a tag and then lost
      # its journal to a failed upload leaves no record of that move, and the
      # consumers would read an older attempt (or none) as the published one.
      # No `overwrite`: when the first upload did complete despite its error,
      # this one fails on the existing name and changes nothing.
      - name: Retry the image vulnerability gate report upload
        if: always() && steps.upload_gate.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yuzu-agent-bundle-chisel-image-vuln-gate-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/image-vuln-gate/
          if-no-files-found: error
          retention-days: 90

      - name: Bundle summary
        env:
          NAME: yuzu-agent-bundle-chisel
        run: |
          st="$(scripts/ci/image-publish.sh state "$RUNNER_TEMP/image-vuln-gate" "$NAME" "$GITHUB_RUN_ATTEMPT")"
          {
            echo "## Published \`yuzu-agent-bundle-chisel\` delivery image (linux/amd64)"
            echo ""
            echo "**Journal:** \`$(sed -n 's/^state=//p' <<<"$st")\`  **Tag:** \`$(sed -n 's/^tags=//p' <<<"$st")\`  **Digest:** \`$(sed -n 's/^digest=//p' <<<"$st")\`"
            echo ""
            echo "Three triplets (linux-x64, windows-x64, macos-arm64); cosign keyless + SLSA provenance."
            echo "Its syft SBOM pair is a 3-day workflow artifact of this run, not a release asset, and is not marked incomplete."
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Attach the agent bundle's gate reports to the release (WP15/S9) ──
  # docker-publish-agent-bundle runs after the release is published, so its
  # gate reports cannot be inside the release's signed SHA256SUMS. This job
  # attaches them to the release as assets anyway (a workflow artifact lasts 90
  # days at most, shorter than a SOC 2 Type II observation window), with a
  # checksum list per attempt signed keyless by this workflow identity, exactly
  # as SHA256SUMS is. It runs whenever the bundle job ran at all (passed,
  # refused, failed or cancelled) and downloads EVERY attempt's gate artifact
  # of this run (`pattern:` + `merge-multiple`: an artifact uploaded by an
  # earlier attempt is listed in a re-run, which "Re-run failed jobs" already
  # relies on), so each run of this job converges on every attempt's files
  # being on the release. Each attempt's files are its gate reports and its
  # publish journal (publish-yuzu-agent-bundle-chisel.attempt-N.txt), which
  # says how far that attempt got: no journal (no record: the gate refused, the
  # job stopped first, or the upload failed), or a prefix of
  # none, push-started, verified, signed-attested, tagging, tagged. A journal
  # that is not a legal prefix, or one beside a gate report that does not
  # record `gate: pass`, is refused before anything is uploaded. The
  # published image is the highest attempt whose journal ends `tagged`; when a
  # higher attempt stopped at `tagging` (a tag may name either digest) the
  # files are attached and then the job fails. It adds new assets only (their
  # names are in no SHA256SUMS) and NEVER replaces a completed one: every name
  # carries the attempt (trivy-yuzu-agent-bundle-chisel.attempt-N.*, the
  # journal, and yuzu-agent-bundle-chisel-image-vuln-gate.attempt-N.SHA256SUMS).
  # A name already on the release is kept when it is a completed upload
  # identical to this run's file (a .sigstore: when it verifies the same list),
  # fails the job when it is a completed upload that differs, and is deleted and
  # uploaded again when it is an interrupted upload (GitHub's asset state is not
  # `uploaded`, or its bytes do not match GitHub's size or digest for it). Kept
  # out of the bundle job so contents: write is held by a job that builds
  # nothing and checks out only the journal reader.
  attach-bundle-gate-report:
    name: "Attach agent-bundle gate report to the release"
    needs: [release, docker-publish-agent-bundle]
    if: always() && needs.release.result == 'success' && needs.docker-publish-agent-bundle.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write   # gh release upload
      id-token: write   # cosign sign-blob keyless
    steps:
      # Only the journal reader (scripts/ci/image-publish.sh `published`),
      # which reads files and runs nothing else.
      - name: Check out the publish journal reader
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src
          sparse-checkout: |
            scripts/ci/image-publish.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download every attempt's gate reports for the bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: yuzu-agent-bundle-chisel-image-vuln-gate-attempt-*
          merge-multiple: true
          path: bundle-gate

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign and attach
        # Per attempt, in attempt order, the attempt's reports and journal and
        # its signed checksum list. Every refusal (an unexpected file, an
        # attempt with no gate report, an illegal journal, a completed asset
        # that differs) is decided before anything is deleted or uploaded.
        # Add, never replace (G8P4-chaos-injector-1): a name already on the
        # release that GitHub reports in a state other than `uploaded`, or whose
        # bytes do not match GitHub's own size or digest for it, is an
        # interrupted upload that was never served, and is deleted and uploaded
        # again; a completed one is kept when identical (a .sigstore: when it
        # verifies its list) and refused when it differs. Tested with stub gh
        # and cosign: tests/test_image_vuln_gate.py AttachBundleReport and
        # tests/test_image_publish.py, which run this block as written.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SIGN_REPOSITORY: ${{ github.repository }}
          SIGN_REF: ${{ github.ref }}
          PUBLISH: ${{ github.workspace }}/src/scripts/ci/image-publish.sh
        run: |
          set -euo pipefail
          err() { echo "::error::$*"; }
          name=yuzu-agent-bundle-chisel
          scratch="$(mktemp -d "$RUNNER_TEMP/yuzu-attach.XXXXXX")"
          trap 'rm -rf "$scratch"' EXIT
          mkdir -p bundle-gate   # absent when no attempt uploaded anything
          cd bundle-gate
          shopt -s nullglob
          all=(*)
          shopt -u nullglob
          if (( ${#all[@]} == 0 )); then
            err "no gate report for $name from any attempt of this run (did the bundle job stop before its gate in every attempt?)"
            exit 1
          fi
          declare -A seen=()
          for f in "${all[@]}"; do
            # This job's own outputs (a checksum list and its signature), from
            # an earlier run in the same directory: regenerated below.
            [[ ! "$f" =~ ^${name}-image-vuln-gate\.attempt-[1-9][0-9]{0,3}\.SHA256SUMS(\.sigstore)?$ ]] || continue
            if [[ "$f" =~ ^(trivy|grype)-${name}\.attempt-([1-9][0-9]{0,3})\.(json|txt|gate\.txt)$ ]]; then
              seen[${BASH_REMATCH[2]}]=1
            elif [[ "$f" =~ ^publish-${name}\.attempt-([1-9][0-9]{0,3})\.txt$ ]]; then
              seen[${BASH_REMATCH[1]}]=1
            else
              err "unexpected file $f in the bundle's gate artifacts"
              exit 1
            fi
          done
          mapfile -t attempts < <(printf '%s\n' "${!seen[@]}" | sort -n)
          for n in "${attempts[@]}"; do
            [[ -s "trivy-${name}.attempt-${n}.gate.txt" ]] \
              || { err "attempt $n has files but no trivy-${name}.attempt-${n}.gate.txt; not attaching anything"; exit 1; }
          done

          # The journals: legal prefixes only, each beside a passing gate. Exit
          # 3 (legal, but a higher attempt stopped while tagging) attaches the
          # files and then fails the job.
          prc=0
          bash "$PUBLISH" published . "$name" > "$scratch/published" || prc=$?
          if [ "$prc" != 0 ] && [ "$prc" != 3 ]; then
            err "an attempt's publish journal is not a legal prefix, or has no passing gate (above); not attaching anything"
            exit 1
          fi
          published="$(sed -n 's/^published=//p' "$scratch/published")"
          digest="$(sed -n 's/^digest=//p' "$scratch/published")"
          if [ "$published" = none ]; then
            echo "no attempt of this run published $name (no journal ends 'tagged'); attaching the record of every attempt"
          else
            echo "attempt $published published $name ($digest); attaching the record of every attempt"
          fi

          verify() {
            cosign verify-blob --bundle "$1" \
              --certificate-identity "https://github.com/${SIGN_REPOSITORY}/.github/workflows/release.yml@${SIGN_REF}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$2"
          }

          # What is on the release already.
          release_id="$(gh api "repos/$GH_REPO/releases/tags/$GITHUB_REF_NAME" --jq '.id')"
          [[ "$release_id" =~ ^[0-9]+$ ]] || { err "no release for $GITHUB_REF_NAME"; exit 1; }
          # id, name, state, size, digest (empty when GitHub reports none).
          gh api --paginate "repos/$GH_REPO/releases/$release_id/assets?per_page=100" \
            --jq '.[] | [.id, .name, .state, .size, (.digest // "")] | @tsv' > "$scratch/assets.tsv"

          # asset NAME: prints "id<TAB>state<TAB>size<TAB>digest" for that asset, or nothing.
          asset() {
            awk -F '\t' -v n="$1" '$2 == n { print $1 "\t" $3 "\t" $4 "\t" $5 }' "$scratch/assets.tsv"
          }
          # fetch ID SIZE DIGEST NAME: downloads a completed asset to $scratch/NAME;
          # returns 1 when the bytes do not match GitHub's own size or digest for
          # it (an incomplete upload). A download that fails stops the job: it is
          # never read as an incomplete upload (that would delete a completed one).
          fetch() {
            local id="$1" size="$2" digest="$3" out="$scratch/$4"
            gh api -H "Accept: application/octet-stream" "repos/$GH_REPO/releases/assets/$id" > "$out" \
              || { err "could not download $4 from the release; nothing changed, re-run this job"; exit 1; }
            [ "$(stat -c %s "$out")" = "$size" ] || return 1
            [ -z "$digest" ] || [ "sha256:$(sha256sum "$out" | cut -d' ' -f1)" = "$digest" ] || return 1
          }

          upload=()
          replace=()
          # classify NAME KIND [LIST]: what to do with this run's file NAME,
          # decided before anything is deleted. KIND is `file` (a completed asset
          # is kept when byte-identical) or `sigstore` (kept when it verifies
          # LIST). A completed asset that differs exits 1 here.
          classify() {
            local name="$1" kind="$2" list="${3:-}" row id state size digest
            row="$(asset "$name")"
            if [ -z "$row" ]; then
              upload+=("$name")
              return 0
            fi
            IFS=$'\t' read -r id state size digest <<<"$row"
            if [ "$state" != "uploaded" ]; then
              echo "$name is on the release in state '$state' (an interrupted upload, never served); it will be deleted and uploaded again"
              replace+=("$id")
              upload+=("$name")
              return 0
            fi
            if ! fetch "$id" "$size" "$digest" "$name"; then
              echo "$name is on the release but its bytes do not match GitHub's size or digest for it (an incomplete upload); it will be deleted and uploaded again"
              replace+=("$id")
              upload+=("$name")
              return 0
            fi
            if [ "$kind" = sigstore ]; then
              verify "$scratch/$name" "$list" \
                || { err "$name on the release does not verify $list; refusing to replace it"; exit 1; }
              echo "$name is already on the release and verifies; kept"
            else
              cmp -s "$name" "$scratch/$name" \
                || { err "$name is already on the release with different content; refusing to replace it"; exit 1; }
              echo "$name is already on the release, identical; kept"
            fi
          }

          lists=()
          for n in "${attempts[@]}"; do
            stem="${name}.attempt-${n}"
            shopt -s nullglob
            # Every scanner's report for the bundle image from that attempt, and its journal.
            reports=("trivy-${stem}".* "grype-${stem}".*)
            shopt -u nullglob
            [ ! -e "publish-${stem}.txt" ] || reports+=("publish-${stem}.txt")
            sums="${name}-image-vuln-gate.attempt-${n}.SHA256SUMS"
            sha256sum "${reports[@]}" > "$sums"
            cat "$sums"
            for f in "${reports[@]}" "$sums"; do
              classify "$f" file
            done
            classify "$sums.sigstore" sigstore "$sums"
            lists+=("$sums")
          done
          # A list's signature: made only when none complete is on the release.
          for sums in "${lists[@]}"; do
            for f in "${upload[@]}"; do
              if [ "$f" = "$sums.sigstore" ]; then
                cosign sign-blob --yes "$sums" --bundle "$sums.sigstore"
                verify "$sums.sigstore" "$sums"
              fi
            done
          done

          for id in "${replace[@]}"; do
            gh api -X DELETE "repos/$GH_REPO/releases/assets/$id" > /dev/null
          done
          if (( ${#upload[@]} )); then
            gh release upload "$GITHUB_REF_NAME" "${upload[@]}"
          fi
          echo "Attached ${#upload[@]} file(s) for attempt(s) ${attempts[*]} to ${GITHUB_REF_NAME} (${#replace[@]} incomplete upload(s) replaced; no completed asset replaced)"
          if [ "$prc" = 3 ]; then
            err "the record is attached, but a higher attempt stopped while moving the bundle's tag (above): re-run docker-publish-agent-bundle so a new attempt completes 'tagged', then this job"
            exit 1
          fi

  # ── Create GitHub Release ────────────────────────────────────────────
  release:
    name: "Create Release"
    # docker-publish-postgres is in the needs: the composes release-pin
    # ghcr.io/.../yuzu-postgres:X.Y.Z (#1318), so publishing a release
    # whose postgres image failed to push would ship broken composes.
    # docker-publish-chisel is in the needs so its SBOMs are always present and
    # inside SHA256SUMS (#5242); check-release-artifacts.sh requires them.
    # docker-publish-agent-bundle is NOT, by design: it builds from this
    # release's published assets, so it can only run after it, and its SBOM is
    # not a release asset (it stays a workflow artifact).
    needs: [release-guard, build-linux, build-gateway, build-windows, build-macos, docker-publish, docker-publish-postgres, docker-publish-chisel]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write   # gh release create
      id-token: write   # cosign sign-blob keyless (SHA256SUMS.sigstore)

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate docker-compose image versions
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Compose ${YUZU_VERSION:-X.Y.Z} defaults track the stable base
          # version, not rc/beta/alpha suffixes — same convention used by
          # the Extract changelog step below. v0.11.0-rc1 cut (2026-04-18)
          # hit this after all 6 build jobs had already completed.
          BASE_VERSION="${VERSION%%-*}"
          bash scripts/check-compose-versions.sh "$BASE_VERSION"

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          # Skip docker buildx attestation/provenance artifacts (auto-named
          # `<owner>~<repo>~<random>.dockerbuild`). They consistently fail
          # to download with `Artifact download failed after 5 retries` and
          # the Create Release job needs none of them — the release assets
          # are all `yuzu-*`. This filter killed the v0.10.0 release before
          # it could publish; v0.10.0 had to be assembled manually.
          pattern: 'yuzu-*'

      # The image gate's reports and publish journals of EVERY attempt of this
      # run, into one directory (WP15/S9). An artifact uploaded by an earlier
      # run attempt is listed in a re-run (what "Re-run failed jobs" already
      # relies on for the build artifacts); each name carries its attempt, so
      # merging cannot collide. The copies the `yuzu-*` download above also
      # fetched are dropped in the flatten step, so these are the only ones.
      - name: Download every attempt's gate reports and publish journals
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: gate-reports
          pattern: '*-image-vuln-gate-attempt-*'
          merge-multiple: true

      - name: Package Compose Wizard
        # The Compose Wizard (tools/compose-wizard/) is a browser-based
        # docker-compose.yml + .env generator contributed in PR #405 by
        # @fjarvis. Zero dependencies — extract zip, open index.html, walk
        # the wizard. Bundled here as a release asset so customers can grab
        # it from the Releases page.
        #
        # Conditional on the directory existing — the wizard was merged
        # into main directly in PR #405, so any tag cut from a branch that
        # hasn't reconciled with main may not have it. Skip with a warning
        # rather than fail the release.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -d tools/compose-wizard ]; then
            STAGING="yuzu-compose-wizard-${VERSION}"
            cp -r tools/compose-wizard "$STAGING"
            zip -r "artifacts/yuzu-compose-wizard-${VERSION}.zip" "$STAGING"
            SIZE=$(du -h "artifacts/yuzu-compose-wizard-${VERSION}.zip" | cut -f1)
            echo "Packaged compose wizard: yuzu-compose-wizard-${VERSION}.zip ($SIZE)"
          else
            echo "::warning::tools/compose-wizard not present in this checkout — skipping wizard bundle. See PR #405."
          fi

      - name: Flatten artifacts + SBOMs
        run: |
          cd artifacts
          # The gate artifacts come from the merged download only.
          rm -rf ./*-image-vuln-gate-attempt-*/
          # Collect archives, installers, AND SBOMs from per-platform
          # upload-artifact subdirs into artifacts/ for uniform handling
          # by the gate script, SHA256SUMS generator, and gh release
          # create. File names are globally unique across jobs (the
          # per-platform suffix is baked into each asset name), so no
          # collisions are expected; fail loud if they happen.
          find . -mindepth 2 -type f \( \
            -name '*.tar.gz' -o \
            -name '*.zip'    -o \
            -name '*.exe'    -o \
            -name '*.deb'    -o \
            -name '*.rpm'    -o \
            -name '*.pkg'    -o \
            -name '*.cdx.json' -o \
            -name '*.spdx.json' -o \
            -name 'trivy-*.json' -o \
            -name 'trivy-*.txt' -o \
            -name 'grype-*.json' -o \
            -name 'grype-*.txt' \
          \) -exec mv {} . \;
          # Every attempt's gate reports (trivy-*, grype-*) and publish
          # journals (publish-*); refuse a name collision rather than overwrite.
          shopt -s nullglob
          for f in ../gate-reports/trivy-* ../gate-reports/grype-* ../gate-reports/publish-*; do
            [ ! -e "${f##*/}" ] || { echo "::error::${f##*/} arrived twice"; exit 1; }
            mv -- "$f" .
          done
          shopt -u nullglob

      - name: Verify release artifact completeness
        run: |
          # Gate: every expected archive must have a sibling CycloneDX +
          # SPDX SBOM, and every image SBOM must be present (server, gateway,
          # postgres and the three chisel images, #5242). Missing any
          # of the above fails the release before we publish anything
          # customers will have to unwind. Tracked as #362 / #408.
          # With the version it also checks every asset name is one GitHub
          # stores unchanged and every package is from this release (#5141).
          bash scripts/check-release-artifacts.sh artifacts "${GITHUB_REF_NAME#v}"

      - name: Check artifact SBOM scope
        run: |
          # Every artifact SBOM (all but the *-image ones) must name an artifact
          # in this release with the SHA-256 it records, have at most the bound
          # of entries scripts/ci/artifact-sbom.py states, and list no path
          # under vcpkg/, vcpkg_installed/, build-*/, _build/, _build_*/, site/,
          # tests/, .git/ or .github/ (the marks of a checkout, build-tree or
          # test-tree scan, which is what the pre-S8 SBOMs were). Each image
          # SBOM pair must carry the marker mark-image adds where the image
          # holds what syft cannot list. A failure here comes after the images
          # are pushed: see the release skill's failure table (most causes need
          # a fix and re-tag; a transfer fault needs only a re-run).
          python3 scripts/ci/artifact-sbom.py check --artifacts-dir artifacts

      - name: Generate SHA256SUMS
        run: |
          cd artifacts
          # *.zip glob covers both yuzu-agent-windows-x64.zip and yuzu-compose-wizard-*.zip.
          # SBOMs (*.cdx.json, *.spdx.json) are included so customers can
          # verify the SBOM they download matches the SBOM we shipped.
          # trivy-* (and grype-*, once a second scanner writes reports) are the
          # image vulnerability gate's reports (WP15/S9), the evidence of what
          # each image was scanned with and found. nullglob for that list only:
          # a scanner with no reports adds nothing, while every other pattern
          # here still fails loudly when it matches nothing.
          shopt -s nullglob
          gate_reports=(trivy-* grype-* publish-*)
          shopt -u nullglob
          sha256sum *.tar.gz *.zip *.exe *.deb *.rpm *.pkg *.cdx.json *.spdx.json "${gate_reports[@]}" > SHA256SUMS
          cat SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign SHA256SUMS (keyless)
        env:
          SIGN_REPOSITORY: ${{ github.repository }}
          SIGN_REF: ${{ github.ref }}
        run: |
          cd artifacts
          # cosign v3.0+ rejects explicit --oidc-issuer when a signing
          # config is in use (auto-detected from the workflow's id-token).
          # See "Sign image (keyless)" earlier in this file for the same
          # fix. v0.11.0-rc0 was the first release to hit this after the
          # cosign-installer 3 → 4 dependabot bump (#495).
          #
          # Output extension is .sigstore (canonical Sigstore Bundle format
          # name) rather than the historical .bundle so the OpenSSF
          # Scorecard Signed-Releases check recognises the asset — its
          # extension regex is `\.(minisig|asc|sig|sign|sigstore)$`. v0.11.0
          # and v0.11.0-rc2 also carry a backfilled .sigstore copy alongside
          # their original .bundle for the same reason; this rename makes
          # every future release Scorecard-visible by default.
          cosign sign-blob --yes SHA256SUMS --bundle SHA256SUMS.sigstore
          echo "Signed SHA256SUMS with cosign (keyless/OIDC)"
          # Verify what we just signed with the exact identity the published
          # instructions (and scripts/build-agent-bundle.sh) will use, BEFORE
          # the GitHub Release is created (#7529): a bundle a verifier would
          # reject fails this job here, not after the release is public. (The
          # images are already pushed and signed by now.)
          cosign verify-blob --bundle SHA256SUMS.sigstore \
            --certificate-identity "https://github.com/${SIGN_REPOSITORY}/.github/workflows/release.yml@${SIGN_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            SHA256SUMS
          echo "Verified the SHA256SUMS signature with its exact release.yml identity"

      - name: Bundle SLSA attestations as .intoto.jsonl release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd artifacts
          # Each build job calls actions/attest-build-provenance, which
          # uploads the SLSA bundle to GitHub's Attestations API keyed by
          # the artifact's sha256 digest. That registry is invisible to
          # OpenSSF Scorecard's Signed-Releases check, which only walks
          # release *assets* and matches `*.intoto.jsonl` for provenance.
          # Re-attach each bundle as <artifact>.intoto.jsonl so Scorecard
          # sees the attestation. `gh attestation verify` continues to work
          # against the API; offline verification can also now use
          # `gh attestation verify --bundle <file>.intoto.jsonl <file>`.
          while IFS=' ' read -r digest name; do
            name="${name#\*}"
            case "$name" in
              # trivy-*/grype-* are gate reports and publish-* the publish
              # journals, not build outputs: no attestation exists for them.
              ''|*.cdx.json|*.spdx.json|yuzu-compose-wizard-*|trivy-*|grype-*|publish-*) continue ;;
            esac
            # gh api --jq does not apply on 4xx responses, so capture the
            # raw body and require a non-null bundle to materialise.
            body=$(gh api "repos/${{ github.repository }}/attestations/sha256:$digest" 2>/dev/null || true)
            bundle=$(printf '%s' "$body" | jq -c '.attestations[0].bundle // empty' 2>/dev/null || true)
            if [ -z "$bundle" ]; then
              echo "::warning::no attestation for $name (digest sha256:$digest) — skipping"
              continue
            fi
            printf '%s\n' "$bundle" > "${name}.intoto.jsonl"
            echo "wrote ${name}.intoto.jsonl ($(wc -c < "${name}.intoto.jsonl") bytes)"
          done < SHA256SUMS

      - name: Determine if prerelease
        id: prerelease
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" == *"-alpha"* ]] || [[ "$TAG" == *"-beta"* ]] || [[ "$TAG" == *"-rc"* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # For pre-release tags (v0.8.0-rc0, v0.8.0-beta1, ...), the CHANGELOG
          # entry is written under the base version (## [0.8.0]), not the rc
          # suffix. Strip anything after the first '-' so rc/beta/alpha tags
          # pull the same section as the eventual stable release.
          BASE_VERSION="${VERSION%%-*}"
          # Extract the section for this version from CHANGELOG.md
          if [ -f CHANGELOG.md ]; then
            awk "/^## \[${BASE_VERSION}\]/{found=1;next} /^## \[/{if(found) exit} found{print}" CHANGELOG.md > changelog_section.md
          fi
          # Check if we got content
          if [ -s changelog_section.md ]; then
            echo "has_changelog=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changelog=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate release notes
        env:
          HAS_CHANGELOG: ${{ steps.changelog.outputs.has_changelog }}
        run: |
          OWNER="${{ github.repository_owner }}"
          TAG="${GITHUB_REF_NAME}"

          # Start with changelog content if available. GitHub caps release
          # bodies at 125000 characters; a release that aggregates a large dev
          # line (v0.13.0's [0.13.0] section is ~217 KB / 2800+ lines) blows
          # past that and `gh release create` returns
          # "HTTP 422: body is too long (maximum is 125000 characters)".
          # Cap the embedded changelog (cut at a line boundary) and link to the
          # full CHANGELOG.md when truncated; the static footer below is small,
          # so 100000 leaves ample headroom under the 125000 limit.
          CHANGELOG_LIMIT=100000
          if [ "$HAS_CHANGELOG" = "true" ]; then
            if [ "$(wc -c < changelog_section.md)" -gt "$CHANGELOG_LIMIT" ]; then
              head -c "$CHANGELOG_LIMIT" changelog_section.md | sed '$d' > release-notes.md
              {
                echo ""
                echo "_… changelog truncated — this release's changelog exceeds GitHub's 125,000-character release body limit._"
                echo "_See [CHANGELOG.md](https://github.com/${OWNER}/Yuzu/blob/${TAG}/CHANGELOG.md) for the full list of changes._"
              } >> release-notes.md
            else
              cat changelog_section.md > release-notes.md
            fi
            echo "" >> release-notes.md
          else
            echo "_See commit history for changes in this release._" > release-notes.md
            echo "" >> release-notes.md
          fi

          cat >> release-notes.md <<NOTES_EOF
          ## Enterprise installers

          | Component | Windows | macOS | Debian/Ubuntu | RHEL/Fedora |
          |---|---|---|---|---|
          | Agent | \`.exe\` (InnoSetup) | \`.pkg\` (launchd) | \`.deb\` (systemd) | \`.rpm\` (systemd) |
          | Server | — | — | \`.deb\` (systemd) | \`.rpm\` (systemd) |
          | Gateway | — | — | \`.deb\` (systemd) | \`.rpm\` (systemd) |

          The server runs on Linux only (ADR-0035): use the container image or
          the Linux packages. \`YuzuServerSetup-*.exe\` is discontinued, and
          the Windows and macOS archives contain the agent only. To move an
          existing Windows or macOS server to Linux, follow "Moving a Windows
          or macOS server to Linux" in \`docs/user-manual/server-admin.md\`:
          its data cannot be carried over, so you deploy a new Linux server,
          enroll agents with it as new installations, and delete the old server's
          leftover files, which hold secrets.

          ### Windows silent install (GPO / SCCM / Intune)
          \`\`\`powershell
          YuzuAgentSetup-*.exe /VERYSILENT /SUPPRESSMSGBOXES /SERVER=yuzu-server:50051 /TOKEN=<enrollment-token>
          \`\`\`

          Silent uninstall: \`"C:\\Program Files\\Yuzu\\unins000.exe" /VERYSILENT /SUPPRESSMSGBOXES\` (or the path in the product's \`UninstallString\` registry value, if it was installed to another directory). It removes the program but keeps its data directory, \`%ProgramData%\\Yuzu\` (the agent's identity and mTLS private key). To decommission a device, revoke its certificate on the server and delete \`%ProgramData%\\Yuzu\` (see \`docs/agent-bundle.md\`). Agent uninstallers from earlier releases (up to 0.14.0-rc2) hang on a silent uninstall; upgrade first.

          ### macOS silent install (Jamf / MDM)
          \`\`\`bash
          sudo installer -pkg YuzuAgent-*.pkg -target /
          \`\`\`

          ### Linux install
          \`\`\`bash
          # Debian/Ubuntu
          sudo dpkg -i yuzu-agent_*.deb
          sudo systemctl edit yuzu-agent  # set --server address

          # RHEL/Fedora
          sudo rpm -i yuzu-agent-*.rpm
          \`\`\`

          ## Platform archives

          | Archive | Platform | Arch |
          |---|---|---|
          | \`yuzu-linux-x64.tar.gz\` | Linux (server + agent) | x86_64 |
          | \`yuzu-linux-arm64.tar.gz\` | Linux (server + agent) | ARM64 (coming soon) |
          | \`yuzu-gateway-linux-x64.tar.gz\` | Linux (gateway) | x86_64 |
          | \`yuzu-agent-windows-x64.zip\` | Windows (agent) | x86_64 |
          | \`yuzu-agent-macos-arm64.tar.gz\` | macOS (agent) | ARM64 (Apple Silicon) |

          In earlier releases the Windows and macOS archives were named
          \`yuzu-windows-x64.zip\` and \`yuzu-macos-arm64.tar.gz\` and also
          held the server; update any script that downloads them by name.

          Each binary archive, package and installer has its own CycloneDX and SPDX SBOM,
          named after the file (\`<name without .tar.gz/.zip/.deb/.rpm/.exe/.pkg>.{cdx,spdx}.json\`).
          It lists what is inside that file: the vcpkg libraries its C++ binaries
          are built with (from the installed vcpkg tree), for the gateway the
          Erlang/OTP release, and anything else syft recognises in it. The
          Windows installer's SBOM lists the files of
          \`yuzu-agent-windows-x64.zip\` that the installer installs.
          Not listed yet, though the file holds it: code vendored into the
          source tree and compiled into \`yuzu-server\` (qrcodegen, and the
          web assets it embeds: htmx, ECharts, three.js, Cytoscape, IBM Plex
          fonts), the Windows installer's own InnoSetup runtime, and what the
          gateway's Erlang emulator (\`beam.smp\`) vendors (PCRE2, asmjit,
          zstd, Ryu, OpenSSL's MD5). An SBOM whose file or image holds
          something it does not list says so: a CycloneDX composition with
          \`aggregate: incomplete\`, in SPDX a \`CONTAINS NOASSERTION\`
          relationship on its root, and the reason tokens in the
          \`yuzu:sbom:incomplete-reasons\` note (a CycloneDX property; in SPDX
          a line of the root's comment). The release's six image SBOMs are
          marked too: an image scan cannot see the vcpkg libraries linked into
          \`yuzu-server\` and \`yuzu-agent\`, what the gateway's Erlang
          emulator vendors, nor pgvector, which the \`yuzu-postgres\` image
          builds from source. A scanner such as
          grype reports nothing for the marker, so read it yourself
          (release-verification.md section 5). Libraries the binaries load
          from the operating system at run time (glibc, \`libsystemd\`, the
          MSVC runtime, the host OpenSSL) are not in the file and not listed.

          ## Compose Wizard

          \`yuzu-compose-wizard-*.zip\` — browser-based step-by-step
          generator for a customised \`docker-compose.yml\` + \`.env\`.
          Zero dependencies — extract the zip and open \`index.html\` in
          a browser. Contributed by
          [@fjarvis](https://github.com/fjarvis) in
          [#405](https://github.com/${{ github.repository }}/pull/405).

          \`\`\`bash
          unzip yuzu-compose-wizard-*.zip
          cd yuzu-compose-wizard-*
          # Open index.html in your browser, or:
          python3 -m http.server 8000
          \`\`\`

          ## Docker images

          \`\`\`bash
          docker pull ghcr.io/${OWNER}/yuzu-server:${TAG}
          docker pull ghcr.io/${OWNER}/yuzu-gateway:${TAG}
          \`\`\`

          Architecture: \`linux/amd64\`. Images are published to GHCR by this workflow as part of the release.

          ### Verify checksums

          \`\`\`bash
          sha256sum -c SHA256SUMS
          \`\`\`

          ### Verify signature (cosign)

          \`\`\`bash
          cosign verify-blob --bundle SHA256SUMS.sigstore \\
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${TAG}" \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \\
            SHA256SUMS
          \`\`\`

          ## Supply chain: SBOM, SLSA provenance, signed images

          Every release ships CycloneDX + SPDX SBOMs per binary archive, package
          and installer (\`yuzu-linux-x64\`, \`yuzu-gateway-linux-x64\`,
          \`yuzu-agent-windows-x64\` and \`yuzu-agent-macos-arm64\` with
          \`.cdx.json\`/\`.spdx.json\` for the archives, the package or installer
          name for the others) and per release image
          (\`yuzu-{server,gateway,postgres}-image.{cdx,spdx}.json\` and
          \`yuzu-{server,gateway,agent}-chisel-image.{cdx,spdx}.json\`: a syft
          v1.57.2 scan of the image by the digest this release signs). An image
          scan does not see the C++ libraries linked statically into
          \`yuzu-server\` and \`yuzu-agent\` (the \`yuzu-linux-x64\`, server
          and agent package SBOMs list them), what the gateway's Erlang emulator vendors,
          or the \`yuzu-postgres\` image's source-built pgvector, so each of
          the six image SBOMs is marked incomplete with its reasons
          (server: \`server-vendored, image-static-cpp\`; agent:
          \`image-static-cpp\`; gateway: \`erts-static\`; postgres:
          \`pgvector-source\`). The agent-bundle image published after the
          release has no SBOM among the release assets. GitHub-native
          SLSA build provenance attestations for every binary archive
          and Docker image, and cosign keyless signatures on both the
          Docker images and the \`SHA256SUMS\` manifest. See
          [\`docs/user-manual/release-verification.md\`](docs/user-manual/release-verification.md)
          for the full verification workflow (\`gh attestation verify\`,
          \`cosign verify\`, CycloneDX / SPDX validation).

          Each image was scanned for vulnerabilities before it was pushed; the
          reports are the \`trivy-yuzu-*\` assets (inside \`SHA256SUMS\`): the
          full Trivy JSON, a table, and a \`.gate.txt\` summary with the Trivy
          version, the vulnerability DB digest and date, the image ID and which
          images' OS packages the scanner could not see. The agent-bundle
          image's report is attached after the release, with its own signed
          checksum list (\`yuzu-agent-bundle-chisel-image-vuln-gate.attempt-N.SHA256SUMS\`).
          Every report's name carries the workflow run attempt that wrote it
          (\`.attempt-N\`): when a gate refused an image and the job was re-run,
          the refused attempt's report is here too, beside the passing one.
          Beside each attempt's reports, its publish journal
          (\`publish-<image>.attempt-N.txt\`) records how far that attempt got:
          the image's release tags were moved only after its digest was
          verified to be the scanned image, signed and attested, and the
          published image is the highest attempt whose journal ends
          \`publish: tagged\`. See
          [\`docs/user-manual/release-verification.md\`](docs/user-manual/release-verification.md).

          See the [user manual](docs/user-manual/) for full setup instructions.
          NOTES_EOF
          # Strip leading whitespace from heredoc indentation
          sed -i 's/^          //' release-notes.md

      - name: Refuse to publish if the tag moved (#5282)
        run: bash scripts/ci/check-release-tag-sha.sh

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IS_PRERELEASE: ${{ steps.prerelease.outputs.is_prerelease }}
        run: |
          PRERELEASE_FLAG=""
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          # Compose Wizard zip is conditional — Package Compose Wizard step
          # skips with a warning if tools/compose-wizard isn't in the tag's
          # commit tree. Only include if the file actually exists.
          WIZARD_ASSET=()
          if ls artifacts/yuzu-compose-wizard-*.zip >/dev/null 2>&1; then
            WIZARD_ASSET+=(artifacts/yuzu-compose-wizard-*.zip)
          fi

          # The image vulnerability gate's reports: every scanner's (trivy-*,
          # grype-*), and the publish journals (publish-*), the same list
          # SHA256SUMS hashed.
          shopt -s nullglob
          GATE_REPORTS=(artifacts/trivy-* artifacts/grype-* artifacts/publish-*)
          shopt -u nullglob

          # The release-guard job refused this run up front if a published
          # release already existed (#5282), so a release found here is either
          # a DRAFT (an interrupted `gh release create`, possibly this job's own
          # earlier attempt, or a hand-made draft the guard's contents:read
          # token cannot see) or one PUBLISHED after the guard ran (an earlier
          # attempt of this job, another run of the tag, or a hand-run
          # `gh release create`). Fail with the matching instruction rather than
          # the old skip-with-a-notice that went green, and never re-upload over
          # it: --clobber would replace signed assets.
          if existing_draft="$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [[ "$existing_draft" == "true" ]]; then
              # gh release create makes a draft, uploads, then publishes; an
              # interrupted upload (this job's own earlier attempt included)
              # leaves the draft behind. Nothing was published.
              echo "::error::A DRAFT release ${GITHUB_REF_NAME} already exists, most likely left by an interrupted 'gh release create' (an earlier attempt of this job, or a hand-made draft). Nothing has been published. Delete the draft (gh release delete ${GITHUB_REF_NAME} --yes), then Re-run failed jobs on this run (#5282)."
            else
              echo "::error::Release ${GITHUB_REF_NAME} is already PUBLISHED. If an earlier attempt of THIS run's release job published it and then failed, the release itself is complete (verify its assets against its SHA256SUMS), but docker-publish-agent-bundle, which needs this job, will not run on a re-run: see the release skill, Recovery, and #5479. Otherwise another run or a hand-run 'gh release create' published it after release-guard passed, and this run's pushed images may not match it: investigate before anything else. Refusing to re-upload over signed assets (#5282)."
            fi
            exit 1
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "Yuzu ${GITHUB_REF_NAME}" \
              --notes-file release-notes.md \
              ${PRERELEASE_FLAG} \
              artifacts/yuzu-linux-x64.tar.gz \
              artifacts/yuzu-gateway-linux-x64.tar.gz \
              artifacts/yuzu-agent-windows-x64.zip \
              artifacts/YuzuAgentSetup-*.exe \
              artifacts/YuzuAgent-*.pkg \
              artifacts/yuzu-agent-macos-arm64.tar.gz \
              artifacts/*.deb \
              artifacts/*.rpm \
              artifacts/*.cdx.json \
              artifacts/*.spdx.json \
              "${GATE_REPORTS[@]}" \
              artifacts/*.intoto.jsonl \
              artifacts/SHA256SUMS \
              artifacts/SHA256SUMS.sigstore \
              "${WIZARD_ASSET[@]}"
          fi
