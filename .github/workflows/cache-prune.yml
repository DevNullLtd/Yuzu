name: Cache prune

# Weekly maintenance for self-hosted runner-local caches (PR-9 of the CI
# overhaul plan). Deletes vcpkg binary-cache zips older than 30 days from
# ${runner.tool_cache}/yuzu-vcpkg-binary-cache-*/ on each self-hosted
# runner. Caps unbounded growth at the cost of one warm-rebuild per stale
# port — acceptable, since stale-by-mtime ports are by definition not in
# the active build's working set.
#
# Also sweeps leaked yuzu_test_* databases off the persistent self-hosted
# Postgres instances (#1367, scripts/ci/sweep-test-databases.sh) — the
# out-of-band counterpart to the suite-start sweeper from PR #2091, so
# leaks reclaim even on a box that stops running [pg] legs.
#
# Does NOT touch:
#   - ccache (~/.cache/ccache, %LOCALAPPDATA%\ccache) — its own LRU at
#     CCACHE_MAXSIZE=30G already handles eviction without our help.
#   - the Yuzu workspace (build-*/, vcpkg/, vcpkg_installed/) — those
#     have per-job sentinels that handle invalidation.
#   - GHA-hosted actions/cache entries — managed by GitHub's own LRU.
#
# Schedule: Sundays 04:00 UTC (low CI load). Manual trigger via
# workflow_dispatch for ad-hoc cleanup. The runner-inventory-sentinel
# also runs every 30 min and would surface a wedged runner separately.

on:
  schedule:
    - cron: '0 4 * * 0'  # Sundays 04:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: cache-prune
  cancel-in-progress: false

jobs:
  prune-linux:
    name: "Prune Linux runner cache"
    runs-on: [self-hosted, Linux, X64, yuzu-bigtam-linux]
    # Headroom for the #1367 sweep's worst-case per-instance psql timeouts,
    # plus the buildx prune over four runners' caches (about 120 GB measured).
    timeout-minutes: 30
    steps:
      - name: Prune vcpkg binary cache zips older than 30 days
        run: |
          set -eu
          base="${RUNNER_TOOL_CACHE:-/opt/actions-runner/_work/_tool}"
          if [[ ! -d "$base" ]]; then
            echo "::warning::RUNNER_TOOL_CACHE not found at $base — skipping"
            exit 0
          fi
          echo "Pruning vcpkg binary-cache zips older than 30 days under: $base"
          # `-type f` because the cache subdirs are kept; only the zip
          # contents age out. -mtime +30 = strictly older than 30 days.
          # Print before delete so the workflow log shows what went.
          before_total=$(find "$base/yuzu-vcpkg-binary-cache-"* -type f 2>/dev/null | wc -l || echo 0)
          deleted=$(find "$base/yuzu-vcpkg-binary-cache-"* -type f -mtime +30 -print -delete 2>/dev/null | wc -l || echo 0)
          after_total=$(find "$base/yuzu-vcpkg-binary-cache-"* -type f 2>/dev/null | wc -l || echo 0)
          echo "before=${before_total} deleted=${deleted} after=${after_total}"

      - name: Prune buildx chisel local cache older than 30 days
        run: |
          set -eu
          # docker-publish-chisel writes a type=local,mode=max buildx cache per
          # image under $RUNNER_TOOL_CACHE/yuzu-docker-buildcache/<image>-chisel —
          # several GB per arch with no built-in eviction. Every release run
          # writes into the dir, so a *-chisel dir untouched for 30 days is
          # genuinely stale (no release used it). Within a dir that IS used,
          # superseded blobs pile up: the next step removes those. Linux-only
          # (the chisel C++ builds run on the self-hosted Big Tam Linux runner).
          # Each removal takes the directory's lock exclusively without waiting
          # (the same <dir>.lock the publish jobs hold shared,
          # scripts/ci/buildcache-lock.sh), so a directory a publish job is
          # using is skipped, never removed under it.
          bc="${RUNNER_TOOL_CACHE:-/opt/actions-runner/_work/_tool}/yuzu-docker-buildcache"
          if [[ ! -d "$bc" ]]; then
            echo "::notice::buildx cache dir $bc not present — skipping"
            exit 0
          fi
          before=$(du -sh "$bc" 2>/dev/null | awk '{print $1}' || echo '?')
          while IFS= read -r -d '' d; do
            rc=0
            flock --exclusive --nonblock --conflict-exit-code 75 "$d.lock" rm -rf -- "$d" || rc=$?
            case "$rc" in
              0) echo "removed stale $d" ;;
              75) echo "::notice::$d skipped: in use (a publish job holds $d.lock)" ;;
              *) echo "::warning::$d: could not lock or remove it (exit $rc)" ;;
            esac
          done < <(find "$bc" -maxdepth 1 -type d -name '*-chisel' -mtime +30 -print0)
          after=$(du -sh "$bc" 2>/dev/null | awk '{print $1}' || echo '?')
          echo "buildx chisel cache: before=${before} after=${after}"

      - name: Sweep leaked healthcheck-gate containers and images (#751)
        run: |
          set -eu
          # scripts/ci/verify-healthcheck-invariants.sh starts a `yuzu-hc-probe-*`
          # listener container, and its workflows `docker load` a
          # `yuzu-hc-verify/<role>:<sha>` image. Both are cleaned up in-job, but a
          # SIGKILL (cancellation grace period expiring, job timeout, daemon
          # crash) can outrun that cleanup, and Big Tam has no blanket
          # `docker system prune`, so nothing else would ever reclaim them.
          #
          # AGE-FILTERED on purpose. The gate itself must never sweep by name at
          # startup: Big Tam runs four runners against ONE dockerd and the verify
          # matrix is five wide, so a name-scoped sweep would `docker rm -f` a
          # sibling job's LIVE listener mid-probe and fail it with a confident but
          # false "the tool is missing". `until=24h` cannot do that — the verify
          # job's timeout is 120 min, so nothing 24h old is still in use.
          docker ps -aq --filter 'name=^yuzu-hc-probe-' --filter 'until=24h' \
            | xargs -r docker rm -f || true
          docker image ls --filter 'reference=yuzu-hc-verify/*' --filter 'until=24h' -q \
            | xargs -r docker image rm -f || true
          echo "healthcheck-gate leftovers older than 24h swept"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # clean: false is load-bearing on the self-hosted agents: they share
          # one per-repo workspace with ci.yml's build jobs (which also set it),
          # and the default git clean -ffdx would wipe the warm build-*/ and
          # vcpkg_installed/ trees this workflow's own header promises not to
          # touch.
          clean: false

      - name: Prune unreferenced buildx cache blobs (WP15/S9)
        run: |
          set -eu
          # Every release publish job exports a type=local,mode=max cache to
          # $RUNNER_TOOL_CACHE/yuzu-docker-buildcache/<image>. An export writes
          # new blobs and replaces index.json but never deletes the blobs only
          # the old index named, and YUZU_PACKAGE_REFRESH makes the package
          # layer new on every run attempt, so the dirs grow without bound
          # (one server dir measured 20 GB, 6.3 GB referenced).
          #
          # All four Big Tam runners' caches, every week: each runner has its
          # own tool cache (/srv/ci/work-N/_tool), all four run as one OS
          # identity, and this job lands on one runner, so it walks its
          # siblings' too. A publish job holds a shared lock on <dir>.lock
          # for its whole run (scripts/ci/buildcache-lock.sh); the script
          # takes it exclusively without waiting and skips a dir in use. It
          # removes only blobs no index can reach and older than 24 h, skips a
          # dir written in the last 3 h, removes a BROKEN dir whole (the next
          # build runs cold instead of failing), and reports an ERROR, exit 1
          # after the last dir, for a dir it cannot read. Recovery for a
          # broken cache: docs/ci-architecture.md "Cache pruning + weekly
          # maintenance".
          tc="${RUNNER_TOOL_CACHE:-/opt/actions-runner/_work/_tool}"
          roots=("$tc/yuzu-docker-buildcache")
          if [[ "$tc" == */work-*/_tool ]]; then
            for r in "${tc%/work-*/_tool}"/work-*/_tool/yuzu-docker-buildcache; do
              [[ "$r" == "$tc/yuzu-docker-buildcache" ]] || roots+=("$r")
            done
          fi
          shopt -s nullglob
          dirs=()
          for r in "${roots[@]}"; do
            if [[ ! -d "$r" || -L "$r" ]]; then
              echo "buildx cache root $r: not present (or a symlink), skipped"
              continue
            fi
            echo "buildx cache root $r: before=$(du -sh "$r" 2>/dev/null | awk '{print $1}' || echo '?')"
            for d in "$r"/*/; do dirs+=("${d%/}"); done
          done
          rc=0
          if [[ ${#dirs[@]} -gt 0 ]]; then
            python3 -I scripts/ci/prune-buildcache.py "${dirs[@]}" || rc=$?
          fi
          for r in "${roots[@]}"; do
            [[ -d "$r" ]] && echo "buildx cache root $r: after=$(du -sh "$r" 2>/dev/null | awk '{print $1}' || echo '?')"
          done
          exit "$rc"

      - name: Sweep leaked yuzu_test_* databases (#1367)
        # Runs even when a prune step above failed: a prune error must not
        # leave the leaked databases unswept until it is fixed.
        if: success() || failure()
        run: bash scripts/ci/sweep-test-databases.sh

  prune-macos:
    name: "Prune macOS runner cache"
    runs-on: [self-hosted, macOS, ARM64, yuzu-bigmags-macos]
    timeout-minutes: 15  # parity with the sibling prune jobs
    steps:
      - name: Prune vcpkg binary cache zips older than 30 days
        run: |
          set -eu
          # RUNNER_TOOL_CACHE on the BigMags Mac Minis; the macos job in ci.yml
          # keys its vcpkg binary cache under ${runner.tool_cache}/yuzu-vcpkg-binary-cache-macos.
          base="${RUNNER_TOOL_CACHE:-}"
          if [[ -z "$base" || ! -d "$base" ]]; then
            echo "::warning::RUNNER_TOOL_CACHE not found at '$base' — skipping"
            exit 0
          fi
          echo "Pruning vcpkg binary-cache zips older than 30 days under: $base"
          # `-type f` because the cache subdirs are kept; only the zip
          # contents age out. -mtime +30 = strictly older than 30 days.
          # Print before delete so the workflow log shows what went.
          before_total=$(find "$base/yuzu-vcpkg-binary-cache-macos" -type f 2>/dev/null | wc -l || echo 0)
          deleted=$(find "$base/yuzu-vcpkg-binary-cache-macos" -type f -mtime +30 -print -delete 2>/dev/null | wc -l || echo 0)
          after_total=$(find "$base/yuzu-vcpkg-binary-cache-macos" -type f 2>/dev/null | wc -l || echo 0)
          echo "before=${before_total} deleted=${deleted} after=${after_total}"

  prune-windows:
    name: "Prune Windows runner cache"
    runs-on: [self-hosted, Windows, X64, yuzu-weetam-windows]
    timeout-minutes: 15  # headroom for the #1367 sweep's worst-case per-instance psql timeouts
    defaults:
      run:
        # MSYS2 bash for the same `find -mtime` semantics. Same shell
        # convention as the windows job in ci.yml.
        shell: 'C:\msys64\usr\bin\bash.exe --noprofile --norc -eo pipefail {0}'
    steps:
      - name: Prune vcpkg binary cache zips older than 30 days
        run: |
          set -eu
          # System32 precedes /usr/bin on these runners' PATH (the same fact
          # that forces the `source`-not-`bash` idiom below), so a bare `find`
          # is Windows find.exe — its errors were swallowed by 2>/dev/null and
          # this step pruned nothing while printing before=0 deleted=0.
          # Prepend /usr/bin so coreutils win.
          export PATH="/usr/bin:$PATH"
          # RUNNER_TOOL_CACHE on Windows is typically C:\actions-runner\_work\_tool
          # which msys2 bash sees as /c/actions-runner/_work/_tool. Use the
          # native env var directly; bash treats forward+back slashes equivalently
          # for path operations.
          base="${RUNNER_TOOL_CACHE:-}"
          if [[ -z "$base" || ! -d "$base" ]]; then
            echo "::warning::RUNNER_TOOL_CACHE not found at '$base' — skipping"
            exit 0
          fi
          echo "Pruning vcpkg binary-cache zips older than 30 days under: $base"
          before_total=$(find "$base/yuzu-vcpkg-binary-cache-"* -type f 2>/dev/null | wc -l || echo 0)
          deleted=$(find "$base/yuzu-vcpkg-binary-cache-"* -type f -mtime +30 -print -delete 2>/dev/null | wc -l || echo 0)
          after_total=$(find "$base/yuzu-vcpkg-binary-cache-"* -type f 2>/dev/null | wc -l || echo 0)
          echo "before=${before_total} deleted=${deleted} after=${after_total}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # clean: false is load-bearing on the self-hosted agents: they share
          # one per-repo workspace with ci.yml's build jobs (which also set it),
          # and the default git clean -ffdx would wipe the warm build-*/ and
          # vcpkg_installed/ trees this workflow's own header promises not to
          # touch.
          clean: false

      - name: Sweep leaked yuzu_test_* databases (#1367)
        # `source`, not `bash`: same idiom as ci.yml's ensure-postgres step —
        # the bare `bash` resolves to the System32 WSL stub under LOCAL
        # SYSTEM, while this step already runs inside MSYS2 bash (job
        # default shell). The script ends in an explicit exit, so sourcing
        # is safe.
        run: source scripts/ci/sweep-test-databases.sh
