name: Nightly

# Tier-3 of the CI overhaul plan (PR-6): sanitizers + coverage moved off the
# every-push critical path of ci.yml. Runs once a day at 06:00 UTC against
# the dev branch, with `workflow_dispatch` available for on-demand re-runs.
#
# On any failure the `alert` job opens or comments on a `nightly-broken`
# issue, mirroring the runner-inventory-sentinel pattern. The discipline
# norm is "no merge to main while `nightly-broken` is open" (documented
# in CLAUDE.md after this PR lands).
#
# Note: `sanitizer-tests.yml` remains the on-demand path for `/test --full`.
# It uses the same triplet + binary cache as the asan job here, so a fresh
# nightly run warms the cache for the next dispatched run.

on:
  schedule:
    - cron: '0 6 * * *'  # 06:00 UTC daily
  workflow_dispatch:
    inputs:
      jobs:
        description: "Which jobs to run (#4018: lets recurrence be measured on dev without paying for the full Big Tam matrix each time - scheduled nightlies only ever run main, never dev)"
        type: choice
        options:
          - all
          - windows-asan
        default: all

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

env:
  VCPKG_COMMIT: "4b77da7fed37817f124936239197833469f1b9a8"
  VCPKG_BINARY_SOURCES: "default"
  CCACHE_MAXSIZE: "30G"
  CCACHE_COMPRESS: "true"
  CCACHE_COMPRESSLEVEL: "1"
  # Big Tam and Wee Tam both allocate one 8C/16T L3 domain per runner.
  YUZU_BUILD_JOBS: "16"

jobs:
  # ── Preflight: Big Tam runner-health gate ─────────────────────────────
  # Mirrors ci.yml's preflight. All three build jobs pin the Big Tam pool
  # (gcc-15/26.04 toolchain) and gate on bigtam_pool_healthy with explicit
  # `== 'true'` (fail-closed: an offline Big Tam skips them in <30s rather
  # than queueing 60 min into a stalled runner). Secrets are available on
  # schedule + workflow_dispatch, so the PAT resolves.
  #
  # Big Tam and Windows are required nightly pools. Missing control evidence
  # or a wholly unavailable required pool fails this job red; it is not
  # converted into a successful matrix skip.
  preflight:
    name: "Nightly preflight (runner health)"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      bigtam_pool_healthy: ${{ steps.health.outputs.bigtam_pool_healthy }}
      # Exact Wee Tam pool gate used by windows-asan.
      weetam_pool_healthy: ${{ steps.health.outputs.weetam_pool_healthy }}
      failure_kind: ${{ steps.health.outputs.failure_kind }}
      failure_report: ${{ steps.health.outputs.failure_report }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Probe runner health
        id: health
        env:
          GH_TOKEN: ${{ secrets.RUNNER_INVENTORY_TOKEN || secrets.GITHUB_TOKEN }}
          DISPATCH_JOBS: ${{ inputs.jobs }}
        run: |
          # #4018 hardening: a `jobs=windows-asan` dispatch only needs Wee Tam
          # healthy. Requiring Big Tam unconditionally (as before) meant an
          # unrelated Big Tam outage failed THIS job, which - via windows-asan's
          # bare `if:` (no status function, so an implicit success() is ANDed on
          # per CLAUDE.md's own standing invariant) - silently skipped
          # windows-asan too, defeating the selector's whole point in exactly the
          # case a cheap, isolated Wee Tam check is most valuable.
          pools=(--require-pool weetam)
          if [[ "$DISPATCH_JOBS" != "windows-asan" ]]; then
            pools+=(--require-pool bigtam)
          fi
          python3 scripts/ci/runner-health-check.py --mode preflight "${pools[@]}"

  # ── Sanitizers (ASan + UBSan) ──────────────────────────────────────────
  sanitize-asan:
    name: "Sanitizers (ASan+UBSan)"
    needs: [preflight]
    # inputs.jobs is null on a schedule trigger (no workflow_dispatch inputs), and
    # `null != 'windows-asan'` is true - so this guard, and its four siblings on
    # sanitize-tsan/coverage/alert/close-on-green, are no-ops on the daily cron and
    # a plain `jobs=all` dispatch. Only `jobs=windows-asan` skips them. A future edit
    # comparing against `'all'` instead of `!= 'windows-asan'` would silently skip
    # every one of these jobs on the cron - don't make that change here.
    if: needs.preflight.outputs.bigtam_pool_healthy == 'true' && inputs.jobs != 'windows-asan'
    # Pinned to the Big Tam pool (native Ubuntu 26.04, GCC 15). The ASan
    # triplet (x64-linux-asan) is a forced cold-cache rebuild every run
    # because per-instrumentation vcpkg packages can't be safely shared
    # with the standard triplet, so the ASan job rebuilds the full dep tree
    # from source on every nightly. The Threadripper Big Tam host clears it
    # fast; the bigtam-linux label guarantees the gcc-15 toolchain (Shulgi
    # 24.04 can't build it).
    runs-on: [self-hosted, Linux, X64, yuzu-bigtam-linux]
    # 60->75 (#4018 hardening round): the #2373 tsan-heavy split adds a second,
    # separately-budgeted test() entry (up to 600s x this leg's own
    # --timeout-multiplier 2 = 1200s worst case) that this job's own timeout-minutes
    # never accounted for. sanitizer-tests.yml's equivalent ASan/TSan legs already
    # run the identical surface + multiplier at 75 minutes - match that, don't leave
    # nightly as the tighter of the two jobs doing the same work.
    timeout-minutes: 75
    env:
      # detect_odr_violation=0: kept as belt-and-braces post-#4019, not
      # because the original trigger still applies. It was added because
      # gRPC's libgpr.so embedded a static copy of abseil's kToUpper while
      # the rest of the dep tree linked abseil dynamically -- #4019's
      # triplets/x64-linux-asan.cmake switch to static linkage eliminated
      # that specific split (confirmed: no separate libgpr.so in the built
      # binaries). A narrower, still-live instance of the same ODR class
      # survives at the libyuzu_agent_core.so/test-binary boundary (each
      # independently embeds its own abseil kSeed) -- confirmed empirically
      # NOT to trip this detector across a full agent-suite run, but not
      # proven absent under every code path. Re-enabling is tracked
      # separately; don't assume this line is dead weight.
      ASAN_OPTIONS: "detect_leaks=1:halt_on_error=1:detect_odr_violation=0"
      UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"
      # Shared 4-runner Big Tam host: harmless gateway-eunit default-cookie
      # defence (matches ci.yml's linux leg).
      YUZU_GW_ALLOW_DEFAULT_COOKIE: "1"

    steps:
      - name: Wipe build-linux-asan/ on branch switch (pre-checkout)
        run: |
          incoming="${GITHUB_REF#refs/heads/}"
          if [[ -d "$GITHUB_WORKSPACE/.git" ]]; then
            current=$(git -C "$GITHUB_WORKSPACE" rev-parse --abbrev-ref HEAD 2>/dev/null || echo "")
            if [[ -n "$current" && "$current" != "HEAD" && "$current" != "$incoming" ]]; then
              echo "branch switch: $current -> $incoming — wiping build-linux-asan/"
              rm -rf "$GITHUB_WORKSPACE/build-linux-asan"
            fi
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          clean: false
          persist-credentials: false

      - name: Install system packages
        run: |
          # flock serializes apt across the 4 runners sharing the Big Tam
          # host — DPkg::Lock::Timeout does NOT cover apt-get update's lists
          # lock — reusing ci.yml's lock path so all Big Tam jobs coordinate.
          (
            flock -w 600 9 || { echo "::error::timed out waiting for apt lock"; exit 1; }
            sudo apt-get -o DPkg::Lock::Timeout=300 update
            sudo apt-get -o DPkg::Lock::Timeout=300 install -y \
              cmake ninja-build gcc-15 g++-15 \
              pkg-config curl zip unzip tar python3-pip ccache \
              bison flex libsystemd-dev libblkid-dev autoconf automake libtool
          ) 9>/tmp/yuzu-ci-apt.lock
          pip3 install --user --break-system-packages --require-hashes -r requirements-ci.txt
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # OTP + rebar3 for the gateway custom_target. Without these, this
      # job inherits whatever Erlang the self-hosted runner has globally,
      # which on the WSL2 runner has previously been older than the
      # rebar3 binary on PATH — producing BEAM-loader failures of the
      # form `op bs_add p x i u x: please re-compile this module with an
      # Erlang/OTP 28 compiler`. Pin matches ci.yml + release.yml so any
      # OTP bump moves all three workflows together.
      - name: Install Erlang/OTP and rebar3
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        env:
          ImageOS: ubuntu24
        with:
          otp-version: '28'
          rebar3-version: '3.24'

      - name: Reset ccache stats
        run: ccache -z

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          vcpkgGitCommitId: '${{ env.VCPKG_COMMIT }}'

      - name: vcpkg sentinel (x64-linux-asan)
        run: bash scripts/ci/vcpkg-triplet-sentinel.sh x64-linux-asan

      - name: Install vcpkg packages (ASan-instrumented)
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{ runner.tool_cache }}/yuzu-vcpkg-binary-cache-asan
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          ${{ github.workspace }}/vcpkg/vcpkg install \
            --triplet x64-linux-asan \
            --overlay-triplets=${{ github.workspace }}/triplets \
            --x-manifest-root=${{ github.workspace }}

      - name: Configure (Meson + ASan/UBSan)
        env:
          CC: ccache gcc-15
          CXX: ccache g++-15
          PKG_CONFIG_PATH: ${{ github.workspace }}/vcpkg_installed/x64-linux-asan/lib/pkgconfig
        run: |
          reconfig=""
          [[ -d build-linux-asan/meson-info ]] && reconfig="--reconfigure"
          meson setup $reconfig build-linux-asan \
            --native-file meson/native/linux-gcc15.ini \
            --buildtype=debug \
            -Dcmake_prefix_path=${{ github.workspace }}/vcpkg_installed/x64-linux-asan \
            -Dbuild_tests=true \
            -Db_sanitize=address,undefined

      - name: Build
        run: meson compile -C build-linux-asan -j "$YUZU_BUILD_JOBS"

      # Postgres for server tests (ADR-0006 decision 8, #1318).
      # Idempotent persistent docker container — per agent on the 4-runner
      # pool (`yuzu-ci-postgres-<n>` on 127.0.0.1:15440+<n>, #2094) — same
      # step as ci.yml's linux job. Required since #1320 PR 1 (SOFT_EXIT=1):
      # a missing Postgres fails the job here, before the test step.
      - name: Ensure Postgres (server tests)
        run: bash scripts/ci/ensure-postgres.sh

      - name: Test
        # --timeout-multiplier 2: the #2092 server shards carry 600s budgets
        # sized for uninstrumented runs; sanitizer instrumentation runs
        # slower (the pre-split 900s budget was justified by exactly that),
        # and 2x1200s parallel shards still fit this job's timeout.
        # YUZU_TEST_PROGRESS (governance follow-up, #4153 round 4): previously only
        # enabled on the nightly windows-asan leg, so a hang here had no per-test
        # attribution beyond the coarser suite-level testlog. Absolute path, same
        # reason as windows-asan's own comment on this: meson's default test workdir
        # is the build directory itself, so a bare path would double-prefix.
        run: |
          export YUZU_TEST_PROGRESS=1
          export YUZU_TEST_PROGRESS_FILE="$GITHUB_WORKSPACE/build-linux-asan/meson-logs/progress.log"
          mkdir -p "$(dirname "$YUZU_TEST_PROGRESS_FILE")"
          rm -f "$YUZU_TEST_PROGRESS_FILE"
          meson test -C build-linux-asan --timeout-multiplier 2 --print-errorlogs

      - name: ccache stats
        if: always()
        run: ccache -s

      - name: Upload meson testlog (on failure or cancel)
        # `|| cancelled()` added alongside progress.log (#4153 round 4): the historical
        # stalls this listener exists to attribute (#2345, #4018) rode to the JOB's own
        # timeout, which GitHub Actions reports as CANCELLED, not FAILED - a bare
        # `failure()` would silently drop exactly the artifact this fix adds.
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: meson-testlog-asan
          path: |
            build-linux-asan/meson-logs/testlog.txt
            build-linux-asan/meson-logs/testlog.junit.xml
            build-linux-asan/meson-logs/progress.log
          retention-days: 14
          if-no-files-found: warn

  # ── Sanitizers (TSan) ──────────────────────────────────────────────────
  sanitize-tsan:
    name: "Sanitizers (TSan)"
    needs: [preflight]
    if: needs.preflight.outputs.bigtam_pool_healthy == 'true' && inputs.jobs != 'windows-asan'
    # Pinned to the Big Tam pool. Same compute argument as the ASan job:
    # the TSan triplet (x64-linux-tsan, issue #917) is a forced cold-cache
    # rebuild every run because per-instrumentation vcpkg packages can't be
    # safely shared with the standard or ASan triplets. The bigtam-linux
    # label guarantees the gcc-15 toolchain (Shulgi 24.04 can't build it).
    runs-on: [self-hosted, Linux, X64, yuzu-bigtam-linux]
    # 60->75: see the sanitize-asan job's identical comment above (#4018 hardening).
    timeout-minutes: 75
    env:
      # TSan suppressions are COMPILED INTO the test binaries
      # (tests/unit/test_runner_main.cpp, __tsan_default_suppressions, #1611);
      # there is deliberately no `suppressions=` file here. Read that comment
      # before adding one.
      TSAN_OPTIONS: "halt_on_error=1:second_deadlock_stack=1"
      # Shared 4-runner Big Tam host: harmless gateway-eunit default-cookie
      # defence (matches ci.yml's linux leg).
      YUZU_GW_ALLOW_DEFAULT_COOKIE: "1"

    steps:
      - name: Wipe build-linux-tsan/ on branch switch (pre-checkout)
        run: |
          incoming="${GITHUB_REF#refs/heads/}"
          if [[ -d "$GITHUB_WORKSPACE/.git" ]]; then
            current=$(git -C "$GITHUB_WORKSPACE" rev-parse --abbrev-ref HEAD 2>/dev/null || echo "")
            if [[ -n "$current" && "$current" != "HEAD" && "$current" != "$incoming" ]]; then
              echo "branch switch: $current -> $incoming — wiping build-linux-tsan/"
              rm -rf "$GITHUB_WORKSPACE/build-linux-tsan"
            fi
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          clean: false
          persist-credentials: false

      - name: Install system packages
        run: |
          # flock serializes apt across the 4 runners sharing the Big Tam
          # host — DPkg::Lock::Timeout does NOT cover apt-get update's lists
          # lock — reusing ci.yml's lock path so all Big Tam jobs coordinate.
          #
          # gdb is in this list (not apt-installed inside the diagnostic step
          # where it used to live) so the failure path costs no apt-get update
          # round-trip, and so a broken apt mirror surfaces here — up front, on
          # every run — rather than only on the run where we need a stack and
          # cannot get one (#1038, build-ci N1).
          (
            flock -w 600 9 || { echo "::error::timed out waiting for apt lock"; exit 1; }
            sudo apt-get -o DPkg::Lock::Timeout=300 update
            sudo apt-get -o DPkg::Lock::Timeout=300 install -y \
              cmake ninja-build gcc-15 g++-15 gdb \
              pkg-config curl zip unzip tar python3-pip ccache \
              bison flex libsystemd-dev libblkid-dev autoconf automake libtool
          ) 9>/tmp/yuzu-ci-apt.lock
          pip3 install --user --break-system-packages --require-hashes -r requirements-ci.txt
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # OTP + rebar3 for the gateway custom_target. Without these, this
      # job inherits whatever Erlang the self-hosted runner has globally,
      # which on the WSL2 runner has previously been older than the
      # rebar3 binary on PATH — producing BEAM-loader failures of the
      # form `op bs_add p x i u x: please re-compile this module with an
      # Erlang/OTP 28 compiler`. Pin matches ci.yml + release.yml so any
      # OTP bump moves all three workflows together.
      - name: Install Erlang/OTP and rebar3
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        env:
          ImageOS: ubuntu24
        with:
          otp-version: '28'
          rebar3-version: '3.24'

      - name: Reset ccache stats
        run: ccache -z

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          vcpkgGitCommitId: '${{ env.VCPKG_COMMIT }}'

      - name: vcpkg sentinel (x64-linux-tsan)
        run: bash scripts/ci/vcpkg-triplet-sentinel.sh x64-linux-tsan

      - name: Install vcpkg packages (TSan-instrumented)
        env:
          # Dedicated per-triplet binary cache. TSan-instrumented
          # packages can't share the standard x64-linux cache or the
          # x64-linux-asan cache — different sanitizer flag sets produce
          # different shadow-memory ABIs. Issue #917 / #569.
          VCPKG_DEFAULT_BINARY_CACHE: ${{ runner.tool_cache }}/yuzu-vcpkg-binary-cache-tsan
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          ${{ github.workspace }}/vcpkg/vcpkg install \
            --triplet x64-linux-tsan \
            --overlay-triplets=${{ github.workspace }}/triplets \
            --x-manifest-root=${{ github.workspace }}

      - name: Configure (Meson + TSan)
        env:
          CC: ccache gcc-15
          CXX: ccache g++-15
          PKG_CONFIG_PATH: ${{ github.workspace }}/vcpkg_installed/x64-linux-tsan/lib/pkgconfig
        run: |
          reconfig=""
          [[ -d build-linux-tsan/meson-info ]] && reconfig="--reconfigure"
          meson setup $reconfig build-linux-tsan \
            --native-file meson/native/linux-gcc15.ini \
            --buildtype=debug \
            -Dcmake_prefix_path=${{ github.workspace }}/vcpkg_installed/x64-linux-tsan \
            -Dbuild_tests=true \
            -Db_sanitize=thread

      - name: Build
        run: meson compile -C build-linux-tsan -j "$YUZU_BUILD_JOBS"

      - name: Build gai_sync_shim (TSan + glibc getaddrinfo_a workaround)
        # cpp-httplib's non-blocking DNS routes through glibc's getaddrinfo_a(),
        # whose clone3-spawned helper thread bypasses TSan's pthread_create
        # interceptor and segfaults on its first malloc() (#438). The shim
        # interposes it with a synchronous getaddrinfo() on the calling thread.
        # Full rationale, the glibc-private-ABI guard, and the gcc-15/-Werror
        # reasoning live in the script — ONE copy, shared with sanitizer-tests.yml,
        # so the two can't drift (#1038 CS-03). Built into $RUNNER_TEMP, not /tmp,
        # because the 4-agent Big Tam pool shares one filesystem and a fixed path
        # is a cross-job collision class (#1038 R-15 / CS-04).
        run: bash scripts/ci/build-gai-sync-shim.sh "$RUNNER_TEMP/libgai_sync_shim.so"

      # Postgres for server tests (ADR-0006 decision 8, #1318) — same
      # idempotent docker-container step as ci.yml's linux job.
      - name: Ensure Postgres (server tests)
        run: bash scripts/ci/ensure-postgres.sh

      - name: Test
        id: test
        env:
          LD_PRELOAD: ${{ runner.temp }}/libgai_sync_shim.so
        # --timeout-multiplier 2: see the asan Test step (#2092 shard budgets).
        # YUZU_TEST_PROGRESS (governance follow-up, #4153 round 4): see the asan Test
        # step's comment - same rationale, same absolute-path requirement.
        run: |
          export YUZU_TEST_PROGRESS=1
          export YUZU_TEST_PROGRESS_FILE="$GITHUB_WORKSPACE/build-linux-tsan/meson-logs/progress.log"
          mkdir -p "$(dirname "$YUZU_TEST_PROGRESS_FILE")"
          rm -f "$YUZU_TEST_PROGRESS_FILE"
          meson test -C build-linux-tsan --timeout-multiplier 2 --print-errorlogs

      - name: Capture stack trace under gdb (#438 diagnostic)
        # With the gai_sync_shim active, the originally-documented #438
        # getaddrinfo_a crash is suppressed and the TSan suite should pass, so
        # any stack captured here is a NEW failure mode worth investigating.
        #
        # The `if:` needs care, and got it wrong before (#1038). The previous
        # guard was a bare `steps.test.outcome == 'failure'`, which contains no
        # status-check function — so GitHub ANDs an implicit `success()` onto it,
        # and `success()` is false the moment Test fails. The condition was
        # therefore unsatisfiable and the step skipped on every red nightly since
        # #1034 (verified against runs 29312580979 / 29231499246 / 29183473414:
        # "Test: failure" -> "Capture stack trace under gdb: skipped"). The whole
        # diagnostic has been dead code.
        #
        # `failure() || cancelled()` restores reachability AND extends it to job
        # cancellation — a TSan test stuck until the 60-min timeout is exactly the
        # case a stack helps most, and `failure()` alone does not fire there
        # (#1038, NICE-3). The outcome check is kept as the inner clause so we
        # still don't gdb an unrelated failure (a corrupt ccache, a bad artifact
        # upload) where there is no meaningful binary to inspect — which was the
        # original, correct intent of the guard this replaces.
        if: (failure() || cancelled()) && (steps.test.outcome == 'failure' || steps.test.outcome == 'cancelled')
        env:
          LD_PRELOAD: ${{ runner.temp }}/libgai_sync_shim.so
          # TSan suppressions are COMPILED INTO the test binaries
          # (tests/unit/test_runner_main.cpp, __tsan_default_suppressions, #1611);
          # there is deliberately no `suppressions=` file here. Read that comment
          # before adding one.
          TSAN_OPTIONS: "halt_on_error=1:second_deadlock_stack=1"
          # Not interpolated into the shell directly: keeps the expression out of
          # the script body (zizmor template-injection hygiene, and it is the
          # pattern the rest of this file uses).
          TEST_OUTCOME: ${{ steps.test.outcome }}
        run: |
          # Which binaries to gdb, with which Catch2 seed, is derived from the run
          # itself — see scripts/ci/tsan-gdb-capture.py. It replaces a hardcoded
          # `./tests/yuzu_server_tests`, which captured nothing at all when the
          # crash was in agent/tar/transport (#1038, R-06). Best-effort by
          # contract: the script always exits 0, so a diagnostic that cannot run
          # never masks — or adds to — the real failure.
          # Explicit if/else, not `[[ ]] && mode=…`: the default runner shell is
          # `bash -eo pipefail`, and a bare `cond && assign` whose cond is false
          # returns non-zero — harmless here (it's exempt from set -e as a non-final
          # &&-list member) but a needless snag for the next reader.
          if [[ "$TEST_OUTCOME" == "cancelled" ]]; then
            mode=cancelled
          else
            mode=failure
          fi
          python3 scripts/ci/tsan-gdb-capture.py \
            --builddir build-linux-tsan \
            --mode "$mode"

      - name: ccache stats
        if: always()
        run: ccache -s

      - name: Upload meson testlog and stack capture (on failure or cancel)
        # `|| cancelled()` for the same reason the gdb step has it: on a 60-min
        # timeout the job is CANCELLED, not failed, so a plain `failure()` upload
        # would throw away the very stack capture the step above just took for
        # the stuck-test case. An `always()` here would also upload on green runs.
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: meson-testlog-tsan
          path: |
            build-linux-tsan/meson-logs/testlog.txt
            build-linux-tsan/meson-logs/testlog.junit.xml
            build-linux-tsan/meson-logs/progress.log
            build-linux-tsan/stack-capture.log
          retention-days: 14
          if-no-files-found: warn

  # ── Sanitizer (Windows ASan) ────────────────────────────────────────────
  # ADR-0021 spark hardening batch (#1934a): the Windows-only spark
  # mechanisms (spark_file.cpp / spark_registry.cpp / spark_service.cpp) had
  # NO sanitizer coverage at all before this job — every real memory-safety
  # bug in that family (UAF-class hazards on watch removal, resource leaks
  # on reconnect) was Windows-side and caught only by manual review or a
  # local ad-hoc TSan build. MSVC has no TSan, so this is ASan-only; the
  # Linux TSan job above (+ the fake-mechanism cross-platform tests) carries
  # the data-race half of the coverage.
  #
  # Agent-only (build_server=false): the spark mechanisms are entirely
  # agent-side, and skipping the server halves build time + sidesteps
  # ASan-vs-static-grpc-stack link unknowns for a component this job doesn't
  # need to touch.
  #
  # KNOWN SIMPLIFICATION vs the Linux ASan job above: that job builds a
  # fully ASan-instrumented vcpkg dependency triplet (x64-linux-asan) so the
  # app and its deps cooperate on container-poisoning. Doing the equivalent
  # for MSVC (a from-source x64-windows-asan triplet rebuilding grpc/
  # protobuf/abseil/openssl under MSVC ASan) is a materially larger
  # undertaking and its own investigation — out of scope for this hardening
  # batch. Instead this job reuses the STANDARD x64-windows triplet
  # (prebuilt, non-instrumented deps) and passes
  # `-D_DISABLE_STRING_ANNOTATION -D_DISABLE_VECTOR_ANNOTATION`, the
  # documented MSVC workaround for the LNK2038 container-annotation mismatch
  # between an ASan-compiled app and non-ASan-compiled static libs (spiked
  # 2026-07-08 on DGRHP: full agent suite green, zero ASan reports, both
  # with and without this flag pair changing anything except making the
  # link succeed).
  #
  # WHAT THIS LEG CATCHES vs NOT — the annotation-disable flags are global,
  # so they turn off MSVC's STL container-overflow annotations for OUR
  # translation units too, not just the vendored libs. So this leg DOES
  # catch, in Yuzu's own spark code, heap-buffer-overflow (raw allocations),
  # stack-buffer-overflow, the DirWatch fixed-array IOCP buffer, and
  # use-after-free (the whole UAF class this batch targets). It does NOT
  # catch out-of-bounds into a std::vector/std::string/std::deque's
  # reserved-but-unused capacity — that specific check rides on the
  # container annotations, which are disabled globally by the workaround.
  # Building a from-source Windows ASan triplet (instrumenting the vendored
  # deps so annotations can stay on) would restore container coverage; it's
  # a materially larger, separate undertaking, revisit if built for another
  # reason.
  windows-asan:
    name: "Sanitizer (Windows ASan)"
    needs: [preflight]
    if: needs.preflight.outputs.weetam_pool_healthy == 'true'
    runs-on: [self-hosted, Windows, X64, yuzu-weetam-windows]
    timeout-minutes: 90
    defaults:
      run:
        # See ci.yml's windows job for why this must be explicit MSYS2 bash,
        # not the bare `bash` keyword (which resolves to WSL bash on this
        # runner and refuses to run as the LOCAL SYSTEM service account).
        shell: 'C:\msys64\usr\bin\bash.exe --noprofile --norc -eo pipefail {0}'
    env:
      # halt_on_error=1 matches every other sanitizer job in this file
      # (sanitize-asan, sanitize-tsan) and sanitizer-tests.yml — continuing
      # past a first UAF/OOB means later reports in the same run can be
      # noise from an already-corrupted heap rather than independent signal.
      # windows_hook_rtl_allocators (RTL heap-API hooking, relevant to
      # IOCP-heavy code) is deliberately NOT enabled yet: it's an
      # upstream-experimental compiler-rt option, and the DGRHP spike that
      # validated this job's configuration did not have it set — ship the
      # validated baseline first, add it as a separately-tested follow-up.
      ASAN_OPTIONS: "halt_on_error=1"
    steps:
      - name: Wipe build-windows-asan/ on branch switch (pre-checkout)
        run: |
          incoming="${GITHUB_REF#refs/heads/}"
          if [[ -d "$GITHUB_WORKSPACE/.git" ]]; then
            current=$(git -C "$GITHUB_WORKSPACE" rev-parse --abbrev-ref HEAD 2>/dev/null || echo "")
            if [[ -n "$current" && "$current" != "HEAD" && "$current" != "$incoming" ]]; then
              echo "branch switch: $current -> $incoming — wiping build-windows-asan/"
              rm -rf "$GITHUB_WORKSPACE/build-windows-asan"
            fi
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          clean: false
          persist-credentials: false

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          sdk: 10.0.26100.0

      - name: Assert toolchain available
        run: |
          set -e
          for tool in meson ninja cl ccache cmake python; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "::error::$tool not on PATH on the self-hosted Windows runner"
              exit 1
            fi
          done
          meson --version

      - name: Assert toolchain manifest (self-hosted)
        shell: pwsh
        run: ./deploy/windows/Assert-Toolchain.ps1 -ManifestPath 'C:\actions-runner\toolchain-manifest.json'

      - name: Assert runner disk (>= 45 GB free)
        run: |
          # This is a THIRD persistent build tree (build-windows-asan/) next
          # to ci.yml's build-windows-{debug,release}/ on the same shared,
          # persistent, clean:false Wee Tam disk, on top of the shared
          # vcpkg_installed/ and ccache trees — fail fast rather than hitting
          # "no space left on device" 30-80 minutes into a 90-minute run.
          free_gb=$(df -k "$GITHUB_WORKSPACE" | awk 'NR==2 {printf "%d", $4/1024/1024}')
          echo "runner disk free: ${free_gb}G on $GITHUB_WORKSPACE"
          if [[ -z "$free_gb" ]] || (( free_gb < 45 )); then
            echo "::error::runner disk ${free_gb}G < 45 GB required"
            exit 1
          fi

      - name: Reset ccache stats
        run: ccache -z

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          vcpkgGitCommitId: '${{ env.VCPKG_COMMIT }}'

      - name: vcpkg sentinel (x64-windows)
        run: /usr/bin/bash scripts/ci/vcpkg-triplet-sentinel.sh x64-windows

      - name: Install vcpkg packages
        env:
          # Shared with ci.yml's windows job's cache when both land on the
          # same physical runner (4-runner Wee Tam pool) — same triplet, no
          # ASan-specific vcpkg rebuild (see the job-level comment above).
          VCPKG_DEFAULT_BINARY_CACHE: ${{ runner.tool_cache }}/yuzu-vcpkg-binary-cache-windows
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          "$GITHUB_WORKSPACE/vcpkg/vcpkg.exe" install \
            --triplet x64-windows \
            --x-manifest-root="$GITHUB_WORKSPACE"

      - name: Configure (Meson + ASan)
        env:
          CC: ccache cl
          CXX: ccache cl
          CMAKE_PREFIX_PATH: ${{ github.workspace }}/vcpkg_installed/x64-windows
        run: |
          reconfig=""
          [[ -d build-windows-asan/meson-info ]] && reconfig="--reconfigure"
          # debugoptimized -> /MD (from_buildtype), matching the vcpkg
          # release-CRT libs and avoiding the /MDd debug-CRT+ASan interaction.
          meson setup $reconfig build-windows-asan \
            --buildtype=debugoptimized \
            -Dcmake_prefix_path="$GITHUB_WORKSPACE/vcpkg_installed/x64-windows" \
            -Dbuild_server=false \
            -Dbuild_tests=true \
            -Db_sanitize=address \
            -Dcpp_args="-D_DISABLE_STRING_ANNOTATION -D_DISABLE_VECTOR_ANNOTATION"

      - name: Build
        run: meson compile -C build-windows-asan tests/yuzu_agent_tests -j "$YUZU_BUILD_JOBS"

      - name: Test
        # #4018/#2373: sibling-aligned with every other sanitizer leg (Linux
        # asan/tsan/coverage, sanitizer-tests.yml, the macOS ci.yml leg all carry
        # --timeout-multiplier 2 already) and joins ci.yml's Windows with-test-slot.sh
        # gate (this leg previously ran ungated on the shared 4-runner Wee Tam box).
        # YUZU_TEST_PROGRESS_FILE is an ABSOLUTE path deliberately: meson's default
        # test workdir is the build directory itself (verified against meson's own
        # source), so a bare "build-windows-asan/meson-logs/..." value would resolve
        # relative to a cwd that's already build-windows-asan and double-prefix.
        id: test
        env:
          YUZU_TEST_SLOT_TIMEOUT_MIN: "30"
        run: |
          export PATH="$GITHUB_WORKSPACE/vcpkg_installed/x64-windows/bin:$PATH"
          export YUZU_TEST_PROGRESS=1
          export YUZU_TEST_PROGRESS_FILE="$GITHUB_WORKSPACE/build-windows-asan/meson-logs/progress.log"
          mkdir -p "$(dirname "$YUZU_TEST_PROGRESS_FILE")"
          rm -f "$YUZU_TEST_PROGRESS_FILE"
          bash scripts/ci/with-test-slot.sh 2 -- \
            meson test -C build-windows-asan --suite agent --timeout-multiplier 2 --print-errorlogs

      - name: Process snapshot (on Test stall/cancel)
        # #4018 Gate-4 ask: a process inventory captured as soon as possible after a
        # stall or cancel, so a future recurrence's contention theory can be checked
        # against evidence instead of staying a guess. Runs after meson's own kill (or
        # the job-level cancel) has already happened, not "before teardown" - it
        # inspects co-tenant processes on the box, not the killed process itself.
        #
        # BOTH clauses are required, exactly per the TSan job's gdb-capture step
        # above (#1038): a bare `steps.test.outcome == ...` has no status-check
        # function, so GitHub ANDs an implicit success() onto it - unsatisfiable
        # the moment Test fails, making the step permanently unreachable dead
        # code (this exact mistake shipped here once already in this PR's own
        # governance round and was caught by build-ci's Gate 8 re-verify).
        # `failure() || cancelled()` restores reachability; the outcome check
        # stays as the inner clause so an unrelated Configure/Build/vcpkg
        # failure earlier in this job doesn't trigger an irrelevant process dump.
        if: (failure() || cancelled()) && (steps.test.outcome == 'failure' || steps.test.outcome == 'cancelled')
        # `tasklist /v` shows PID/session/user/CPU/window-title, not command lines -
        # it will list every process on this SYSTEM-identity, 4-runner-shared box
        # (CLAUDE.md's standing single-identity invariant), which lands in this
        # repo's public run log. No new confidentiality issue - equivalent to the
        # box's existing routine CI-log visibility - but worth this acknowledgment
        # given that shared-identity posture is treated as significant elsewhere.
        run: tasklist //v

      - name: ccache stats
        if: always()
        run: ccache -s

      - name: Upload meson testlog (on failure/cancel; always on a windows-asan-only dispatch)
        # cancelled() matters for #4018: a 90-minute job-level timeout is a CANCEL,
        # not a failure, and that's exactly when the progress log matters most.
        # The always() half separately lets a `jobs=windows-asan` recurrence
        # dispatch record a clean run's timings, not only a failing/cancelled one.
        if: failure() || cancelled() || (always() && inputs.jobs == 'windows-asan')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: meson-testlog-windows-asan
          path: |
            build-windows-asan/meson-logs/testlog.txt
            build-windows-asan/meson-logs/testlog.junit.xml
            build-windows-asan/meson-logs/progress.log
          retention-days: 14
          if-no-files-found: warn

  # ── Coverage (gcov + gcovr) ────────────────────────────────────────────
  coverage:
    name: "Coverage (GCC 15)"
    needs: [preflight]
    if: needs.preflight.outputs.bigtam_pool_healthy == 'true' && inputs.jobs != 'windows-asan'
    # Pinned to the Big Tam pool. Was the generic [self-hosted, Linux, X64]
    # pool, but that spans both Shulgi (24.04/gcc-13) and Big Tam
    # (26.04/gcc-15); a gcc-15 coverage build can only run on Big Tam, so
    # pin it there rather than risk landing on a gcc-13 host.
    runs-on: [self-hosted, Linux, X64, yuzu-bigtam-linux]
    timeout-minutes: 60
    env:
      # Shared 4-runner Big Tam host: harmless gateway-eunit default-cookie
      # defence (matches ci.yml's linux leg).
      YUZU_GW_ALLOW_DEFAULT_COOKIE: "1"

    steps:
      - name: Wipe build-linux-coverage/ on branch switch (pre-checkout)
        run: |
          incoming="${GITHUB_REF#refs/heads/}"
          if [[ -d "$GITHUB_WORKSPACE/.git" ]]; then
            current=$(git -C "$GITHUB_WORKSPACE" rev-parse --abbrev-ref HEAD 2>/dev/null || echo "")
            if [[ -n "$current" && "$current" != "HEAD" && "$current" != "$incoming" ]]; then
              echo "branch switch: $current -> $incoming — wiping build-linux-coverage/"
              rm -rf "$GITHUB_WORKSPACE/build-linux-coverage"
            fi
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          clean: false
          persist-credentials: false

      - name: Install system packages
        run: |
          # flock serializes apt across the 4 runners sharing the Big Tam
          # host — DPkg::Lock::Timeout does NOT cover apt-get update's lists
          # lock — reusing ci.yml's lock path so all Big Tam jobs coordinate.
          (
            flock -w 600 9 || { echo "::error::timed out waiting for apt lock"; exit 1; }
            sudo apt-get -o DPkg::Lock::Timeout=300 update
            sudo apt-get -o DPkg::Lock::Timeout=300 install -y \
              cmake ninja-build gcc-15 g++-15 \
              pkg-config curl zip unzip tar python3-pip ccache \
              bison flex libsystemd-dev libblkid-dev autoconf automake libtool
          ) 9>/tmp/yuzu-ci-apt.lock
          # requirements-ci.txt is hash-pinned (includes gcovr for the
          # coverage report).
          pip3 install --user --break-system-packages --require-hashes -r requirements-ci.txt
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # OTP + rebar3 for the gateway custom_target. Without these, this
      # job inherits whatever Erlang the self-hosted runner has globally,
      # which on the WSL2 runner has previously been older than the
      # rebar3 binary on PATH — producing BEAM-loader failures of the
      # form `op bs_add p x i u x: please re-compile this module with an
      # Erlang/OTP 28 compiler`. Pin matches ci.yml + release.yml so any
      # OTP bump moves all three workflows together.
      - name: Install Erlang/OTP and rebar3
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        env:
          ImageOS: ubuntu24
        with:
          otp-version: '28'
          rebar3-version: '3.24'

      - name: Reset ccache stats
        run: ccache -z

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          vcpkgGitCommitId: '${{ env.VCPKG_COMMIT }}'

      - name: vcpkg sentinel (x64-linux)
        run: bash scripts/ci/vcpkg-triplet-sentinel.sh x64-linux

      - name: Install vcpkg packages
        env:
          # Coverage uses x64-linux triplet — package zips identical to
          # matrix linux so we share the cache.
          VCPKG_DEFAULT_BINARY_CACHE: ${{ runner.tool_cache }}/yuzu-vcpkg-binary-cache-linux
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          ${{ github.workspace }}/vcpkg/vcpkg install \
            --triplet x64-linux \
            --x-manifest-root=${{ github.workspace }}

      - name: Configure (Meson + coverage)
        # build-linux-coverage (not build-linux) so a coverage rebuild
        # can't disturb a concurrent ci.yml matrix linux build that
        # might otherwise queue behind it on the shared self-hosted
        # runner. Distinct from PR-1's per-OS naming because coverage
        # is a sanitizer-class job, not a tier-2 matrix variant.
        env:
          CC: ccache gcc-15
          CXX: ccache g++-15
          PKG_CONFIG_PATH: ${{ github.workspace }}/vcpkg_installed/x64-linux/lib/pkgconfig
        run: |
          reconfig=""
          [[ -d build-linux-coverage/meson-info ]] && reconfig="--reconfigure"
          meson setup $reconfig build-linux-coverage \
            --native-file meson/native/linux-gcc15.ini \
            --buildtype=debug \
            -Dcmake_prefix_path=${{ github.workspace }}/vcpkg_installed/x64-linux \
            -Dbuild_tests=true \
            -Db_coverage=true

      - name: Build
        run: meson compile -C build-linux-coverage -j "$YUZU_BUILD_JOBS"

      # Postgres for server tests (ADR-0006 decision 8, #1318) — same
      # idempotent docker-container step as ci.yml's linux job.
      - name: Ensure Postgres (server tests)
        run: bash scripts/ci/ensure-postgres.sh

      - name: Test
        # --timeout-multiplier 2: see the asan Test step (#2092 shard budgets;
        # coverage instrumentation is similarly slower than plain debug).
        # YUZU_TEST_PROGRESS (governance follow-up, #4153 round 4): this leg runs the
        # full unfiltered suite including agent, but had no per-test attribution on a
        # hang - only the asan/tsan/windows-asan legs did. Same absolute-path reasoning
        # as those: meson's default test workdir is the build directory itself.
        run: |
          export YUZU_TEST_PROGRESS=1
          export YUZU_TEST_PROGRESS_FILE="$GITHUB_WORKSPACE/build-linux-coverage/meson-logs/progress.log"
          mkdir -p "$(dirname "$YUZU_TEST_PROGRESS_FILE")"
          rm -f "$YUZU_TEST_PROGRESS_FILE"
          meson test -C build-linux-coverage --timeout-multiplier 2 --print-errorlogs

      - name: Generate coverage reports
        run: |
          # --gcov-ignore-parse-errors=negative_hits.warn: tests/unit/test_metrics_perf.cpp
          # runs hot concurrent writer loops that cause gcov's branch counters to race into
          # negative values. gcovr's own error message suggests this flag.
          gcovr --root . \
            --filter 'server/' --filter 'agents/' --filter 'sdk/' --filter 'tests/' \
            --exclude '.*\.pb\.(h|cc)$' \
            --branches \
            --gcov-ignore-parse-errors=negative_hits.warn \
            --xml -o build-linux-coverage/coverage.xml
          mkdir -p build-linux-coverage/coverage-html
          gcovr --root . \
            --filter 'server/' --filter 'agents/' --filter 'sdk/' --filter 'tests/' \
            --exclude '.*\.pb\.(h|cc)$' \
            --branches \
            --gcov-ignore-parse-errors=negative_hits.warn \
            --html --html-details -o build-linux-coverage/coverage-html/index.html

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: build-linux-coverage/coverage.xml
          fail_ci_if_error: false

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: build-linux-coverage/coverage-html/

      - name: Upload meson testlog (on failure or cancel)
        # Supersedes the leg's prior bare `if: failure()` testlog upload (adversarial-
        # review finding, #4153): that step had no progress.log and, on a duplicate
        # `meson-testlog-coverage` name, would have collided with this one and failed
        # on every red run - deleted rather than kept alongside this one. `|| cancelled()`:
        # see the same line's comment on the asan leg - a stall here rides the JOB's own
        # timeout, reported as CANCELLED not FAILED, which the deleted step never covered.
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: meson-testlog-coverage
          path: |
            build-linux-coverage/meson-logs/testlog.txt
            build-linux-coverage/meson-logs/testlog.junit.xml
            build-linux-coverage/meson-logs/progress.log
          retention-days: 14
          if-no-files-found: warn

      - name: ccache stats
        if: always()
        run: ccache -s

  # ── Alert on nightly failure ───────────────────────────────────────────
  # Opens or comments on the `nightly-broken` issue if any of the four
  # jobs above failed. The discipline rule is "no merge to main while
  # `nightly-broken` is open." Mirrors runner-inventory-sentinel.yml's
  # issue-creation pattern.
  alert:
    name: "Open nightly-broken on failure"
    needs: [preflight, sanitize-asan, sanitize-tsan, windows-asan, coverage]
    # `always()` alone also runs after cancellation, which must not create a
    # repository-wide merge block. Retain failure handling for preflight.
    if: ${{ !cancelled() && inputs.jobs != 'windows-asan' && (failure() || needs.preflight.result == 'failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update nightly-broken issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REF_NAME: ${{ github.ref_name }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          PREFLIGHT_FAILURE_KIND: ${{ needs.preflight.outputs.failure_kind }}
          PREFLIGHT_FAILURE_REPORT: ${{ needs.preflight.outputs.failure_report }}
        with:
          script: |
            const label = 'nightly-broken';
            const failedJobs = [];
            const ctx = JSON.parse(process.env.NEEDS_JSON);
            for (const [name, job] of Object.entries(ctx)) {
              if (job.result === 'failure') failedJobs.push(name);
            }
            const summary = failedJobs.length
              ? failedJobs.join(', ')
              : 'unknown (alert fired without specific job failures)';
            const preflightDetail = process.env.PREFLIGHT_FAILURE_REPORT
              ? [
                  `**Preflight failure:** \`${process.env.PREFLIGHT_FAILURE_KIND || 'unknown'}\``,
                  process.env.PREFLIGHT_FAILURE_REPORT,
                  ``,
                ]
              : [];
            const runUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            const sha = '${{ github.sha }}';
            const refName = process.env.REF_NAME;
            const body = [
              `Nightly run failed on \`${refName}\` @ \`${sha.substring(0, 7)}\`.`,
              ``,
              `**Failed jobs:** ${summary}`,
              ``,
              ...preflightDetail,
              `**Run:** ${runUrl}`,
              ``,
              `**Discipline:** no merge to main while this issue is open.`,
              ``,
              `(auto-posted by .github/workflows/nightly.yml — close after a green nightly.)`,
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: label,
              state: 'open',
              per_page: 5,
            });

            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
              core.notice(`Commented on existing nightly-broken issue #${existing.data[0].number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Nightly broken: ${summary}`,
                labels: [label],
                body,
              });
              core.notice(`Opened nightly-broken issue #${created.data.number}`);
            }

  # ── Close nightly-broken on full green ─────────────────────────────────
  # Symmetric counterpart to the `alert:` job above. Closes any open
  # `nightly-broken` issue when all four nightly jobs (asan, tsan,
  # windows-asan, coverage) succeed, so the discipline rule "no merge to
  # main while nightly-broken is open" naturally clears as soon as the next
  # green nightly lands.
  # Iterates over all matching open issues, not just the first, so a stale
  # duplicate from any prior bug doesn't linger.
  close-on-green:
    name: "Close nightly-broken on green"
    needs: [preflight, sanitize-asan, sanitize-tsan, windows-asan, coverage]
    if: success() && inputs.jobs != 'windows-asan'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Close any open nightly-broken issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REF_NAME: ${{ github.ref_name }}
        with:
          script: |
            const label = 'nightly-broken';
            const runUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            const sha = '${{ github.sha }}';
            const refName = process.env.REF_NAME;
            const body = [
              `Nightly run on \`${refName}\` @ \`${sha.substring(0, 7)}\` is **fully green**.`,
              ``,
              `**Run:** ${runUrl}`,
              ``,
              `Closing this issue automatically. The "no merge to main" discipline rule clears.`,
              ``,
              `(auto-closed by .github/workflows/nightly.yml — re-opened automatically by the alert job if a future nightly fails.)`,
            ].join('\n');

            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: label,
              state: 'open',
              per_page: 100,
            });

            if (open.data.length === 0) {
              core.notice('No open nightly-broken issues to close.');
              return;
            }

            for (const issue of open.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
              });
              core.notice(`Closed nightly-broken issue #${issue.number}`);
            }
