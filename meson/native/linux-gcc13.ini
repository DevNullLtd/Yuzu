# Meson native file: Linux, C++23 only, compiler chosen by CC/CXX
# Usage: meson setup builddir --native-file meson/native/linux-gcc13.ini
# NOTE: Set CC/CXX env vars to control compiler selection (e.g. CC='ccache gcc-15')
#
# The name is historical: this file was written for the GCC 13 CI legs, which
# are gone. It pins nothing but cpp_std — no [binaries], no linker override —
# which is why the RHEL 9 recipe (scripts/setup-rhel9.sh, gcc-toolset-15) and
# scripts/test/coverage-gate.sh use it: they need GCC 15 without mold. GCC 13
# and 14 are below the supported compiler floor (GCC 15, #5929; see
# docs/build-guide.md "Compiler floor"); pointing CC/CXX at them through this
# file builds an unsupported, untested configuration. On a host with mold, prefer
# linux-gcc15.ini, which is what CI and the shipped images use.

[built-in options]
cpp_std = 'c++23'
