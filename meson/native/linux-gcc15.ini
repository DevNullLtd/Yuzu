# Meson native file: Linux x64 with GCC 15
# Usage: meson setup builddir --native-file meson/native/linux-gcc15.ini
# NOTE: Set CC/CXX env vars to control compiler selection (e.g. CC='ccache gcc-15')
#
# GCC 15 is the default toolchain on Ubuntu 26.04 (Resolute) and the supported
# compiler floor (#5929). This native file is the live Ubuntu-26.04 Linux
# toolchain: the Big Tam self-hosted legs of ci.yml / nightly.yml / release.yml,
# the GitHub-hosted ubuntu-26.04 workflow canary and fork-review job, and the
# builder stages of the shipped Dockerfile.{server,agent}[.chisel] images.
# linux-gcc13.ini (cpp_std only, no mold) remains for hosts without mold.

[built-in options]
cpp_std = 'c++23'
# Link with mold (`apt install mold`) — large cut in link time on the big
# yuzu-server / yuzu-agent binaries and the release LTO link. REQUIRES mold on
# every host that uses this file (the Big Tam pool, the hosted canary and
# fork-review jobs, and the Docker builder stages all install it); GCC >= 12.1
# supports -fuse-ld=mold natively.
c_link_args = ['-fuse-ld=mold']
cpp_link_args = ['-fuse-ld=mold']
