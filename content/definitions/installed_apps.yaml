## Installed Applications Definitions
## Inventories and queries installed applications across all platforms.
## Plugin: installed_apps | Actions: list, query
##
## Sources by platform:
##   Windows: Registry Uninstall keys (64-bit, 32-bit WoW64, current user)
##   Linux:   dpkg-query, rpm, or pacman (auto-detected)
##   macOS:   system_profiler SPApplicationsDataType
##
## The `list` action carries six columns: name, version, publisher,
## install_date, install_location, bundle_id. install_location is the
## Uninstall-key InstallLocation on Windows and the location system_profiler
## reports (normally the .app bundle) on macOS ("-" on Linux by design);
## bundle_id is the macOS CFBundleIdentifier ("-" elsewhere).

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: crossplatform.software.inventory
  displayName: List Installed Applications
  version: 1.1.0
  description: >
    Enumerates all installed applications on the endpoint. On Windows,
    reads the registry Uninstall keys (64-bit HKLM, 32-bit WoW64, and
    HKCU), and deduplicates by name+version (the `SystemComponent` filter
    is inert today -- the value is a REG_DWORD the string reader rejects --
    and is a tracked follow-up).
    The HKCU read is the AGENT SERVICE ACCOUNT's own hive, not a
    logged-in user's: the agent runs as a system-context service
    (LocalSystem today, see #1442), so HKCU resolves to that account's
    profile and carries no end-user applications. This is deliberate
    machine scope, not a gap -- per-user applications are a separate
    action (list_per_user) that this one never invokes.
    On Linux, auto-detects the package manager (dpkg, rpm, or pacman).
    On macOS, queries system_profiler for GUI applications. Returns
    application name, version, publisher, install date, install location,
    and (macOS) bundle identifier. Rows are seven escape-aware tokens (every
    field: `\` to `/`, `|` to `\|`, CR/LF to a space, over 4 KiB cut); split
    on an unescaped `|`. The dashboard results table shows this definition's
    rows as key/value (app plus one remainder cell); read the six columns
    positionally from the raw output on the REST/MCP response routes. Agents
    older than plugin 1.2.0 emit five tokens and do NOT escape `|` in name,
    version, publisher or install date, so such a row can split into any
    count: accept a row only when it has exactly 5 or exactly 7 tokens under
    the escape-aware split, reject any other count, and read the sixth and
    seventh columns only for agents known to run plugin 1.2.0 or later.
  tags: [software, inventory, compliance]

spec:
  type: question
  platforms: [windows, linux, darwin]

  execution:
    plugin: installed_apps
    action: list
    concurrency: per-device

  parameters:
    type: object
    properties: {}

  result:
    columns:
      - name: name
        type: string
        description: "The application's display name as read from the OS-native registry or package database. Values: free text."
        example: "7-Zip 26.02 (x64)"
        platforms: [windows, linux, darwin]
      - name: version
        type: string
        description: 'The installed version string, or "-" when the source reports none. Values: free text or "-".'
        example: "26.02"
        platforms: [windows, linux, darwin]
      - name: publisher
        type: string
        description: "The vendor or maintainer name; always \"-\" on macOS, since system_profiler's mini detail carries no publisher field. Values: free text or \"-\"."
        example: "Igor Pavlov"
        platforms: [windows, linux]
      - name: install_date
        type: string
        description: "Install date in the OS's native format (Windows registry InstallDate, rpm's formatted install time); \"-\" when the source reports none, which dpkg-based Linux hosts always do. Values: free text or \"-\"."
        example: "20260617"
        platforms: [windows, darwin]
      - name: install_location
        type: string
        description: "Where the application lives on disk, as the OS reports it. Windows: the Uninstall key's InstallLocation value, returned raw — a REG_EXPAND_SZ value such as %ProgramFiles%\\Vendor is NOT expanded — or \"-\" when the value is absent (many MSI-registered products, SDK/runtime component packages and NSIS/portable installers write none — 182 of 241 rows on one developer workstation), longer than 511 characters, not a string type, or a per-user install (this action is machine scope). Where the same product is registered in more than one hive the smallest populated value wins. Unlike windows.software.msi.list, separators are \"/\": backslashes are emitted as \"/\" (a UNC path reads //srv/share; not reversible), so C:\\Program Files\\7-Zip\\ reads C:/Program Files/7-Zip/. macOS: the location system_profiler reports, normally the .app bundle path and occasionally a non-bundle directory; this can lie under a user's home (/Users/<account>/...). Always \"-\" on Linux by design: a package installs files to many prefixes, so there is no single install location. Values: path or \"-\". The value is as reported by the OS: untrusted and non-canonical."
        example: "C:/Program Files/7-Zip/"
        platforms: [windows, darwin]
      - name: bundle_id
        type: string
        description: "The macOS CFBundleIdentifier read in-process from the bundle at install_location (reverse-DNS form). Always \"-\" on Windows and Linux, which have no bundle identifier concept; \"-\" on macOS when the location is not a bundle or carries no identifier, and for rows beyond the per-run enrichment cap (5000 applications / 120 s), which is not reported as degraded. The value is as reported by the OS: untrusted, as reported by the local bundle — a local user can plant a bundle whose identifier is any string. Values: bundle identifier or \"-\"."
        example: "com.apple.ActivityMonitor"
        platforms: [darwin]
    aggregation:
      groupBy:
        - name
      operations:
        - count

  readablePayload: "List all installed applications"

  gather:
    ttlSeconds: 300

  approval:
    mode: auto

  permissions:
    executeRoles: [endpoint-admin, endpoint-operator]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 1.0.0
    requiredPlugins: [installed_apps]

status:
  phase: active

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: crossplatform.software.query
  displayName: Query Installed Application
  version: 1.0.0
  description: >
    Searches for a specific installed application by case-insensitive
    partial name match. Returns a found/not-found indicator followed
    by matching application records. Useful for compliance checks
    (e.g. verifying a required security agent is installed) and
    license auditing.
  tags: [software, compliance, diagnostics]

spec:
  type: question
  platforms: [windows, linux, darwin]

  execution:
    plugin: installed_apps
    action: query
    concurrency: per-device

  parameters:
    type: object
    required: [name]
    properties:
      name:
        type: string
        displayName: Application Name
        description: >
          Case-insensitive substring to match against installed
          application names. All apps whose name contains this
          string are returned.
        validation:
          minLength: 1
          maxLength: 256

  result:
    columns:
      - name: found
        type: bool
        description: 'Whether at least one installed application matched the search string. Values: true, false.'
        example: "true"
        platforms: [windows, linux, darwin]
      - name: name
        type: string
        description: "The matching application's display name. Values: free text."
        example: "Microsoft Edge"
        platforms: [windows, linux, darwin]
      - name: version
        type: string
        description: "The matching application's installed version string, or \"-\" when the source reports none. Values: free text or \"-\"."
        example: "152.0.4191.66"
        platforms: [windows, linux, darwin]
      - name: publisher
        type: string
        description: "The vendor or maintainer name; always \"-\" on macOS, since system_profiler's mini detail carries no publisher field. Values: free text or \"-\"."
        example: "Microsoft Corporation"
        platforms: [windows, linux]
    aggregation:
      groupBy:
        - found
      operations:
        - count

  readablePayload: "Query installed applications matching '${name}'"

  gather:
    ttlSeconds: 300

  approval:
    mode: auto

  permissions:
    executeRoles: [endpoint-admin, endpoint-operator]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 1.0.0
    requiredPlugins: [installed_apps]

status:
  phase: active

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: crossplatform.software.per_user_inventory
  displayName: Per-User Installed Applications
  version: 1.0.0
  description: >
    Enumerates installed applications on a per-user basis. On Windows,
    iterates user profiles and reads each user's
    Software\Microsoft\Windows\CurrentVersion\Uninstall -- from the LIVE
    HKEY_USERS\<SID> hive when that user is logged in, falling back to an
    offline mount of their NTUSER.DAT only when it is not loaded.
    On Linux, reports system-wide packages (dpkg/rpm). On macOS, reports
    system apps plus per-user Homebrew packages. Output includes the
    username (or "system") alongside each application record.
  tags: [software, inventory, per-user, compliance]

spec:
  type: question
  platforms: [windows, linux, darwin]

  execution:
    plugin: installed_apps
    action: list_per_user
    concurrency: per-device

  parameters:
    type: object
    properties: {}

  result:
    columns:
      - name: username
        type: string
        description: 'The resolved local profile name on Windows (never the SID), the literal "system" for the machine-scope Linux/macOS leg, or "brew" for macOS per-user Homebrew formulae. Values: profile name, "system", "brew", or "-".'
        example: "jsmith"
        platforms: [windows, linux, darwin]
      - name: name
        type: string
        description: "The application's display name. Values: free text."
        example: "Signal 8.18.0"
        platforms: [windows, linux, darwin]
      - name: version
        type: string
        description: 'The installed version string, or "-" when the source reports none. Values: free text or "-".'
        example: "8.18.0"
        platforms: [windows, linux, darwin]
      - name: publisher
        type: string
        description: 'The vendor or maintainer name; always "-" on macOS and for Homebrew rows. Values: free text or "-".'
        example: "Signal Messenger, LLC"
        platforms: [windows, linux]
      - name: install_date
        type: string
        description: "Install date in the OS's native format; \"-\" when the source reports none, which dpkg-based Linux hosts and Homebrew rows always do. Values: free text or \"-\"."
        example: "20260714"
        platforms: [windows, darwin]
    aggregation:
      groupBy:
        - username
        - name
      operations:
        - count

  readablePayload: "List installed applications per user"

  gather:
    ttlSeconds: 600

  approval:
    mode: role-gated

  permissions:
    executeRoles: [endpoint-admin]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 1.0.0
    requiredPlugins: [installed_apps]

status:
  phase: active
