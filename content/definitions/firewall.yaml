---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: security.firewall.quarantine_allow
  displayName: Modify Quarantine Allow List
  version: 1.0.0
  description: >
    Add or remove exceptions on an active quarantine without releasing or
    re-applying it: a new generation is applied and the old one removed last,
    so an update only tightens in between. Refuses (not_active) when no
    containment is in force. Loopback, the control channel, resolvers and DHCP
    can never be removed. The server's stored whitelist is not updated by this
    action.
  tags: [security, quarantine, incident-response, network]

spec:
  type: action
  platforms: [windows, linux, darwin]

  execution:
    plugin: firewall
    action: quarantine_allow
    concurrency: per-device

  parameters:
    type: object
    required: [op, exceptions]
    properties:
      op:
        type: string
        displayName: Operation
        description: Whether to add or remove the listed exceptions.
        validation:
          enum: ["add", "remove"]
      exceptions:
        type: string
        displayName: Exceptions
        description: >
          Comma-separated exceptions, each addr[/prefix][:port][/tcp|udp][/in|out].

  result:
    columns:
      - name: row
        type: string
        description: >-
          The row key. `status` carries the verdict (active, active_unproven,
          inactive, partial, degraded, refused, busy, or rolled_back, update_failed
          where the action can end that way) and, after a second pipe, a reason token
          where there is one; `verify` carries the proof of the block (control channel
          and probe target); `allow` rows list what stays reachable; `note` rows carry
          a key=value detail, among them `ttl_expires` (the time limit, epoch seconds)
          and `probe_target` when one is stored. The server clamps this plugin to two
          fields, so everything after the key lands in the value column.
        values: [status, verify, allow, rolled_back, refused, note]
        example: status
        platforms: [windows, linux, darwin]
      - name: value
        type: string
        description: >-
          The remainder of the row after the key. For a `status` row: the verdict
          token, optionally followed by `|` and a reason token (for example
          `active_unproven`, `inactive`, `refused|privilege_unavailable`).
        example: inactive
        platforms: [windows, linux, darwin]

  readablePayload: "Quarantine allow list: ${op} ${exceptions}"

  gather:
    ttlSeconds: 120

  approval:
    mode: role-gated

  permissions:
    executeRoles: [endpoint-admin, security-admin]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 0.1.0
    requiredPlugins: [firewall]

status:
  phase: active
