## Firewall Status, Rules and Device Containment Definitions
## Queries firewall state, enumerates rules, and contains or releases a device
## across platforms.
## Plugin: firewall | Actions: state, rules, quarantine, release,
## quarantine_status, quarantine_allow
##
## Sources by platform (see agents/plugins/firewall/README.md):
##   Windows: INetFwPolicy2 COM (Domain/Private/Public profiles; INetFwRules
##            enumeration for rules)
##   Linux:   firewalld (sd-bus), else nftables (netlink), else the root
##            snapshot broker, else ufw, else iptables (auto-detected in
##            that order)
##   macOS:   state: Application Firewall (socketfilterfw) primary, pf (pfctl)
##            secondary, plus pf anchors/rule count (pfctl, root-only);
##            rules: per-app allow/block list (socketfilterfw --listapps,
##            unprivileged), pf rule lines (pfctl), plus the same pf
##            anchors/rule count

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: security.firewall.state
  displayName: Firewall State
  version: 1.1.0
  description: >
    Query the firewall state on the endpoint. On Windows, reports the
    enabled/disabled status of each Windows Firewall profile (Domain,
    Private, Public). On Linux, auto-detects the active firewall backend
    (firewalld, nftables, ufw or iptables) and reports its state; a firewalld
    whose service list could not be read completely is held behind the
    nftables and snapshot reads and answers (state|running, ruleset|unknown)
    only when none of them shows an active ruleset; on the
    packaged unit, which cannot read nftables or iptables itself, the nftables
    and legacy iptables state is read through the root-owned snapshot socket
    (error|snapshot:<token> when that read fails; on a host the installer
    provisioned, the root helper's snapshot word through sudo, with
    error|snapshot:helper:<token> when that run fails). On macOS, reports
    the Application Firewall global state (socketfilterfw --getglobalstate)
    as the primary signal — with a mode row when block-all is set — and the
    pf packet filter state as a secondary pf row, plus the pf anchor list and
    rule count (each read runs through the installer's exact read-only sudo
    line, or directly as root; unknown/empty without either); unreadable checks report
    unknown, never a false-safe value, and a macOS read that did not complete is
    named by an error row (error|appfirewall:globalstate:<token>,
    error|pf:info:<token>, error|pf:anchors:<token>, error|pf:rules:<token>);
    a read that completed but whose text is not recognised reads unknown with
    no error row.
    On Linux, an nftables probe whose dumps disagree on the ruleset generation,
    or whose chain or rule dump tears, is read once more (when 2 seconds of
    its budget remain) before it is distrusted (fallthrough|nftables:generation:changed),
    a ruleset that keeps changing reads torn_persistent, and ufw or iptables
    output that is not in the expected shape reads unknown with
    error|ufw:unrecognised_output or error|iptables:unrecognised_output.
    A snapshot section that was not read (failed, absent, or not in a shape
    the parser knows) reads unknown unless another section shows content
    (error|nftables:snapshot:failed, error|nftables:snapshot:absent,
    error|nftables:unrecognised_output, error|iptables:snapshot:failed,
    error|iptables:snapshot:absent, error|iptables:unrecognised_output,
    error|ip6tables:snapshot:failed, error|ip6tables:snapshot:absent or
    error|ip6tables:unrecognised_output). Through the snapshot socket or
    helper, inactive is answered only when all three sections (nftables,
    legacy iptables, legacy ip6tables) were read and none shows content, in two
    snapshots taken one after the other; a rule count is written whenever all
    three sections of the answering snapshot were read and the netlink read did
    not turn the state to unknown.
  tags: [security, firewall, compliance, network]

spec:
  type: question
  platforms: [windows, linux, darwin]

  execution:
    plugin: firewall
    action: state
    concurrency: per-device

  parameters:
    type: object
    properties: {}

  result:
    columns:
      - name: profile_or_backend
        type: string
        description: >-
          Row key. Windows: "profile" rows carry the profile name in the next
          field (Domain, Private, Public). Linux and macOS: "backend", "state",
          "mode" and "pf" rows, one key each. Linux additionally emits "error"
          rows (a refused or fd-exhausted backend read), "fallthrough" rows (the
          nftables leg handing off to the next backend after a dump failure),
          and "ruleset" rows (the rule count, or unknown when that count could
          not be trusted). macOS additionally emits "anchor" rows (one pf
          anchor name each, root-only) and its own "ruleset" row (the pf rule
          count, or unknown when the read was refused or incomplete). macOS
          "error" rows name the read that did not complete, right after the
          row it explains.
        values: [profile, backend, state, mode, pf, anchor, error, fallthrough, ruleset]
        example: profile
      - name: state
        type: string
        description: >-
          The remainder of the row after the key (the server clamps this plugin
          to two fields). Windows "profile" rows: the profile name (Domain,
          Private, Public), then its state (enabled, disabled, unknown or
          error:<hresult>). Linux "state" rows: running (firewalld), active, inactive or
          unknown. macOS "state" rows: enabled, disabled or unknown; "pf" rows
          the same; "mode" row is block_all; "anchor" rows carry one pf anchor
          name each (needs root or the installer's sudo grant, omitted when the
          read is refused or incomplete). "backend" rows name the backend (appfirewall,
          firewalld, nftables, ufw, iptables, none). "ruleset" rows carry the
          rule count as an integer, or unknown whenever the backend's read
          was incomplete or refused rather than a fabricated 0 — on Linux
          this is the nftables/ufw/iptables rule count; on macOS it is the pf
          rule count (needs root or the installer's sudo grant). Linux "error" rows:
          nftables:<table|chain|rule>:<eperm|timeout|foreign_flood|...> for a
          refused/failed dump, nftables:generation:<changed|torn_persistent>
          when clean dumps disagreed on the ruleset generation, or
          fd_exhausted for EMFILE/ENFILE on the nftables socket, or ufw:unrecognised_output / iptables:unrecognised_output
          for output that finished but is not in the expected shape; snapshot:<token> when the snapshot
          could not be read (connect:eacces, connect:refused, connect:busy, connect:errno:<n>, peer_not_root, timeout,
          io_error or oversized from the root socket; empty, truncated or malformed from either transport; gone when
          the second snapshot of a read found neither the socket nor a usable helper); snapshot:helper:<token> when the
          root helper's snapshot word run through sudo timed out, was clipped, was refused or failed
          (not_run, timeout, truncated, exit:<n>);
          nftables:snapshot:failed, nftables:snapshot:absent, nftables:unrecognised_output, iptables:snapshot:failed,
          iptables:snapshot:absent, iptables:unrecognised_output, ip6tables:snapshot:failed,
          ip6tables:snapshot:absent or ip6tables:unrecognised_output for a snapshot section that was not read.
          macOS
          "error" rows: appfirewall:globalstate:<token> or
          pf:<info|anchors|rules>:<token>, where the token is not_run,
          timeout, truncated or exit:<n>. Linux "fallthrough" rows:
          nftables:<chain|rule|generation>:<reason>, one row for each dump
          that failed, written when the leg hands off to the next backend
          (the reason is torn_persistent when churn ended three probes in a
          row; generation:changed means the dumps disagreed on the ruleset
          generation after the one re-run saw it again, or at once when
          under 2 seconds of the budget remained).
        example: enabled
    aggregation:
      groupBy: [state]
      operations: [count]

  visualization:
    # firewall is a key|value-schema plugin — `result_parsing.hpp` clamps
    # each row to two fields. The `state` action emits rows whose value
    # is itself pipe-delimited (`Domain|enabled`, `Private|enabled`, …)
    # but the engine sees it as one opaque string. Filtering to the
    # `profile` rows and labelling by the value string gives a fleet
    # pie of "which (profile, state) tuples do we have, by device
    # count". Splitting the value into its own (profile, state) axes
    # for a true multi-series column chart needs the value-substring
    # engine extension tracked under issue #626.
    type: pie
    processor: single_series
    title: Firewall profile state across the fleet
    whereField: 0
    whereEquals: profile
    labelField: 1
    valueLabel: Devices

  readablePayload: "Query firewall state"

  gather:
    ttlSeconds: 120

  approval:
    mode: auto

  permissions:
    executeRoles: [endpoint-admin, endpoint-operator, security-admin]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 0.1.0
    requiredPlugins: [firewall]

status:
  phase: active

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: security.firewall.rules
  displayName: List Firewall Rules
  version: 1.0.0
  description: >
    List firewall rules on the endpoint. On Windows, enumerates the
    Windows Firewall rule set through the INetFwPolicy2 COM interface
    (capped at 100 rules, with a truncated marker row only when a genuine 101st rule exists)
    with rule name, enabled state, direction, action, and profile mask. On
    Linux, uses the detected backend: firewalld zones and services over
    D-Bus (only when that read was complete: a partly read firewalld is held
    and answers, with ruleset|unknown, only when no read shows an active
    ruleset), nftables chains and rule handles over netlink (or, on the packaged
    unit, the root snapshot socket's nftables listing), or the structured
    parse of ufw status numbered / iptables -S; through the snapshot socket
    every instantiated legacy iptables and ip6tables table is read together
    with the nftables ruleset (rows rule|[ip6|][<table>|]<kind>|<chain>|<spec>,
    the table written only outside the filter table). On macOS, lists the
    per-app Application Firewall allow/block decisions (socketfilterfw
    --listapps, unprivileged), the pf rules via pfctl -s rules and the
    pf anchor list (root, or the installer's exact sudo grant, is required to
    read /dev/pf; a run with neither lists no pf rows and says why with
    error|pf:... rows, but the app list still populates). On Windows, a rule
    property that could not be read is unknown in its field, never a default,
    and one error|rule_property:<rules>:0x<hresult> row says how many rules
    are affected.
  tags: [security, firewall, compliance, network, audit]

spec:
  type: question
  platforms: [windows, linux, darwin]

  execution:
    plugin: firewall
    action: rules
    concurrency: per-device

  parameters:
    type: object
    properties: {}

  result:
    columns:
      - name: rule_name
        type: string
        description: >-
          The row key, and the field after it for "rule" rows. Windows:
          "rule" rows with the rule's display name, plus a trailing
          "ruleset" row (the count of rules actually emitted this call,
          capped at 100) and "truncated" (present only past that cap). A
          field whose read failed is "unknown" (the name too), and a rule
          the enumerator returned but whose object could not be obtained is
          an all-unknown row that still counts: a rule row named unknown
          beside an error|rule_property: row is a failed read, not a rule
          called unknown.
          Linux: "rule" rows
          only — backend literal "firewalld" (then zone, "service", service
          name) or "nftables" (then family, table, chain, hook and policy —
          or "handle" and the handle number); the numbered index for ufw; the
          entry kind for iptables (policy, new_chain, append; then chain and
          rule spec), or "ip6" then that kind, chain and spec for an ip6tables
          entry read through the root snapshot socket; an entry of a legacy
          table other than filter carries the table name before the kind
          (nat, mangle, raw or security, the only other tables the parser
          admits; "ip6" then the table for IPv6). macOS: "rule" rows carry the raw pf rule line; "app"
          rows carry the per-app path and allow/block/unknown decision
          (unprivileged, from socketfilterfw --listapps); "anchor" rows carry
          one pf anchor name each; "ruleset" is the pf rule count, or unknown
          when the pf read was refused or incomplete — anchor and ruleset
          both need root or the installer's sudo grant. The server clamps the row to two fields, so the
          remainder lands in the value column.
          Every platform can also emit "error" rows for a read that did not
          complete (macOS: appfirewall:listapps:<token>, pf:anchors:<token>,
          pf:rules:<token>; Windows: rule_property:<rules>:0x<hresult>, the
          number of rules with a property that could not be read and the
          first HRESULT, written before the ruleset row; Linux:
          snapshot:<token> when the snapshot could not be read
          (connect:eacces, connect:refused, connect:busy, connect:errno:<n>,
          peer_not_root, timeout, io_error or oversized from the root socket;
          empty, truncated or malformed from either transport; gone when the
          second snapshot of a read found neither the socket nor a usable
          helper), snapshot:helper:<token> when the root helper's snapshot
          word run through sudo timed out, was clipped, was refused or failed,
          nftables:snapshot:failed, nftables:snapshot:absent,
          nftables:unrecognised_output, iptables:snapshot:failed,
          iptables:snapshot:absent, iptables:unrecognised_output,
          ip6tables:snapshot:failed, ip6tables:snapshot:absent or
          ip6tables:unrecognised_output for a snapshot section that was not
          read), and Linux emits "backend", "fallthrough" and a
          "rules" row (unknown) when no backend could answer.
        values: [rule, app, anchor, ruleset, truncated, backend, error, fallthrough, rules]
        example: Core Networking - DNS (UDP-Out)
      - name: enabled
        type: string
        description: Windows only; enabled, disabled or unknown (the read of that property failed).
        values: [enabled, disabled, unknown]
        example: enabled
        platforms: [windows]
      - name: direction
        type: string
        description: Windows only; in, out or unknown (also unknown when the read failed).
        values: [in, out, unknown]
        example: out
        platforms: [windows]
      - name: action
        type: string
        description: Windows only; allow, block or unknown (also unknown when the read failed, never block by default).
        values: [allow, block, unknown]
        example: allow
        platforms: [windows]
      - name: profiles
        type: string
        description: Windows only; the NET_FW_PROFILE_TYPE2 bitmask as an integer (1 domain, 2 private, 4 public, 2147483647 all), or unknown when the read failed.
        example: "2147483647"
        platforms: [windows]

  readablePayload: "List firewall rules"

  gather:
    ttlSeconds: 300

  approval:
    mode: auto

  permissions:
    executeRoles: [endpoint-admin, endpoint-operator, security-admin]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 0.1.0
    requiredPlugins: [firewall]

status:
  phase: active

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: security.firewall.quarantine
  displayName: Quarantine Device
  version: 1.0.0
  description: >
    Isolate the device from the network: block all inbound and outbound
    traffic except loopback, the agent's own control channel to the Yuzu server,
    DHCP, DNS to the host's configured resolvers, IPv6 neighbour discovery and
    any exceptions listed. An optional time limit ends the containment on the
    device's own clock (a host the server holds a record for is contained
    again by the server, unless it refuses the apply); an optional probe
    target proves the block. On Windows the block is a rule group plus a
    per-profile default-block; on Linux an own nftables table (iptables
    generation chain without nft); on macOS an own pf sub-anchor. Reports
    active only when the block is verified and
    active_unproven when it could not be proven. Waits up to 2s for any other
    in-flight containment change on this device. The Linux packaged unit
    refuses every containment action (privilege_unavailable). A device whose
    control endpoint is one of its own addresses (loopback included), or whose
    own addresses cannot be read, answers refused|self_host or
    refused|own_addresses_unreadable to every apply that is not a repair,
    whoever sent it, an apply to an already-contained device included, before
    the privilege check; the refusal changes nothing, so no leg is built, no
    record is stored and an existing record and its containment are left as they
    were. The token alone does not say whether the device is contained: one that
    held no containment stays uncontained and its record never confirms, one
    that was already contained stays contained (the repair and the boot
    re-apply keep it), and quarantine_status says which.
  tags: [security, quarantine, incident-response, network]

spec:
  type: action
  platforms: [windows, linux, darwin]

  execution:
    plugin: firewall
    action: quarantine
    concurrency: per-device

  parameters:
    type: object
    properties:
      exceptions:
        type: string
        displayName: Allowed Addresses
        description: >
          Comma-separated exceptions (for example DNS server, SIEM collector),
          each addr[/prefix][:port][/tcp|udp][/in|out]. At most 64 across the
          quarantine's life.
      ttl_seconds:
        type: string
        displayName: Time Limit (seconds)
        description: >
          Optional, 60 to 2592000. The containment ends by itself on the
          device's clock when it passes (the clock is not synchronised while
          contained). A device the server holds a quarantine record for is
          contained again (unless it refuses the apply): the server reads that
          end as drift and re-applies the stored allow set.
      probe_target:
        type: string
        displayName: Probe Target
        description: >
          Optional IP literal as ip:port (or [v6]:port) that answered before the
          change and must time out after it, to prove the block.

  result:
    columns:
      - name: row
        type: string
        description: >-
          The row key. `status` carries the verdict (active, active_unproven,
          inactive, partial, degraded, refused, busy, or rolled_back, update_failed
          where the action can end that way) and, after a second pipe, a reason token
          where there is one; `verify` carries the proof of the block (control channel
          and probe target); `allow` rows list what stays reachable; `note` rows carry
          a key=value detail, among them `ttl_expires` (the time limit, epoch seconds)
          and `probe_target` when one is stored. The server clamps this plugin to two
          fields, so everything after the key lands in the value column.
        values: [status, verify, allow, rolled_back, refused, note]
        example: status
        platforms: [windows, linux, darwin]
      - name: value
        type: string
        description: >-
          The remainder of the row after the key. For a `status` row: the verdict
          token, optionally followed by `|` and a reason token (for example
          `active_unproven`, `inactive`, `refused|privilege_unavailable`).
        example: inactive
        platforms: [windows, linux, darwin]

  readablePayload: >
    Quarantine device (exceptions=${exceptions}, ttl_seconds=${ttl_seconds})

  gather:
    ttlSeconds: 120

  approval:
    mode: role-gated

  permissions:
    executeRoles: [endpoint-admin, security-admin]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 0.1.0
    requiredPlugins: [firewall]

status:
  phase: active

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: security.firewall.release
  displayName: Release Device from Quarantine
  version: 1.0.0
  description: >
    Remove the device's quarantine containment and restore network access:
    the own rules are removed, the captured firewall policy is restored and
    any rule disabled for the containment is re-enabled. Reports inactive when
    nothing of ours is left and partial when a step could not be confirmed.
    Connections cut by the apply-time state flush on macOS are not restored.
    The Linux packaged unit refuses it (privilege_unavailable).
  tags: [security, quarantine, incident-response, network]

spec:
  type: action
  platforms: [windows, linux, darwin]

  execution:
    plugin: firewall
    action: release
    concurrency: per-device

  parameters:
    type: object
    properties: {}

  result:
    columns:
      - name: row
        type: string
        description: >-
          The row key. `status` carries the verdict (active, active_unproven,
          inactive, partial, degraded, refused, busy, or rolled_back, update_failed
          where the action can end that way) and, after a second pipe, a reason token
          where there is one; `verify` carries the proof of the block (control channel
          and probe target); `allow` rows list what stays reachable; `note` rows carry
          a key=value detail, among them `ttl_expires` (the time limit, epoch seconds)
          and `probe_target` when one is stored. The server clamps this plugin to two
          fields, so everything after the key lands in the value column.
        values: [status, verify, allow, rolled_back, refused, note]
        example: status
        platforms: [windows, linux, darwin]
      - name: value
        type: string
        description: >-
          The remainder of the row after the key. For a `status` row: the verdict
          token, optionally followed by `|` and a reason token (for example
          `active_unproven`, `inactive`, `refused|privilege_unavailable`).
        example: inactive
        platforms: [windows, linux, darwin]

  readablePayload: "Release device from quarantine"

  gather:
    ttlSeconds: 120

  approval:
    mode: role-gated

  permissions:
    executeRoles: [endpoint-admin, security-admin]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 0.1.0
    requiredPlugins: [firewall]

status:
  phase: active

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: security.firewall.quarantine_status
  displayName: Quarantine Status
  version: 1.0.0
  description: >
    Re-read the device's containment from its record and the live firewall
    and report the verdict (active, active_unproven, inactive, partial or
    degraded) with the allow list in force and any time limit. Always runs
    immediately, even while a containment change is in flight on the same
    device. The server confirms a quarantine and a release from this read.
  tags: [security, quarantine, diagnostics]

spec:
  type: question
  platforms: [windows, linux, darwin]

  execution:
    plugin: firewall
    action: quarantine_status
    concurrency: per-device

  parameters:
    type: object
    properties: {}

  result:
    columns:
      - name: row
        type: string
        description: >-
          The row key. `status` carries the verdict (active, active_unproven,
          inactive, partial, degraded, refused, busy, or rolled_back, update_failed
          where the action can end that way) and, after a second pipe, a reason token
          where there is one; `verify` carries the proof of the block (control channel
          and probe target); `allow` rows list what stays reachable; `note` rows carry
          a key=value detail, among them `ttl_expires` (the time limit, epoch seconds)
          and `probe_target` when one is stored. The server clamps this plugin to two
          fields, so everything after the key lands in the value column.
        values: [status, verify, allow, rolled_back, refused, note]
        example: status
        platforms: [windows, linux, darwin]
      - name: value
        type: string
        description: >-
          The remainder of the row after the key. For a `status` row: the verdict
          token, optionally followed by `|` and a reason token (for example
          `active_unproven`, `inactive`, `refused|privilege_unavailable`).
        example: inactive
        platforms: [windows, linux, darwin]

  readablePayload: "Query quarantine status"

  gather:
    ttlSeconds: 60

  approval:
    mode: auto

  permissions:
    executeRoles: [endpoint-admin, endpoint-operator, security-admin]
    authorRoles: [content-author]

