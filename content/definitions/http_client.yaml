## HTTP Client Plugin Definitions

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: agent.http_client.download
  displayName: Download File
  version: 1.0.0
  description: >
    Download a file from a URL to a local path with optional SHA256 hash verification.
  tags: [http, download, content]
spec:
  type: action
  platforms: [windows, linux, darwin]
  execution:
    plugin: http_client
    action: download
    concurrency: per-device
  parameters:
    type: object
    required: [url, path]
    properties:
      url:
        type: string
        displayName: URL
        description: HTTP or HTTPS URL to download.
      path:
        type: string
        displayName: Destination Path
        description: Local file path to save the download.
      expected_hash:
        type: string
        displayName: Expected SHA256 Hash
        description: Optional SHA256 hash (hex, case-insensitive) the downloaded body must match before anything is written. Without it the response must declare its length (Content-Length, or chunked framing) so a truncated transfer is refused.
  result:
    columns:
      - name: status
        type: string
        description: Literal "ok" on success; a failed download emits a separate error output instead of a non-ok status row.
        example: "ok"
        platforms: [windows, linux, darwin]
      - name: path
        type: string
        description: 'Absolute path the file was written to, after canonicalizing the parent directory and rejecting any ".." component. Values: absolute filesystem path.'
        example: /tmp/yuzu_capture/yuzu_capture_download.html
        platforms: [windows, linux, darwin]
      - name: size
        type: int64
        description: 'Size in bytes of the downloaded body, which is the size of the file now at the destination (the body is held in memory, verified, then written in one atomic replace). Values: non-negative integer, bytes.'
        example: 559
        platforms: [windows, linux, darwin]
      - name: hash
        type: string
        description: 'Lowercase hex SHA-256 digest of the downloaded body (the shared in-memory SHA-256, identical on every OS), the value compared with expected_hash before anything is written. Values: 64-character lowercase hex string.'
        example: ff67a9d764d6a2367a187734e697f6a53217db9a21c101d410a113ca871a299d
        platforms: [windows, linux, darwin]
  approval:
    mode: role-gated
  permissions:
    executeRoles: [endpoint-admin]
    authorRoles: [content-author]
  compatibility:
    minAgentVersion: 0.2.0
    requiredPlugins: [http_client]
status:
  phase: active

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: agent.http_client.get
  displayName: HTTP GET
  version: 1.0.0
  description: >
    Perform an HTTP GET request and return the response status and body.
  tags: [http, network]
spec:
  type: question
  platforms: [windows, linux, darwin]
  execution:
    plugin: http_client
    action: get
    concurrency: per-device
  parameters:
    type: object
    required: [url]
    properties:
      url:
        type: string
        displayName: URL
        description: HTTP or HTTPS URL to request.
  result:
    columns:
      - name: status
        type: int32
        description: 'HTTP status code returned by the GET request, or 0 if the request could not be made (invalid URL, SSRF block, or connection failure). Values: HTTP status code, or 0 on request failure.'
        example: 200
        platforms: [windows, linux, darwin]
      - name: body
        type: string
        description: 'Response body text, at most the first 1 MiB (a longer body is cut at a character boundary and a truncated row follows); NUL, LF, CR, any other control byte below 0x20 except TAB, and invalid UTF-8 bytes are replaced with ? and a constrained row reports how many. Values: free text, or an error string on failure.'
        example: '<!doctype html><html lang="en"><head><title>Example Domain</title>...'
        platforms: [windows, linux, darwin]
      - name: constrained
        type: string
        description: 'Present only when body bytes were replaced: body_bytes_replaced:<count> of NUL, LF, CR, other control bytes below 0x20 except TAB, or invalid UTF-8 bytes. Values: body_bytes_replaced:<count>.'
        example: 'body_bytes_replaced:3'
        platforms: [windows, linux, darwin]
      - name: truncated
        type: int64
        description: 'Present only when the body was cut at the cap: the cap in bytes (1048576). The status is still the peer status and the exit code is unchanged. Values: 1048576.'
        example: 1048576
        platforms: [windows, linux, darwin]
  approval:
    mode: auto
  permissions:
    executeRoles: [endpoint-admin, endpoint-operator]
    authorRoles: [content-author]
  compatibility:
    minAgentVersion: 0.2.0
    requiredPlugins: [http_client]
status:
  phase: active

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: agent.http_client.head
  displayName: HTTP HEAD
  version: 1.0.0
  description: >
    Perform an HTTP HEAD request and return the response status code and headers.
    Useful for checking file availability or size before downloading.
  tags: [http, network]
spec:
  type: question
  platforms: [windows, linux, darwin]
  execution:
    plugin: http_client
    action: head
    concurrency: per-device
  parameters:
    type: object
    required: [url]
    properties:
      url:
        type: string
        displayName: URL
        description: HTTP or HTTPS URL to request.
  result:
    columns:
      - name: status
        type: int32
        description: 'HTTP status code returned by the HEAD request, or 0 if the request could not be made (invalid URL, SSRF block, or connection failure). Values: HTTP status code, or 0 on request failure.'
        example: 200
        platforms: [windows, linux, darwin]
      - name: content_length
        type: int64
        description: "Declared here but not populated by the current head leg, which writes one combined \"headers\" field (the full raw response header block) instead of parsed content_length/content_type fields — see the plugin README's Caveats section. Values: not emitted by current code."
        example: "-"
        platforms: []
      - name: content_type
        type: string
        description: "Declared here but not populated by the current head leg, which writes one combined \"headers\" field (the full raw response header block) instead of parsed content_length/content_type fields — see the plugin README's Caveats section. Values: not emitted by current code."
        example: "-"
        platforms: []
  approval:
    mode: auto
  permissions:
    executeRoles: [endpoint-admin, endpoint-operator]
    authorRoles: [content-author]
  compatibility:
    minAgentVersion: 0.2.0
    requiredPlugins: [http_client]
status:
  phase: active
