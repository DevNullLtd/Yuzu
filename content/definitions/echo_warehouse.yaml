apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: crossplatform.echo.rollup
  displayName: "Echo: Run Aggregation"
  version: 1.0.0
  description: >
    Force an immediate rollup aggregation cycle (normally runs every 15 minutes).
    Aggregates live data into hourly, daily, and monthly summary tables and
    then permanently deletes rows older than each tier's retention limit.
    Classified Destructive/Irreversible with no approval gate: an operator
    who can dispatch it deletes history immediately and cannot undo it.
  tags: [echo, warehouse, rollup, aggregation]

spec:
  type: action
  platforms: [windows, linux, darwin]

  execution:
    plugin: echo
    action: rollup
    concurrency: per-device

  parameters:
    type: object
    properties: {}

  result:
    columns:
      - name: status
        type: string
        description: >-
          Declared as a literal status token; the plugin's actual response line is `echo|rollup|<n>|rows_aggregated` (a single positional line, not a status/rows_aggregated pair), so this column is not populated by the current wire format — see Caveats and known gaps. Values: not emitted by the current wire format.
        example: "-"
        platforms: []
      - name: rows_aggregated
        type: int32
        description: >-
          Number of rows the aggregation pass moved into the hourly/daily/monthly tiers this cycle (run_aggregation's return value); carried as the third field of the `echo|rollup|<n>|rows_aggregated` line rather than a named column. Values: non-negative integer.
        example: "-"
        platforms: [windows, linux, darwin]

  readablePayload: "Force Echo warehouse rollup aggregation"

  gather:
    ttlSeconds: 300

  approval:
    mode: auto

  permissions:
    executeRoles: [endpoint-admin]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: "0.10.0"
    requiredPlugins: [echo]

status:
  phase: active

