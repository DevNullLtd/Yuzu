## Issue #60 — daily aggregation example reading from $Process_Daily.
## Demonstrates the live-to-aggregate rollup tier shape (start_count /
## stop_count are SUM-aggregated by day_ts + name + user). The
## `datetime(day_ts, 'unixepoch')` conversion is the SQLite-native
## equivalent of competing platforms' `EPOCHTOJSON(TS)` helper.
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: crossplatform.echo.daily_process_summary
  displayName: "Echo: Daily process summary"
  version: 1.0.0
  description: >
    Per-day process activity for the last 30 days, aggregated from
    $Process_Daily. Each row is (date, process_name, user, start_count,
    stop_count). Useful for trend questions ("did $process_name run more
    often last week than the week before?") that would be O(N) over
    $Process_Live.
  tags: [echo, warehouse, processes, daily, examples]

spec:
  type: question
  platforms: [windows, linux, darwin]

  execution:
    plugin: echo
    action: sql
    concurrency: per-device

  parameters:
    type: object
    properties:
      sql:
        type: string
        default: "SELECT datetime(day_ts, 'unixepoch') AS day, name, user, start_count, stop_count FROM $Process_Daily WHERE day_ts > strftime('%s', 'now', '-30 days') ORDER BY day_ts DESC, start_count DESC LIMIT 1000"
        description: >
          The preset SQL text this canned query runs. Hidden from the
          operator UI (not editable via the dashboard); see
          metadata.description for what it returns. Edit this file to
          change the query.
        hidden: true
    required: [sql]

  result:
    columns:
      - name: output
        type: clob
        description: >-
          One line per row of the underlying query result (pipe-delimited field values, as produced by `sql`'s row loop). The base `sql` action additionally emits a leading `__schema__|<col>|<col>...` line and a trailing `__total__|<n>` line; this canned query executes through that same action and inherits the identical wire shape. Values: pipe-delimited row text, or the __schema__/__total__ marker lines.
        example: "-"
        platforms: [windows, linux, darwin]

  gather:
    ttlSeconds: 60

  approval:
    mode: auto

  permissions:
    executeRoles: [endpoint-admin, endpoint-operator]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: "0.10.0"
    requiredPlugins: [echo]

status:
  phase: active

