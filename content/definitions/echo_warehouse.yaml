## Echo Warehouse SQL Query Definitions
## Pre-built SQL queries against the Echo data warehouse tables.
## Plugin: echo | Action: sql | Uses $-prefixed table names.

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: crossplatform.echo.sql
  displayName: "Echo: SQL Query"
  version: 1.0.0
  description: >
    Execute an arbitrary SELECT query against the Echo warehouse tables on each
    targeted agent. Use $-prefixed table names ($Process_Live, $TCP_Hourly, etc.)
    which are translated to real table names on the agent. Only SELECT queries
    are permitted.
  tags: [echo, warehouse, sql, query]

spec:
  type: question
  platforms: [windows, linux, darwin]

  execution:
    plugin: echo
    action: sql
    concurrency: per-device

  parameters:
    type: object
    properties:
      sql:
        type: string
        displayName: SQL Query
        description: >
          A SELECT query using $-prefixed table names. Available tables include
          $Process_Live, $Process_Hourly, $Process_Daily, $Process_Monthly,
          $TCP_Live, $TCP_Hourly, $TCP_Daily, $TCP_Monthly,
          $Service_Live, $Service_Hourly, $User_Live, $User_Daily, and
          $ARP_Live/$ARP_Hourly and $DNS_Live/$DNS_Hourly (ADR-0015; need
          arp_enabled / dns_enabled left on; $ARP_* is collected on Windows, Linux and
          macOS (constrained), $DNS_* on Windows only today — empty elsewhere).
    required: [sql]

  result:
    columns:
      - name: output
        type: clob
        description: >-
          One line per row of the underlying query result (pipe-delimited field values, as produced by `sql`'s row loop). The base `sql` action additionally emits a leading `__schema__|<col>|<col>...` line and a trailing `__total__|<n>` line; this canned query executes through that same action and inherits the identical wire shape. Values: pipe-delimited row text, or the __schema__/__total__ marker lines.
        example: "-"
        platforms: [windows, linux, darwin]

  gather:
    ttlSeconds: 30

  approval:
    mode: auto

  permissions:
    executeRoles: [endpoint-admin, endpoint-operator]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: "0.10.0"
    requiredPlugins: [echo]

status:
  phase: active

