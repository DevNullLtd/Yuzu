## Issue #60 — ISO timestamp conversion example.
## Operators reading raw ts INTEGER columns get epoch seconds, which are
## hard to skim. SQLite's `datetime(ts, 'unixepoch')` returns a sortable
## ISO-8601 string ("2026-04-25 19:31:42"). This query is shipped as a
## copy-paste reference and as a standing example query.
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: crossplatform.echo.recent_processes_iso
  displayName: "Echo: Recent processes (ISO timestamps)"
  version: 1.0.0
  description: >
    Same as `echo.recent_processes` but emits human-readable ISO-8601
    timestamps via `datetime(ts, 'unixepoch')` instead of epoch seconds.
    Use this when piping query output to a human reader; use
    `echo.recent_processes` when piping to another tool that expects
    epoch seconds.
  tags: [echo, warehouse, processes, examples, iso]

spec:
  type: question
  platforms: [windows, linux, darwin]

  execution:
    plugin: echo
    action: sql
    concurrency: per-device

  parameters:
    type: object
    properties:
      sql:
        type: string
        default: "SELECT datetime(ts, 'unixepoch') AS event_time, action, name, pid, user FROM $Process_Live WHERE ts > strftime('%s', 'now', '-24 hours') ORDER BY ts DESC LIMIT 500"
        description: >
          The preset SQL text this canned query runs. Hidden from the
          operator UI (not editable via the dashboard); see
          metadata.description for what it returns. Edit this file to
          change the query.
        hidden: true
    required: [sql]

  result:
    columns:
      - name: output
        type: clob
        description: >-
          One line per row of the underlying query result (pipe-delimited field values, as produced by `sql`'s row loop). The base `sql` action additionally emits a leading `__schema__|<col>|<col>...` line and a trailing `__total__|<n>` line; this canned query executes through that same action and inherits the identical wire shape. Values: pipe-delimited row text, or the __schema__/__total__ marker lines.
        example: "-"
        platforms: [windows, linux, darwin]

  gather:
    ttlSeconds: 30

  approval:
    mode: auto

  permissions:
    executeRoles: [endpoint-admin, endpoint-operator]
