## Timeline Activity Record (TAR) Definitions
## Continuous system state change tracking -- processes, network, services, users.
## Plugin: tar | Actions: status, query, snapshot, export, configure, collect_fast, collect_slow, fleet_snapshot

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: crossplatform.tar.status
  displayName: TAR Status
  version: 1.0.0
  description: >
    Returns the current status of the TAR database including record count,
    oldest and newest event timestamps, database size on disk, and the
    configured retention period. Use this to verify TAR is collecting data
    and to monitor disk usage. Also reports both the configured
    network_capture_method and the network_capture_method_effective (the
    mechanism actually collecting — always polling today), so status never
    misrepresents the active capture mechanism. On the healthy path the FIRST
    line is storage_state|ok. Offline means a wedged rollback closed the TAR
    database, so collection and retention are both stopped until the agent
    restarts and every other field is withheld -- the reply is then just an
    error| line followed by storage_state|offline, and the action exits
    non-zero. The order is REVERSED on that path: error| comes FIRST, because
    server and dashboard consumers key off the output starting with error|, so
    do not assume storage_state is always the first line. Historical data
    NORMALLY stays queryable via tar sql, but only when the read-only query
    connection is itself available; the error| line states which case applies,
    so do not infer tar sql access from storage_state|offline alone.
    Reports the retention clock
    guard counters (#2361): retention_guard_declines_total and
    retention_guard_failures_total are always present, with per-table
    retention_guard|<table>|<n> and retention_guard_failed|<table>|<n> lines for
    any table with a non-zero count. Read the two totals TOGETHER - a zero
    declines total only means the endpoint's clock is behaving if the failures
    total is also zero. Scrape this across the fleet to find hosts whose clocks
    need attention; the agent has no /metrics endpoint.
  tags: [tar, timeline, monitoring, diagnostics]

spec:
  type: question
  platforms: [windows, linux, darwin]

  execution:
    plugin: tar
    action: status
    concurrency: per-device

  parameters:
    type: object
    properties: {}

  result:
    columns:
      - name: record_count
        type: int64
        description: 'Total number of TAR event rows currently stored across all warehouse tables. Values: non-negative integer.'
        example: "-"
        platforms: [windows, linux, darwin]
      - name: oldest_timestamp
        type: int64
        description: 'Unix epoch seconds of the oldest event row still retained, or 0 when the warehouse is empty. Values: epoch seconds, or 0.'
        example: "-"
        platforms: [windows, linux, darwin]
      - name: newest_timestamp
        type: int64
        description: 'Unix epoch seconds of the newest event row, or 0 when the warehouse is empty. Values: epoch seconds, or 0.'
        example: "-"
        platforms: [windows, linux, darwin]
      - name: db_size_bytes
        type: int64
        description: 'Size in bytes of tar.db on disk. Values: non-negative integer.'
        example: "-"
        platforms: [windows, linux, darwin]
      - name: retention_days
        type: int32
        description: 'Currently configured retention window in days (see configure.retention_days). Values: 1-365.'
        example: "-"
        platforms: [windows, linux, darwin]

  readablePayload: "Get TAR database status"

  gather:
    ttlSeconds: 60

  approval:
    mode: auto

  permissions:
    executeRoles: [endpoint-admin, endpoint-operator]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 0.1.0
    requiredPlugins: [tar]

status:
  phase: active

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: crossplatform.tar.query
  displayName: Query TAR Events
  version: 1.0.0
  description: >
    Queries the TAR event database for system activity records within a
    time range. Events include process starts/stops, network connections
    opened/closed, service state changes, and user logins/logouts. Results
    are pipe-delimited: timestamp|event_type|event_action|snapshot_id|detail_json.
    The detail_json field contains a JSON object with type-specific fields:

    Process events: {"pid":N, "ppid":N, "name":"...", "cmdline":"...", "user":"..."}
    Network events: {"proto":"tcp", "local_addr":"...", "local_port":N, "remote_addr":"...", "remote_host":"...", "remote_port":N, "state":"...", "pid":N}
    Service events: {"name":"...", "display_name":"...", "status":"...", "startup_type":"..."}
    User events: {"user":"...", "domain":"...", "logon_type":"...", "session_id":"..."}
  tags: [tar, timeline, query, forensics, compliance]

spec:
  type: question
  platforms: [windows, linux, darwin]

  execution:
    plugin: tar
    action: query
    concurrency: per-device

  parameters:
    type: object
    properties:
      from:
        type: string
        displayName: Start Time
        description: >
          Start of the query time range as Unix epoch seconds.
          Defaults to 0 (beginning of time).
      to:
        type: string
        displayName: End Time
        description: >
          End of the query time range as Unix epoch seconds.
          Defaults to the current time.
      type:
        type: string
        displayName: Event Type Filter
        description: >
          Filter results by event type. Valid values: process, network,
          service, user, software, arp, dns, mapdrive. software joins the default
          feed once enabled (its collection is off by default — see
          software_enabled); arp/dns/mapdrive are opt-in device-state / PII sources
          reached only by an explicit filter — they are excluded from the default
          (empty-filter) feed. mapdrive (§3.8) returns network-share mappings in
          both directions, including historical (action='historical') rows. Leave
          empty to return the core process/network/service/user/software types.
        validation:
          enum: [process, network, service, user, software, arp, dns, mapdrive, ""]
      limit:
        type: string
        displayName: Result Limit
        description: >
          Maximum number of events to return. Default 1000, max 10000.
        validation:
          pattern: "^[0-9]+$"

  result:
    columns:
      - name: timestamp
        type: int64
        description: Unix epoch seconds the event was recorded.
        example: "-"
        platforms: [windows, linux, darwin]
      - name: event_type
        type: string
        description: 'Which capture source the row came from. Values: process, network, service, user, software, arp, dns, mapdrive.'
        example: "-"
        platforms: [windows, linux, darwin]
      - name: event_action
        type: string
        description: 'The lifecycle verb for this event (e.g. started/stopped, appeared/removed, opened/closed); the vocabulary is source-specific. Values: free text, source-dependent verb.'
        example: "-"
        platforms: [windows, linux, darwin]
      - name: snapshot_id
        type: int64
        description: 'Internal id of the collection cycle that produced this row, used to correlate rows from the same tick. Values: integer.'
        example: "-"
        platforms: [windows, linux, darwin]
      - name: detail_json
        type: clob
        description: >-
          JSON object with type-specific fields (see metadata.description for the per-type shape); empty string on the default (no type filter) union branches, which project only ts/event_type/action/snapshot_id. Values: JSON object, or empty string.
        example: "-"
        platforms: [windows, linux, darwin]

  readablePayload: "Query TAR events from ${from} to ${to} type=${type}"

  gather:
    ttlSeconds: 30

  approval:
    mode: auto

  permissions:
    executeRoles: [endpoint-admin, endpoint-operator]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 0.1.0
    requiredPlugins: [tar]

status:
  phase: active

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: crossplatform.tar.snapshot
  displayName: TAR Force Snapshot
  version: 1.0.0
  description: >
    Forces an immediate full snapshot of all four TAR collectors (processes,
    network connections, services, user sessions). Computes diffs against
    the previous state and records any detected changes. Useful before
    maintenance windows or incident investigations.
  tags: [tar, timeline, snapshot, forensics]

spec:
  type: action
  platforms: [windows, linux, darwin]

  execution:
    plugin: tar
    action: snapshot
    concurrency: per-device

  parameters:
    type: object
    properties: {}

  result:
    columns:
      - name: status
        type: string
        description: >-
          Outcome token for the forced snapshot. The actual response line is `tar|snapshot|complete` when every enabled source collected cleanly, or `tar|snapshot|partial|<comma-joined source names>` when one or more sources threw an incomplete-capture error and retained their previous baseline instead of collecting. Values: complete, partial.
        example: "-"
        platforms: [windows, linux, darwin]
      - name: events_recorded
        type: int32
        description: >-
          Declared as a count of events the forced snapshot recorded; the current wire format (tar|snapshot|complete or |partial|<sources>) does not carry a numeric count, so this column is not populated — see Caveats and known gaps. Values: not emitted by the current wire format.
        example: "-"
        platforms: []

  readablePayload: "Force immediate TAR snapshot"

  gather:
    ttlSeconds: 300

  approval:
    mode: auto

  permissions:
    executeRoles: [endpoint-admin]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 0.1.0
    requiredPlugins: [tar]

status:
  phase: active

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: crossplatform.tar.export
  displayName: Export TAR Events as JSON
  version: 1.0.0
  description: >
    Exports TAR events as a JSON array for integration with external
    analytics tools (Splunk, ClickHouse, ELK). Each event object includes
    id, timestamp, event_type, event_action, snapshot_id, and a nested
    detail object with type-specific fields.
  tags: [tar, timeline, export, analytics, integration]

spec:
  type: question
  platforms: [windows, linux, darwin]

  execution:
    plugin: tar
    action: export
    concurrency: per-device

  parameters:
    type: object
    properties:
      from:
        type: string
        displayName: Start Time
        description: Start of export range as Unix epoch seconds.
      to:
        type: string
        displayName: End Time
        description: End of export range as Unix epoch seconds.
      type:
        type: string
        displayName: Event Type Filter
        description: Filter by event type (process, network, service, user, software, arp, dns, mapdrive).
      limit:
        type: string
        displayName: Result Limit
        description: Maximum events to export. Default 1000, max 10000.

  result:
    columns:
      - name: json_output
        type: clob
        description: >
          A JSON array of event objects; each carries id, timestamp,
          event_type, event_action, snapshot_id and a nested detail object
          with type-specific fields.
        example: "-"
        platforms: [windows, linux, darwin]

  readablePayload: "Export TAR events as JSON"

  gather:
    ttlSeconds: 30

  approval:
    mode: auto

  permissions:
    executeRoles: [endpoint-admin, endpoint-operator]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 0.1.0
    requiredPlugins: [tar]

status:
  phase: active

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: crossplatform.tar.configure
  displayName: Configure TAR
  version: 1.0.0
  description: >
    Updates TAR plugin configuration. Changes take effect on the next
    collection cycle. Configurable settings include data retention period,
    collection intervals, and command-line redaction patterns for sensitive
    data protection.
  tags: [tar, timeline, configuration, security]

spec:
  type: action
  platforms: [windows, linux, darwin]

  execution:
    plugin: tar
    action: configure
    concurrency: per-device

  parameters:
    type: object
    properties:
      retention_days:
        type: string
        displayName: Retention Days
        description: >
          Number of days to retain TAR events before automatic purging.
          Valid range: 1-365. Default: 7.
        validation:
          pattern: "^[0-9]+$"
      fast_interval:
        type: string
        displayName: Fast Collection Interval (seconds)
        description: >
          Interval in seconds for process and network collection.
          Valid range: 10-3600. Default: 60.
        validation:
          pattern: "^[0-9]+$"
      slow_interval:
        type: string
        displayName: Slow Collection Interval (seconds)
        description: >
          Interval in seconds for service and user session collection.
          Valid range: 30-7200. Default: 300.
        validation:
          pattern: "^[0-9]+$"
      redaction_patterns:
        type: string
        displayName: Redaction Patterns
        description: >
          JSON array of case-insensitive SUBSTRING patterns (not glob) for
          command-line redaction. Leading/trailing `*` are stripped; `?` and
          `[abc]` are literals. Any process command line containing a pattern
          has its cmdline replaced with "[REDACTED by TAR]". At most 256
          elements of at most 256 characters each; over-cap elements are
          dropped at load. Default patterns: ["*password*", "*secret*",
          "*token*", "*api_key*", "*credential*"]. These defaults are ALWAYS
          MERGED IN — your patterns are ADDED to them, never replace them, so an
          empty or all-invalid array cannot disable the baseline redaction.
      process_enabled:
        type: string
        displayName: Process Collector Enabled
        description: >
          Enable or disable the process collector on this agent. "true"
          (default) keeps the collector active; "false" short-circuits the
          process branch of every collect_fast cycle. Existing rows remain
          queryable until they age out by retention. Requires agent
          v0.12.0+; older agents silently ignore. Valid: "true" | "false".
        validation:
          pattern: "^(true|false)$"
      tcp_enabled:
        type: string
        displayName: TCP Collector Enabled
        description: >
          Enable or disable the TCP/network collector on this agent. See
          process_enabled for semantics. Requires agent v0.12.0+; older
          agents silently ignore. Valid: "true" | "false".
        validation:
          pattern: "^(true|false)$"
      service_enabled:
        type: string
        displayName: Service Collector Enabled
        description: >
          Enable or disable the service collector on this agent. See
          process_enabled for semantics. Requires agent v0.12.0+; older
          agents silently ignore. Valid: "true" | "false".
        validation:
          pattern: "^(true|false)$"
      user_enabled:
        type: string
        displayName: User-Session Collector Enabled
        description: >
          Enable or disable the user-session collector on this agent. See
          process_enabled for semantics. Requires agent v0.12.0+; older
          agents silently ignore. Valid: "true" | "false".
        validation:
          pattern: "^(true|false)$"
      perf_enabled:
        type: string
        displayName: Performance Collector Enabled
        description: >
          Enable or disable the device performance sampler (CPU / memory / disk /
          network rates → $Perf_*) on this agent. "true" (default) keeps it
          active. Device-level perf carries no per-application identity. See
          process_enabled for the disable semantics. Requires agent v0.12.0+;
          older agents silently ignore. Valid: "true" | "false".
        validation:
          pattern: "^(true|false)$"
      procperf_enabled:
        type: string
        displayName: Per-Application Performance Collector Enabled
        description: >
          Enable or disable the per-application top-N CPU/working-set sampler
          (procperf source → $ProcPerf_*). **Off by default** — per-application
          resource usage reveals which applications run on a device, which is
          usage-class telemetry under the works-council posture; independent of
          perf_enabled. Image names only — never command lines. **Enabling this
          also sends per-app names + versions OFF-DEVICE**: the top-N is synced
          daily to the central app_perf store (the B1 per-device and B2 fleet
          views), so it is not local-triage-only. To keep the device fully
          local, leave this off, or suppress the upload with --inventory-disable
          / YUZU_AGENT_INVENTORY_DISABLE. Set to "true" to opt in. Requires
          agent v0.12.0+; older agents silently ignore. Valid: "true" | "false".
        validation:
          pattern: "^(true|false)$"
      netqual_enabled:
        type: string
        displayName: Network-Quality Collector Enabled
        description: >
          Enable or disable the per-connection TCP-quality sampler (netqual
          source → $NetQual_Live, plus the per-boot retrospective baseline
          $NetQual_Boot). **Off by default** — per-connection quality is
          usage-class telemetry under the works-council posture; only a coarse
          destination class (loopback/private/public) is stored, raw remote
          addresses are dropped at the edge. Linux (netlink INET_DIAG) and
          Windows (TCP ESTATS — ADR-0020); **Windows requires an elevated
          agent** (non-elevated records nothing and tar.status reports
          netqual_capture_method=none). macOS is planned. Independent of
          tcp_enabled. Queried via tar.sql only ($NetQual_Live / $NetQual_Boot);
          the legacy tar.query / tar.export actions do not surface netqual. Set
          to "true" to opt in. Requires agent v0.12.0+; older agents silently
          ignore. Valid: "true" | "false".
        validation:
          pattern: "^(true|false)$"
      netconn_enabled:
        type: string
        displayName: Connectivity-Transition Collector Enabled
        description: >
          Enable or disable the connectivity-transition source (netconn →
          $NetConn_Live, ADR-0020). **Off by default** — opt-in usage-class
          telemetry. Windows reads the OS-retained NetworkProfile / NCSI /
          WLAN-AutoConfig event logs, so the FIRST read backfills connectivity
          history from BEFORE the source was enabled (bounded by
          netconn_lookback_seconds; set that to 0 for forward-only). Only closed
          enum tokens + numeric reason codes are stored — NO SSID, BSSID, profile
          name, interface GUID, or MAC. Windows-only collector today (Linux
          journald / macOS oslog planned; the table is queryable-empty there).
          Queried via tar.sql only ($NetConn_Live); the legacy tar.query /
          tar.export actions do not surface netconn. Requires agent v0.12.0+;
          older agents silently ignore. Valid: "true" | "false".
        validation:
          pattern: "^(true|false)$"
      netconn_lookback_seconds:
        type: string
        displayName: Connectivity History Lookback (seconds)
        description: >
          How far BEFORE enablement the netconn backfill reads OS-retained
          connectivity history (ADR-0020 privacy note). Because the timing of
          network / Wi-Fi connect/disconnect events is a presence / working-hours
          proxy — behavioral data even with SSIDs stripped — enabling netconn
          retroactively ingests a window that predates any monitoring
          disclosure. Set to "0" to DISABLE the pre-enablement read entirely
          (the source then records only forward connectivity from the moment it
          is enabled) for jurisdictions or works-council agreements where
          retrospective collection is not permitted. Clamped to 0-7776000
          (0 - 90 days); default 604800 (7 days). Applies to the first read after
          enablement (and after a late enable); once caught up the source reads
          only forward. Requires agent v0.12.0+.
        validation:
          pattern: "^[0-9]+$"
      module_enabled:
        type: string
        displayName: Module-Load Collector Enabled
        description: >
          Enable or disable the image-load / module-stream capture source (module
          source → $Module_*). **Off by default** — module-load capture is
          high-volume usage-class telemetry (every library and driver load per
          process, with a code-signing verdict) under the works-council posture;
          no command line is ever captured. No data is recorded until a collector
          for the host's OS ships ($Module_* tables are queryable-empty until
          then). Set to "true" to opt in. Requires agent v0.12.0+; older agents
          silently ignore. Valid: "true" | "false".
        validation:
          pattern: "^(true|false)$"
      software_enabled:
        type: string
        displayName: Software Inventory Collector Enabled
        description: >
          Enable or disable the software install/uninstall source (software →
          $Software_*) on this agent. **Off by default** — turn it on per host to
          record machine-wide installed-software inventory (HKLM Uninstall), which
          is device asset-management and vulnerability-relevance data and carries
          NO user identity (machine scope only — no per-user / profile-name data).
          Names, versions, and publisher only. See process_enabled for the disable
          semantics (atomic, existing rows remain queryable, clean re-baseline on
          re-enable). Requires agent v0.12.0+; older agents silently ignore. Valid:
          "true" | "false".
        validation:
          pattern: "^(true|false)$"
      software_interval:
        type: string
        displayName: Software Collection Interval (seconds)
        description: >
          Interval in seconds for the software install/uninstall sampler
          (tar.software trigger). "0" disables the trigger entirely; any other
          value must be 300-86400 (5 minutes - 1 day). Default: 3600 (hourly).
          Installs are rare, so this runs on its own slower trigger. Requires
          agent v0.12.0+.
        validation:
          pattern: "^[0-9]+$"
      arp_enabled:
        type: string
        displayName: ARP Collector Enabled
        description: >
          Enable or disable the ARP / neighbour-table capture source (ADR-0015).
          Opt-in: "false" by default. See process_enabled for semantics.
          Native on every OS today: GetIpNetTable2 on Windows, /proc/net/arp
          on Linux, and a route_sysctl dump on macOS (constrained there --
          entry_type always reports "unknown"). Requires agent v0.12.0+;
          older agents silently ignore. Valid: "true" | "false".
        validation:
          pattern: "^(true|false)$"
      dns_enabled:
        type: string
        displayName: DNS Cache Collector Enabled
        description: >
          Enable or disable the DNS resolver-cache capture source (ADR-0015).
          Opt-in: "false" by default — the DNS cache reveals visited domains
          (usage-class telemetry under the works-council posture; enabling is
          audited). Windows-only collector today (Linux/macOS planned). Requires
          agent v0.12.0+; older agents silently ignore. Valid: "true" | "false".
        validation:
          pattern: "^(true|false)$"
      mapdrive_enabled:
        type: string
        displayName: Mapped-Drive Collector Enabled
        description: >
          Enable or disable the mapped-drive capture source (capability-map §3.8,
          mapdrive → $MapDrive_*). Records network-share mappings in BOTH
          directions — outbound (drives this host maps to remote shares) and
          inbound (remote hosts mapping this host's shares, the lateral-movement
          signal). Opt-in: "false" by default — rows expose usernames and remote
          share paths (identity/usage-class telemetry under the works-council
          posture; enabling is audited). Windows + Linux (macOS planned); inbound
          needs local-admin / Server-Operator on Windows and Samba on Linux and
          degrades to empty otherwise. NOTE: the one-time HISTORICAL backfill (all
          PREVIOUSLY mapped drives, from the registry / fstab / event logs) is
          seeded at agent init, so it materializes on the first agent restart
          AFTER you enable this. See software_enabled for disable semantics (same
          opt-in posture; disabling leaves existing rows queryable).
          Requires agent v0.12.0+; older agents silently ignore. Valid:
          "true" | "false".
        validation:
          pattern: "^(true|false)$"
      power_enabled:
        type: string
        displayName: Power Transition Capture Enabled
        description: >
          Enable or disable the sleep/wake/AC-power transition source (power →
          $Power_Live, cursor-model seam). **ON by default ("true")** — the
          first works-council-class source to ship enabled. Note this is NOT
          the product's first default-on source: process, tcp, service, user
          and perf have always been on as machine-scope operational telemetry.
          Of the eight sources added since 1.5 under the works-council opt-in
          posture (procperf, netqual, module, software, arp, dns, netconn,
          mapdrive) every one defaults OFF, and power is the first of THAT
          class to diverge.
          The divergence is deliberate, but it does NOT mean the data is
          low-sensitivity: the SOC 2 data inventory classifies $Power_Live as
          usage-class / behavioral-adjacent, because the TIMING of sleep/wake
          and AC events is a presence and working-hours proxy. Treat it as
          co-determination-relevant and use power_lookback_seconds=0 where a
          retrospective read is not lawful.
          The source WILL use a durable log-position cursor (not a snapshot
          diff), so a restart will resume from where it left off rather than
          re-scanning; a lost/invalid cursor or a wrapped OS event log will
          re-baseline forward and record a capture_gap rather than replaying
          from the beginning.
          Set to "false" to opt out. Requires agent v0.12.0+; older agents
          silently ignore. Valid: "true" | "false".
        validation:
          pattern: "^(true|false)$"
      power_lookback_seconds:
        type: string
        displayName: Power History Lookback (seconds)
        description: >
          How far BEFORE enablement the power source's first read may reach
          into OS-retained sleep/wake/AC-power history (same shape as
          netconn_lookback_seconds, ADR-0020). Set to "0" to disable the
          pre-enablement read entirely (forward-only from the moment it is
          enabled). Clamped to 0-7776000 (0 - 90 days); default 604800 (7
          days). Applies to the first read after enablement (and after a late
          enable); once caught up the source reads only forward. Effective on
          macOS only — Windows and Linux have no power-history API, so their
          first read is always forward-only regardless of this value. Requires
          agent v0.12.0+.
        validation:
          pattern: "^[0-9]+$"
      removable_enabled:
        type: string
        displayName: Removable Media Capture Enabled
        description: >
          Enable or disable the removable-media attach/detach source
          (removable → $Removable_Live, cursor-model seam), including
          exec_from_removable correlation (a process observed running from a
          removable volume). **ON by default ("true")** — the first
          works-council-class source to ship enabled, alongside power. This is
          NOT the product's first default-on source: process, tcp, service,
          user and perf have always been on as machine-scope operational
          telemetry. Of the eight sources added since 1.5 under the
          works-council opt-in posture every one defaults OFF, and removable is
          one of the first two of THAT class to diverge.
          The divergence is deliberate and it does NOT mean the data is
          low-sensitivity — this is the MORE sensitive of the two. The SOC 2
          data inventory classifies $Removable_Live as usage/identity-class:
          it records device vendor, product and SERIAL, plus the executed
          binary path and pid of any process running from a removable volume.
          Treat it as co-determination-relevant and set
          removable_lookback_seconds=0 where a retrospective read of OS-retained
          removable history is not lawful.
          The source WILL use the same durable log-position cursor model as
          power (see power_enabled) — a lost/invalid cursor will re-baseline
          forward and record a capture_gap rather than replaying history.
          Queried via tar.sql only ($Removable_Live); the legacy tar.query /
          tar.export actions do not surface removable. Set to "false"
          to opt out. Requires agent v0.12.0+; older agents silently ignore.
          Valid: "true" | "false".
        validation:
          pattern: "^(true|false)$"
      removable_lookback_seconds:
        type: string
        displayName: Removable Media History Lookback (seconds)
        description: >
          How far BEFORE enablement the removable source's first read may
          reach into OS-retained device-attach history (same shape as
          netconn_lookback_seconds / power_lookback_seconds above). Set to "0"
          to disable the pre-enablement read entirely (forward-only from the
          moment it is enabled). Clamped to 0-7776000 (0 - 90 days); default
          604800 (7 days). Applies to the first read after enablement (and
          after a late enable); once caught up the source reads only forward.
          Requires agent v0.12.0+.
        validation:
          pattern: "^[0-9]+$"
      usage_enabled:
        type: string
        displayName: Application Usage Capture Enabled
        description: >
          Enable or disable the `usage` derived fold (usage → $Usage_Live /
          $Usage_Daily), a checked_transaction-based pairing of the process
          source's started/stopped events into per-executable run/duration
          aggregates plus a per-day distinct-user count. **ON by default
          ("true")** — joining power/removable as a works-council-class
          source shipping enabled; process, tcp, service, user and perf are
          already default-on as machine-scope operational telemetry.
          The SOC 2 data inventory classifies $Usage_Live/$Usage_Daily as
          usage-class / behavioral-adjacent: $Usage_Live persists the owning
          pid and user for each open run, and the per-day username
          membership (queryable via tar.sql) reveals which applications run
          on a device, when, and by whom. Treat as co-determination-relevant,
          same basis as power/removable.
          Forward-only, no retrospective backfill: disabling and later
          re-enabling always re-baselines from the moment of re-enable, never
          a retrospective fold over whatever process history accrued during
          the disabled window — this is a lifecycle-state-machine property,
          not a best-effort marker check. Set to "false" to opt out.
          Requires agent v0.12.0+; older agents silently ignore.
          Valid: "true" | "false".
        validation:
          pattern: "^(true|false)$"
      network_capture_method:
        type: string
        displayName: Network Capture Method
        description: >
          TCP capture mechanism. "polling" (always accepted) drives the
          collector via the platform polling API at fast_interval cadence and
          is the only mechanism wired today. Validation is OS-AWARE and scoped to
          the NETWORK (tcp) source: besides "polling", only the tcp-source method
          valid on the RUNNING host's OS is accepted — iphlpapi on Windows, procfs
          on Linux, proc_pidfdinfo on macOS (run the `compatibility` action for the
          live list). Process-source methods such as "etw" / "endpoint_security"
          are NOT network_capture_method values and are rejected even on their own
          OS. A method belonging to a DIFFERENT OS is also rejected, so a Linux
          agent can no longer store "iphlpapi". A host-valid future method is
          accepted for pre-staging; the agent emits a warn line and continues
          polling until that collector lands. The mechanism actually in force is
          observable via network_capture_method_effective in the status action
          (always polling today). Requires agent v0.12.0+.
      process_stabilization_exclusions:
        type: string
        displayName: Process Stabilization Exclusions
        description: >
          JSON array of case-insensitive substring patterns matched against
          the process name. Any process whose name contains a pattern is
          dropped before the diff so noisy short-lived helpers do not
          dwarf real activity. Trade-off: forensic completeness — anything
          matching is invisible to TAR. Leading and trailing `*` are
          stripped (so `*-helper*` is the same as `-helper`). NOT real
          glob — `?` and `[abc]` are treated as literals. At most 256
          elements of at most 256 characters each, and the EFFECTIVE substring
          (after stripping `*`) must be at least 3 characters — a shorter core
          like "a" or "*a*" would match almost every process and is rejected
          at configure AND dropped at load. Requires agent v0.12.0+. Example:
          '["chrome-helper","ms-edge-helper"]'.

  result:
    columns:
      - name: key
        type: string
        description: >-
          Name of one configuration setting that was changed by this call (e.g. retention_days, arp_enabled); one row is emitted per persisted key — unchanged keys emit nothing. Values: one of the parameter names listed under Inputs.
        example: "-"
        platforms: [windows, linux, darwin]
      - name: value
        type: string
        description: >-
          The new value that was persisted for that key, as a string (post-clamp / post-validation where the parameter defines one). Values: free text, mirrors the parameter's own type/values.
        example: "-"
        platforms: [windows, linux, darwin]

  readablePayload: "Configure TAR settings"

  gather:
    ttlSeconds: 60

  approval:
    mode: role-gated

  permissions:
    executeRoles: [endpoint-admin]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 0.1.0
    requiredPlugins: [tar]

status:
  phase: active

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: crossplatform.tar.collect_fast
  displayName: TAR Fast Collection
  version: 1.0.0
  description: >
    Internal trigger-driven action that collects process and network
    connection snapshots, computes diffs against previous state, and
    records change events. Runs automatically every 60 seconds by default.
    Not typically invoked manually.
  tags: [tar, timeline, internal, processes, network]

spec:
  type: action
  platforms: [windows, linux, darwin]

  execution:
    plugin: tar
    action: collect_fast
    concurrency: per-device

  parameters:
    type: object
    properties: {}

  result:
    columns:
      - name: events_recorded
        type: int32
        description: >-
          Count of change events this tick appended to the warehouse. Carried as the third field of the actual response line `tar|collect_fast|<events_recorded>|<token>`, where <token> is one of source_disabled / unsupported_platform / baseline / sample_recorded / cursor_advanced / cursor_lost / capture_incomplete / counters_unavailable. Values: non-negative integer.
        example: "-"
        platforms: [windows, linux, darwin]

  readablePayload: "Run TAR fast collection (processes + network)"

  gather:
    ttlSeconds: 120

  approval:
    mode: auto

  permissions:
    executeRoles: [endpoint-admin]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 0.1.0
    requiredPlugins: [tar]

status:
  phase: active

