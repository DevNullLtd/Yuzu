## Process Introspection Definitions
## The security posture of ONE process on ONE device: its resource limits, signal masks,
## capability sets, seccomp state, OOM scores and scheduling policy. Numbers, masks and fixed
## tokens only. Nothing is changed, signalled or attached to.
## Plugin: process_introspect | Actions: inspect
##
## Gated behind the SAME Forensics securable execution_artifacts, privacy_permissions and
## remote_access_audit use (Forensics:Read + AdminOrApproval: Administrator by default) and
## SINGLE-TARGET -- exactly one device per dispatch. See this plugin's README
## (agents/plugins/process_introspect/README.md) and
## server/core/src/capability_decls/plugin_action_catalogue_process_introspect.hpp.
##
## DEFAULT-OFF: gated behind the server-side plugin-config kill switch
## (`PluginConfigStore::seed_kill_switch_default_off`) -- an operator must explicitly
## `PUT /api/v1/plugin-config/process_introspect/kill-switch {"enabled":true}` before this
## action will dispatch.
##
## ONE action, one `facet` per request (no `all`, no list). Sources by facet on Linux, all read
## through one directory descriptor opened once on /proc/<pid>:
##   resource_limits  /proc/<pid>/limits
##   sigmasks         /proc/<pid>/status (SigPnd, ShdPnd, SigBlk, SigIgn, SigCgt)
##   caps             /proc/<pid>/status (CapInh, CapPrm, CapEff, CapBnd, CapAmb)
##   seccomp          /proc/<pid>/status (Seccomp, Seccomp_filters, NoNewPrivs)
##   oom              /proc/<pid>/oom_score and oom_score_adj
##   sched            /proc/<pid>/stat (policy, nice, rt priority) and status (Cpus_allowed_list)
##   macOS, Windows:  PLANNED, not read yet; one `unsupported` status row, <os>:planned.
##
## NEVER emitted, on any facet: file or memory contents, environment values, socket payloads,
## command-line arguments or the process name. Data above this contract is a NEW action, never
## a new facet.
---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: crossplatform.process_introspect.inspect
  displayName: Process Introspection
  version: 1.0.0
  description: >
    Inspects one process on one device and returns one facet of its security posture:
    resource_limits, sigmasks, caps, seccomp, oom or sched. Only numbers, masks and fixed
    tokens are returned; file or memory contents, environment values, socket payloads and
    command-line arguments are never read or returned. Reads one process on one device per
    request and is off until enabled. A pid that has been reused since an earlier inspect, or a
    process that changed during the read, is refused rather than guessed. The first row is a
    status row stating whether the read was complete. On Linux the read is made through
    /proc, so on a host that mounts /proc with hidepid 2 or above another account's process
    reads as no_such_process_or_hidden. macOS and Windows are planned and not yet read.
    Take the pid from crossplatform.process.list; a degraded read is returned as CONSTRAINED,
    never as an empty OK, and no_such_process, no_such_process_or_hidden and pid_reused are
    terminal while torn_read can be retried. Needs Forensics:Read, and a non-administrator
    also needs an approval.
  tags: [process, introspection, security, posture, forensics]

spec:
  type: question
  platforms: [windows, linux, darwin]

  execution:
    plugin: process_introspect
    action: inspect
    concurrency: per-device

  parameters:
    type: object
    required: [pid, facet]
    properties:
      pid:
        type: string
        displayName: Process ID
        description: >
          The numeric process id to inspect, 1 to 2147483647 with no leading zero (e.g. 4242).
          One process per request; names are never matched.
        validation:
          pattern: "^([1-9][0-9]{0,8}|1[0-9]{9}|20[0-9]{8}|21[0-3][0-9]{7}|214[0-6][0-9]{6}|2147[0-3][0-9]{5}|21474[0-7][0-9]{4}|214748[0-2][0-9]{3}|2147483[0-5][0-9]{2}|21474836[0-3][0-9]|214748364[0-7])$"
      facet:
        type: string
        displayName: Facet
        description: >
          Which part of the process to read: resource_limits, sigmasks, caps, seccomp, oom or
          sched. One facet per request.
        validation:
          enum: ["resource_limits", "sigmasks", "caps", "seccomp", "oom", "sched"]
      start_time:
        type: string
        displayName: Start-time token
        description: >
          Optional identity guard. The token is field 2 of the `target` row of an earlier
          inspect of the same pid; no other plugin or action emits it, so the first inspect of
          a pid is always unguarded and the guard only links one inspect to the next. If the
          pid now belongs to a different process the request is refused as pid_reused. Leave
          empty for no guard.
        validation:
          pattern: "^([0-9a-f]{8}\\.[0-9]{1,20})?$"

  result:
    columns:
      - name: row_kind
        type: string
        values: [status, target, limit, sigmask, cap, seccomp, oom, sched]
        description: 'Row shape discriminator (field 0). Values: status, target, limit, sigmask, cap, seccomp, oom, sched.'
        example: sigmask
        platforms: [windows, linux, darwin]
      - name: field_1
        type: string
        description: 'status: the literal "inspect". target: the pid inspected. limit: the limit name (cpu_time, file_size, data_size, stack_size, core_file_size, resident_set, processes, open_files, locked_memory, address_space, file_locks, pending_signals, msgqueue_size, nice_priority, realtime_priority, realtime_timeout). sigmask: pending, shared_pending, blocked, ignored or caught. cap: inheritable, permitted, effective, bounding or ambient. seccomp: the mode (disabled, strict, filter) or "-". oom: the OOM score, or "-". sched: the scheduling policy (other, fifo, rr, batch, idle, deadline, ext, unknown).'
        example: blocked
        platforms: [windows, linux, darwin]
      - name: field_2
        type: string
        description: 'status: supported, constrained, permission_denied, unavailable or unsupported (the planned legs, and a leg that threw). target: the start-time token, <8 hex of the boot id>.<process start time>, to pass back as start_time. limit: the soft limit, a number or unlimited. sigmask and cap: the 16-digit hex mask. seccomp: the number of installed filters, or "-". oom: the OOM score adjustment, or "-". sched: the nice value.'
        example: '0000000000000000'
        platforms: [windows, linux, darwin]
      - name: field_3
        type: string
        description: 'status: reason token(s) for a non-supported read, "-" when complete; tokens look like linux:process_introspect:pid_reused or macos:planned. target: the facet inspected. limit: the hard limit, a number or unlimited. seccomp: NoNewPrivs, 0 or 1, or "-". sched: the realtime priority, 0 to 99.'
        example: unlimited
        platforms: [windows, linux, darwin]
      - name: field_4
        type: string
        description: 'limit: the unit (seconds, bytes, count, microseconds, none). sched: the allowed-CPU list such as 0-7 or 0,2,4, or "-" when it could not be read. Not used by the other kinds.'
        example: bytes
        platforms: [linux]
    aggregation:
      groupBy:
        - row_kind
      operations:
        - count

  readablePayload: "Inspect the {{facet}} of process {{pid}}"

  gather:
    # The response window for the one reply, not a cache.
    ttlSeconds: 300

  approval:
    mode: role-gated

  permissions:
    executeRoles: [admin]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 1.0.0
    requiredPlugins: [process_introspect]

status:
  phase: active
