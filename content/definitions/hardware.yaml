    type: object
    properties: {}

  result:
    # status|swap|<level>|<reason>   (always first; the only row until a leg lands)
    # swap|<device>|<total_mb>|<used_mb>|<source>
    columns:
      - name: row_kind
        type: string
        description: 'Row shape discriminator (the wire row''s leading tag). Values: status (exactly one per result, always first), swap (one per record read).'
        values: [status, swap]
        example: status
        platforms: [windows, linux, darwin]
      - name: device
        type: string
