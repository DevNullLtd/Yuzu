apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: device.hardware.swap
  displayName: Swap and Page Files
  version: 1.0.0
  description: >
    Reports swap devices and page files with total and used size in MB. Not read
    yet on any OS: every dispatch answers one unsupported status row
    (windows:planned, linux:planned or macos:planned) until its leg lands (H.5
    Windows, H.11 Linux, H.13 macOS). On-demand only; it is not part of any
    daily sync.
  tags: [hardware, inventory, swap]

spec:
  type: question
  platforms: [windows, linux, darwin]

  execution:
    plugin: hardware
    action: swap
    concurrency: per-device

