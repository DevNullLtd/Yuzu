  phase: active

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: device.hardware.machine_id
  displayName: Machine Identifier (Keyed Hash)
  version: 1.0.0
  description: >
    Reports a keyed hash of the operating system machine identifier. The raw
    identifier never leaves the host. Not read yet on any OS: every dispatch
    answers one unsupported status row (windows:planned, linux:planned or
    macos:planned) until its leg lands (H.5 Windows, H.11 Linux); macOS has no
    source beyond the hardware UUID that device.hardware.system reports and
    moves to a typed unsupported (H.13). On-demand only; it is not part of any
    daily sync.
  tags: [hardware, inventory, machine-id]

spec:
  type: question
  platforms: [windows, linux, darwin]

  execution:
    plugin: hardware
    action: machine_id
    concurrency: per-device

  parameters:
    type: object
    properties: {}

