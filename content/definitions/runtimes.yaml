## Runtimes Definitions
## Reports installed .NET (Core/5+), JVM and Python runtimes. Read-only, zero subprocess.
## Plugin: runtimes | Actions: dotnet, jvm, python
##
## SHIPPED LEGS: Linux (dotnet, jvm, python) and, for python only, macOS and Windows. Rung 1
## (directory names and metadata-file reads; no `java`, `dotnet` or `python` process is ever
## started).
##   Linux:   /usr/share/dotnet, /usr/lib/dotnet, /usr/lib64/dotnet shared/<framework>/<version>
##            and sdk/<version> directory walk (dotnet);
##            <home>/release file reads under /usr/lib/jvm, /opt/java, /usr/lib64/jvm and
##            /var/opt/java, plus a bin/java probe for a home with no release file (jvm);
##            python3.<minor> regular files in /usr/bin and /usr/local/bin (python; the version
##            is major.minor from the file name, the patch level is not available).
##            Network mounts are skipped (read from /proc/self/mountinfo).
##   macOS:   /Library/Frameworks/Python.framework/Versions/<x.y>/Resources/Info.plist (python).
##   Windows: HKLM\SOFTWARE\Python\PythonCore\<tag> in both registry views, PEP 514 (python);
##            per-user hives are never read.
##
## macOS AND WINDOWS dotnet / jvm: planned; the action answers a single unsupported status row on
## this OS. Until then it answers `status|<action>|unsupported|<macos|windows>:planned`. The
## planned mechanisms are declared in the plugin descriptor (runtimes_plugin.cpp):
##   macOS:   /usr/local/share/dotnet/shared walk (dotnet);
##            /Library/Java/JavaVirtualMachines/*/Contents/Info.plist JavaVM dict +
##            Contents/Home/release (jvm).
##   Windows: NDP release-key table + dotnet InstalledVersions + Program Files walk (dotnet);
##            JavaSoft keys + Program Files\Java walk (jvm).
##
## Every action's output is: one `status|<action>|<level>|<reason>` row FIRST, then zero or
## more `<action>|<flavour>|<version>|<install_path>|<vendor>` rows. A `supported` status
## with zero data rows means none was found at the standard roots listed above (a runtime
## installed anywhere else is not looked for); a `constrained` status means a read failed or
## was skipped and the rows may be incomplete — failure never reads as absent.

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: crossplatform.runtimes.dotnet
  displayName: .NET Runtime Inventory
  version: 1.0.0
  description: >
    Reports installed .NET (Core/5+) shared frameworks and SDKs on Linux: one
    row per framework version or SDK version found under the standard install
    roots (flavour, version, install path), from directory names only — no
    `dotnet` process is started. A `supported` status with no rows means none
    was found at the standard roots (a runtime installed elsewhere is not
    looked for); a `constrained` status means a read failed or was skipped and
    the list may be incomplete. macOS and Windows: planned; the action answers a single
    unsupported status row on this OS
    (`status|dotnet|unsupported|<macos|windows>:planned`).
  tags: [runtimes, dotnet, inventory]

spec:
  type: question
  platforms: [linux]

  execution:
    plugin: runtimes
    action: dotnet
    concurrency: per-device

  parameters:
    type: object
    properties: {}

  result:
    # status|dotnet|<level>|<reason>   (always first)
    # dotnet|<flavour>|<version>|<install_path>|<vendor or ->
    columns:
      - name: row_kind
        type: string
        description: 'Row shape discriminator (the wire row''s leading tag). Values: status (exactly one per result, always first), dotnet (one per runtime found).'
        values: [status, dotnet]
        example: dotnet
        platforms: [linux]
      - name: flavour
        type: string
        description: 'Runtime kind. Values: core (a Microsoft.NETCore.App, Microsoft.AspNetCore.App or Microsoft.WindowsDesktop.App shared framework), sdk (an SDK install), unmodelled (any other shared-framework name — reported, never dropped). The three core frameworks all read core at the same version; the install path tells them apart. Status rows: the action name.'
        values: [core, sdk, unmodelled]
        example: core
        platforms: [linux]
      - name: version
        type: string
        description: 'Version taken from the install directory name (e.g. 8.0.31, or a preview build such as 9.0.100-preview.1.24101.2). Status rows: the level (supported, constrained or unsupported).'
        example: 8.0.31
        platforms: [linux]
      - name: install_path
        type: string
        description: 'Absolute path of the framework or SDK version directory the version was read from. Status rows: the comma-joined failure tokens, or -.'
        example: /usr/share/dotnet/shared/Microsoft.NETCore.App/8.0.31
        platforms: [linux]
      - name: vendor
        type: string
        description: 'Always "-" for dotnet: the install tree carries no vendor field.'
        example: "-"
        platforms: [linux]

  readablePayload: "List installed .NET runtimes"

  gather:
    ttlSeconds: 300

  approval:
    mode: auto

  permissions:
    executeRoles: [endpoint-admin, endpoint-operator]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 1.0.0
    requiredPlugins: [runtimes]

status:
  phase: active

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: crossplatform.runtimes.jvm
  displayName: JVM Inventory
  version: 1.0.0
  description: >
    Reports installed Java runtimes on Linux: one row per JDK/JRE home under
    /usr/lib/jvm, /opt/java, /usr/lib64/jvm and /var/opt/java — flavour (jdk,
    jre, unmodelled), version, install path and vendor (the build's self-reported
    `IMPLEMENTOR` value, e.g. Eclipse Adoptium vs Debian; it is not verified). A
    home with a java binary but no `release` file (some distro OpenJDK 8 packages)
    is a row with version `-` and a `release_missing` constraint. No `java` process is
    started. A `supported` status with no rows means none was found at those
    roots (an Oracle-RPM /usr/java or a tarball install elsewhere is not looked
    for); a `constrained` status means a read failed or was skipped and the list
    may be incomplete. macOS and Windows: planned; the action answers a single
    unsupported status row on this OS (`status|jvm|unsupported|<macos|windows>:planned`).
  tags: [runtimes, jvm, inventory]

spec:
  type: question
  platforms: [linux]

  execution:
    plugin: runtimes
    action: jvm
    concurrency: per-device

  parameters:
    type: object
    properties: {}

  result:
    # status|jvm|<level>|<reason>   (always first)
    # jvm|<flavour>|<version>|<install_path>|<vendor or ->
    columns:
      - name: row_kind
        type: string
        description: 'Row shape discriminator (the wire row''s leading tag). Values: status (exactly one per result, always first), jvm (one per runtime found).'
        values: [status, jvm]
        example: jvm
        platforms: [linux]
      - name: flavour
        type: string
        description: 'Image kind from the IMAGE_TYPE key of the release file. Values: jdk, jre, unmodelled (the file does not say — Debian and SUSE OpenJDK release files have no IMAGE_TYPE, and a release-less home has no file at all; never guessed from the path). Status rows: the action name.'
        values: [jdk, jre, unmodelled]
        example: jdk
        platforms: [linux]
      - name: version
        type: string
        description: 'JAVA_VERSION from the release file, falling back to JAVA_RUNTIME_VERSION. A release file with neither key yields no row and a release_unparsable constraint; a home with a java binary but no release file yields - and a release_missing constraint. Status rows: the level (supported, constrained or unsupported).'
        example: 17.0.20
        platforms: [linux]
      - name: install_path
        type: string
        description: 'Absolute path of the JVM home directory. Status rows: the comma-joined failure tokens, or -.'
        example: /opt/java/openjdk
        platforms: [linux]
      - name: vendor
        type: string
        description: 'IMPLEMENTOR from the release file (e.g. Eclipse Adoptium, Debian), self-reported by the build and not verified, or "-" when the key is absent (or the home has no release file).'
        example: Eclipse Adoptium
        platforms: [linux]

  readablePayload: "List installed JVMs"

  gather:
    ttlSeconds: 300

  approval:
    mode: auto

  permissions:
    executeRoles: [endpoint-admin, endpoint-operator]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 1.0.0
    requiredPlugins: [runtimes]

status:
  phase: active

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: crossplatform.runtimes.python
  displayName: Python Inventory
  version: 1.0.0
  description: >
    Reports installed Python interpreters: one row per interpreter found at the standard
    machine roots (flavour, version, install path, vendor), from install metadata only — no
    `python` process is started. Windows: the python.org PEP 514 keys under
    HKLM\SOFTWARE\Python\PythonCore in both registry views, with the full x.y.z version
    (per-user installs and other PEP 514 publishers are not listed). macOS: the python.org
    framework under /Library/Frameworks/Python.framework/Versions, with the full x.y.z from
    each version's Info.plist. Linux: python3.<minor> files in /usr/bin and /usr/local/bin,
    with major.minor ONLY (for example 3.11) — the patch level is not stored anywhere without
    running the interpreter, so it is not guessed. A `supported` status with no rows means
    none was found at those roots (Homebrew, pyenv, conda and virtual environments are not
    looked for); a `constrained` status means a read failed or was skipped and the list may
    be incomplete.
  tags: [runtimes, python, inventory]

spec:
  type: question
  platforms: [windows, darwin, linux]

  execution:
    plugin: runtimes
    action: python
    concurrency: per-device

  parameters:
    type: object
    properties: {}

  result:
    # status|python|<level>|<reason>   (always first)
    # python|<flavour>|<version>|<install_path>|<vendor or ->
    columns:
      - name: row_kind
        type: string
        description: 'Row shape discriminator (the wire row''s leading tag). Values: status (exactly one per result, always first), python (one per interpreter found).'
        values: [status, python]
        example: python
        platforms: [windows, darwin, linux]
      - name: flavour
        type: string
        description: 'Interpreter kind. Values: cpython (a python.org PythonCore registry tag on Windows, or the python.org framework on macOS, identified by its bundle identifier), unmodelled (any other bundle identifier on macOS; every Linux row — a file name does not say what implementation it is). Status rows: the action name.'
        values: [cpython, unmodelled]
        example: cpython
        platforms: [windows, darwin, linux]
      - name: version
        type: string
        description: 'Interpreter version. Windows: the PythonCore Version value (x.y.z), else SysVersion, else the tag''s major.minor. macOS: the full x.y.z from Info.plist, else the version directory name (x.y). Linux: major.minor from the python3.<minor> file name — the patch level is not available. - when none could be determined. Status rows: the level (supported, constrained or unsupported).'
        example: 3.14.6
        platforms: [windows, darwin, linux]
      - name: install_path
        type: string
        description: 'Windows: the InstallPath key''s default value (backslashes are written as /), or - when the tag has none. macOS: the framework version directory. Linux: the interpreter file. Status rows: the comma-joined failure tokens, or -.'
        example: /usr/bin/python3.11
        platforms: [windows, darwin, linux]
      - name: vendor
        type: string
        description: 'Windows: PythonCore. macOS: the framework''s CFBundleIdentifier (org.python.python), or - when the plist could not be read. Linux: always "-".'
        example: PythonCore
        platforms: [windows, darwin, linux]

  readablePayload: "List installed Python interpreters"

  gather:
    ttlSeconds: 300

  approval:
    mode: auto

  permissions:
    executeRoles: [endpoint-admin, endpoint-operator]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 1.0.0
    requiredPlugins: [runtimes]

status:
  phase: active
