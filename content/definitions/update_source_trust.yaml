## Update Source Trust Definitions
## Reports how a device's package/update sources are configured to trust their
## signing authorities. Read-only, facts only: an unsigned or rogue source is a
## row, never a verdict, and nothing is enforced, fetched or changed.
## Plugin: update_source_trust | Actions: sources
##
## Sources by platform:
##   Linux:   file reads of /etc/apt/sources.list{,.d/*} (one-line and deb822
##            formats: signed-by, trusted, allow-insecure), the apt keyrings
##            /etc/apt/trusted.gpg{,.d/*} and /etc/apt/keyrings/*, and the
##            yum/dnf /etc/yum.repos.d/*.repo settings (gpgcheck,
##            repo_gpgcheck, gpgkey, sslverify).
##   macOS:   CFPropertyListCreateWithData over the local
##            /Library/Preferences/com.apple.SoftwareUpdate.plist and the
##            MDM-delivered /Library/Managed Preferences/com.apple.SoftwareUpdate.plist.
##            CONSTRAINED:
##            managed leg verified against fixtures only; no MDM-enrolled host in this run
##   Windows: PLANNED — follows as its own PR (WSUS / Automatic Updates policy
##            under HKLM\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate{,\AU}).
##            Until then `sources` on Windows answers with exactly one row,
##            `status|sources|unsupported|windows:planned`.
##
## WHY: there is no documented customer driver for this plugin. Capability-map
## section 8.8 tests reachability to update sources, never their trust, and the
## SOC 2 supply-chain material covers Yuzu's own build pipeline, not a customer
## endpoint's package-source configuration. This is a capability-gap addition:
## an unsigned or rogue third-party repository is a common compromise vector.
##
## Absent versus constrained: a host that simply has no apt tree, no .repo
## files or no Software Update plist reports ZERO rows for that family and stays
## `supported` (a genuinely absent thing). A source that exists but cannot be
## read reports `constrained` with a reason token, never an empty success.
## The planned Windows `wsus` row kind will report policy_configured=no for a
## host with no WSUS policy — the common case, a fact — which is deliberately
## distinct from `constrained` (a policy key that exists but cannot be read).

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: crossplatform.security.update_source_trust
  displayName: Update Source Trust
  version: 1.0.0
  description: >
    Reports how the device's package and update sources are configured to
    trust their signing authorities, as facts only. On Linux, one row per apt
    source (one-line and deb822, with signed-by, trusted and allow-insecure),
    one row per apt keyring file, and one row per yum/dnf repository (with
    gpgcheck, repo_gpgcheck, gpgkey and sslverify). On macOS, one row for the
    local and one for the MDM-managed Software Update policy. The Windows
    WSUS leg is planned and follows as its own PR. A leading status row states
    whether the read was complete. The plugin never enforces, fetches or
    changes anything.
  tags: [security, supply-chain, update-sources, packages]

spec:
  type: question
  platforms: [windows, linux, darwin]

  execution:
    plugin: update_source_trust
    action: sources
    concurrency: per-device

  parameters:
    type: object
    properties: {}

  result:
    # Five row shapes on one stream, discriminated by field 0 (row_kind). Every
    # row of a kind carries the same field count; "-" is an absent value. A
    # status row always comes first. Booleans are the four-value vocabulary
    # yes | no | unset | unmodelled (unset = key absent; unmodelled = key
    # present with a value the plugin does not recognise).
    #
    #   status|sources|<supported|constrained|unsupported>|<reason or ->
    #   apt_source|<file>|<one_line|deb822>|<types>|<uris>|<suites>|<components>|<signed_by>|<trusted>|<allow_insecure>|<enabled>
    #   apt_keyring|<path>|<scope>|<armored|binary|empty|unmodelled>|<size_bytes>
    #   rpm_repo|<file>|<repo_id>|<name>|<enabled>|<gpgcheck>|<repo_gpgcheck>|<gpgkey>|<baseurl>|<mirror>|<sslverify>
    #   macos_swu|<local|managed>|<catalog_url>|<auto_check>|<auto_download>|<auto_install_macos>|<config_data_install>|<critical_update_install>|<allow_prerelease>
    #   wsus|...   PLANNED (Windows leg, its own PR); never emitted today. A
    #              host with no WSUS policy will report policy_configured=no.
    #
    # field_1..field_10 carry the data fields of the widest shapes (apt_source
    # and rpm_repo, 10 each); narrower shapes leave the tail fields off the row.
    columns:
      - name: row_kind
        type: string
        values: [status, apt_source, apt_keyring, rpm_repo, macos_swu]
        description: 'Row shape discriminator (field 0). Values: status, apt_source, apt_keyring, rpm_repo, macos_swu. A planned wsus shape is documented for the Windows leg and is not emitted today.'
        example: apt_source
        platforms: [windows, linux, darwin]
      - name: field_1
        type: string
        description: 'status: the literal "sources". apt_source, rpm_repo: the logical absolute path of the source file. apt_keyring: the keyring file path. macos_swu: scope, local or managed.'
        example: /etc/apt/sources.list.d/debian.sources
        platforms: [windows, linux, darwin]
      - name: field_2
        type: string
        description: 'status: supported, constrained or unsupported (Windows reports unsupported until its leg lands). apt_source: format, one_line or deb822. apt_keyring: scope (legacy_trusted_gpg, trusted_gpg_d or etc_apt_keyrings). rpm_repo: repo id. macos_swu: catalog URL, "-" when the plist sets none, or unmodelled for a value of the wrong type.'
        example: deb822
        platforms: [windows, linux, darwin]
      - name: field_3
        type: string
        description: 'status: reason token(s) for a constrained or unsupported read, "-" when complete; a token has the form <os>:<source>:<detail> (windows:planned on Windows). apt_source: source types (deb, deb-src or unmodelled). apt_keyring: key format (armored, binary, empty or unmodelled). rpm_repo: repository name. macos_swu: auto_check.'
        example: deb
        platforms: [windows, linux, darwin]
      - name: field_4
        type: string
        description: 'apt_source: URIs, userinfo (user:pass@) redacted. apt_keyring: size in bytes. rpm_repo: enabled. macos_swu: auto_download. Not used by status. Values for booleans: yes, no, unset, unmodelled.'
        example: https://deb.debian.org/debian
        platforms: [linux, darwin]
      - name: field_5
        type: string
        description: 'apt_source: suites. rpm_repo: gpgcheck (yes, no, unset, unmodelled; unset means the .repo file does not say, not that the effective value is off). macos_swu: auto_install_macos.'
        example: bookworm
        platforms: [linux, darwin]
      - name: field_6
        type: string
        description: 'apt_source: components. rpm_repo: repo_gpgcheck. macos_swu: config_data_install.'
        example: main
        platforms: [linux, darwin]
      - name: field_7
        type: string
        description: 'apt_source: signed_by, the Signed-By value (paths and/or fingerprints), the literal inline_key when a deb822 Signed-By embeds a key block (key material is never emitted), or "-" when absent (apt then uses its global trusted keyrings). rpm_repo: gpgkey URL(s). macos_swu: critical_update_install.'
        example: /usr/share/keyrings/debian-archive-keyring.gpg
        platforms: [linux, darwin]
      - name: field_8
        type: string
        description: 'apt_source: trusted (yes, no, unset, unmodelled; yes disables signature checking for the source). rpm_repo: baseurl. macos_swu: allow_prerelease.'
        example: unset
        platforms: [linux, darwin]
      - name: field_9
        type: string
        description: 'apt_source: allow_insecure (yes, no, unset, unmodelled). rpm_repo: mirror (mirrorlist or metalink) URL.'
        example: unset
        platforms: [linux]
      - name: field_10
        type: string
        description: 'apt_source: enabled (yes, no, unmodelled; deb822 defaults to enabled). rpm_repo: sslverify (yes, no, unset, unmodelled).'
        example: "yes"
        platforms: [linux]
    aggregation:
      groupBy:
        - row_kind
      operations:
        - count

  readablePayload: "Report update-source trust facts"

  gather:
    ttlSeconds: 300

  approval:
    mode: auto

  permissions:
    executeRoles: [endpoint-admin, endpoint-operator, security-admin]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 1.0.0
    requiredPlugins: [update_source_trust]

status:
  phase: active
