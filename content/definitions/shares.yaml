## Shares Definitions
## Reports the shares this host serves over SMB and NFS: names, paths, ro/rw, whether
## anonymous access is configured, and a few flags. Linux and macOS read CONFIGURED shares;
## Windows reads the LIVE shares of the Server service. Nothing is changed or fetched.
## Plugin: shares | Actions: list
##
## Sources by platform:
##   Linux:   bounded no-follow reads of /etc/exports, /etc/exports.d/*.exports and
##            /etc/samba/smb.conf (pure parsers). Configured shares as written, not live
##            nfsd/smbd state. The Samba registry backend, include= files and usershares are
##            not read and are reported as constrained tokens.
##   macOS:   the share points `/usr/sbin/sharing -l -f json` records (a bounded argv leaf:
##            5 s deadline, no shell) plus a byte-capped no-follow read of /etc/exports in
##            Apple's BSD grammar, emulated best-effort (checks that need the host are not
##            modelled). Share points as recorded, not live smbd state; a record with SMB
##            sharing off is flagged `unavailable`, SMB encryption required `sealed`; the
##            tool never prints AFP or FTP state, so a share point enabled only for those
##            appears as an SMB row. NFS exports as written, hosts counted never listed. A
##            tool that cannot start, times out, exits nonzero (other than printing its
##            no-records text) or prints anything but a JSON object or its no-records text
##            fails the `sharing` source with a named token, never an empty list.
##   Windows: NetShareEnum level 2 (netapi32), the live shares of the Server service, read
##            in pages (64 KiB requested per call: a memory bound, not a time bound); level 1
##            (names, no paths) when level 2 is refused. The
##            administrative ADMIN$, C$ and IPC$ shares are flagged `special`, never
##            `hidden`; any other share whose name ends in `$` is flagged `hidden`. A stopped
##            Server service is `unsupported` with a named token, never an empty list. The
##            enumeration is not a snapshot: a drain whose count differs from the first
##            page's total is `constrained` (inconsistent_drain). Access and anonymous are
##            `-`; ACLs (level 502) and the remark are never read.
##
## ACLs, `valid users` and NFS client host lists are never emitted. NFS clients are a count
## (`clients_<n>`) and an anonymous flag only. Share names and paths can embed account names
## (Samba [homes]): treat the result as sensitive.
## Linux and macOS rows are configured shares; Windows rows are the shares this host serves, not the
## mapped-drive and session observations the echo mapdrive source records.

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: crossplatform.network.shares
  displayName: Shares
  version: 1.0.0
  description: >
    Reports the shares this host serves over SMB and NFS: name, path,
    ro/rw/mixed, whether anonymous access is configured and a few flags, never ACLs or NFS client
    host lists (clients are a count). On Linux, read from /etc/exports, /etc/exports.d and
    /etc/samba/smb.conf as written, not live nfsd/smbd state; the Samba registry backend,
    include files and usershares are not read. On Windows, read live from the Server service
    through NetShareEnum: the administrative ADMIN$, C$ and IPC$ shares are flagged special,
    any other share whose name ends in $ is flagged hidden, and a stopped Server service is
    reported as unavailable, never as an empty list. Under a service identity that is not an
    administrator (the intended NT SERVICE\YuzuAgent) the Windows leg is predicted (per the
    NetShareEnum contract; not yet measured) to answer names and kind only, constrained with
    windows:shares:netshareenum:level2_permission_denied; per that contract, membership of
    Administrators or Power Users for that identity would restore paths (Server Operators
    exists only on a domain controller; Windows Server 2022 lists Administrators or Access
    Control Assistance Operators). On macOS, the share points recorded by the
    sharing tool (/usr/sbin/sharing -l -f json, bounded runner) as SMB shares, and
    /etc/exports as written (Apple's mountd grammar, emulated best-effort: checks that need the
    host are not modelled) as NFS exports, not live smbd/nfsd state; a record
    with SMB sharing off is flagged unavailable, SMB encryption required is flagged sealed,
    and a tool that fails or answers unrecognisably is constrained with a named token. A
    refused or failed read is permission_denied or constrained with a reason token,
    never an empty result; one source row per source says whether it was read. Share names and
    paths can embed account names (on macOS the default share point is named after the
    account's full name and sits under /Users/<account>), so the result is sensitive. A
    leading status row states whether every source was read, not whether every mountd
    rejection was modelled.
  tags: [network, shares, smb, nfs, posture]

spec:
  type: question
  platforms: [windows, linux, darwin]

  execution:
    plugin: shares
    action: list
    concurrency: per-device

  parameters:
    type: object
    properties: {}

  result:
    # Rows are discriminated by field 0 (row_kind); "-" is an absent value. A status row always
    # comes first, then one source row per source the leg knows about, then the share rows.
    #
    #   status|list|<supported|constrained|permission_denied|unsupported>|<reason tokens or ->
    #   source|<exports|exports_d|smb_conf|netshareenum|sharing>|<read|absent|refused|failed>|<share count or ->
    #   share|<nfs|smb>|<name or ->|<path or ->|<ro|rw|mixed|->|<true|false|->|<flags or ->|<source>
    #
    # share flags (comma-separated, closed set): hidden, unavailable, special, sealed,
    # no_root_squash, clients_<n>; Windows rows carry exactly one kind (disk, print, device,
    # ipc, other), then special (STYPE_SPECIAL) or hidden (a non-special name ending in $),
    # then temporary when set.
    columns:
      - name: row_kind
        type: string
        values: [status, source, share]
        description: 'Row shape discriminator (field 0). Values: status, source, share.'
        example: share
        platforms: [windows, linux, darwin]
      - name: field_1
        type: string
        description: 'status: the literal "list". source: exports, exports_d, smb_conf, netshareenum or sharing. share: nfs or smb.'
        example: smb
        platforms: [windows, linux, darwin]
      - name: field_2
        type: string
        description: 'status: supported, constrained, permission_denied or unsupported (a stopped Windows Server service, and a leg that threw). source: read, absent, refused or failed (absent is a state, not a failure). share: the SMB share name, or "-" for NFS (identified by path).'
        example: supported
        platforms: [windows, linux, darwin]
      - name: field_3
        type: string
        description: 'status: reason token(s) for a non-supported read, "-" when complete; tokens look like linux:shares:exports:permission_denied, linux:shares:smb_conf:registry_backend, windows:shares:netshareenum:server_not_started, macos:shares:sharing:exit_nonzero, macos:shares:exports:symlink_refused. source: the number of shares read from it, "-" unless it was read. share: the exported path ("-" when none is set).'
        example: '-'
        platforms: [windows, linux, darwin]
      - name: field_4
        type: string
        description: 'share: ro, rw, mixed (clients, security flavours or a Samba read/write list disagree with the share default) or "-" when unknown. Windows rows carry `-`: share-level permissions are not read. Not used by the other kinds.'
        example: rw
        platforms: [linux, darwin]
      - name: field_5
        type: string
        description: 'share: true when any client may use it (guest, `*`, a wildcard made only of `*`/`?`, a network with an all-zero mask, on macOS an export with no host and no network or an IPv6 network with no or a zero mask), false when not, "-" when unknown. For SMB this reflects `guest ok` as written (Samba) or the guest-access setting of the share point (macOS); whether a client can actually connect as guest also depends on global authentication settings (`map to guest`, `security`). Windows rows carry `-`: share-level permissions are not read. Not used by the other kinds.'
        example: 'false'
        platforms: [linux, darwin]
      - name: field_6
        type: string
        description: 'share: comma-separated flags from hidden, unavailable (Samba available = no; macOS SMB sharing off, or an NFS export marked offline), special, sealed (macOS: SMB encryption required), no_root_squash, clients_<n> (the NFS client count; hosts are never listed), or "-"; on Windows exactly one kind (disk, print, device, ipc or other), then special (STYPE_SPECIAL) or hidden (a share that is not special and whose name ends in $), then temporary when set. Not used by the other kinds.'
        example: clients_2
        platforms: [windows, linux, darwin]
      - name: field_7
        type: string
        description: 'share: the source it came from (exports, exports_d, smb_conf, netshareenum or sharing). Not used by the other kinds.'
        example: exports
        platforms: [windows, linux, darwin]
    aggregation:
      groupBy:
        - row_kind
      operations:
        - count

  readablePayload: "List the shares this host serves over SMB and NFS"

  gather:
    ttlSeconds: 3600

  approval:
    mode: auto

  permissions:
    executeRoles: [endpoint-admin, endpoint-operator]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 1.0.0
    requiredPlugins: [shares]

status:
  phase: active
