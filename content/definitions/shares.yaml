## Shares Definitions
## Reports the shares this host is CONFIGURED to serve over SMB and NFS: names, paths, ro/rw,
## whether anonymous access is configured, and a few flags. Nothing is changed or fetched.
## Plugin: shares | Actions: list
##
## Sources by platform:
##   Linux:   bounded no-follow reads of /etc/exports, /etc/exports.d/*.exports and
##            /etc/samba/smb.conf (pure parsers). Configured shares as written, not live
##            nfsd/smbd state. The Samba registry backend, include= files and usershares are
##            not read and are reported as constrained tokens.
##   macOS:   PLANNED, not read yet; one `unsupported` status row, macos:planned.
##   Windows: PLANNED, not read yet; one `unsupported` status row, windows:planned.
##
## ACLs, `valid users` and NFS client host lists are never emitted. NFS clients are a count
## (`clients_<n>`) and an anonymous flag only. Share names and paths can embed account names
## (Samba [homes]): treat the result as sensitive.
## Configured exports, not the mapped-drive and session observations the echo mapdrive source
## records.

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: crossplatform.network.shares
  displayName: Shares
  version: 1.0.0
  description: >
    Reports the shares this host is configured to serve over SMB and NFS: name, path,
    ro/rw/mixed, whether anonymous access is configured and a few flags, never ACLs or NFS client
    host lists (clients are a count). On Linux, read from /etc/exports, /etc/exports.d and
    /etc/samba/smb.conf as written, not live nfsd/smbd state; the Samba registry backend,
    include files and usershares are not read. The macOS and Windows legs are planned and not
    yet read. A refused or failed read is permission_denied or constrained with a reason token,
    never an empty result; one source row per source says whether it was read. Share names and
    paths can embed account names, so the result is sensitive. A leading status row states
    whether the read was complete.
  tags: [network, shares, smb, nfs, posture]

spec:
  type: question
  platforms: [windows, linux, darwin]

  execution:
    plugin: shares
    action: list
    concurrency: per-device

  parameters:
    type: object
    properties: {}

  result:
    # Rows are discriminated by field 0 (row_kind); "-" is an absent value. A status row always
    # comes first, then one source row per source the leg knows about, then the share rows.
    #
    #   status|list|<supported|constrained|permission_denied|unsupported>|<reason tokens or ->
    #   source|<exports|exports_d|smb_conf>|<read|absent|refused|failed>|<share count or ->
    #   share|<nfs|smb>|<name or ->|<path or ->|<ro|rw|mixed|->|<true|false|->|<flags or ->|<source>
    #
    # share flags (comma-separated, closed set): hidden, unavailable, special,
    # no_root_squash, clients_<n>.
    columns:
      - name: row_kind
        type: string
        values: [status, source, share]
        description: 'Row shape discriminator (field 0). Values: status, source, share.'
        example: share
        platforms: [windows, linux, darwin]
      - name: field_1
        type: string
        description: 'status: the literal "list". source: exports, exports_d or smb_conf. share: nfs or smb.'
        example: smb
        platforms: [windows, linux, darwin]
      - name: field_2
        type: string
        description: 'status: supported, constrained, permission_denied or unsupported (the planned macOS and Windows legs, and a leg that threw). source: read, absent, refused or failed (absent is a state, not a failure). share: the SMB share name, or "-" for NFS (identified by path).'
        example: supported
        platforms: [windows, linux, darwin]
      - name: field_3
        type: string
        description: 'status: reason token(s) for a non-supported read, "-" when complete; tokens look like linux:shares:exports:permission_denied, linux:shares:smb_conf:registry_backend, macos:planned, windows:planned. source: the number of shares read from it, "-" unless it was read. share: the exported path ("-" when none is set).'
        example: '-'
        platforms: [windows, linux, darwin]
      - name: field_4
        type: string
        description: 'share: ro, rw, mixed (clients, security flavours or a Samba read/write list disagree with the share default) or "-" when unknown. Not used by the other kinds.'
        example: rw
        platforms: [linux]
      - name: field_5
        type: string
        description: 'share: true when any client may use it (guest, `*`, a wildcard made only of `*`/`?`, or a network with an all-zero mask), false when not, "-" when unknown. For SMB this reflects `guest ok` as written; whether a client can actually connect as guest also depends on global authentication settings (`map to guest`, `security`). Not used by the other kinds.'
        example: 'false'
        platforms: [linux]
      - name: field_6
        type: string
        description: 'share: comma-separated flags from hidden, unavailable, special, no_root_squash, clients_<n> (the NFS client count; hosts are never listed), or "-". Not used by the other kinds.'
        example: clients_2
        platforms: [linux]
      - name: field_7
        type: string
        description: 'share: the source it came from (exports, exports_d or smb_conf). Not used by the other kinds.'
        example: exports
        platforms: [linux]
    aggregation:
      groupBy:
        - row_kind
      operations:
        - count

  readablePayload: "List the shares this host serves over SMB and NFS"

  gather:
    ttlSeconds: 3600

  approval:
    mode: auto

  permissions:
    executeRoles: [endpoint-admin, endpoint-operator]
    authorRoles: [content-author]

  compatibility:
    minAgentVersion: 1.0.0
    requiredPlugins: [shares]

status:
  phase: active
