apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: windows.registry.enumerate_keys
  displayName: Enumerate Registry Subkeys
  version: 1.0.0
  description: >
    List all immediate subkeys under a registry key, one row per subkey.
    Windows-only.
  tags: [registry, windows]
spec:
  type: question
  platforms: [windows]
  execution:
    plugin: registry
    action: enumerate_keys
    concurrency: per-device
  parameters:
    type: object
    required: [hive, key]
    properties:
      hive:
        type: string
        description: >
          Registry hive to enumerate, e.g. "HKLM".
        validation:
          enum: ["HKLM", "HKCU", "HKCR", "HKU"]
      key:
        type: string
        description: >
          Registry key path relative to the hive root, e.g.
          "SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion".
  result:
    columns:
      - name: subkey
        type: string
        description: >-
          One immediate subkey name under the given key; zero rows means the key has no subkeys. Display text (registry 2.0.1 and later): `|`, every control character except TAB, DEL, the C1 controls, U+2028 and U+2029 each become `_`, so two names that differ only there render alike. Values: free text.
        example: "ProfileList"
        platforms: [windows]
  approval:
    mode: auto
  permissions:
    executeRoles: [endpoint-admin, endpoint-operator]
    authorRoles: [content-author]
  compatibility:
    minAgentVersion: 0.2.0
    requiredPlugins: [registry]
status:
  phase: active

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: windows.registry.delete_value
  displayName: Delete Registry Value
  version: 1.1.0
  description: >
    Delete a specific value from a Windows registry key; the key itself is
    left in place. Registry 2.0.0 reports a failure as an `error|<token>` line
    (key_not_found, value_not_found, key_is_link, access_denied ...) instead of a
    sentence, limits the key path to 255 bytes and 32 components, and emits one
    leading `audit|op=delete_value|...` row (the old value, hex) before `status|ok`.
    Windows-only.
  tags: [registry, windows, configuration]
spec:
  type: action
  platforms: [windows]
  execution:
    plugin: registry
    action: delete_value
    concurrency: per-device
  parameters:
    type: object
    required: [hive, key, name]
    properties:
      hive:
        type: string
        displayName: Registry Hive
        description: >
          Registry hive containing the value, e.g. "HKCU".
        validation:
          enum: ["HKLM", "HKCU", "HKCR", "HKU"]
      key:
        type: string
        displayName: Key Path
        description: >
          Registry key path containing the value, relative to the hive
          root.
      name:
        type: string
        displayName: Value Name
        description: The value name to delete.
  result:
    columns:
      - name: status
        type: string
        description: >-
          Confirms the delete succeeded; only ever emitted on success — a failure is reported as an `error|` line and a non-zero exit instead of this column. Values: ok.
        example: "ok"
        platforms: [windows]
  approval:
    mode: role-gated
  permissions:
    executeRoles: [endpoint-admin]
    authorRoles: [content-author]
  compatibility:
    minAgentVersion: 0.15.0
    requiredPlugins: [registry]
status:
  phase: active

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: windows.registry.delete_key
  displayName: Delete Registry Key
  version: 1.2.0
  description: >
    Delete a Windows registry key. By default only a key with no subkeys is deleted (one with subkeys is
    refused as key_has_subkeys and nothing is deleted); `recursive` true removes the key and everything beneath
    it, and `dry_run` true counts what a real run would remove and deletes nothing. The key is opened on a
    checked handle (one canonical-name-checked open, with a component walk as the fallback) and a registry
    symbolic link in the path is refused, never followed (the key AT the path may itself be a link: the link
    object is removed and its target is untouched). A recursive delete first VETS the whole tree: every child is
    opened from its parent's handle with the delete's own access and probed for a link, and a link anywhere in
    the tree is refused as key_is_link with nothing deleted (a child whose ACL denies the delete, as
    access_denied, in a dry run too; a key whose raw UTF-16 name is not well-formed, which no UTF-8 name can
    open exactly, as unrepresentable_name). It then removes the tree post-order, each key by its own handle (no
    RegDeleteTreeW, which follows links), re-checking every key it finds for a link: a link planted since the
    vet stops the delete as key_is_link, and a tree that grew past the vet's bound stops it as concurrent_change,
    with what was already removed counted. The vet is a size bound and a link sweep, not a list of the keys it
    saw: a key added after it is deleted and counted like any other. It visits at most 10,000 keys and values and
    600 levels; a dry run past that reports a lower bound with capped=1, and a real recursive delete of a tree it
    could not finish is refused as tree_too_large with nothing deleted (delete it in parts). On a dry run or a
    refusal the counts are what the vet counted; on a real run they are what the delete removed (exact when it
    succeeds, the partial total when it stopped), so they can exceed a dry run's. A non-recursive delete of a key
    holding more than 10,000 values removes only that key and its own values. MIXED FLEETS: an agent running
    registry 1.x or 2.0.x (every agent released before 2.1.0, v0.14.1 included) reads neither `recursive` nor
    `dry_run`: sent dry_run=true it DELETES a key that has no subkeys (a key with subkeys is refused), and a bare
    `status|ok` or a `dry_run|0` row in answer to dry_run=true means the key was deleted. The server does not
    compare plugin versions at dispatch (#6484), so upgrade the server, then the agents to registry 2.1.0 before
    using either flag, scope any preview to a tag that marks devices verified at 2.1.0, and until then use the
    delete_key kill switch as the stop-gap. Windows-only.
  tags: [registry, windows, configuration]
spec:
  type: action
  platforms: [windows]
  execution:
    plugin: registry
    action: delete_key
    concurrency: per-device
  parameters:
    type: object
    required: [hive, key]
    properties:
      hive:
        type: string
        displayName: Registry Hive
        description: >
          Registry hive containing the key, e.g. "HKCU".
        validation:
          enum: ["HKLM", "HKCU", "HKCR", "HKU"]
      key:
        type: string
        displayName: Key Path
        description: >
          Registry key path to delete, relative to the hive root.
      recursive:
        type: string
        displayName: Recursive
        description: >
          "true" deletes every subkey and value beneath the key as well; "false" (the default) refuses a key
          that has subkeys. The tree is vetted first (at most 10,000 keys and values and 600 levels, else
          tree_too_large with nothing deleted; a registry link inside it is refused as key_is_link), and the
          counts of a dry run are a snapshot. Any other spelling is refused as invalid_data (the direct command
          route, which has no enum, also accepts 1 and 0). Needs registry 2.1.0 on the agent: registry 1.x and
          2.0.x ignore it.
        default: "false"
        validation:
          enum: ["true", "false"]
      dry_run:
        type: string
        displayName: Dry Run
        description: >
          "true" counts what a real run would remove (with `recursive`, the vetted tree) and deletes nothing;
          "false" (the default) deletes. Any other spelling is refused as invalid_data (the direct command route
          also accepts 1 and 0). Needs registry 2.1.0 on the agent: an agent at registry 1.x or 2.0.x ignores this
          flag and DELETES a key that has no subkeys, so upgrade agents first (docs/user-manual/upgrading.md).
        default: "false"
        validation:
          enum: ["true", "false"]
  result:
    columns:
      - name: status
        type: string
        description: >-
          Confirms the run succeeded and, on a real run, that the handle read back as deleted (a dry run answers ok too); only ever emitted on success — a failure is reported as an `error|<token>` line (not exhaustive: key_not_found, key_has_subkeys, tree_too_large, key_is_link, access_denied, verify_mismatch, concurrent_change, invalid_key_path, invalid_data or win32:<code>) and a non-zero exit instead of this column. A run that resolves its hive and key, success or not, also emits one `audit|op=delete_key|...` row (dry_run=1 on a dry run, whose success row records that a vet ran, not a deletion); a missing hive or key, or an unparseable hive, is a bare `error|...` line with nothing opened and no audit row. Values: ok.
        example: "ok"
        platforms: [windows]
      - name: counted_keys
        type: int32
        description: 'Keys in the subtree, the target included: on a real run what the delete REMOVED (exact when it succeeds, the partial total when it stopped), on a dry run what the vet counted (a lower bound when capped is 1). A non-recursive delete counts the target alone, so 1. Emitted on success only: a refusal carries its counts in the audit row (counted_keys=). Values: a non-negative integer.'
        example: "4"
        platforms: [windows]
      - name: counted_values
        type: int32
        description: 'Values in those keys, counted the same way (a lower bound whenever capped is 1). Point in time: a writer racing the delete can add values a dry run never saw. Values: a non-negative integer.'
        example: "5"
        platforms: [windows]
      - name: dry_run
        type: bool
        description: 'Whether this was a dry run: 1 (counted, nothing deleted) or 0 (a real run). Values: 1, 0 — a digit, never true/false.'
        example: "0"
        platforms: [windows]
      - name: capped
        type: bool
        description: 'Whether the vet or the value enumeration stopped at its bound (10,000 keys and values, 600 levels), making the counts a lower bound; reported on a dry run or a non-recursive delete of a key holding more than 10,000 values (it removes that key with all its values). A real recursive delete past the bound is refused as tree_too_large, never capped: that refusal says capped=1 in its audit row only. Values: 1 (capped), 0 (complete) — a digit, never true/false.'
        example: "0"
        platforms: [windows]
  approval:
    mode: role-gated
  permissions:
    executeRoles: [endpoint-admin]
    authorRoles: [content-author]
  compatibility:
    minAgentVersion: 0.15.0
    requiredPlugins: [registry]
status:
  phase: active

