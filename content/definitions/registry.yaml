## Windows Registry Plugin Definitions

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: windows.registry.get_value
  displayName: Get Registry Value
  version: 1.1.0
  description: >
    Read a value from the Windows registry. Value data is decoded for
    REG_SZ/REG_EXPAND_SZ/REG_DWORD/REG_QWORD; every other type, including
    REG_MULTI_SZ and REG_LINK, is returned as hex-encoded bytes rather than
    decoded (get_user_value decodes both of those). Windows-only.
  tags: [registry, windows, configuration]
spec:
  type: question
  platforms: [windows]
  execution:
    plugin: registry
    action: get_value
    concurrency: per-device
  parameters:
    type: object
    required: [hive, key, name]
    properties:
      hive:
        type: string
        displayName: Registry Hive
        description: >
          Registry hive to read from, e.g. "HKLM".
        validation:
          enum: ["HKLM", "HKCU", "HKCR", "HKU"]
      key:
        type: string
        displayName: Key Path
        description: >
          Registry key path relative to the hive root, e.g.
          "SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion".
      name:
        type: string
        displayName: Value Name
        description: The value name to read, e.g. "ProductName".
  result:
    columns:
      - name: value
        type: string
        description: >-
          The value's data, decoded to a display string, for a value of at most 1 MiB (registry 2.0.1 and later; older agents read the whole value). Never truncated: a larger value fails the action with `error|value exceeds 1 MiB limit` rather than returning a partial string. Display text, not exact: `|`, every control character except TAB, DEL, the C1 controls (U+0080-U+009F), U+2028 and U+2029 each become `_` and trailing NULs are dropped, so those characters cannot be recovered from the row; get_value has no exact-bytes mode for a string value (the types it returns as hex are exact). Values: free text.
        example: "Windows 10 Pro"
        platforms: [windows]
      - name: type
        type: string
        description: >-
          The registry value type, named via the shared type table shared with get_user_value and enumerate_values. Values: REG_SZ, REG_EXPAND_SZ, REG_DWORD, REG_QWORD, REG_BINARY, REG_MULTI_SZ, REG_NONE, REG_LINK, REG_DWORD_BIG_ENDIAN, REG_UNKNOWN.
        example: "REG_SZ"
        platforms: [windows]
  approval:
    mode: auto
  permissions:
    executeRoles: [endpoint-admin, endpoint-operator]
    authorRoles: [content-author]
  compatibility:
    minAgentVersion: 0.2.0
    requiredPlugins: [registry]
status:
  phase: active

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: windows.registry.get_user_value
  displayName: Get Per-User Registry Value
  version: 1.2.0
  description: >
    Read a registry value from a specific user's registry hive. Resolves
    the target profile via ProfileList (by username or an explicit SID),
    then reads the live HKEY_USERS\<SID> hive if the user is logged in,
    or loads that profile's NTUSER.DAT via RegLoadKey as a fallback.
    SeBackupPrivilege and SeRestorePrivilege are required only for the
    offline fallback when the target user is not logged in; reading an
    already-loaded live hive needs no elevated privilege. Windows-only.
  tags: [registry, windows, per-user, configuration]
spec:
  type: question
  platforms: [windows]
  execution:
    plugin: registry
    action: get_user_value
    concurrency: per-device
  parameters:
    type: object
    required: [key]
    properties:
      username:
        type: string
        displayName: Username
        description: >
          Windows profile folder name to resolve via ProfileList (see
          list_profiles), matched case-insensitively. This is not always
          the same as the account name (renamed accounts, domain profiles).
          Either username or sid is required; sid takes precedence if both
          are given.
        validation:
          maxLength: 256
      sid:
        type: string
        displayName: User SID
        description: >
          Windows security identifier (e.g.,
          "S-1-5-21-...-1001") of the target profile, as an alternative to
          username. Must match one of the profiles list_profiles would
          report; a sid not found there is rejected. Either username or sid
          is required.
        validation:
          maxLength: 256
      key:
        type: string
        displayName: Key Path
        description: >
          Registry key path relative to the resolved user's hive root
          (e.g., "Software\\Microsoft\\Windows\\CurrentVersion\\Explorer").
        validation:
          maxLength: 1024
      name:
        type: string
        displayName: Value Name
        description: The registry value name to read.
        validation:
          maxLength: 256
  result:
    columns:
      - name: username
        type: string
        description: >-
          The resolved profile display name the value was read from — falls back to the caller's own username/sid input, then the resolved sid, but is never fabricated and never empty (ADR-0024 D11). Values: free text.
        example: "jsmith"
        platforms: [windows]
      - name: value
        type: string
        description: >-
          The value's data, decoded the same way get_value decodes it, plus REG_MULTI_SZ (records semicolon-joined) and REG_LINK (target string) — the two types get_value leaves hex-encoded — both sanitised against '|'/CR/LF so a value cannot forge a column or row. Values: free text.
        example: "1"
        platforms: [windows]
      - name: type
        type: string
        description: 'The registry value type, named via the shared type table. Values: REG_SZ, REG_EXPAND_SZ, REG_DWORD, REG_QWORD, REG_BINARY, REG_MULTI_SZ, REG_NONE, REG_LINK, REG_DWORD_BIG_ENDIAN, REG_UNKNOWN.'
        example: "REG_DWORD"
        platforms: [windows]
  readablePayload: "Read registry value '${name}' from user '${username}' key '${key}'"
  approval:
    mode: role-gated
  permissions:
    executeRoles: [endpoint-admin]
    authorRoles: [content-author]
  compatibility:
    minAgentVersion: 0.13.1
    requiredPlugins: [registry]
status:
  phase: active

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: windows.registry.list_profiles
  displayName: List User Profiles
  version: 1.0.0
  description: >
    Enumerate local Windows user profiles from
    HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\ProfileList: SID,
    resolved profile name, profile path, and whether the profile's
    registry hive is currently loaded under HKEY_USERS. System profiles
    (LocalSystem, LocalService, NetworkService) are excluded. Windows-only.
  tags: [registry, windows, users, per-user]
spec:
  type: question
  platforms: [windows]
  execution:
    plugin: registry
    action: list_profiles
    concurrency: per-device
  parameters:
    type: object
    required: []
    properties: {}
  result:
    columns:
      - name: sid
        type: string
        description: "The profile's Windows security identifier. Values: free text (a Windows SID string)."
        example: "S-1-5-21-1111111111-2222222222-3333333333-1001"
        platforms: [windows]
      - name: profile_name
        type: string
        description: >-
          The resolved profile folder name (the last path component of ProfileImagePath); rendered "-" when it cannot be resolved — never falls back to the sid (ADR-0024 D11). Values: free text or "-".
        example: "jsmith"
        platforms: [windows]
      - name: profile_path
        type: string
        description: >-
          The profile's ProfileImagePath, environment-expanded; rendered "-" when it is absent or unreadable. Values: free text or "-".
        example: "C:\\Users\\jsmith"
        platforms: [windows]
      - name: hive_state
        type: string
        description: "Whether the profile's registry hive is reachable right now. Values: loaded, loaded_classes_only, not_loaded."
        example: "loaded"
        platforms: [windows]
  readablePayload: "List local user profiles"
  approval:
    mode: auto
  permissions:
    executeRoles: [endpoint-admin, endpoint-operator]
    authorRoles: [content-author]
  compatibility:
    minAgentVersion: 0.13.1
    requiredPlugins: [registry]
status:
  phase: active

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: windows.registry.set_value
  displayName: Set Registry Value
  version: 1.1.0
  description: >
    Write a value to the Windows registry, creating missing key components
    beneath an existing top-level key (a path whose first component is
    missing is refused as root_level_create). All six writable types are supported (REG_SZ, REG_EXPAND_SZ,
    REG_BINARY, REG_DWORD, REG_MULTI_SZ, REG_QWORD) and the write is verified:
    the previous value is captured first, the new one is read back on the same
    handle and compared byte for byte, and a mismatch fails the action. The
    key is opened on a checked handle (one canonical-name-checked open, with a
    component walk as the fallback) and a registry symbolic link anywhere in
    the path is refused, never followed; a write under HKLM\SYSTEM\CurrentControlSet,
    itself a link, therefore fails as key_is_link. The previous and new values
    are recorded in a `registry.write` audit row (hex, capped at 256 bytes; they can
    contain secrets: the product owner accepted this risk on 2026-10-20 and masking
    is a planned later change). Needs registry 2.0.0 on the agent: an agent still
    running registry 1.x writes an EMPTY REG_SZ for a data_hex-only write, stores
    REG_QWORD, REG_MULTI_SZ, REG_EXPAND_SZ and REG_BINARY values as REG_SZ text and
    follows a write under HKLM\SYSTEM\CurrentControlSet, all answering `status|ok`,
    so upgrade the agents first. Windows-only.
  tags: [registry, windows, configuration]
spec:
  type: action
  platforms: [windows]
  execution:
    plugin: registry
    action: set_value
    concurrency: per-device
  parameters:
    type: object
    required: [hive, key, name]
    properties:
      hive:
        type: string
        description: >
          Registry hive to write to, e.g. "HKCU".
        validation:
          enum: ["HKLM", "HKCU", "HKCR", "HKU"]
      key:
        type: string
        description: >
          Registry key path relative to the hive root; created if it does
          not already exist beneath an existing top-level key, e.g.
          "Software\\MyApp". At most 255 bytes and 32 components; a hive
          alias, an empty, "." or ".." component and control characters are
          refused on the instruction and MCP routes; POST /api/command passes
          an embedded NUL to the plugin as a C string, so the value is cut at
          it.
      name:
        type: string
        description: >
          The value name to write, e.g. "InstallPath". Empty writes the key's
          default value. At most 16,383 bytes.
      value:
        type: string
        description: >
          The value data to write, as text; interpreted per `type`: decimal
          digits for REG_DWORD / REG_QWORD, literal text for REG_SZ /
          REG_EXPAND_SZ, LF-separated non-empty records for REG_MULTI_SZ
          (split on LF only, so a CR stays inside its record; an empty record
          or a trailing LF is refused as invalid_data; empty text is the empty
          list), hex digits for REG_BINARY (empty is zero bytes). Send exactly
          one of `value` and `data_hex`. When neither is sent, or the one sent
          is empty, the write stores an empty value of the type and answers ok:
          an empty string, the empty list or zero bytes (REG_DWORD and
          REG_QWORD refuse it as invalid_data), so a misspelt parameter name
          writes an empty value instead of failing. Through MCP
          `execute_instruction` and the result-set execute routes every
          parameter value is limited to 64 KiB.
      data_hex:
        type: string
        description: >
          The exact bytes to write, as hex, for any type; give it INSTEAD of
          `value` (both non-empty is refused as invalid_data). Shape
          is checked per type: 4 bytes for REG_DWORD, 8 for REG_QWORD, a
          terminating NUL for the string types, a trailing double NUL for
          REG_MULTI_SZ. Use it for exact bytes you hold from another source. An
          empty `data_hex` is the same as omitting it here. The plugin takes at
          most 1 MiB of data (2,097,152 hex characters), but MCP
          `execute_instruction` and the result-set execute routes limit every
          parameter value to 64 KiB, so through them it carries at most 32 KiB
          of data; the direct command route is not under that cap. Needs
          registry 2.0.0 on the agent: registry 1.x ignores it and writes an
          EMPTY REG_SZ over the value, answering `status|ok` (with
          type=REG_DWORD and data_hex only, 1.x throws and writes nothing).
        validation:
          maxLength: 2097152
      type:
        type: string
        description: >
          Registry value type to write. Defaults to REG_SZ when omitted.
          Mixed fleets: an agent still running registry 1.x stores
          REG_QWORD, REG_MULTI_SZ, REG_EXPAND_SZ and REG_BINARY values as
          REG_SZ text and answers `status|ok`, so upgrade the agents to
          registry 2.0.0 before using them.
        validation:
          enum: ["REG_SZ", "REG_EXPAND_SZ", "REG_BINARY", "REG_DWORD", "REG_MULTI_SZ", "REG_QWORD"]
  result:
    columns:
      - name: status
        type: string
        description: >-
          Confirms the write succeeded and read back identical; only ever emitted on success — a failure is reported as an `error|<token>` line (not exhaustive: access_denied, key_not_found, root_level_create, key_is_link, concurrent_change, invalid_type, invalid_data, value_overflow, invalid_key_path, invalid_value_name, verify_mismatch or win32:<code>) and a non-zero exit instead of this column. A run that resolves its hive and key, success or not, also emits one `audit|op=set_value|...` row carrying the previous and new values (hex, capped); a missing hive or key, or an unparseable hive, is a bare `error|...` line with nothing opened and no audit row, while a key path or value name that fails shape validation after the hive resolved (invalid_key_path, invalid_value_name) is audited as result=refused. Values: ok.
        example: "ok"
        platforms: [windows]
  approval:
    mode: role-gated
  permissions:
    executeRoles: [endpoint-admin]
    authorRoles: [content-author]
  compatibility:
    minAgentVersion: 0.15.0
    requiredPlugins: [registry]
status:
  phase: active

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: windows.registry.enumerate_keys
  displayName: Enumerate Registry Subkeys
  version: 1.0.0
  description: >
    List all immediate subkeys under a registry key, one row per subkey.
    Windows-only.
  tags: [registry, windows]
spec:
  type: question
  platforms: [windows]
  execution:
    plugin: registry
    action: enumerate_keys
    concurrency: per-device
  parameters:
    type: object
    required: [hive, key]
    properties:
      hive:
        type: string
        description: >
          Registry hive to enumerate, e.g. "HKLM".
        validation:
          enum: ["HKLM", "HKCU", "HKCR", "HKU"]
      key:
        type: string
        description: >
          Registry key path relative to the hive root, e.g.
          "SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion".
  result:
    columns:
      - name: subkey
        type: string
        description: >-
          One immediate subkey name under the given key; zero rows means the key has no subkeys. Display text: `|`, every control character except TAB, DEL, the C1 controls, U+2028 and U+2029 each become `_`, so two names that differ only there render alike. Values: free text.
        example: "ProfileList"
        platforms: [windows]
  approval:
    mode: auto
  permissions:
    executeRoles: [endpoint-admin, endpoint-operator]
    authorRoles: [content-author]
  compatibility:
    minAgentVersion: 0.2.0
    requiredPlugins: [registry]
status:
  phase: active

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: windows.registry.delete_value
  displayName: Delete Registry Value
  version: 1.1.0
  description: >
    Delete a specific value from a Windows registry key; the key itself is
    left in place. Registry 2.0.0 reports a failure as an `error|<token>` line
    (key_not_found, value_not_found, key_is_link, access_denied ...) instead of a
    sentence, limits the key path to 255 bytes and 32 components, and emits one
    leading `audit|op=delete_value|...` row (the old value, hex) before `status|ok`.
    Windows-only.
  tags: [registry, windows, configuration]
spec:
  type: action
  platforms: [windows]
  execution:
    plugin: registry
    action: delete_value
    concurrency: per-device
  parameters:
    type: object
    required: [hive, key, name]
    properties:
      hive:
        type: string
        displayName: Registry Hive
        description: >
          Registry hive containing the value, e.g. "HKCU".
        validation:
          enum: ["HKLM", "HKCU", "HKCR", "HKU"]
      key:
        type: string
        displayName: Key Path
        description: >
          Registry key path containing the value, relative to the hive
          root.
      name:
        type: string
        displayName: Value Name
        description: The value name to delete.
  result:
    columns:
      - name: status
        type: string
        description: >-
          Confirms the delete succeeded; only ever emitted on success — a failure is reported as an `error|` line and a non-zero exit instead of this column. Values: ok.
        example: "ok"
        platforms: [windows]
  approval:
    mode: role-gated
  permissions:
    executeRoles: [endpoint-admin]
    authorRoles: [content-author]
  compatibility:
    minAgentVersion: 0.15.0
    requiredPlugins: [registry]
status:
  phase: active

---
apiVersion: yuzu.io/v1alpha1
kind: InstructionDefinition
metadata:
  id: windows.registry.delete_key
  displayName: Delete Registry Key
  version: 1.1.0
  description: >
    Delete a Windows registry key that has no subkeys; a key with subkeys is refused as key_has_subkeys
    and nothing is deleted. The key is opened on a checked handle (one canonical-name-checked open, with
    a component walk as the fallback) and a registry symbolic link in the path is refused, never followed
    (the key AT the path may itself be a link: the link object is removed and its target is untouched).
    The delete runs by handle on the checked key (no RegDeleteTreeW, which follows links) and is
    confirmed by the handle reading back as deleted. counted_keys is 1 and counted_values is the number
    of values the key held; the count stops at 10,000 nodes (the key plus up to 9,999 values), past which
    capped is 1 and counted_values is a lower bound (the delete still removes the key with all its
    values). A subkey created between the check and the delete makes the delete fail, not key_has_subkeys:
    the key stays and the action answers a failure token (access_denied or win32:<code>). Windows-only.
  tags: [registry, windows, configuration]
spec:
  type: action
  platforms: [windows]
  execution:
    plugin: registry
    action: delete_key
    concurrency: per-device
  parameters:
    type: object
    required: [hive, key]
    properties:
      hive:
        type: string
        displayName: Registry Hive
        description: >
          Registry hive containing the key, e.g. "HKCU".
        validation:
          enum: ["HKLM", "HKCU", "HKCR", "HKU"]
      key:
        type: string
        displayName: Key Path
        description: >
          Registry key path to delete, relative to the hive root.
  result:
    columns:
      - name: status
        type: string
        description: >-
          Confirms the delete succeeded and the handle read back as deleted; only ever emitted on success — a failure is reported as an `error|<token>` line (not exhaustive: key_not_found, key_has_subkeys, key_is_link, access_denied, verify_mismatch, concurrent_change, invalid_key_path or win32:<code>) and a non-zero exit instead of this column. A run that resolves its hive and key, success or not, also emits one `audit|op=delete_key|...` row; a missing hive or key, or an unparseable hive, is a bare `error|...` line with nothing opened and no audit row. Values: ok.
        example: "ok"
        platforms: [windows]
      - name: counted_keys
        type: int32
        description: 'Keys removed: always the target alone, so 1. Values: 1.'
        example: "1"
        platforms: [windows]
      - name: counted_values
        type: int32
        description: 'Values the key held, counted before the delete (a lower bound whenever capped is 1). Point in time: a writer racing the delete can add values this count never saw. Values: a non-negative integer.'
        example: "5"
        platforms: [windows]
      - name: dry_run
        type: bool
        description: 'Always 0: this version has no dry run (the column is kept for the audit row and later releases). Values: 0 — a digit, never true/false.'
        example: "0"
        platforms: [windows]
      - name: capped
        type: bool
        description: 'Whether the value enumeration stopped at its cap of 10,000 nodes (the key plus up to 9,999 values), making counted_values a lower bound; the delete still removes the key with all its values. Values: 1 (capped), 0 (complete) — a digit, never true/false.'
        example: "0"
        platforms: [windows]
  approval:
    mode: role-gated
  permissions:
    executeRoles: [endpoint-admin]
    authorRoles: [content-author]
  compatibility:
    minAgentVersion: 0.15.0
    requiredPlugins: [registry]
status:
  phase: active

