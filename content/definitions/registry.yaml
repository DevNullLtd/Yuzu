          Registry hive to check, e.g. "HKLM".
        validation:
          enum: ["HKLM", "HKCU", "HKCR", "HKU"]
      key:
        type: string
        displayName: Key Path
        description: >
          Registry key path relative to the hive root.
  result:
    columns:
      - name: exists
