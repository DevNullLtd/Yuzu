# Accepted vulnerabilities for the release image gate (WP15/S9).
#
# Read by scripts/ci/image-vuln-gate.sh, which release.yml runs on every
# published image BEFORE it is pushed (and pre-release.yml runs again on the
# published tags). The gate fails on any CRITICAL vulnerability that has a fix
# and is not accepted here.
#
# Rules for an entry. scripts/ci/image-vuln-gate-checks.py parses this file
# and the gate refuses it unless every entry follows them, in this exact
# block-style shape (no flow style, anchors or comments after a value). Trivy
# never reads this file: it reads a canonical copy of the entries in force.
#   - `id`, first: the vulnerability id.
#   - `paths` or `purls` (a block list): scope it as narrowly as Trivy allows.
#     A `paths` item is one concrete relative path (usr/local/bin/gosu): no
#     glob character, no empty string, no leading `/` (Trivy matches paths as
#     globs, and an OS package's path is empty, so `**` would hide the CVE in
#     every package). A `purls` item is a full package URL with its version
#     (pkg:deb/debian/libfoo@1.2-3): a purl without one matches every version.
#     An OS package can only be scoped by purl.
#   - `statement`: why the finding does not apply or cannot be fixed by us yet,
#     with the evidence.
#   - `expired_at`: an unquoted date at most 92 days out. When it passes the
#     entry is no longer in force and the next release fails on the finding
#     again, so it is re-reviewed rather than forgotten. The gate warns 21 days
#     before.
#   - `approved_by`: the GitHub login of the person who accepted the finding.
#   - `approval_ref`: the pull request in which they approved it, quoted
#     ("#1234", or its https://github.com/.../pull/N URL), and `approved_on`:
#     the date of that approval. Until the approving review exists, write
#     `approval_ref: pending` and no `approved_on`: a pending entry is NOT
#     honoured by the release gate (release.yml passes --release), only by
#     local runs and the post-release QA scan, which report it as pending.
#   - Remove the entry as soon as the upstream image no longer carries it.

vulnerabilities:
  # yuzu-postgres: /usr/local/bin/gosu is the upstream postgres image's gosu
  # 1.19, built by its upstream with go1.24.6. Trivy reports the Go standard
  # library's CVE-2025-68121 (crypto/tls certificate validation on session
  # resumption, fixed in Go 1.24.13). gosu does not link crypto/tls: the binary
  # in postgres:18.6-bookworm@sha256:f1ea2a1a4fb7... holds no crypto/tls (or
  # net/http, crypto/x509) symbol, checked with `strings` on 2026-11-17, while
  # its os/exec symbols are present. gosu only switches user and execs the
  # server at container start. Our build cannot replace the binary without
  # forking the upstream entrypoint; the fix is upstream rebuilding gosu.
  - id: CVE-2025-68121
    paths:
      - "usr/local/bin/gosu"
    statement: >-
      gosu 1.19 in the upstream postgres image is built with go1.24.6; gosu does
      not link crypto/tls (no crypto/tls symbol in the binary), so the
      session-resumption flaw is unreachable. Accepted until upstream rebuilds
      gosu. WP15/S9, reviewed 2026-11-17.
    expired_at: 2027-02-15
    approved_by: fjarvis
    # Proposed approver; the approval is the owner's review on the pull
    # request that adds this entry. Fill in approval_ref and approved_on then.
    approval_ref: pending
