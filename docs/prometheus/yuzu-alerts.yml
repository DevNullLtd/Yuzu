  - name: yuzu-auth-sessions
    # HA WS-1/1a (ADR-2002 §4) — durable operator sessions. The clock-anomaly
    # alert is the DB-clock-integrity monitor ADR-2002 §4 mitigation (a) requires
    # ("monitor for backward movement; alert"): a session reap pass declines when
    # its wall-clock read is implausibly ahead of, or behind, the persisted
    # anchor — exactly a backward/forward DB-host clock step, which would
    # un-expire sessions and extend live JIT-elevation / MFA windows. Both
    # counters are zero-seeded at boot, so increase() > 0 is meaningful.
    rules:
      - alert: YuzuSessionReapClockAnomaly
        expr: |
          increase(yuzu_auth_session_reap_clock_anomaly_total[1h]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Durable-session reap declined on a DB-primary clock anomaly (ADR-2002 §4 integrity)"
          description: >-
            A durable-session reap pass was declined because the DB-PRIMARY clock
            reading (Postgres now(), read in-SQL — the same clock that authors
            session expires_at since #3715) was implausibly ahead of or behind the
            persisted reap anchor — the DB-primary clock-integrity signal ADR-2002
            §4 mitigation (a) requires be monitored. A backward step un-expires
            sessions and extends live JIT-elevation / MFA step-up windows toward
            their authored maximums (the residual the per-window clamps/ceilings
            bound but do not eliminate). Investigate the DATABASE primary's NTP /
            clock health first (not the app host — a local app-host wobble is the
            separate yuzu_auth_local_clock_backward_total signal, which does NOT
            affect session adjudication under DB-clock authority); correlate with
            yuzu_auth_session_store_degrade_total.
      - alert: YuzuSessionStoreDegraded
        expr: |
          increase(yuzu_auth_session_store_degrade_total[10m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Durable session store degraded on the auth hot path (op={{ $labels.op }})"
          description: >-
            A durable session-store operation ({{ $labels.op }}) hit a degraded
            PostgreSQL read/write for 10m. A `validate` degrade fails requests
            closed (401); `create`/`elevate`/`mark_mfa`/`invalidate`/
            `invalidate_user` degrades fail the privileged op closed; a sustained
            `generation_refresh` degrade drops the validate cache past the
            stale-serve bound. Usually PostgreSQL pool saturation / failover —
            correlate with the pool metrics.

  - name: yuzu-ota
    # Agent OTA pull bounds (#913 per-peer admission, #911 deadlines, #416
    # identity). Every series here is zero-seeded at boot, so increase() > 0 is
    # meaningful and absent() stays a real signal.
    #
    # Deliberately NOT alerted: yuzu_ota_download_admission_total
    # {decision="rejected_rate"} on its own. The rate bucket is the loose,
    # secondary bound and is expected to reject during a fleet-wide update; a
    # page on it would be noise. The concurrency rejection is the one that means
    # a peer is actually trying to monopolise capacity.
    rules:
      - alert: YuzuOtaConcurrencyRejections
        expr: |
          sum by (job, instance) (
            increase(yuzu_ota_download_admission_total{decision="rejected_concurrency"}[1h])
          ) > 5
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "A peer is repeatedly hitting the per-peer OTA concurrency cap"
          runbook_url: "https://github.com/Tr3kkR/Yuzu/blob/main/docs/user-manual/server-admin.md#agent-ota-pull-bounds"
          description: >-
            One or more agents are being refused DownloadUpdate because they
            already hold --ota-max-concurrent-per-peer parallel transfers. This
            is the primary bound from issue #913 and it firing sustained means
            a peer is opening more concurrent OTA streams than any healthy
            agent needs. Investigate which identity: correlate with
            yuzu_ota_admission_key_mode_total to see whether admission is
            keyed on certificates or has fallen back to peer IP, and check the
            server logs, which name the rejected peer — but note that line is
            SAMPLED 1-in-100 (the first always logs, then every hundredth, on a
            counter shared with the server-wide rejections), so a short burst may
            leave one line or none. This counter is the complete record; the log
            is for attribution only. Admission rejections are
            deliberately metric-only and write NO audit row (see
            docs/user-manual/audit-log.md), so do not look for one. A short burst during a
            fleet-wide rollout is benign; a sustained signal is not.

            Threshold note: the lookback is [1h] and `for:` is 15m. An earlier
            form used [15m]/10m — increase() over [15m] stays positive for a
            full 15m after a single event, so a `for:` window that is short
            relative to its lookback only debounces gaps shorter than `for:`
            itself, not the full lookback, and `for: 10m` there fired on one
            rejection. The bar is a count, not a duration, for that reason.

      - alert: YuzuOtaIdentityRejections
        expr: |
          sum by (job, instance, reason) (
            increase(yuzu_grpc_ota_identity_rejected_total[1h])
          ) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Agent OTA RPCs rejected for a missing or mismatched certificate identity"
          runbook_url: "https://github.com/Tr3kkR/Yuzu/blob/main/docs/user-manual/server-admin.md#agent-ota-pull-bounds"
          description: >-
            CheckForUpdate or DownloadUpdate was rejected because the peer
            presented no usable client certificate, presented one from a
            foreign CA, or claimed an agent_id that does not match its
            certificate (issue #416). On a fleet where every agent is enrolled
            this should be flat at zero, so any sustained signal is either a
            misconfigured agent or an identity being spoofed. The reason label
            says which. Paired forensic evidence is the
            session.ota_identity_rejected audit rows for attribution. Read VOLUME from
            this counter, never from the row count: rows undercount for two
            separate reasons — `no_client_identity` is metric-only and writes
            none, and the row is rate-limited per peer, with suppressed rows
            counted by yuzu_ota_identity_audit_suppressed_total.

            Window note: the lookback is an HOUR and `for:` is deliberately SHORTER
            than it. A `for:` at least as long as the lookback can never be
            satisfied by a sparse signal — `increase()>0` decays before the `for:`
            elapses — which would make this rule blind to exactly the low-and-slow
            identity probe it exists to catch. `reason` is preserved in the
            aggregation because the description and runbook both tell the operator
            to read it.

      - alert: YuzuOtaRefundDivergence
        expr: |
          sum by (job, instance) (
            increase(yuzu_ota_download_deadline_exceeded_total[30m])
          )
            > sum by (job, instance) (
                increase(
                  yuzu_ota_download_refund_total{reason=~"transfer_deadline|chunk_deadline"}[30m]
                )
              )
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "OTA deadline aborts exceed rate-token refunds — lockout regression suspected"
          runbook_url: "https://github.com/Tr3kkR/Yuzu/blob/main/docs/user-manual/server-admin.md#agent-ota-pull-bounds"
          description: >-
            Every transfer aborted by a SERVER-imposed deadline must refund the
            rate token it was charged at admission; that invariant is what stops
            a genuinely slow-link or flapping agent from spending itself into a
            lockout (the failure mode recorded on issues #934 and #941). Charges
            running ahead of refunds means a code path is aborting without
            refunding, which silently re-opens that lockout. Check recent changes
            to the DownloadUpdate deadline branches in agent_service_impl.cpp.

            SCOPE, honestly: this compares two counters incremented from the same
            classified outcome, so what it detects is a code path that aborts
            WITHOUT refunding — a dropped or reordered call site. It cannot see a
            refund that was issued but did not land inside PrincipalQuota::refund
            (which is find-not-insert and silently drops an untracked key). That
            case is covered by the primitive's own unit tests, not by this alert.

      - alert: YuzuOtaTransfersAborting
        expr: |
          (
            sum by (job, instance, phase) (
              increase(yuzu_ota_download_deadline_exceeded_total[1h])
            )
              / on (job, instance) group_left ()
            clamp_min(
              sum by (job, instance) (
                increase(yuzu_ota_download_admission_total{decision="admitted"}[1h])
              ), 1
            ) > 0.1
          )
          and on (job, instance)
          (
            sum by (job, instance) (
              increase(yuzu_ota_download_admission_total{decision="admitted"}[1h])
            ) >= 4
          )
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "OTA transfers are being aborted by a server-imposed deadline"
          runbook_url: "https://github.com/Tr3kkR/Yuzu/blob/main/docs/user-manual/server-admin.md#agent-ota-pull-bounds"
          description: >-
            Transfers are hitting --ota-transfer-deadline-secs or
            --ota-chunk-write-deadline-secs. This is the alert that makes a
            MISCONFIGURED deadline visible, and without it that failure is silent:
            every aborted transfer refunds its rate token, so the buckets never
            drain, YuzuOtaRefundDivergence stays quiet, and the agent retries on its
            own 6-hourly timer. The fleet simply stops updating while every other
            dashboard stays green.

            Threshold note, and it is the whole design of this rule. Two review
            rounds each proved one half of this from opposite ends.

            An ABSOLUTE count cannot work: agents check every 6h, so N agents all
            failing produce only N/12 aborts per 30m, and any fixed bar goes blind
            below some fleet size — a bar of 3 left every fleet under ~36 agents
            unable to page while 100% of its devices failed, forever. Adding an
            absolute arm back ALONGSIDE the proportion does not rescue it either: a
            permanently-broken 15% of a large fleet and a benign 5% rollout tail on a
            fleet three times larger produce the same absolute count, so no fixed bar
            separates them. Only the proportion does.

            The bar is 0.1 rather than 0.2 because 0.2 was proved blind to a permanent
            15%-of-fleet outage — a whole site unable to update, forever, with this
            detector green. The `admitted >= 4` guard exists because the ratio is
            meaningless on a nearly-idle server: one admission and one abort in an
            hour reads 1.0 and would page. The denominator is separately clamped at 1
            so the division itself is total.

            HONEST RESIDUAL: a fleet where under ~10% of devices fail permanently sits
            below this bar. That is deliberate — real fleets carry a standing trickle
            of slow links — but it is a blind spot, not a proof of health.

            Window note: `for:` is deliberately SHORTER than the lookback. A `for:` at
            least as long as the lookback can never be satisfied by a signal sparser
            than the window, which is how a 30m-on-[30m] form failed to fire at any
            evaluation time at all. `phase` is preserved in the aggregation because
            this description tells the operator to read it; the denominator carries no
            `phase`, hence the explicit `on (job, instance) group_left ()`.

            Check the phase label — `transfer` means the
            whole-transfer budget was too small for the artifact on that link
            (900s over a 100 MiB binary implies a ~0.93 Mbit/s floor), `write` means
            a single chunk stalled. Correlate with
            yuzu_ota_download_refund_total{reason=~".*deadline"}.

      - alert: YuzuOtaServerCapacityRejections
        expr: |
          sum by (job, instance) (
            increase(yuzu_ota_download_admission_total{decision="rejected_total"}[1h])
          ) > 1
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "OTA transfers refused by the SERVER-WIDE capacity ceiling"
          runbook_url: "https://github.com/Tr3kkR/Yuzu/blob/main/docs/user-manual/server-admin.md#agent-ota-pull-bounds"
          description: >-
            Window note: `for:` is shorter than the lookback (so the rule can
            actually be satisfied), and the bar is >1 over an hour rather than >0,
            because a single transient refusal at the ceiling is not a page — the
            group already excludes `rejected_rate` for the same reason.

            --ota-max-concurrent-total is saturated, so agents are being refused
            regardless of their own per-peer budget. Two very different causes look
            identical here and the log line distinguishes them by `cert_keyed`.
            EITHER a fleet-wide rollout genuinely wants more concurrency than the
            ceiling allows — raise it, sizing roughly as
            `devices x transfer_seconds / rollout_seconds` — OR a few source
            addresses are holding slow transfers to occupy the shared ceiling,
            which is a denial attempt: IP-keyed peers are confined to the
            unreserved share (`--ota-cert-reserve-pct`) so they cannot starve
            enrolled agents.

            The rejection log's `cert_keyed=` field is the discriminator, with two
            caveats that matter before you act on it. It means "presented a
            certificate this listener accepted", NOT "is an enrolled Yuzu agent"
            (#3828) — on a multi-CA trust bundle a certificate from any other CA
            in that bundle also reads `cert_keyed=true`, so on such a deployment
            it does not separate a rollout from an attack on its own. And the log
            line is sampled 1-in-100, so a short burst may leave one line or none.
            Correlate with yuzu_ota_admission_key_mode_total, which is complete.

      - alert: YuzuOtaPeerMapEvicting
        expr: |
          sum by (job, instance) (increase(yuzu_ota_download_peers_evicted_total[1h])) > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "The OTA admission map is evicting — the rate limiter may be disabled"
          runbook_url: "https://github.com/Tr3kkR/Yuzu/blob/main/docs/user-manual/server-admin.md#agent-ota-pull-bounds"
          description: >-
            Sustained eviction means --ota-max-peers-tracked is at or below the live
            peer count. This is not a cache-efficiency concern: an evicted key that
            returns is re-inserted with a FULL token burst, so continuous eviction
            silently disables the rate dimension for the peers cycling through it.
            Raise --ota-max-peers-tracked above the number of distinct admission
            keys you expect (check yuzu_ota_download_peers_tracked, and
            yuzu_ota_admission_key_mode_total to see whether keys are certificates
            or source IPs — the IP fallback inflates the key count).

      - alert: YuzuOtaPeerMapNearCapacity
        expr: |
          yuzu_ota_download_peers_tracked
            / clamp_min(yuzu_ota_download_peers_capacity, 1)
            > 0.8
        for: 30m
        labels:
          severity: info
        annotations:
          summary: "OTA per-peer admission map is approaching its cardinality ceiling"
          runbook_url: "https://github.com/Tr3kkR/Yuzu/blob/main/docs/user-manual/server-admin.md#agent-ota-pull-bounds"
          description: >-
            The per-peer OTA admission map is above 80% of
            --ota-max-peers-tracked (issue #935). Expressed as a ratio against
            the published yuzu_ota_download_peers_capacity gauge rather than a
            hardcoded count, so it stays correct when an operator retunes the
            flag. The map is bounded and evicts the least-recently-seen idle
            entry, so this is not a memory-exhaustion risk — but on a fleet far
            smaller than the configured ceiling it indicates admission has
            fallen back to peer-IP keying for many peers (check
            yuzu_ota_admission_key_mode_total{mode="peer_ip"}), which is what a
            NAT'd peer rotating source ports looks like. Correlate with
            yuzu_ota_download_peers_evicted_total to see whether the cap is
            actually biting yet.

            STALENESS: yuzu_ota_download_peers_tracked is refreshed only when a
            DownloadUpdate arrives. On an idle fleet (default update_check_interval
            is 6h) it holds its last value, so treat a firing instance with no
            recent admissions as a stale reading rather than a live condition. The
            map also never shrinks — purge_stale has no periodic caller — so once
            this fires it stays firing until the process restarts.

  - name: yuzu-executions
    # HA WS-1(1b) (ADR-2002 §5) — the command_id -> execution_id correlation
    # (ExecutionTracker::command_execution, PG-backed, replacing the former
    # in-process cmd_execution_ids_ map). Mirrors yuzu-auth-sessions'
    # YuzuSessionReapClockAnomaly shape: a reap pass declines when its
    # DB-primary now() read is implausibly ahead of, or behind, the
    # persisted anchor. Lower stakes than the session case (this table is a
    # regenerable observability aid, not compliance evidence — see
    # docs/executions-history-ladder.md), so a single reap-clock-anomaly
    # alert is the whole ask here; the write/store-degrade counters are
    # deferred (no comparable existing shape to adapt, best-effort
    # observability rather than an integrity signal). Zero-seeded at boot,
    # so increase() > 0 is meaningful.
    rules:
      - alert: YuzuExecCorrelationReapClockAnomaly
        expr: |
          increase(yuzu_exec_correlation_reap_clock_anomaly_total[1h]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Command/execution correlation reap declined on a DB-primary clock anomaly"
          description: >-
            The command_id -> execution_id correlation table's retention
            sweep (ExecutionTracker::reap_command_execution_mappings) was
            declined because the DB-PRIMARY clock reading (Postgres now(),
            read in-SQL) was implausibly ahead of or behind the persisted
            reap anchor. Unlike the durable-session case, a decline here
            does not un-expire anything security-relevant — the table
            simply stops draining (rows age past the intended 24h window)
            until a subsequent pass reads a plausible now(). Investigate
            the DATABASE primary's NTP / clock health; correlate with
            yuzu_exec_correlation_store_degrade_total /
            yuzu_exec_correlation_write_degrade_total.
